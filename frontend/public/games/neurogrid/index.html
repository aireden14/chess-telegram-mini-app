<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Neurogrid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body {
    background: radial-gradient(ellipse at 50% -10%, #0a1224 0%, #030509 55%, #000 100%);
    color: #d7e6ff;
    font-family: 'SF Mono', 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    width: 100vw; height: 100vh; height: 100dvh;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  #stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px;
    position: relative;
  }

  /* фоновые нейро-нити */
  #wires {
    position: absolute; inset: 0; z-index: 0; opacity: 0.35; pointer-events: none;
  }

  /* --- скрытый HUD: цифры почти невидимы, оживают только при изменении --- */
  .corner-stat {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px);
    z-index: 3; display: flex; flex-direction: column; gap: 2px;
    opacity: 0.3; transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }
  #level-corner { left: 16px; align-items: flex-start; }
  #best-corner { right: 16px; align-items: flex-end; }
  .corner-stat.pulse { opacity: 1; transform: scale(1.08); }
  .corner-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #4d6a9e; }
  .corner-value {
    font-size: 16px; font-weight: 700; color: #7ff2ff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(127,242,255,0.4);
  }
  #best-corner .corner-value { color: #ffb86b; text-shadow: 0 0 10px rgba(255,184,107,0.35); }

  /* --- рамка сетки: дышит цветом вместо текстового статуса --- */
  #grid-frame {
    position: relative; z-index: 2;
    padding: 12px;
    border-radius: 28px;
    border: 1px solid rgba(120,160,255,0.08);
    transition: box-shadow 0.5s ease, border-color 0.5s ease, opacity 0.4s ease;
  }
  #grid-frame.phase-show {
    border-color: rgba(127,242,255,0.3);
    box-shadow: 0 0 0 1px rgba(127,242,255,0.22), 0 0 44px rgba(127,242,255,0.16);
    animation: breathe 1.1s ease-in-out infinite;
  }
  #grid-frame.phase-listen {
    border-color: rgba(157,252,174,0.35);
    box-shadow: 0 0 0 1px rgba(157,252,174,0.28), 0 0 44px rgba(157,252,174,0.16);
    animation: breathe 1.3s ease-in-out infinite;
  }
  #grid-frame.phase-error {
    border-color: rgba(255,93,122,0.6);
    box-shadow: 0 0 0 1px rgba(255,93,122,0.5), 0 0 54px rgba(255,93,122,0.35);
  }
  #grid-frame.phase-clear {
    border-color: rgba(255,209,102,0.55);
    box-shadow: 0 0 0 1px rgba(255,209,102,0.45), 0 0 54px rgba(255,209,102,0.3);
  }
  #grid-frame.dimmed { opacity: 0.22; }
  @keyframes breathe {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.4); }
  }

  #grid {
    position: relative;
    display: grid;
    gap: clamp(8px, 2vw, 14px);
    width: min(88vw, 400px);
    aspect-ratio: 1 / 1;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  #grid.shake { animation: shake 0.42s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-10px) rotate(-1deg); }
    30% { transform: translateX(9px) rotate(1deg); }
    45% { transform: translateX(-7px); }
    60% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
    90% { transform: translateX(2px); }
  }

  .cell {
    position: relative;
    border-radius: 18%;
    background: linear-gradient(160deg, #0d1730 0%, #060b17 100%);
    border: 1px solid rgba(120,160,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 6px 18px rgba(0,0,0,0.4);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .cell::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, var(--glow, #7ff2ff) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.18s ease;
  }
  .cell.active {
    transform: scale(0.94);
    border-color: var(--glow, #7ff2ff);
    background: linear-gradient(160deg, color-mix(in srgb, var(--glow, #7ff2ff) 22%, #0d1730) 0%, #060b17 100%);
    box-shadow: 0 0 24px 2px var(--glow, #7ff2ff), 0 0 60px 8px color-mix(in srgb, var(--glow, #7ff2ff) 45%, transparent), inset 0 0 20px rgba(255,255,255,0.08);
  }
  .cell.active::before { opacity: 0.9; }
  .cell.tapped { transform: scale(0.88); }
  .cell.wrong {
    border-color: #ff5d7a;
    background: linear-gradient(160deg, rgba(255,93,122,0.35) 0%, #180608 100%);
    box-shadow: 0 0 30px 4px #ff5d7a;
  }
  .cell.locked { cursor: default; }

  #panel {
    position: relative; z-index: 2;
    margin-top: clamp(20px, 5vh, 32px);
    min-height: 48px;
    display: flex; align-items: center; justify-content: center;
  }

  .ghost-btn {
    font-family: inherit; letter-spacing: 3px; text-transform: uppercase;
    font-size: 12px; font-weight: 700; color: #9fd8ff;
    background: transparent; border: 1px solid rgba(127,242,255,0.35);
    border-radius: 999px; padding: 13px 32px; cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.12s ease, border-color 0.2s ease;
  }
  .ghost-btn:active {
    transform: scale(0.95);
    background: rgba(127,242,255,0.12);
    box-shadow: 0 0 24px rgba(127,242,255,0.25);
    border-color: rgba(127,242,255,0.6);
  }

  /* --- game over: без плашки-панели, просто гаснет сетка --- */
  #overlay {
    position: absolute; inset: 0; z-index: 5;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: rgba(2,4,10,0);
    transition: background 0.4s ease;
  }
  #overlay.show {
    display: flex;
    background: rgba(2,4,10,0.5);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    animation: fadein 0.3s ease;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #overlay-title {
    font-size: 13px; letter-spacing: 6px; text-transform: uppercase;
    color: #ff8399; text-shadow: 0 0 18px rgba(255,93,122,0.45);
  }
  #overlay-stats { display: flex; gap: 36px; }
  .stat-num {
    font-size: 34px; font-weight: 700; color: #7ff2ff; text-align: center;
    text-shadow: 0 0 16px rgba(127,242,255,0.4);
  }
  .stat-lbl { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #4d6a9e; text-align: center; margin-top: 2px; }
  .stat-num.new-best { color: #ffd166; text-shadow: 0 0 18px rgba(255,209,102,0.55); }

  /* --- обучение: ведём за руку --- */
  #tutorial-panel {
    position: absolute; left: 50%; bottom: clamp(70px, 13vh, 120px);
    transform: translateX(-50%);
    z-index: 4; width: min(84vw, 320px);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    pointer-events: none;
  }
  #tutorial-caption {
    text-align: center; font-size: 13px; line-height: 1.55; letter-spacing: 0.5px;
    color: #cfe4ff; opacity: 0; transition: opacity 0.3s ease;
  }
  #tutorial-caption.show { opacity: 1; }
  #tutorial-cta { display: none; pointer-events: all; }

  #replay-tutorial-btn {
    position: fixed; z-index: 3;
    left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(127,242,255,0.25); background: transparent;
    color: #6f8bbd; font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; opacity: 0.35; transition: opacity 0.2s ease;
  }
  #replay-tutorial-btn:active { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="wires"></canvas>

  <div class="corner-stat" id="level-corner">
    <span class="corner-label">Level</span>
    <span class="corner-value" id="level-val">0</span>
  </div>
  <div class="corner-stat" id="best-corner">
    <span class="corner-label">Best</span>
    <span class="corner-value" id="best-val">0</span>
  </div>

  <span class="sr-only" id="sr-status" aria-live="polite"></span>

  <div id="grid-frame">
    <div id="grid"></div>
  </div>

  <div id="panel">
    <button id="start-btn" class="ghost-btn">Начать</button>
  </div>

  <div id="tutorial-panel">
    <p id="tutorial-caption" aria-live="polite"></p>
    <button id="tutorial-cta" class="ghost-btn">Погнали</button>
  </div>

  <button id="replay-tutorial-btn" aria-label="Как играть" title="Как играть">?</button>

  <div id="overlay">
    <div id="overlay-title">Сигнал потерян</div>
    <div id="overlay-stats">
      <div>
        <div class="stat-num" id="final-level">0</div>
        <div class="stat-lbl">Level</div>
      </div>
      <div>
        <div class="stat-num" id="final-best">0</div>
        <div class="stat-lbl">Best</div>
      </div>
    </div>
    <button id="retry-btn" class="ghost-btn">Ещё раз</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COLORS = ["#7ff2ff", "#b98bff", "#ff8bd0", "#ffd166", "#8bffb0", "#6ba8ff"];
  var SIZE_SCHEDULE = [
    { upTo: 4, cols: 3 },
    { upTo: 9, cols: 4 },
    { upTo: 16, cols: 5 },
    { upTo: Infinity, cols: 6 }
  ];
  var TUT_KEY = "neurogrid_onboarded_v1";
  var BEST_KEY = "neurogrid_best_v1";

  var gridFrame = document.getElementById("grid-frame");
  var grid = document.getElementById("grid");
  var startBtn = document.getElementById("start-btn");
  var retryBtn = document.getElementById("retry-btn");
  var overlay = document.getElementById("overlay");
  var srStatus = document.getElementById("sr-status");
  var levelVal = document.getElementById("level-val");
  var bestVal = document.getElementById("best-val");
  var levelCorner = document.getElementById("level-corner");
  var bestCorner = document.getElementById("best-corner");
  var finalLevel = document.getElementById("final-level");
  var finalBest = document.getElementById("final-best");
  var tutorialPanel = document.getElementById("tutorial-panel");
  var tutorialCaption = document.getElementById("tutorial-caption");
  var tutorialCta = document.getElementById("tutorial-cta");
  var replayTutorialBtn = document.getElementById("replay-tutorial-btn");

  var best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
  bestVal.textContent = best;

  var cols = 3;
  var cells = [];
  var sequence = [];
  var userIndex = 0;
  var level = 0;
  var playing = false;
  var accepting = false;
  var tutorialActive = false;

  // --- audio ---
  var audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }
  function unlockAudio() {
    try {
      var c = ctx();
      if (c.state === "suspended") c.resume();
    } catch (e) { /* ignore */ }
  }
  document.addEventListener("pointerdown", unlockAudio, { once: true });

  function beep(freq, dur, type) {
    try {
      var c = ctx();
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, c.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + dur + 0.02);
    } catch (e) { /* audio unsupported, ignore */ }
  }
  function toneForIndex(i, n) {
    var base = 220;
    var ratio = Math.pow(2, i / n);
    return base * (1 + ratio);
  }

  function haptic(style) {
    try {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        var h = window.Telegram.WebApp.HapticFeedback;
        if (style === "error") h.notificationOccurred("error");
        else if (style === "success") h.notificationOccurred("success");
        else h.impactOccurred(style || "light");
      } else if (navigator.vibrate) {
        navigator.vibrate(style === "error" ? [40, 40, 40] : 15);
      }
    } catch (e) { /* ignore */ }
  }

  function colsForLevel(lvl) {
    for (var i = 0; i < SIZE_SCHEDULE.length; i++) {
      if (lvl <= SIZE_SCHEDULE[i].upTo) return SIZE_SCHEDULE[i].cols;
    }
    return 6;
  }

  function buildGrid(n) {
    grid.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
    grid.innerHTML = "";
    cells = [];
    var total = n * n;
    for (var i = 0; i < total; i++) {
      var c = document.createElement("div");
      c.className = "cell locked";
      c.style.setProperty("--glow", COLORS[i % COLORS.length]);
      c.dataset.idx = i;
      c.addEventListener("pointerdown", onCellTap);
      grid.appendChild(c);
      cells.push(c);
    }
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function setPhase(name, srText) {
    gridFrame.className = name ? "phase-" + name : "";
    if (srText !== undefined) srStatus.textContent = srText;
  }

  var levelBumpTimer = null, bestBumpTimer = null;
  function bumpCorner(el, timerHolder) {
    el.classList.add("pulse");
    clearTimeout(timerHolder.id);
    timerHolder.id = setTimeout(function () { el.classList.remove("pulse"); }, 900);
  }
  var levelBumpHolder = { id: null }, bestBumpHolder = { id: null };

  function lockCells(locked) {
    cells.forEach(function (c) {
      if (locked) c.classList.add("locked"); else c.classList.remove("locked");
    });
  }

  async function playSequence() {
    accepting = false;
    lockCells(true);
    setPhase("show", "Смотри внимательно");
    await sleep(450);
    for (var i = 0; i < sequence.length; i++) {
      var idx = sequence[i];
      var cell = cells[idx];
      cell.classList.add("active");
      beep(toneForIndex(idx, cells.length), 0.22, "sine");
      await sleep(Math.max(230, 430 - level * 6));
      cell.classList.remove("active");
      await sleep(Math.max(90, 160 - level * 3));
    }
    userIndex = 0;
    accepting = true;
    lockCells(false);
    setPhase("listen", "Повтори сигнал");
  }

  function nextRound() {
    level += 1;
    levelVal.textContent = level;
    bumpCorner(levelCorner, levelBumpHolder);
    var neededCols = colsForLevel(level);
    if (neededCols !== cols) {
      cols = neededCols;
      buildGrid(cols);
    }
    sequence.push(Math.floor(Math.random() * cells.length));
    playSequence();
  }

  function onCellTap(e) {
    if (!accepting || !playing) return;
    var idx = parseInt(e.currentTarget.dataset.idx, 10);
    var cell = e.currentTarget;
    var expected = sequence[userIndex];

    if (idx === expected) {
      cell.classList.add("tapped", "active");
      beep(toneForIndex(idx, cells.length), 0.16, "triangle");
      haptic("light");
      setTimeout(function () {
        cell.classList.remove("tapped", "active");
      }, 140);
      userIndex += 1;
      if (userIndex === sequence.length) {
        accepting = false;
        haptic("success");
        setPhase("clear", "Уровень пройден");
        setTimeout(nextRound, 520);
      }
    } else {
      accepting = false;
      cell.classList.add("wrong");
      beep(90, 0.4, "sawtooth");
      haptic("error");
      grid.classList.add("shake");
      setPhase("error", "Обрыв связи");
      setTimeout(gameOver, 480);
    }
  }

  function gameOver() {
    playing = false;
    grid.classList.remove("shake");
    lockCells(true);
    gridFrame.classList.add("dimmed");
    if (level > best) {
      best = level;
      localStorage.setItem(BEST_KEY, String(best));
      bumpCorner(bestCorner, bestBumpHolder);
    }
    bestVal.textContent = best;
    finalLevel.textContent = level;
    finalBest.textContent = best;
    document.getElementById("final-best").classList.toggle("new-best", level >= best && level > 0);
    overlay.classList.add("show");
  }

  function startGame() {
    ctx(); // unlock audio on user gesture
    overlay.classList.remove("show");
    gridFrame.classList.remove("dimmed");
    setPhase("", "");
    cells.forEach(function (c) { c.classList.remove("wrong"); });
    level = 0;
    sequence = [];
    cols = 3;
    buildGrid(cols);
    playing = true;
    levelVal.textContent = 0;
    startBtn.style.display = "none";
    replayTutorialBtn.style.display = "none";
    nextRound();
  }

  // --- обучение: ведём за руку ---
  function setCaption(text) {
    tutorialCaption.classList.remove("show");
    tutorialCaption.textContent = text;
    void tutorialCaption.offsetWidth; // force reflow to restart fade-in
    tutorialCaption.classList.add("show");
  }

  function waitForSingleTap(expectedIdx) {
    return new Promise(function (resolve) {
      function handler(e) {
        cells.forEach(function (c) { c.removeEventListener("pointerdown", handler); });
        var idx = parseInt(e.currentTarget.dataset.idx, 10);
        var cell = e.currentTarget;
        if (idx === expectedIdx) {
          cell.classList.add("tapped", "active");
          beep(toneForIndex(idx, cells.length), 0.16, "triangle");
          haptic("light");
          setTimeout(function () { cell.classList.remove("tapped", "active"); }, 140);
        } else {
          cell.classList.add("wrong");
          beep(90, 0.3, "sawtooth");
          haptic("error");
          setTimeout(function () { cell.classList.remove("wrong"); }, 300);
        }
        resolve(idx === expectedIdx);
      }
      cells.forEach(function (c) { c.addEventListener("pointerdown", handler); });
    });
  }

  async function flashCell(idx, onMs, offMs) {
    var cell = cells[idx];
    cell.classList.add("active");
    beep(toneForIndex(idx, cells.length), Math.min(0.24, onMs / 1000), "sine");
    await sleep(onMs);
    cell.classList.remove("active");
    await sleep(offMs);
  }

  async function tutorialSingleStep() {
    var target = 4; // центр сетки 3x3
    for (;;) {
      setCaption("Смотри.");
      await sleep(350);
      await flashCell(target, 320, 260);
      setCaption("Нажми на неё — так же, как она горела.");
      var ok = await waitForSingleTap(target);
      if (ok) { setCaption("Точно."); await sleep(650); return; }
      setCaption("Мимо — ещё раз.");
      await sleep(550);
    }
  }

  async function tutorialChainStep() {
    var seq = [4, 1];
    for (;;) {
      setCaption("Запоминай порядок.");
      await sleep(500);
      await flashCell(seq[0], 380, 220);
      await flashCell(seq[1], 380, 220);
      setCaption("Повтори цепочку.");
      var mistake = false;
      for (var i = 0; i < seq.length; i++) {
        var ok = await waitForSingleTap(seq[i]);
        if (!ok) { mistake = true; break; }
      }
      if (!mistake) { setCaption("Именно так."); await sleep(650); return; }
      setCaption("Собьёшься — начнём цепочку заново.");
      await sleep(700);
    }
  }

  async function runTutorial() {
    tutorialActive = true;
    startBtn.style.display = "none";
    replayTutorialBtn.style.display = "none";
    overlay.classList.remove("show");
    gridFrame.classList.remove("dimmed");
    cols = 3;
    buildGrid(cols);
    lockCells(false);
    tutorialPanel.style.display = "flex";

    setCaption("Neurogrid — сетка, которая запоминает.");
    await sleep(1500);

    await tutorialSingleStep();

    setCaption("Дальше — цепочки длиннее.");
    await sleep(1300);

    await tutorialChainStep();

    setCaption("Ошибся после старта — и всё сначала. Сетка растёт с каждым уровнем.");
    await sleep(1900);

    setCaption("Погнали?");
    tutorialCta.style.display = "inline-flex";
    await new Promise(function (resolve) {
      function onClick() {
        tutorialCta.removeEventListener("click", onClick);
        resolve();
      }
      tutorialCta.addEventListener("click", onClick);
    });
    tutorialCta.style.display = "none";
    tutorialCaption.classList.remove("show");

    localStorage.setItem(TUT_KEY, "1");
    tutorialActive = false;
    startGame();
  }

  buildGrid(cols);
  startBtn.addEventListener("click", startGame);
  retryBtn.addEventListener("click", startGame);
  replayTutorialBtn.addEventListener("click", function () { runTutorial(); });

  if (localStorage.getItem(TUT_KEY)) {
    startBtn.style.display = "inline-block";
  } else {
    startBtn.style.display = "none";
    replayTutorialBtn.style.display = "none";
    setTimeout(runTutorial, 500);
  }

  // --- фоновые нейро-нити на canvas ---
  var wiresCanvas = document.getElementById("wires");
  var wctx = wiresCanvas.getContext("2d");
  var nodes = [];
  function resizeWires() {
    wiresCanvas.width = window.innerWidth;
    wiresCanvas.height = window.innerHeight;
  }
  function initNodes() {
    nodes = [];
    var n = 22;
    for (var i = 0; i < n; i++) {
      nodes.push({
        x: Math.random() * wiresCanvas.width,
        y: Math.random() * wiresCanvas.height,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25
      });
    }
  }
  function drawWires() {
    wctx.clearRect(0, 0, wiresCanvas.width, wiresCanvas.height);
    nodes.forEach(function (p) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > wiresCanvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > wiresCanvas.height) p.vy *= -1;
    });
    for (var i = 0; i < nodes.length; i++) {
      for (var j = i + 1; j < nodes.length; j++) {
        var a = nodes[i], b = nodes[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          wctx.strokeStyle = "rgba(127,242,255," + (0.12 * (1 - dist / 150)) + ")";
          wctx.lineWidth = 1;
          wctx.beginPath();
          wctx.moveTo(a.x, a.y);
          wctx.lineTo(b.x, b.y);
          wctx.stroke();
        }
      }
      wctx.fillStyle = "rgba(127,242,255,0.5)";
      wctx.beginPath();
      wctx.arc(nodes[i].x, nodes[i].y, 1.6, 0, Math.PI * 2);
      wctx.fill();
    }
    requestAnimationFrame(drawWires);
  }
  window.addEventListener("resize", function () { resizeWires(); initNodes(); });
  resizeWires();
  initNodes();
  drawWires();
})();
</script>
</body>
</html>
