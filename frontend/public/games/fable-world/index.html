<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#101815" />
  <title>Fable World</title>
  <style>
    :root{color-scheme:dark;--glass:rgba(13,21,18,.84);--line:rgba(255,255,255,.12);--mint:#88f0bd;--gold:#ffd071;--danger:#ff6e70}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101815;color:#f4fff8;font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:none}
    button{font:inherit;color:inherit}
    #game{position:fixed;inset:0;overflow:hidden;background:#17251f}
    canvas{display:block;width:100%;height:100%}
    .glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    #top{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
    .identity{min-width:0;border-radius:18px;padding:8px 10px;display:flex;gap:9px;align-items:center;pointer-events:auto}
    .portrait{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#52d49a,#376b62);font-size:22px;border:1px solid #b5ffe0}
    .who{min-width:112px}.who strong{display:block;font-size:13px;letter-spacing:.02em}.micro{font-size:10px;color:#c2d4ca;margin-top:2px}
    .bar{height:5px;background:#24322d;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:50%;transition:width .2s}.hp i{background:linear-gradient(90deg,#ff666b,#ffad73)}.xp i{background:linear-gradient(90deg,#6fe9ff,#9c82ff)}
    #region{margin-left:auto;border-radius:16px;padding:8px 10px;text-align:right;pointer-events:auto;max-width:145px}.region-name{font-size:12px;font-weight:800}.region-level{font-size:9px;color:#d6e3dc;margin-top:2px}
    #exit{pointer-events:auto;width:36px;height:36px;border:0;border-radius:13px;display:grid;place-items:center;font-size:18px;background:rgba(18,27,24,.88)}
    #resources{position:absolute;left:10px;right:10px;top:74px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding-bottom:3px}#resources::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;border-radius:11px;padding:5px 7px;font-size:10px;font-weight:750;background:rgba(9,15,13,.72);border:1px solid rgba(255,255,255,.1)}
    #objective{position:absolute;top:106px;left:50%;transform:translateX(-50%);max-width:min(88vw,420px);border-radius:14px;padding:7px 11px;font-size:10px;text-align:center;color:#e9f7ef;pointer-events:none;transition:opacity .25s}
    #toast{position:absolute;left:50%;top:142px;transform:translate(-50%,-8px);opacity:0;max-width:86vw;padding:9px 13px;border-radius:14px;text-align:center;font-size:11px;font-weight:700;pointer-events:none;transition:.22s;z-index:20}#toast.show{opacity:1;transform:translate(-50%,0)}
    #joystick{position:absolute;left:18px;bottom:92px;width:104px;height:104px;border-radius:50%;background:rgba(8,16,13,.34);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 25px rgba(0,0,0,.28);touch-action:none}
    #stick{position:absolute;width:48px;height:48px;border-radius:50%;left:28px;top:28px;background:linear-gradient(145deg,rgba(139,255,196,.84),rgba(62,132,109,.88));border:1px solid #c8ffe2;box-shadow:0 7px 18px rgba(0,0,0,.34)}
    #actions{position:absolute;right:16px;bottom:91px;width:142px;height:130px;pointer-events:none}.action{pointer-events:auto;position:absolute;border:1px solid rgba(255,255,255,.18);background:rgba(12,20,17,.79);box-shadow:0 8px 22px rgba(0,0,0,.32);border-radius:50%;font-weight:900;line-height:1.05}.action b{display:block;font-size:22px}.action span{font-size:8px;text-transform:uppercase;letter-spacing:.06em}.action:active{transform:scale(.92)}
    #attack{right:0;bottom:0;width:70px;height:70px;background:linear-gradient(145deg,rgba(158,55,56,.92),rgba(65,23,28,.92))}#capture{right:72px;top:0;width:62px;height:62px;background:linear-gradient(145deg,rgba(93,68,179,.92),rgba(39,27,76,.92))}#gather{right:0;top:0;width:58px;height:58px}
    #dock{position:absolute;left:10px;right:10px;bottom:8px;height:68px;border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;gap:4px;z-index:10}
    .dockbtn{border:0;background:transparent;border-radius:16px;font-size:9px;color:#c5d4cd}.dockbtn b{display:block;font-size:22px;margin-bottom:2px}.dockbtn:active,.dockbtn.active{background:rgba(131,240,184,.13);color:#fff}
    #panelBackdrop{position:absolute;inset:0;background:rgba(3,7,6,.44);opacity:0;pointer-events:none;transition:.2s;z-index:30}#panelBackdrop.open{opacity:1;pointer-events:auto}
    #panel{position:absolute;left:8px;right:8px;bottom:8px;max-height:min(76vh,650px);transform:translateY(calc(100% + 16px));transition:.28s cubic-bezier(.2,.8,.2,1);z-index:31;border-radius:26px;overflow:hidden;display:flex;flex-direction:column}#panel.open{transform:translateY(0)}
    .panelHead{display:flex;align-items:center;gap:10px;padding:15px 16px 10px;border-bottom:1px solid var(--line)}.panelHead h2{font-size:17px;margin:0}.panelHead p{margin:3px 0 0;font-size:10px;color:#aebeb6}.close{margin-left:auto;border:0;border-radius:13px;background:rgba(255,255,255,.08);width:36px;height:36px;font-size:18px}
    #panelBody{overflow:auto;padding:10px 10px 22px;overscroll-behavior:contain;touch-action:pan-y}
    .sectionTitle{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#9fb1a8;margin:10px 5px 7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .card{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:17px;padding:10px;min-width:0}.card h3{font-size:12px;margin:0 0 4px}.card p{font-size:9px;line-height:1.35;color:#b9c9c1;margin:4px 0}.row{display:flex;align-items:center;gap:7px}.bigIcon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:radial-gradient(circle at 50% 65%,rgba(118,224,171,.2),rgba(255,255,255,.035) 68%);font-size:22px;flex:0 0 auto;overflow:hidden}.fableSprite{display:block;width:100%;height:100%;background-repeat:no-repeat;background-size:500% 200%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));transform:scale(1.12)}.grow{flex:1;min-width:0}.tag{display:inline-flex;border-radius:8px;background:rgba(255,255,255,.07);padding:3px 5px;font-size:8px;margin:2px 2px 0 0}.cta{width:100%;border:0;border-radius:11px;padding:8px;margin-top:7px;background:linear-gradient(135deg,#69d7a3,#347a66);font-size:10px;font-weight:850}.cta.secondary{background:rgba(255,255,255,.09)}.cta:disabled{opacity:.38}.cost{font-size:8px;color:#dce8e2}.bad{color:#ff8d8f}.good{color:#8ff1bd}
    .tech{position:relative}.tech.locked{opacity:.48}.branch{font-size:8px;text-transform:uppercase;color:#8ff1bd;letter-spacing:.06em}.techLevel{position:absolute;right:8px;top:8px;font-size:9px;color:#ffd071}.progressLine{height:4px;border-radius:4px;background:#28352f;overflow:hidden;margin-top:6px}.progressLine i{height:100%;display:block;background:#7de4ad}
    .empty{text-align:center;padding:28px 16px;color:#aebeb6;font-size:11px}.hint{border:1px dashed rgba(255,208,113,.35);background:rgba(255,208,113,.07);padding:9px;border-radius:13px;font-size:9px;line-height:1.4;color:#f4e5bd;margin-bottom:8px}
    #placement{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);padding:9px 13px;border-radius:14px;font-size:10px;display:none;z-index:15}#placement.show{display:block}
    @media (min-width:700px){#panel{left:50%;right:auto;width:520px;transform:translate(-50%,calc(100% + 16px))}#panel.open{transform:translate(-50%,0)}#joystick{width:122px;height:122px}#stick{left:37px;top:37px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
<div id="game">
  <canvas id="world"></canvas>
  <div id="top">
    <div class="identity glass"><div class="portrait">🧭</div><div class="who"><strong>Искатель · <span id="level">1</span> ур.</strong><div class="bar hp"><i id="hpbar"></i></div><div class="bar xp"><i id="xpbar"></i></div><div class="micro" id="statusText">HP 110/110 · знание 6</div></div></div>
    <div id="region" class="glass"><div class="region-name">🌳 Сердечная роща</div><div class="region-level">уровни 1–7</div></div>
    <button id="exit" class="glass" aria-label="Выйти">×</button>
  </div>
  <div id="resources"></div>
  <div id="objective" class="glass">Соберите дерево, камень и эфир. Ослабьте первого фейбла и поймайте его.</div>
  <div id="toast" class="glass"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="actions">
    <button id="capture" class="action"><b>🔮</b><span>поймать</span></button>
    <button id="gather" class="action"><b>✋</b><span>добыть</span></button>
    <button id="attack" class="action"><b>⚔️</b><span>удар</span></button>
  </div>
  <nav id="dock" class="glass">
    <button class="dockbtn" data-panel="bag"><b>🎒</b>Сумка</button>
    <button class="dockbtn" data-panel="fables"><b>🐾</b>Фейблы</button>
    <button class="dockbtn" data-panel="tech"><b>✨</b>Наука</button>
    <button class="dockbtn" data-panel="build"><b>🔨</b>Стройка</button>
  </nav>
  <div id="placement" class="glass"></div>
  <div id="panelBackdrop"></div>
  <section id="panel" class="glass"><header class="panelHead"><div><h2 id="panelTitle"></h2><p id="panelSub"></p></div><button class="close">×</button></header><div id="panelBody"></div></section>
</div>
<script>
(() => {
  "use strict";
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const canvas=$("#world"), ctx=canvas.getContext("2d");
  const SAVE_KEY="gamepass.fable-world.v1", WORLD={w:4000,h:1600}, BASE={x:300,y:800,r:260};
  const DATA={}, maps={}, ART={ground:{},buildings:{},nodes:{},atlases:{}};
  const ATLAS_INDEX={
    mossprig:["a",0,0],cindertail:["a",1,0],pebblemole:["a",2,0],brooklet:["a",3,0],thornhare:["a",4,0],
    voltkit:["a",0,1],mirecap:["a",1,1],reedmaw:["a",2,1],ironhorn:["a",3,1],sunweaver:["a",4,1],
    dunewing:["b",0,0],glassback:["b",1,0],emberwing:["b",2,0],ashram:["b",3,0],runegolem:["b",4,0],
    pyrelisk:["b",0,1],glimfox:["b",1,1],aurorayak:["b",2,1],moonowl:["b",3,1],starwyrm:["b",4,1]
  };
  let state, nodes=[], wild=[], last=performance.now(), saveClock=0, hudClock=0, currentPanel=null, placement=null, tapTarget=null, toastTimer=0;
  const input={x:0,y:0,keys:new Set()}, camera={x:0,y:0};

  const initialState=()=>({version:1,player:{x:335,y:800,level:1,xp:0,hp:110,maxHp:110,attackCd:0},knowledge:6,inventory:{wood:0,stone:0,fiber:0,berry:4,aether:0,basicOrb:3},unlocked:["fieldcraft"],buildings:[],fables:[],seenSpecies:[],discovered:["heartgrove"],playSeconds:0,lastSaved:Date.now(),tutorial:0});
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const fmt=n=>n<10&&n%1? n.toFixed(1):Math.floor(n).toLocaleString("ru-RU");
  const seeded=(seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(74017);
  const hasTech=id=>state.unlocked.includes(id);
  const hasBuilding=id=>state.buildings.some(b=>b.id===id);
  const item=id=>maps.items[id]||{name:id,icon:"•"};
  const species=id=>maps.species[id];
  const biomeAt=x=>DATA.biomes.biomes.find(b=>x>=b.xRange[0]&&x<b.xRange[1])||DATA.biomes.biomes.at(-1);
  const xpNeed=()=>60+state.player.level*35;

  function loadSave(){
    try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY));state=saved?.version===1?Object.assign(initialState(),saved):initialState()}catch{state=initialState()}
    state.player.maxHp=110+(state.player.level-1)*12;state.player.hp=clamp(state.player.hp||state.player.maxHp,1,state.player.maxHp);
    state.inventory=Object.assign(initialState().inventory,state.inventory||{});state.lastSaved=state.lastSaved||Date.now();
  }
  function save(){state.lastSaved=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
  function haptic(type="light"){try{parent.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.(type)}catch{};try{navigator.vibrate(type==="heavy"?35:12)}catch{}}
  function toast(msg,type="normal"){const el=$("#toast");el.textContent=msg;el.style.borderColor=type==="bad"?"rgba(255,90,90,.5)":type==="good"?"rgba(100,255,177,.5)":"";el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}

  async function loadData(){
    const names=["technologies","items","fables","biomes","balance"];
    const rows=await Promise.all(names.map(n=>fetch(`data/${n}.json`).then(r=>{if(!r.ok)throw Error(n);return r.json()})));
    names.forEach((n,i)=>DATA[n]=rows[i]);
    maps.items=Object.fromEntries(DATA.items.resources.map(x=>[x.id,x]));
    maps.buildings=Object.fromEntries(DATA.items.buildings.map(x=>[x.id,x]));
    maps.species=Object.fromEntries(DATA.fables.species.map(x=>[x.id,x]));
    maps.tech=Object.fromEntries(DATA.technologies.technologies.map(x=>[x.id,x]));
  }
  const loadImage=src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src});
  async function loadArt(){
    const grounds=["heartgrove","mistfen","sundust","emberpeak","starfrost"],buildingIds=["hearthcore","chest","logging_camp","quarry","berry_garden","loom","furnace","workshop","orb_bench","generator","assembler"],nodeIds=["rock","aether_node","ore_node","coal_node","ember_node","quartz_node","star_node"];
    const jobs=[];
    for(const id of grounds)jobs.push(loadImage(`assets/nova/ground-${id}.png`).then(img=>ART.ground[id]=img));
    for(const id of buildingIds)jobs.push(loadImage(`assets/nova/build-${id}.png`).then(img=>ART.buildings[id]=img));
    for(const id of nodeIds)jobs.push(loadImage(`assets/nova/node-${id}.png`).then(img=>ART.nodes[id]=img));
    jobs.push(loadImage("assets/nova/tree.png").then(img=>ART.tree=img));
    jobs.push(loadImage("assets/nova/player.png").then(img=>ART.player=img));
    jobs.push(loadImage("assets/fables/fables-atlas-a.png").then(img=>ART.atlases.a=img));
    jobs.push(loadImage("assets/fables/fables-atlas-b.png").then(img=>ART.atlases.b=img));
    await Promise.all(jobs);
  }

  function generateWorld(){
    nodes=[];wild=[];
    const nodeInfo={tree:["wood","🌲",1],rock:["stone","🪨",1],grass:["fiber","🌿",1],bush:["berry","🫐",1],aether_node:["aether","🔹",1],ore_node:["ore","⛏️",2],coal_node:["coal","⚫",2],ember_node:["cinder","🟠",2],quartz_node:["quartz","💎",3],star_node:["starOre","🌠",3]};
    for(const b of DATA.biomes.biomes){
      const count=b.id==="heartgrove"?68:54;
      for(let i=0;i<count;i++){
        const kind=b.nodes[Math.floor(seeded()*b.nodes.length)], meta=nodeInfo[kind];
        const x=b.xRange[0]+40+seeded()*(b.xRange[1]-b.xRange[0]-80),y=55+seeded()*(WORLD.h-110);
        if(Math.hypot(x-BASE.x,y-BASE.y)<125)continue;
        nodes.push({id:`${b.id}-${i}`,kind,resource:meta[0],icon:meta[1],gate:meta[2],x,y,alive:true,respawn:0});
      }
      const pool=DATA.fables.species.filter(s=>s.biome===b.id);
      for(let i=0;i<16;i++){const sp=pool[i%pool.length],lv=Math.round(sp.levels[0]+seeded()*(sp.levels[1]-sp.levels[0]));spawnWild(sp,lv,b,i)}
    }
  }
  function spawnWild(sp,level,b,index){
    const x=b.xRange[0]+70+seeded()*(b.xRange[1]-b.xRange[0]-140),y=80+seeded()*(WORLD.h-160);
    const maxHp=Math.round(38+level*8+sp.stats.hp*.35);
    wild.push({id:`${b.id}-${sp.id}-${index}`,species:sp.id,level,x,y,homeX:x,homeY:y,hp:maxHp,maxHp,aggro:false,dead:false,respawn:0,attackCd:seeded(),wander:seeded()*6});
  }

  function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);canvas._dpr=dpr}
  function worldPoint(clientX,clientY){return{x:clientX+camera.x,y:clientY+camera.y}}
  function screenPoint(o){return{x:o.x-camera.x,y:o.y-camera.y}}

  function draw(){
    const w=innerWidth,h=innerHeight,p=state.player;camera.x=clamp(p.x-w*.5,0,WORLD.w-w);camera.y=clamp(p.y-h*.5,0,WORLD.h-h);
    ctx.clearRect(0,0,w,h);
    for(const b of DATA.biomes.biomes){const sx=b.xRange[0]-camera.x,sw=b.xRange[1]-b.xRange[0];if(sx>w||sx+sw<0)continue;ctx.fillStyle=b.colors.ground;ctx.fillRect(sx,-camera.y,sw,WORLD.h);const texture=ART.ground[b.id],tile=512,startX=Math.floor(Math.max(b.xRange[0],camera.x)/tile)*tile,startY=Math.floor(camera.y/tile)*tile;if(texture){ctx.save();ctx.beginPath();ctx.rect(Math.max(0,sx),0,Math.min(w,sx+sw)-Math.max(0,sx),h);ctx.clip();ctx.globalAlpha=.34;ctx.globalCompositeOperation="soft-light";for(let x=startX;x<Math.min(b.xRange[1],camera.x+w)+tile;x+=tile)for(let y=startY;y<camera.y+h+tile;y+=tile)ctx.drawImage(texture,x-camera.x,y-camera.y,tile,tile);ctx.restore()}const shade=ctx.createLinearGradient(sx,0,sx+sw,0);shade.addColorStop(0,"rgba(0,0,0,.12)");shade.addColorStop(.5,"rgba(255,255,255,.025)");shade.addColorStop(1,"rgba(0,0,0,.16)");ctx.fillStyle=shade;ctx.fillRect(sx,0,sw,h);drawLandmark(b)}
    if(hasBuilding("hearthcore")){const bp=screenPoint(BASE);ctx.beginPath();ctx.arc(bp.x,bp.y,BASE.r,0,Math.PI*2);ctx.fillStyle="rgba(105,240,170,.035)";ctx.fill();ctx.strokeStyle="rgba(132,255,193,.25)";ctx.setLineDash([7,8]);ctx.stroke();ctx.setLineDash([])}
    for(const n of nodes)if(n.alive)drawNode(n);
    for(const b of state.buildings)drawBuilding(b);
    drawWorkers();
    for(const c of wild)if(!c.dead)drawCreature(c,false);
    drawParty();drawPlayer();
    if(placement){const m=screenPoint(placement.pos||BASE),def=maps.buildings[placement.id],img=ART.buildings[placement.id];ctx.globalAlpha=.66;if(img)ctx.drawImage(img,m.x-34,m.y-34,68,68);else{ctx.font="32px serif";ctx.textAlign="center";ctx.fillText(def.icon,m.x,m.y)}ctx.globalAlpha=1}
  }
  function drawLandmark(b){const x=(b.xRange[0]+b.xRange[1])/2-camera.x,y=170-camera.y;if(x<-120||x>innerWidth+120||y<-80||y>innerHeight+80)return;ctx.textAlign="center";ctx.fillStyle="rgba(245,255,250,.16)";ctx.font="46px serif";ctx.fillText("◈",x,y);ctx.fillStyle="rgba(255,255,255,.65)";ctx.font="700 10px system-ui";ctx.fillText(b.landmark,x,y+20)}
  function drawNode(n){const q=screenPoint(n);if(q.x<-55||q.x>innerWidth+55||q.y<-65||q.y>innerHeight+65)return;const img=n.kind==="tree"?ART.tree:ART.nodes[n.kind];ctx.save();ctx.fillStyle="rgba(4,8,6,.28)";ctx.beginPath();ctx.ellipse(q.x,q.y+13,n.kind==="tree"?23:16,n.kind==="tree"?8:6,0,0,Math.PI*2);ctx.fill();if(img){const size=n.kind==="tree"?72:n.kind==="rock"?42:38;ctx.drawImage(img,q.x-size/2,q.y-size*.72,size,size)}else{ctx.textAlign="center";ctx.font="23px serif";ctx.fillText(n.icon,q.x,q.y+7)}ctx.restore();if(dist(n,state.player)<70){ctx.beginPath();ctx.arc(q.x,q.y,28,0,Math.PI*2);ctx.strokeStyle="rgba(214,255,233,.72)";ctx.lineWidth=2;ctx.stroke()}}
  function drawBuilding(b){const q=screenPoint(b);if(q.x<-65||q.x>innerWidth+65||q.y<-65||q.y>innerHeight+65)return;const d=maps.buildings[b.id],img=ART.buildings[b.id],size=b.id==="hearthcore"?76:64;ctx.fillStyle="rgba(3,7,5,.36)";ctx.beginPath();ctx.ellipse(q.x,q.y+19,size*.36,9,0,0,Math.PI*2);ctx.fill();if(img)ctx.drawImage(img,q.x-size/2,q.y-size*.58,size,size);else{ctx.textAlign="center";ctx.font="26px serif";ctx.fillText(d.icon,q.x,q.y+8)}ctx.font="800 8px system-ui";ctx.textAlign="center";ctx.fillStyle="#f0fff7";ctx.strokeStyle="rgba(5,11,8,.9)";ctx.lineWidth=3;ctx.strokeText(d.name,q.x,q.y+36);ctx.fillText(d.name,q.x,q.y+36)}

  function update(dt){
    const p=state.player,speed=145,dx=input.x+(input.keys.has("a")||input.keys.has("arrowleft")?-1:0)+(input.keys.has("d")||input.keys.has("arrowright")?1:0),dy=input.y+(input.keys.has("w")||input.keys.has("arrowup")?-1:0)+(input.keys.has("s")||input.keys.has("arrowdown")?1:0),len=Math.hypot(dx,dy)||1;
    if(Math.abs(dx)+Math.abs(dy)>.05){p.x=clamp(p.x+dx/len*speed*dt,18,WORLD.w-18);p.y=clamp(p.y+dy/len*speed*dt,18,WORLD.h-18);tapTarget=null}else if(tapTarget){const d=dist(p,tapTarget);if(d>8){p.x+=((tapTarget.x-p.x)/d)*speed*dt;p.y+=((tapTarget.y-p.y)/d)*speed*dt}else tapTarget=null}
    p.attackCd=Math.max(0,p.attackCd-dt);state.playSeconds+=dt;
    updateWild(dt);runProduction(dt);discoverBiome();updateHud();hudClock+=dt;if(hudClock>1){hudClock=0;renderResources()}saveClock+=dt;if(saveClock>8){saveClock=0;save()}
  }
  function updateWild(dt){
    for(const c of wild){if(c.dead){c.respawn-=dt;if(c.respawn<=0){c.dead=false;c.aggro=false;c.hp=c.maxHp;c.x=c.homeX;c.y=c.homeY}continue}c.attackCd=Math.max(0,c.attackCd-dt);const sp=species(c.species),d=dist(c,state.player);if(sp.temper==="aggressive"&&d<95)c.aggro=true;if(c.aggro){if(d>38&&d<330){c.x+=(state.player.x-c.x)/d*52*dt;c.y+=(state.player.y-c.y)/d*52*dt}else if(d<=42&&c.attackCd<=0){c.attackCd=1.15;hurtPlayer(c)}}else{c.wander-=dt;if(c.wander<=0){c.wander=2+seeded()*4;c.vx=seeded()-.5;c.vy=seeded()-.5}c.x=clamp(c.x+(c.vx||0)*16*dt,c.homeX-80,c.homeX+80);c.y=clamp(c.y+(c.vy||0)*16*dt,c.homeY-80,c.homeY+80)}}
  }
  function playerDefense(){return 5+(state.player.level-1)*1.15}
  function hurtPlayer(c){const sp=species(c.species),raw=5+c.level*1.4+sp.stats.attack*.05,dmg=Math.max(2,Math.round(raw-playerDefense()*.35));state.player.hp-=dmg;haptic("heavy");toast(`−${dmg} HP · ${sp.name} атакует`,"bad");if(state.player.hp<=0){state.player.x=BASE.x+35;state.player.y=BASE.y;state.player.hp=state.player.maxHp;wild.forEach(x=>x.aggro=false);toast("Вы очнулись у стоянки. Ресурсы сохранены.","bad")}}
  function nearestWild(range=120){return wild.filter(c=>!c.dead&&dist(c,state.player)<=range).sort((a,b)=>dist(a,state.player)-dist(b,state.player))[0]}
  function nearestNode(range=75){return nodes.filter(n=>n.alive&&dist(n,state.player)<=range).sort((a,b)=>dist(a,state.player)-dist(b,state.player))[0]}
  function attack(){const p=state.player;if(p.attackCd>0)return;const c=nearestWild(105);if(!c){toast("Подойдите ближе к дикому фейблу");return}p.attackCd=.48;c.aggro=true;const sp=species(c.species),def=2+c.level*1.22+sp.stats.defense*.035;let raw=12+(p.level-1)*2.2;for(const f of state.fables.filter(x=>x.mode==="party")){const fs=species(f.species);raw+=3+f.level*.55+fs.stats.attack*.02}const dmg=Math.max(1,Math.round(raw-def*.42));c.hp-=dmg;haptic("medium");if(c.hp<=0)defeat(c);else toast(`⚔️ ${sp.name}: −${dmg} · HP ${Math.ceil(c.hp)}/${c.maxHp}`)}
  function defeat(c){c.dead=true;c.respawn=18;c.aggro=false;const sp=species(c.species);Object.entries(sp.drop||{}).forEach(([k,v])=>add(k,v));gainXp(14+c.level*3);toast(`Победа над ${sp.name} · добыча получена`,"good");renderResources()}
  function chooseOrb(level){const order=level>=23?["sigilOrb","runeOrb","wovenOrb","basicOrb"]:level>=14?["runeOrb","wovenOrb","basicOrb"]:level>=7?["wovenOrb","basicOrb"]:["basicOrb"];return order.find(id=>(state.inventory[id]||0)>=1)||["sigilOrb","runeOrb","wovenOrb","basicOrb"].find(id=>(state.inventory[id]||0)>=1)}
  function capture(){const c=nearestWild(130);if(!c){toast("Для броска подойдите к фейблу");return}const orb=chooseOrb(c.level);if(!orb){toast("Сферы закончились — создайте новые в сумке","bad");return}const power=item(orb).capturePower||8;if(c.level>power+3){toast(`${item(orb).name} слишком слаба для ${c.level} уровня`,"bad");return}state.inventory[orb]--;const missing=1-c.hp/c.maxHp,sphereFactor=power/8,levelFactor=Math.pow(.87,Math.max(0,c.level-state.player.level))*Math.min(1.2,1+Math.max(0,state.player.level-c.level)*.025),chance=clamp((.18+missing*.62)*sphereFactor*levelFactor,.02,.94);haptic("medium");if(Math.random()<chance){c.dead=true;c.respawn=24;c.aggro=false;const first=!state.seenSpecies.includes(c.species);if(first){state.seenSpecies.push(c.species);state.knowledge++;}state.fables.push({uid:`f${Date.now()}${Math.floor(Math.random()*99)}`,species:c.species,level:c.level,mode:"reserve",job:null});gainXp(22+c.level*4);toast(`✨ ${species(c.species).name} теперь с вами${first?" · +1 знание":""}`,"good");state.tutorial=Math.max(state.tutorial,1)}else{c.aggro=true;toast(`Сфера не удержала ${species(c.species).name} · шанс ${Math.round(chance*100)}%`,"bad")}renderResources()}
  function gather(){const n=nearestNode();if(!n){toast("Подойдите к дереву, камню или залежи");return}if(n.gate>=2&&!hasTech("ore_drills")){toast("Нужны «Рудные шурфы» и инструменты добычи 2","bad");return}if(n.gate>=3&&!hasTech("deep_mining")){toast("Нужна технология глубинной добычи","bad");return}const amount=n.resource==="wood"||n.resource==="stone"?2:1;add(n.resource,amount);n.alive=false;n.respawn=12+seeded()*10;haptic();toast(`${n.icon} +${amount} ${item(n.resource).name}`);renderResources()}

  const jobDefs={
    lumbering:{building:"logging_camp",label:"лесная артель",resource:"wood"},mining:{building:"quarry",label:"каменная артель",resource:"stone"},planting:{building:"berry_garden",label:"сад росы",resource:"berry"},watering:{building:"berry_garden",label:"сад росы",resource:"berry"},gathering:{building:"berry_garden",label:"сад росы",resource:"berry"},kindling:{building:"furnace",label:"пламенная печь"},handiwork:{building:"loom",label:"ткацкий стан"},electricity:{building:"generator",label:"грозовой генератор"},transporting:{building:"chest",label:"логистика"}

  function runProduction(dt,mult=1){
    for(const n of nodes)if(!n.alive){n.respawn-=dt;if(n.respawn<=0)n.alive=true}
    const workers=state.fables.filter(f=>f.mode==="base"),power=workers.some(f=>f.job==="electricity")?1.15:1,haul=workers.some(f=>f.job==="transporting")?1.08:1;
    for(const f of workers){const sp=species(f.species),skill=sp.work[f.job]||0,rate=(DATA.balance.work.speedBySkillLevel[skill]||1)*power*haul*mult;if(f.job==="lumbering")add("wood",.035*rate*dt);else if(f.job==="mining"){add("stone",.03*rate*dt);if(skill>=2&&hasTech("ore_drills"))add("ore",.008*rate*dt)}else if(["planting","watering","gathering"].includes(f.job))add("berry",.027*rate*dt);else if(f.job==="kindling"){f.progress=(f.progress||0)+rate*dt;if(f.progress>=10&&canPay({ore:2,coal:1})){pay({ore:2,coal:1});add("ingot",1);f.progress=0}}else if(f.job==="handiwork"){f.progress=(f.progress||0)+rate*dt;if(f.progress>=8&&canPay({fiber:3})){pay({fiber:3});add("cloth",1);f.progress=0}}}
  }

  function fablesHtml(){if(!state.fables.length)return `<div class="empty">Пока никого. Ослабьте дикого фейбла до красной полосы и нажмите 🔮.</div>`;return `<div class="hint">Фейбл в отряде помогает в бою. Фейбл на базе автоматически выбирает лучшую доступную работу по своему навыку.</div><div class="grid">${state.fables.map(f=>{const sp=species(f.species),work=Object.entries(sp.work).map(([k,v])=>`<span class="tag">${jobName(k)} ${v}</span>`).join(""),mode=f.mode==="party"?"⚔️ в отряде":f.mode==="base"?`🏭 ${jobDefs[f.job]?.label||f.job}`:"💤 в резерве";return `<div class="card"><div class="row"><div class="bigIcon" style="border:1px solid ${DATA.fables.elements[sp.element].color}">${fableSpriteHtml(f.species)}</div><div class="grow"><h3>${sp.name} · ${f.level} ур.</h3><p>${mode}</p></div></div><div>${work}</div><button class="cta" data-mode="party" data-uid="${f.uid}" ${f.mode==="party"?"disabled":""}>В отряд</button><button class="cta secondary" data-mode="base" data-uid="${f.uid}" ${f.mode==="base"?"disabled":""}>На базу</button><button class="cta secondary" data-mode="reserve" data-uid="${f.uid}" ${f.mode==="reserve"?"disabled":""}>В резерв</button></div>`}).join("")}</div>`}
  function jobName(k){return({kindling:"огонь",watering:"полив",planting:"посадка",electricity:"энергия",handiwork:"ремесло",gathering:"сбор",lumbering:"рубка",mining:"добыча",medicine:"лечение",cooling:"охлаждение",transporting:"перенос",ranching:"пастбище"})[k]||k}
  function techHtml(){const techs=DATA.technologies.technologies;return `<div class="hint">Уровень открывает ступень. Очки знания позволяют выбирать ветку: база, автоматизация, бой или фейблы.</div><div class="grid">${techs.map(t=>{const done=hasTech(t.id),available=techAvailable(t),req=t.requires.filter(x=>!hasTech(x)).map(x=>maps.tech[x]?.name).join(", ");return `<div class="card tech ${!done&&!available?"locked":""}"><span class="branch">${t.branch}</span><span class="techLevel">ур. ${t.level}</span><div class="row" style="margin-top:6px"><div class="bigIcon">${t.icon}</div><div class="grow"><h3>${t.name}</h3><p>${t.description}</p></div></div>${req?`<p>Нужно: ${req}</p>`:""}<button class="cta" data-tech="${t.id}" ${done||!available||state.knowledge<t.cost?"disabled":""}>${done?"Изучено":`Изучить · ${t.cost} ✨`}</button></div>`}).join("")}</div>`}
  function buildHtml(){const all=DATA.items.buildings;return `<div class="hint">После выбора поставьте здание тапом внутри круга базы. Первое Сердце стоянки создаёт этот круг.</div><div class="grid">${all.map(b=>{const open=hasTech(b.tech),once=b.id==="hearthcore"&&hasBuilding(b.id);return `<div class="card ${open?"":"tech locked"}"><div class="row"><div class="bigIcon">${b.icon}</div><div class="grow"><h3>${b.name}</h3><p>${open?maps.tech[b.tech]?.description:`Технология: ${maps.tech[b.tech]?.name}`}</p></div></div><div class="cost">${costHtml(b.cost)}</div><button class="cta" data-build="${b.id}" ${!open||!canPay(b.cost)||once?"disabled":""}>${once?"Построено":"Разместить"}</button></div>`}).join("")}</div>`}
  function bindPanel(){$$("[data-tech]").forEach(b=>b.onclick=()=>unlockTech(b.dataset.tech));$$('[data-build]').forEach(b=>b.onclick=()=>startBuild(b.dataset.build));$$('[data-craft]').forEach(b=>b.onclick=()=>craft(b.dataset.craft));$$('[data-mode]').forEach(b=>b.onclick=()=>setFableMode(b.dataset.uid,b.dataset.mode))}

  function setupInput(){
    addEventListener("resize",resize);addEventListener("keydown",e=>input.keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>input.keys.delete(e.key.toLowerCase()));
    const joy=$("#joystick"),stick=$("#stick");let joyId=null;const moveJoy=e=>{const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=Math.min(34,d),nx=d?x/d:0,ny=d?y/d:0;input.x=nx*Math.min(1,d/30);input.y=ny*Math.min(1,d/30);stick.style.transform=`translate(${nx*m}px,${ny*m}px)`};joy.onpointerdown=e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===joyId)moveJoy(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===joyId){joyId=null;input.x=input.y=0;stick.style.transform=""}};
    canvas.addEventListener("pointerdown",e=>{const p=worldPoint(e.clientX,e.clientY);if(placeBuilding(p))return;tapTarget=p});
    $("#attack").onclick=attack;$("#capture").onclick=capture;$("#gather").onclick=gather;$("#exit").onclick=()=>parent.postMessage("hexland:exit","*");
    $$(".dockbtn").forEach(b=>b.onclick=()=>currentPanel===b.dataset.panel?closePanel():openPanel(b.dataset.panel));$(".close").onclick=closePanel;$("#panelBackdrop").onclick=closePanel;
  }
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
  async function boot(){try{await Promise.all([loadData(),loadArt()]);loadSave();generateWorld();applyOffline();resize();setupInput();renderResources();updateHud();requestAnimationFrame(loop)}catch(err){document.body.innerHTML=`<div style="padding:28px;font-family:system-ui;color:white"><h2>Fable World не загрузился</h2><p>${String(err)}</p></div>`}}
  boot();
})();
</script>
</body>
</html>
