<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fable Factory</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141b24; --panel2:#1b2532; --line:#2a3646;
    --ink:#e8eef7; --dim:#a7b6c9; --gold:#e8b04b; --accent:#7aa2ff; --ok:#4dbb72; --bad:#ff6b6b;
    --glass:rgba(12,17,24,.93);
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:.5px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.11);border:.5px solid rgba(255,255,255,.18);border-radius:13px;padding:8px 10px;cursor:pointer;font-size:.82rem;font-weight:500;transition:transform .16s cubic-bezier(.2,.8,.2,1), background .2s, opacity .2s}
  button:disabled{opacity:.32;cursor:default}
  button:active:not(:disabled){transform:scale(.93)}
  button small{color:var(--dim);display:block;font-size:.68rem;font-weight:400}
  /* верхний HUD */
  #hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:58vw;z-index:20}
  .pill{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:.5px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-size:.78rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .pill.bad{color:var(--bad)}
  #resline{width:100%;display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;scrollbar-width:none}
  #resline::-webkit-scrollbar{display:none}
  #resline .rpill{flex:0 0 auto;background:var(--glass);border:.5px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 9px;font-size:.72rem;display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  #resline .rpill b{font-weight:700;color:var(--ink)}
  #goal{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:8px;border-radius:14px;padding:8px 12px;font-size:.78rem;max-width:210px;cursor:pointer;z-index:20;border-color:rgba(232,176,75,.45)}
  #goal b{color:var(--gold)}
  #goal .gmin{display:none}
  #goal.min .gtxt{display:none}
  #goal.min .gmin{display:inline}
  #goal.min{padding:6px 11px}
  /* обучение */
  #tut{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 76px);max-width:290px;border-radius:16px;padding:12px 14px;font-size:.84rem;display:none;animation:pop .3s cubic-bezier(.2,1.2,.3,1);z-index:30;border-color:rgba(122,162,255,.4)}
  #tut.on{display:block}
  #tut .step{color:var(--accent);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:4px}
  #tut .skip{color:var(--dim);font-size:.72rem;margin-top:8px;cursor:pointer;text-decoration:underline}
  @keyframes pop{0%{transform:translateY(10px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
  /* умная кнопка (dynamic-island) */
  #smart{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:40}
  #smartBtn{width:54px;height:54px;border-radius:50%;font-size:1.35rem;padding:0;display:grid;place-items:center}
  #smartMenu{display:none;flex-direction:column;gap:7px;max-height:min(78vh,640px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px;scrollbar-width:none}
  #smartMenu::-webkit-scrollbar{display:none}
  #smart.open #smartMenu{display:flex;animation:pop .22s cubic-bezier(.2,1.2,.3,1)}
  #smartMenu button{width:172px;text-align:left;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;
    background:rgba(16,22,31,.97);border:.5px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.55)}
  /* тень-затемнение позади открытого меню — читается на любом фоне; закрывается только тапом по ней или ✕ */
  #smartShade{position:fixed;inset:0;z-index:38;display:none;background:radial-gradient(ellipse at 85% 78%, rgba(0,0,0,.62), rgba(0,0,0,.34));backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}
  #smartShade.on{display:block}
  /* дзен-режим: только карта и ⋯ */
  body.zen #hud,body.zen #goal,body.zen #tut,body.zen #quick,body.zen #mmap{display:none !important}
  /* минимапа: тап телепортирует камеру */
  #mmap{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;display:none;
    border:.5px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(8,12,10,.88);
    box-shadow:0 6px 18px rgba(0,0,0,.45);image-rendering:pixelated}
  #smartMenu .k{font-size:1.05rem;width:20px;text-align:center;flex-shrink:0}
  /* контекстное меню по клетке */
  #ctx{position:fixed;z-index:50;display:none;border-radius:16px;padding:8px;min-width:176px;max-width:248px;animation:pop .16s cubic-bezier(.2,1.2,.3,1)}
  #ctx.on{display:block}
  #ctx .ctxTitle{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;padding:2px 6px 7px}
  #ctx .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  #ctx button{text-align:left;display:flex;flex-direction:column;gap:1px;min-height:46px;justify-content:center;line-height:1.15}
  #ctx button.wide{grid-column:1 / -1}
  #ctx button.bad{color:var(--bad);border-color:rgba(255,107,107,.3)}
  /* быстрая укладка — левый край, чтобы не наезжать на умную кнопку справа */
  #quick{position:fixed;left:8px;max-width:calc(100vw - 82px);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:35;display:none;align-items:center;gap:10px;border-radius:999px;padding:7px 8px 7px 15px;font-size:.82rem}
  #quick.on{display:flex}
  #quick button{border-radius:50%;width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:.8rem}
  /* нижний лист */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;transform:translateY(112%);transition:transform .32s cubic-bezier(.2,.9,.2,1);border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);max-height:74vh;display:flex;flex-direction:column}
  #sheet.on{transform:translateY(0)}
  #sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  #sheetTitle{font-weight:700;font-size:1.02rem}
  #sheetX{width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center}
  #sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .invGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.85rem}
  .invGrid div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:7px 11px}
  .invGrid .n{font-variant-numeric:tabular-nums;font-weight:700}
  #sheetBody .techBtn{width:100%;margin-bottom:7px;text-align:left}
  #sheetBody .techBtn.done{border-color:var(--ok);opacity:.6}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 132px);transform:translateX(-50%) translateY(-8px) scale(.96);background:rgba(27,37,50,.85);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:.5px solid rgba(232,176,75,.5);padding:9px 18px;border-radius:999px;font-size:.85rem;opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:86vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  #ovl .choiceBtn{position:relative;text-align:left;min-height:52px;padding-right:96px}
  #ovl .modeBtn{min-height:44px;text-align:center;padding-left:10px;padding-right:44px}
  #ovl .choiceBtn.armed{background:linear-gradient(180deg,rgba(232,176,75,.28),rgba(122,162,255,.16));border-color:rgba(232,176,75,.78);box-shadow:0 0 0 1px rgba(232,176,75,.28),0 10px 24px rgba(0,0,0,.35)}
  #ovl .choiceBtn.armed small{color:#f1d69d}
  #ovl .pickMark{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);align-items:center;justify-content:center;border-radius:999px;background:var(--gold);color:#241a08;font-size:.66rem;font-weight:800;padding:3px 7px;box-shadow:0 4px 14px rgba(232,176,75,.24)}
  #ovl .modeBtn .pickMark{width:22px;height:22px;padding:0;font-size:.78rem}
  #ovl .choiceBtn.armed .pickMark{display:inline-flex}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="goal" class="glass"></div>
<div id="tut" class="glass"><div class="step"></div><div class="txt"></div><div class="skip">пропустить обучение</div></div>
<div id="ctx" class="glass"></div>
<div id="quick" class="glass"><span id="quickTxt"></span><button id="quickX">✕</button></div>
<canvas id="mmap"></canvas>
<div id="smartShade"></div>
<div id="smart">
  <div id="smartMenu"></div>
  <button id="smartBtn" class="glass">⋯</button>
</div>
<div id="sheet" class="glass">
  <div id="sheetHead"><span id="sheetTitle"></span><button id="sheetX">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="log" style="display:none"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============ Fable Factory v4 — endless grind, 20 epochs, prestige ============ */
const W0=84,H0=58,TS=26;   // стартовый размер мира; карту можно догенерировать (expandWorld)
let W=W0,H=H0;
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
const mk=()=>Array.from({length:H},()=>Array(W).fill(null));
const MAX_UPGRADE_LEVEL=20;
const ORE={iron:"#9fb9d4",copper:"#d9813f",coal:"#23262d",stone:"#a09b8a",gold:"#e8c84b",crystal:"#8be0e8"};
const ORE_LABEL={iron:"железо",copper:"медь",coal:"уголь",stone:"камень",gold:"золото",crystal:"кристаллы"};
const ORE_NM={iron:"⛏ Железная руда",copper:"⛏ Медная руда",coal:"⚫ Уголь",stone:"🪨 Камень",gold:"🪙 Золотая жила",crystal:"💎 Кристаллы"};
const ORE_ICON={iron:"⛓",copper:"🟧",coal:"⚫",stone:"🪨",gold:"🪙",crystal:"💎"};
const ORE_KEYS=["iron","copper","coal","stone","gold","crystal"];
const ITEM_COL={iron:"#9fb9d4",copper:"#d9813f",coal:"#2a2e36",stone:"#a09b8a",wood:"#8a6a3d",
  ironPlate:"#c8d4e2",copperPlate:"#e8955a",steelPlate:"#93a0b4",gear:"#b9c2cf",wire:"#d9813f",circuit:"#4dbb72",science:"#7aa2ff",
  gold:"#e8c84b",crystal:"#8be0e8",goldBar:"#f5d76e",lens:"#aef0f5",module:"#c58cff",science2:"#e07af0",food:"#e8a25b"};
const ITEM={iron:"⛏ жел.руда",copper:"⛏ медь",coal:"⚫ уголь",stone:"🪨 камень",wood:"🌲 древесина",
  ironPlate:"▪️ жел.лист",copperPlate:"🟧 мед.лист",steelPlate:"🔩 сталь",gear:"⚙️ шестерня",wire:"〰️ провод",circuit:"🟩 плата",science:"🧪 наука",
  gold:"🪙 золото",crystal:"💎 кристалл",goldBar:"🥇 слиток",lens:"🔍 линза",module:"🧩 модуль",science2:"🔮 синт-наука",food:"🍞 еда"};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function seedHashText(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}
function seeded(seed){
  let t=seed>>>0;
  return ()=>{t+=0x6D2B79F5;let r=t;r=Math.imul(r^r>>>15,r|1);r^=r+Math.imul(r^r>>>7,r|61);return ((r^r>>>14)>>>0)/4294967296}
}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function uniquePush(a,v){if(!a.includes(v))a.push(v);return a}
function shadeHex(hex,mul){
  const n=parseInt(String(hex).replace("#",""),16);
  const r=Math.max(0,Math.min(255,Math.round(((n>>16)&255)*mul)));
  const g=Math.max(0,Math.min(255,Math.round(((n>>8)&255)*mul)));
  const b=Math.max(0,Math.min(255,Math.round((n&255)*mul)));
  return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const ORE_VARIANTS={
  iron:[
    {nm:"метеоритное железо",ic:"☄️",color:"#a7c7e7"},{nm:"синежильное железо",ic:"⛓",color:"#6f9ed7"},
    {nm:"красное железо",ic:"🧲",color:"#b88579"},{nm:"ледяное железо",ic:"❄️",color:"#b8d9ef"}
  ],
  copper:[
    {nm:"пламенная медь",ic:"🔥",color:"#ef8b38"},{nm:"бирюзовая медь",ic:"🟦",color:"#2fb7a1"},
    {nm:"старая медь",ic:"🟧",color:"#b56a36"},{nm:"розовая медь",ic:"🔶",color:"#e78a77"}
  ],
  coal:[
    {nm:"чёрный уголь",ic:"⚫",color:"#23262d"},{nm:"стеклянный уголь",ic:"◼️",color:"#3e4c62"},
    {nm:"серный уголь",ic:"🟡",color:"#56523a"},{nm:"звёздный уголь",ic:"✦",color:"#1a2239"}
  ],
  stone:[
    {nm:"лунный камень",ic:"🌘",color:"#b6b4a8"},{nm:"базальтовый камень",ic:"⬛",color:"#6f7480"},
    {nm:"меловой камень",ic:"⬜",color:"#d4ceb8"},{nm:"зелёный камень",ic:"🪨",color:"#84997c"}
  ],
  gold:[
    {nm:"солнечная золотая жила",ic:"☀️",color:"#f1ca4e"},{nm:"белое золото",ic:"🪙",color:"#e7d99b"},
    {nm:"красное золото",ic:"🔆",color:"#d69442"},{nm:"электровое золото",ic:"⚡️",color:"#f6e06b"}
  ],
  crystal:[
    {nm:"голубые кристаллы",ic:"💎",color:"#8be0e8"},{nm:"фиолетовые кристаллы",ic:"🔮",color:"#b28cff"},
    {nm:"зелёные кристаллы",ic:"🟩",color:"#7ee0a8"},{nm:"розовые кристаллы",ic:"💠",color:"#f09ee5"}
  ],
};
function activeOreSkin(k){return typeof S!=="undefined"&&S.oreSkins&&S.oreSkins[k]?S.oreSkins[k]:null}
function oreColor(k){return activeOreSkin(k)?.color||ORE[k]||"#b8c1cc"}
function oreName(k){return activeOreSkin(k)?`${activeOreSkin(k).ic||ORE_ICON[k]||"⛏"} ${activeOreSkin(k).nm}`:(ORE_NM[k]||"⛏ Руда")}
function oreIcon(k){return activeOreSkin(k)?.ic||ORE_ICON[k]||"⛏"}
function oreFaces(k){
  const s=activeOreSkin(k);
  if(s?.faces)return s.faces;
  const c=oreColor(k);
  return [shadeHex(c,1.28),c,shadeHex(c,.62),shadeHex(c,1.55)];
}

/* ---------- карты ---------- */
const MAPS={
  valley:{nm:"🌿 Долина",desc:"зелёная долина: леса и луга",oreMul:1,water:false,trees:16,
    pal:["#4a6138","#465c35","#4f6a3d","#435832"],dirt:"#6b5a3d",grass:true},
  desert:{nm:"🏜 Пустошь",desc:"руды больше, волны злее, лесов почти нет",oreMul:1.6,water:false,trees:3,
    pal:["#8a7852","#84724d","#7d6c49","#907e58"],dirt:"#6e5f42",grass:false},
  isles: {nm:"🏝 Архипелаг",desc:"озёра и рощи мешают строить",oreMul:1.2,water:true,trees:9,
    pal:["#4a6138","#465c35","#4f6a3d","#435832"],dirt:"#6b5a3d",grass:true},
};
function mapStyle(mapId){
  const base=MAPS[mapId]||MAPS.valley;
  const skin=typeof S!=="undefined"&&S.worldSkin?S.worldSkin:null;
  return skin?{...base,...skin}:base;
}
const WORLD_MISSIONS=[
  {id:"verdant",map:"valley",depth:1,nm:"🌿 Вердант-9",desc:"безопасная лесная планета для расширения базы",res:"железо, медь, уголь, дерево, немного золота",bonus:[["iron",2,36],["copper",2,30],["gold",1,20]]},
  {id:"aurelia",map:"desert",depth:2,nm:"🪙 Аурелия",desc:"сухая богатая планета для золотой цепочки",res:"много золота, уголь, камень, железо",bonus:[["gold",4,34],["coal",2,36],["stone",2,30]]},
  {id:"cryora",map:"isles",depth:3,nm:"💎 Криора",desc:"островная кристальная планета для синт-науки",res:"кристаллы, медь, вода, немного золота",bonus:[["crystal",4,26],["copper",2,34],["gold",1,24]]},
];
const PLANET_BIOMES=[
  {map:"valley",ic:"🌿",desc:"мягкая биосфера, много дерева",trees:18,oreMul:.95,grass:true},
  {map:"desert",ic:"🏜",desc:"сухая корка, богатые жилы",trees:2,oreMul:1.45,grass:false},
  {map:"isles",ic:"🏝",desc:"острова и озёра режут логистику",trees:10,oreMul:1.15,grass:true},
];
const PLANET_PALETTES=[
  {nm:"малахитовая",pal:["#345d47","#3f6d50","#315440","#496f49"],dirt:"#5f4d38",water:"#1d5a68"},
  {nm:"янтарная",pal:["#7f714c","#8d7c54","#756743","#97845b"],dirt:"#6c5537",water:"#245c75"},
  {nm:"пепельная",pal:["#515a5d","#485055","#5b6260","#434a4d"],dirt:"#51483f",water:"#263d53"},
  {nm:"индиговая",pal:["#33455f","#2d3d58","#3d4f6d","#28364f"],dirt:"#4e4559",water:"#203f70"},
  {nm:"рубиновая",pal:["#64423e","#6e4a45","#593936","#754f46"],dirt:"#5a3d32",water:"#4e2d58"},
  {nm:"меловая",pal:["#7a806e","#858a78","#707866","#8d907c"],dirt:"#6f654d",water:"#38646b"},
];
const PLANET_PREFIX=["Ара","Вей","Кора","Мир","Нова","Ори","Тау","Эли","Зен","Руа","Лира","Соль","Кси","Фер","Ио","Вар"];
const PLANET_SUFFIX=["дор","мир","тис","лон","ра","векс","он","лия","нокс","прайм","-7","-12","-Ω","-К","-М"];
const PLANET_MOOD=[
  "тихая орбита","магнитные бури","низкая гравитация","длинные сумерки","пыльные ветра","яркая ночь","тонкая атмосфера","богатый разлом"
];
function makeGalaxySeed(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function ensureGalaxySeed(){
  if(!S.galaxySeed)S.galaxySeed=makeGalaxySeed();
  return S.galaxySeed;
}
function makeOreSkins(r){
  const skins={};
  ORE_KEYS.forEach(k=>{
    const v=pick(r,ORE_VARIANTS[k]);
    const color=shadeHex(v.color,.92+r()*.22);
    skins[k]={nm:v.nm,ic:v.ic,color,faces:[shadeHex(color,1.28),color,shadeHex(color,.62),shadeHex(color,1.55)]};
  });
  return skins;
}
function makeProceduralWorld(index){
  const seed=seedHashText(ensureGalaxySeed()+":"+index);
  const r=seeded(seed);
  const tier=1+Math.floor(index/3);
  const biome=pick(r,PLANET_BIOMES),pal=pick(r,PLANET_PALETTES),oreSkins=makeOreSkins(r);
  const richness=+(1+Math.min(5,tier*.16)+r()*.22).toFixed(2);
  const main=[];
  if(tier===1)uniquePush(main,"gold"); // первый пояс всегда ведёт к золотой цепочке
  if(index%3===2)uniquePush(main,"crystal");
  const common=["iron","copper","coal","stone"],rare=tier>=2?["gold","crystal","gold","crystal"]:["gold","gold","crystal"];
  while(main.length<4)uniquePush(main,pick(r,r()<.55?common:rare));
  const bonus=main.map((k,i)=>[k,Math.max(1,Math.round((k==="gold"||k==="crystal"?1.5:2.4)+tier*.32+(i===0?1:0))),Math.round((k==="gold"||k==="crystal"?22:34)*(1+Math.min(tier,18)*.035)),richness]);

  const res=main.map(k=>`${oreSkins[k].ic} ${oreSkins[k].nm}`).join(", ");
  const mood=pick(r,PLANET_MOOD);

    id:`proc-${index}-${seed.toString(36)}`,proc:true,index,seed,map:biome.map,depth:tier,nm,

function seedOreAmounts(mul){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)
    if(ore[y][x]&&!oreAmt[y][x])oreAmt[y][x]=Math.max(18,Math.round(rnd(70,180)*(mul||1)*scenarioOreFactor(ore[y][x])));
}
function scatterOre(kind,blobs,size,mul){
  for(let b=0;b<blobs;b++){
    let x=rnd(3,W-4),y=rnd(3,H-4),guard=0;
    while((terr[y][x]==="water"||grid[y][x])&&guard++<60){x=rnd(3,W-4);y=rnd(3,H-4)}
    for(let i=0;i<size;i++){
      if(x>0&&y>0&&x<W-1&&y<H-1&&!terr[y][x]&&!grid[y][x]){
        ore[y][x]=kind;
        oreAmt[y][x]=Math.round(rnd(90,210)*(mul||1));
      }
      x+=rnd(-1,1);y+=rnd(-1,1);
    }
  }
}
function resizeTerrCanvas(){terrCv.width=W*TS*SS;terrCv.height=H*TS*SS;terrDirty=true}
function genMap(mapId,depth){
  depth=depth||0; // глубина = номер земли: дальше — богаче и экзотичнее
  const m=mapStyle(mapId);
  W=W0;H=H0;ore=mk();oreAmt=mk();terr=mk();grid=mk();drops={};animals=[];resizeTerrCanvas(); // новый мир — сброс к стартовому размеру
  if(m.water){ // озёра-кляксы
    for(let i=0;i<7;i++){let x=rnd(4,W-5),y=rnd(4,H-5);
      for(let j=0;j<50;j++){if(x>1&&y>1&&x<W-2&&y<H-2)terr[y][x]="water";x+=rnd(-1,1);y+=rnd(-1,1)}}
  }
  const blob=(kind,n)=>{let x=rnd(3,W-4),y=rnd(3,H-4),guard=0;
    while(terr[y][x]==="water"&&guard++<40){x=rnd(3,W-4);y=rnd(3,H-4)}
    for(let i=0;i<n;i++){if(x>0&&y>0&&x<W-1&&y<H-1&&!terr[y][x])ore[y][x]=kind;x+=rnd(-1,1);y+=rnd(-1,1)}};
  const base=Math.round(34*m.oreMul);
  // руда конечна → месторождений вдвое больше, чем раньше
  for(let p=0;p<2;p++)["iron","iron","iron","copper","copper","coal","coal","coal","stone","stone"].forEach(k=>blob(k,base));
  // дальние земли богаче: золото со 2-й земли, кристаллы с 3-й
  if(depth>=1)for(let i=0;i<1+depth;i++)blob("gold",Math.round(20*m.oreMul));
  if(depth>=2)for(let i=0;i<depth-1;i++)blob("crystal",16);
  seedOreAmounts(m.oreMul);
  spawnAnimals(7+depth*3); // в диких землях больше зверья
  // леса: живой мир; дерево рубится Сносом → 🌲 древесина (топливо)
  for(let i=0;i<(m.trees||0);i++){let x=rnd(2,W-3),y=rnd(2,H-3);
    for(let j=0;j<26;j++){if(x>0&&y>0&&x<W-1&&y<H-1&&!terr[y][x]&&!ore[y][x])terr[y][x]="tree";x+=rnd(-1,1);y+=rnd(-1,1)}}
  terrDirty=true;
}
/* ---------- догенерация: добавляем кольцо новой земли вокруг мира ---------- */
function expandWorld(margin){
  const oldW=W,oldH=H,sh=margin;
  const nW=W+margin*2,nH=H+margin*2;
  W=nW;H=nH;
  const nOre=mk(),nAmt=mk(),nTerr=mk(),nGrid=mk();
  for(let y=0;y<oldH;y++)for(let x=0;x<oldW;x++){
    nOre[y+sh][x+sh]=ore[y][x];nAmt[y+sh][x+sh]=oreAmt[y][x];nTerr[y+sh][x+sh]=terr[y][x];nGrid[y+sh][x+sh]=grid[y][x];
  }
  ore=nOre;oreAmt=nAmt;terr=nTerr;grid=nGrid;
  cam.x+=sh*TS;cam.y+=sh*TS;
  enemies.forEach(e=>{e.x+=sh;e.y+=sh});
  workers.forEach(w=>{w.x+=sh;w.y+=sh;if(w.job){w.job.x+=sh;w.job.y+=sh}});
  const newDrops={};for(const key in drops){const [dx2,dy2]=key.split(",").map(Number);newDrops[(dx2+sh)+","+(dy2+sh)]=drops[key]}
  drops=newDrops;
  const inRing=(x,y)=>x<sh||y<sh||x>=sh+oldW||y>=sh+oldH;
  const m=mapStyle(S.map);
  if(m.water){for(let i=0;i<Math.round(margin/2);i++){let x=rnd(2,W-3),y=rnd(2,H-3);
    for(let j=0;j<48;j++){if(inRing(x,y)&&x>1&&y>1&&x<W-2&&y<H-2)terr[y][x]="water";x+=rnd(-1,1);y+=rnd(-1,1)}}}
  const blob=(kind,n)=>{let x=rnd(2,W-3),y=rnd(2,H-3),g=0;
    while((!inRing(x,y)||terr[y][x]||grid[y][x])&&g++<80){x=rnd(2,W-3);y=rnd(2,H-3)}
    for(let i=0;i<n;i++){if(inRing(x,y)&&x>0&&y>0&&x<W-1&&y<H-1&&!terr[y][x]&&!grid[y][x])ore[y][x]=kind;x+=rnd(-1,1);y+=rnd(-1,1)}};
  const base=Math.round(30*m.oreMul);
  const kinds=["iron","iron","iron","copper","copper","coal","coal","coal","stone","stone"];
  if((S.curRegion||0)>=1)kinds.push("gold");
  if((S.curRegion||0)>=2)kinds.push("crystal");
  const passes=Math.max(2,Math.round(margin/3));
  for(let p=0;p<passes;p++)kinds.forEach(k=>blob(k,base));
  spawnAnimals(3);
  for(let i=0;i<Math.max(6,(m.trees||8));i++){let x=rnd(2,W-3),y=rnd(2,H-3);
    for(let j=0;j<24;j++){if(inRing(x,y)&&x>0&&y>0&&x<W-1&&y<H-1&&!terr[y][x]&&!ore[y][x]&&!grid[y][x])terr[y][x]="tree";x+=rnd(-1,1);y+=rnd(-1,1)}}
  seedOreAmounts(m.oreMul);
  resizeTerrCanvas();
  undoStack.length=0;S.hint=null;
  clampCam();
}

    if(best){best.cap-=u.need;u.c.pw=true;fed++;}
    else if(inZone)over++;else noZone++;
  });
  powerStat={fed,need:cons.length,noZone,over};
  S.powerOk=noZone===0&&over===0;
}

function workerSpeed(w){

function pileMatches(w,d){

function nearestBuilding(x,y){
  let best=null,bd=1e9;
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){
    const c=grid[yy][xx];if(!c||c.t==="belt")continue;
    const d=(xx-x)*(xx-x)+(yy-y)*(yy-y);if(d<bd){bd=d;best=[xx,yy];}}
  return best;
}
function findOreNear(kind,x,y){ // ближайшая свободная залежь (той же руды, иначе любой)
  let best=null,bd=1e9,anyBest=null,anyBd=1e9;
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){
    if(!ore[yy][xx]||grid[yy][xx])continue;
    const d=(xx-x)*(xx-x)+(yy-y)*(yy-y);
    if(ore[yy][xx]===kind&&d<bd){bd=d;best=[xx,yy];}
    if(d<anyBd){anyBd=d;anyBest=[xx,yy];}
  }
  return best||anyBest;
}
function specAllowsMiner(w,kind){
  const s=w.spec||"any";
  if(s==="any")return true;
  if(s==="coal")return kind==="coal";
  if(s==="iron")return kind==="iron"||kind==="stone";
  if(s==="copper")return kind==="copper";
  return false; // электрик и грузчик буры не таскают
}
function workerStep(w){
  // голод включается, когда посёлок вырос (4+ жителей): 1 🍞 на ~90 сек
  if(workers.length>=4){
    w.belly=(w.belly??rnd(2400,5400))-1;
    if(w.belly<=0){
      if(inv.food>0){inv.food--;w.belly=5400;if(w.hungry){w.hungry=false;puff(Math.floor(w.x),Math.floor(w.y),"#e8a25b",2)}}
      else {w.hungry=true;w.belly=300;} // проверит снова через 5с
    }
  } else w.hungry=false;
  const SPEED=workerSpeed(w);
  if(!w.job){
    if(w.carryCell){ // несём снятый бур к новой залежи
      const tgt=findOreNear(w.carryCell.oreKind,w.x,w.y);
      if(tgt)w.job={kind:"placeMiner",x:tgt[0],y:tgt[1]};
      else {const b=nearestBuilding(w.x,w.y)||[Math.floor(w.x),Math.floor(w.y)]; // руды нет — вернуть бур на склад
        Object.entries(DEFS.miner.cost).forEach(([k,n])=>inv[k]+=n);w.carryCell=null;
        say("🛠 Свободной руды не осталось — бур разобран на склад");return;}
    } else if(w.carry){ // несём собранное на склад (к ближайшему зданию)
      const b=nearestBuilding(w.x,w.y);
      if(!b){Object.entries(w.carry).forEach(([k,n])=>inv[k]+=n);w.carry=null;return;}
      w.job={kind:"return",x:b[0],y:b[1]};
    } else {
      let tgt=null,bd=1e9;
      const s=w.spec||"any";
      // электрик/угольщик/универсал: голодный генератор
      if((s==="any"||s==="power"||s==="coal")&&inv.coal+inv.wood>0&&S.autoAll!==false)
        for(let y=0;y<H;y++)for(let x=0;x<W;x++){
          const c=grid[y][x];
          if(c&&c.t==="gen"&&c.fuel<600&&(c.buf.coal||0)+(c.buf.wood||0)<1&&!workers.some(o=>o!==w&&o.job&&o.job.kind==="fuel"&&o.job.x===x&&o.job.y===y)){
            const d=(x-w.x)*(x-w.x)+(y-w.y)*(y-w.y);if(d<bd){bd=d;tgt={kind:"fuel",x,y};}}}
      // бур на пустой залежи → перенести (профильные и универсалы)
      if(!tgt){bd=1e9;
        for(let y=0;y<H;y++)for(let x=0;x<W;x++){
          const c=grid[y][x];
          if(c&&c.t==="miner"&&!ore[y][x]&&specAllowsMiner(w,c.oreKind)&&!workers.some(o=>o!==w&&o.job&&o.job.kind==="fixMiner"&&o.job.x===x&&o.job.y===y)){
            const d=(x-w.x)*(x-w.x)+(y-w.y)*(y-w.y);if(d<bd){bd=d;tgt={kind:"fixMiner",x,y};}}}}
      // ближайшая подходящая по специализации куча
      if(!tgt){bd=1e9;
        for(const key in drops){
          if(!pileMatches(w,drops[key]))continue;
          const [x,y]=key.split(",").map(Number);
          if(workers.some(o=>o!==w&&o.job&&o.job.kind==="pile"&&o.job.x===x&&o.job.y===y))continue;
          const d=(x-w.x)*(x-w.x)+(y-w.y)*(y-w.y);if(d<bd){bd=d;tgt={kind:"pile",x,y};}}}
      if(tgt)w.job=tgt;else return; // отдыхает
    }
  }
  const tx=w.job.x+0.5,ty=w.job.y+0.5;
  const dx=tx-w.x,dy=ty-w.y,L=Math.hypot(dx,dy);
  if(L>0.35){w.x+=dx/L*SPEED;w.y+=dy/L*SPEED;return;}
  // пришли
  const j=w.job;w.job=null;
  if(j.kind==="pile"){
    const d=drops[j.x+","+j.y];
    if(d){
      const p=SPECS[w.spec||"any"].piles;
      w.carry=w.carry||{};
      Object.entries(d).forEach(([k,n])=>{
        const bonus=(p&&p.includes(k))?Math.ceil(n*0.3):0; // профильный ресурс — +30%
        w.carry[k]=(w.carry[k]||0)+n+bonus;
      });
      delete drops[j.x+","+j.y];puff(j.x,j.y,"#ffd98a",3);giveXp(w,2);
    }
  } else if(j.kind==="fuel"){
    const c=grid[j.y]&&grid[j.y][j.x];
    if(c&&c.t==="gen"&&S.autoAll!==false){
      const cap=w.spec==="power"?6:3;
      const tc=Math.min(inv.coal,cap);
      if(tc>0){inv.coal-=tc;c.buf.coal=(c.buf.coal||0)+tc;}
      else {const tw=Math.min(inv.wood,cap+1);inv.wood-=tw;c.buf.wood=(c.buf.wood||0)+tw;}
      puff(j.x,j.y,"#5c6a7d",2);giveXp(w,2);
    }
  } else if(j.kind==="fixMiner"){
    const c=grid[j.y]&&grid[j.y][j.x];
    if(c&&c.t==="miner"&&!ore[j.y][j.x]){grid[j.y][j.x]=null;w.carryCell=c;puff(j.x,j.y,"#8b9bb0",3);}
  } else if(j.kind==="placeMiner"){
    if(w.carryCell){
      if(!grid[j.y][j.x]&&ore[j.y][j.x]){
        w.carryCell.oreKind=ore[j.y][j.x];w.carryCell.prog=0;
        grid[j.y][j.x]=w.carryCell;w.carryCell=null;
        puff(j.x,j.y,"#7aa2ff",4);giveXp(w,6);
        say(`🧍 ${SPECS[w.spec].nm} перенёс бур на ${oreName(ore[j.y][j.x])||"новую залежь"}`);
      } // клетку заняли, пока шли — на следующем тике поищет другую
    }
  } else if(j.kind==="return"){
    if(w.carry){Object.entries(w.carry).forEach(([k,n])=>{inv[k]+=n;});w.carry=null;snd("craft");giveXp(w,1);}
  }
}

/* ---------- камера ---------- */
const cam={x:W*TS/2,y:H*TS/2,z:1};
function clampCam(){
  cam.z=Math.min(2.4,Math.max(.42,cam.z));
  const r=cv.getBoundingClientRect();
  const halfW=r.width/2/cam.z, halfH=r.height/2/cam.z, wpx=W*TS, hpx=H*TS;
  // держим камеру так, чтобы мир заполнял экран (без чёрной пустоты по краям); если мир меньше вьюпорта — центрируем
  cam.x = wpx>2*halfW ? Math.min(wpx-halfW,Math.max(halfW,cam.x)) : wpx/2;
  cam.y = hpx>2*halfH ? Math.min(hpx-halfH,Math.max(halfH,cam.y)) : hpx/2;
}
function fitAll(){
  const r=cv.getBoundingClientRect();
  cam.z=Math.min(r.width/(W*TS),r.height/(H*TS))*.96;
  cam.x=W*TS/2;cam.y=H*TS/2;clampCam();
}
function zoomIn(){cam.z*=1.25;clampCam()}
function zoomOut(){cam.z/=1.25;clampCam()}
cv.addEventListener("wheel",e=>{e.preventDefault();cam.z*=e.deltaY<0?1.12:0.9;clampCam()},{passive:false});

/* тап против пана; пинч-зум */
const pointers=new Map();
let panStart=null,movedFar=false,pinchD=0;
function tileAt(clientX,clientY){
  const r=cv.getBoundingClientRect();
  const wx=(clientX-r.left-r.width/2)/cam.z+cam.x;
  const wy=(clientY-r.top-r.height/2)/cam.z+cam.y;
  return [Math.floor(wx/TS),Math.floor(wy/TS)];
}
cv.addEventListener("pointerdown",e=>{
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){panStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};movedFar=false}
  else if(pointers.size===2){const p=[...pointers.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
});
cv.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD>0){cam.z*=d/pinchD;clampCam()}
    pinchD=d;movedFar=true;
  } else if(panStart){
    const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
    if(Math.hypot(dx,dy)>7)movedFar=true;
    if(movedFar){cam.x=panStart.cx-dx/cam.z;cam.y=panStart.cy-dy/cam.z;clampCam()}
  }
});
cv.addEventListener("pointerup",e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchD=0;
  if(pointers.size===0){
    if(!movedFar&&panStart)tapAt(e.clientX,e.clientY);
    panStart=null;
  }
});
cv.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);panStart=null});

/* ---------- действия над клеткой ---------- */
function upgradeCost(c){
  const lv=cellLevel(c);
  if(lv>=MAX_UPGRADE_LEVEL)return null;
  if(c.t==="belt"){
    if(lv<6)return {ironPlate:lv*2,gear:Math.ceil(lv/2)};
    if(lv<11)return {steelPlate:lv,gear:Math.ceil(lv/2)+1,circuit:Math.max(1,lv-6)};
    if(lv<16)return {steelPlate:lv*2,circuit:lv-6,science:lv-9};
    if(lv<19)return {module:Math.ceil((lv-14)/2),science2:lv-14,goldBar:(lv-14)*2};
    return {science2:18,module:6,crystal:30};
  }
  if(lv<5)return {ironPlate:4+lv*2,gear:lv};
  if(lv<10)return {steelPlate:lv*2,circuit:Math.ceil(lv*.8),science:Math.ceil((lv-4)/2)};
  if(lv<15)return {science:lv*2,steelPlate:lv*3,circuit:lv};
  if(lv<19)return {goldBar:(lv-12)*3,lens:lv-13,module:Math.ceil((lv-13)/2),science2:lv-13};
  return {science2:28,module:10,crystal:50,goldBar:30};
}
function upgradeCell(x,y){
  const c=grid[y][x];
  if(!c||c.t==="core")return;
  const lv=cellLevel(c);
  if(lv>=MAX_UPGRADE_LEVEL)return toast("Уже максимум: уровень "+MAX_UPGRADE_LEVEL);
  if(lv>=10&&!canUseMasterLevels())return toast("Мастер-уровни 11-20 откроются на эпохе 15");
  const cost=upgradeCost(c);
  if(!cost||!canPay(cost))return toast("На апгрейд нужно: "+costStr(cost));
  pushU(x,y);pay(cost);
  c.lv=lv+1;
  c.hp=Math.max(c.hp||0,DEFS[c.t].hp+Math.round(DEFS[c.t].hp*(c.lv-1)*0.08));
  updateProgression(true);
  toast(`⬆️ ${DEFS[c.t].nm}: уровень ${c.lv}/${MAX_UPGRADE_LEVEL}`);
  snd("research");puff(x,y,"#e8b04b",6,"L"+c.lv);
  drawInv();drawHud();drawGoal();
}
function buildAt(x,y,t){
  const d=DEFS[t];
  if(t==="miner"&&!ore[y][x]){toast("🛠 Бур ставится только на залежь");return false}
  if(t==="gen"&&ore[y][x]){toast("⚡️ Генератор — только на пустую землю, залежь не закапываем");return false}
  if(!canPay(d.cost)){toast("Не хватает ресурсов на "+d.nm);return false}
  pushU(x,y);pay(d.cost);
  const cell={t,dir:0,item:null,prog:0,buf:{},hp:d.hp,fuel:0,lv:1};
  if(RECIPES[t]){cell.recSel=0;cell.auto=true} // рецепт по умолчанию + авто-загрузка со склада
  if(t==="miner")cell.oreKind=ore[y][x]; // помним, что копаем — для авто-перестановки рабочими
  grid[y][x]=cell;
  if(t==="belt")cell.dir=smartBeltDir(x,y); // умная ориентация — не крутить руками
  if(t!=="belt"){ // посёлок растёт: каждые 5 построек приходит новый рабочий
    S.builtCount=(S.builtCount||0)+1;
    if(S.builtCount%5===0&&workers.length<workerCap()){
      spawnWorker(x,y);
      toast("🧍 Посёлок растёт — прибыл новый рабочий! ("+workers.length+"/"+workerCap()+")");snd("research");
    }
  }
  updateProgression(true);
  snd("place");puff(x,y,"#7aa2ff",3);drawInv();drawHud();
  return true;
}
/* умная ориентация конвейера: в приёмник → продолжить линию → от бура */
const cellAt=(X,Y)=>(X>=0&&Y>=0&&X<W&&Y<H)?grid[Y][X]:null;
const ACCEPTS=t=>t==="furnace"||t==="asm"||t==="lab"||t==="gen";
function receiverDir(x,y){
  for(let di=0;di<4;di++){const [dx,dy]=DIRS[di],n=cellAt(x+dx,y+dy);
    if(n&&ACCEPTS(n.t))return di}
  return null;
}
function smartBeltDir(x,y){
  const rd=receiverDir(x,y);if(rd!=null)return rd;
  for(let di=0;di<4;di++){const [dx,dy]=DIRS[di],n=cellAt(x+dx,y+dy);
    if(n&&n.t==="belt"){const [bdx,bdy]=DIRS[n.dir];
      if(x+dx+bdx===x&&y+dy+bdy===y)return n.dir}} // входящая лента — продолжаем её направление
  for(let di=0;di<4;di++){const [dx,dy]=DIRS[di],n=cellAt(x+dx,y+dy);
    if(n&&n.t==="miner")return (di+2)%4} // от бура — наружу
  return 0;
}
/* быстрая укладка: каждый новый сегмент разворачивает предыдущий в свою сторону — рисуешь дорожку тапами */
function chainBelt(x,y){
  const p=S.quickLast;
  if(p){const dx=x-p.x,dy=y-p.y;
    if(Math.abs(dx)+Math.abs(dy)===1){
      const di=DIRS.findIndex(([a,b])=>a===dx&&b===dy);
      const pc=cellAt(p.x,p.y);
      if(pc&&pc.t==="belt")pc.dir=di;
      const c=cellAt(x,y),rd=receiverDir(x,y);
      if(c&&c.t==="belt")c.dir=rd!=null?rd:di;
    }}
  S.quickLast={x,y};
}
/* кучи на земле */
function dropAt(x,y,k){
  const key=x+","+y,d=drops[key]||(drops[key]={});
  const tot=Object.values(d).reduce((a,b)=>a+b,0);
  if(tot>=DROP_CAP)return false;
  d[k]=(d[k]||0)+1;return true;
}
function collectDrops(x,y){
  const key=x+","+y,d=drops[key];if(!d)return false;
  const parts2=Object.entries(d).map(([k,n])=>{inv[k]+=n;return "+"+n+" "+ITEM[k].split(" ")[0]});
  delete drops[key];
  toast("📥 "+parts2.join("  "));snd("craft");puff(x,y,"#e8b04b",5);
  drawInv();drawHud();return true;
}
/* перенос здания */
function armMove(x,y){
  S.moveFrom={x,y};S.quick=null;
  document.getElementById("quickTxt").innerHTML=`↔️ Перенос: ${DEFS[grid[y][x].t].ic} ${DEFS[grid[y][x].t].nm} — тапни новую клетку`;
  document.getElementById("quick").classList.add("on");
}
function doDelete(x,y){
  const c=grid[y][x];
  if(terr[y][x]==="tree"&&!c){pushU(x,y);terr[y][x]=null;inv.wood+=3;terrDirty=true;
    toast("🪓 +3 древесины");snd("boom");puff(x,y,"#4dbb72",4);drawInv();return}
  if(!c)return;
  if(c.t==="core")return toast("Ядро сносить нельзя");
  pushU(x,y);
  Object.entries(DEFS[c.t].cost).forEach(([k,n])=>inv[k]+=n); // полный возврат ресурсов
  grid[y][x]=null;say("Снесено: "+DEFS[c.t].nm+" (возврат 100%)");snd("boom");puff(x,y,"#8b9bb0",5);
  drawInv();drawHud();
}
function refuel(x,y){const c=grid[y][x];
  const take=Math.min(inv.coal,3), tw=take>0?0:Math.min(inv.wood,4);
  if(take>0){pushU(x,y);inv.coal-=take;c.buf.coal=(c.buf.coal||0)+take;toast("⚫ Уголь в генератор: "+take);snd("place");drawInv()}
  else if(tw>0){pushU(x,y);inv.wood-=tw;c.buf.wood=(c.buf.wood||0)+tw;toast("🌲 Древесина в генератор: "+tw);snd("place");drawInv()}
  else toast("Нет топлива: добудь ⚫ уголь или сруби 🌲 деревья");
}
const activeRecipes=c=>{
  if(c.recSel!=null&&RECIPES[c.t][c.recSel]){
    const r=RECIPES[c.t][c.recSel];
    return (!r.req||tech(r.req))?[r]:recipesOf(c.t);
  }
  return recipesOf(c.t);
};
function feed(x,y){const c=grid[y][x];let fed=[];
  const needs=new Set();activeRecipes(c).forEach(r=>Object.keys(r.in).forEach(k=>needs.add(k)));
  pushU(x,y);
  needs.forEach(k=>{const take=Math.min(inv[k],5);if(take>0){inv[k]-=take;c.buf[k]=(c.buf[k]||0)+take;fed.push(take+" "+ITEM[k].split(" ")[0])}});
  if(fed.length){toast("Загружено: "+fed.join(", "));snd("place");drawInv()}
  else toast(`${DEFS[c.t].nm}: нужно ${activeRecipes(c).map(r=>Object.entries(r.in).map(([k,n])=>(n>1?n+"× ":"")+ITEM[k]).join(" + ")).join(" / ")} — см. 📖 Рецепты`);
}

function openCtx(x,y,sx,sy){
  const c=grid[y][x],acts=[];let title;
  if(c){
    title=`${DEFS[c.t].ic} ${DEFS[c.t].nm} · ур.${cellLevel(c)}/${MAX_UPGRADE_LEVEL}`;
    if(c.t!=="core"){
      const uc=upgradeCost(c);
      acts.push({ic:"⬆️",l:cellLevel(c)>=MAX_UPGRADE_LEVEL?"Максимум":"Улучшить",sub:uc?costStr(uc):"уровень 20",dis:cellLevel(c)>=MAX_UPGRADE_LEVEL,f:()=>upgradeCell(x,y)});
    }
    if(c.t==="belt")acts.push({ic:"🔄",l:"Повернуть",f:()=>{pushU(x,y);c.dir=(c.dir+1)%4;snd("rotate")}});
    if(c.t==="gen")acts.push({ic:"⛽️",l:"Заправить",f:()=>refuel(x,y)});
    if(c.t==="gen")acts.push({ic:"⚫",l:c.auto!==false?"Авто-уголь: ВКЛ":"Авто-уголь: выкл",sub:c.auto!==false?"берёт со склада сам":"заправляй тапом",f:()=>{c.auto=c.auto===false;toast(c.auto!==false?"⚫ Генератор сам берёт топливо со склада":"⚫ Авто-заправка выключена");}});
    if(c.t==="control")acts.push({ic:"🚀",l:"Планеты",sub:"ЦУП миссий",f:()=>openSheet("map")});
    if(c.t==="control"||c.t==="radar")acts.push({ic:"🛡",l:"Власть",sub:"боты и радар",f:()=>openSheet("authority")});
    if(RECIPES[c.t]&&RECIPES[c.t].length>1){
      const cur=c.recSel!=null?ITEM[RECIPES[c.t][c.recSel].out]:"авто";
      acts.push({ic:"🎛",l:"Рецепт",sub:cur,f:()=>openRecipeMenu(x,y,sx,sy)});
    }
    if(RECIPES[c.t])acts.push({ic:"📥",l:c.auto!==false?"Авто-склад: ВКЛ":"Авто-склад: выкл",sub:c.auto!==false?"берёт сырьё сам":"тап → Загрузить",f:()=>{c.auto=c.auto===false;toast(c.auto!==false?"📥 Сам берёт сырьё со склада":"📥 Авто-загрузка выключена");}});
    if(RECIPES[c.t])acts.push({ic:"⬆️",l:"Загрузить",sub:"со склада сейчас",f:()=>feed(x,y)});
    if(c.t!=="core")acts.push({ic:"↔️",l:"Перенести",f:()=>armMove(x,y)});
    acts.push({ic:"ℹ️",l:"Что это?",f:()=>describe(x,y)});
    if(c.t!=="core")acts.push({ic:"✖",l:"Снести",cls:"bad",f:()=>doDelete(x,y)});
  } else if(terr[y][x]==="tree"){
    title="🌲 Дерево";
    acts.push({ic:"🪓",l:"Срубить +3 🌲",wide:true,f:()=>doDelete(x,y)});
    acts.push({ic:"ℹ️",l:"Что это?",wide:true,f:()=>describe(x,y)});
  } else if(terr[y][x]==="water"){
    title="🌊 Вода";

  } else {
    const onOre=ore[y][x];
    title=onOre?`${oreName(onOre)} — что строим?`:"Что построить?";
    buildables().forEach(t=>{
      if(t==="miner"&&!onOre)return;

    });
    acts.push({ic:"ℹ️",l:onOre?"Что за руда?":"Осмотреть",wide:true,f:()=>describe(x,y)});
  }
  renderCtx(title,acts,sx,sy);
}

/* ---------- ⚙️ Автоматизация: сам строит цепочку и тратит ресурсы ---------- */
function sumCost(list){const t={};list.forEach(c=>Object.entries(c).forEach(([k,n])=>t[k]=(t[k]||0)+n));return t}
const freeCell=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!grid[y][x]&&!terr[y][x];
function findOreNearCam(kind){
  const cx=cam.x/TS,cy=cam.y/TS;let best=null,bd=1e9;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)
    if(ore[y][x]===kind&&!grid[y][x]){const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);if(d<bd){bd=d;best=[x,y]}}
  return best;
}
function spiralFree(x,y,minR,maxR,noOre){
  const out=[];
  for(let r=minR;r<=maxR;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    const nx=x+dx,ny=y+dy;
    if(freeCell(nx,ny)&&(!noOre||!ore[ny][nx]))out.push([nx,ny]);
  }
  return out;
}
function beltPath(from,to){ // BFS по пустым клеткам: ленты от бура до процессора
  const key=(x,y)=>x+","+y;
  const prev=new Map();prev.set(key(from[0],from[1]),null);
  const Q=[from];
  while(Q.length){
    const [x,y]=Q.shift();
    for(const [dx,dy] of DIRS){
      const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(prev.has(k))continue;
      if(nx===to[0]&&ny===to[1]){ // дошли до клетки процессора
        const path=[];let cur=[x,y];
        while(cur&&!(cur[0]===from[0]&&cur[1]===from[1])){path.unshift(cur);cur=prev.get(key(cur[0],cur[1]))}
        return path;
      }
      if(!freeCell(nx,ny))continue;
      if(prev.size>900)return null; // защита от разлива по всей карте
      prev.set(k,[x,y]);Q.push([nx,ny]);
    }
  }
  return null;
}

function runAuto(o){
  if(o.tech&&!tech(o.tech))return {err:"Сначала исследуй технологию в 🔬 Науке"};
  if(o.ore){ // цепочка добычи: бур (+ лента + процессор)
    const at=findOreNearCam(o.ore);
    if(!at)return {err:"Не вижу залежь "+oreName(o.ore)+" — расширь карту (🗺)"};
    let procPos=null,path=null;
    const costs=[DEFS.miner.cost];
    if(o.proc){
      for(const cand of spiralFree(at[0],at[1],2,6,true)){ // ищем место с рабочим путём ленты
        const p=beltPath(at,cand);
        if(p&&p.length){procPos=cand;path=p;break}
      }
      if(!procPos)return {err:"Нет места под "+DEFS[o.proc].nm+" рядом с залежью — освободи клетки"};
      costs.push(DEFS[o.proc].cost);
      path.forEach(()=>costs.push(DEFS.belt.cost));
    }
    const total=sumCost(costs);
    if(!canPay(total))return {err:"Не хватает: "+costStr(total)};
    buildAt(at[0],at[1],"miner");
    if(o.proc){
      buildAt(procPos[0],procPos[1],o.proc);
      path.forEach(c=>buildAt(c[0],c[1],"belt"));
      for(let i=0;i<path.length;i++){ // ориентируем ленты строго вдоль пути
        const cell=grid[path[i][1]][path[i][0]];
        const nxt=i+1<path.length?path[i+1]:procPos;
        const di=DIRS.findIndex(([dx,dy])=>path[i][0]+dx===nxt[0]&&path[i][1]+dy===nxt[1]);
        if(cell&&di>=0)cell.dir=di;
      }
      const pc=grid[procPos[1]][procPos[0]];
      if(o.rec!=null){pc.recSel=o.rec;pc.auto=true}
      if(o.proc==="gen")refuel(procPos[0],procPos[1]);
    }
    cam.x=at[0]*TS;cam.y=at[1]*TS;clampCam();
    snd("research");
    return {ok:`⚙️ Готово: 🛠 бур${path?` → ${path.length} лент → ${DEFS[o.proc].ic} ${DEFS[o.proc].nm}`:" (кучи собирай тапом)"}`};
  }
  // только переработка: здание с рецептом + авто-склад
  const d=DEFS[o.proc];
  if(!canPay(d.cost))return {err:"Не хватает: "+costStr(d.cost)};
  const cx=Math.round(cam.x/TS),cy=Math.round(cam.y/TS);
  const spots=spiralFree(cx,cy,1,10,true);
  if(!spots.length)return {err:"Нет свободной клетки в центре экрана — сдвинь камеру"};
  const pos=spots[0];
  buildAt(pos[0],pos[1],o.proc);
  const pc=grid[pos[1]][pos[0]];
  if(RECIPES[o.proc]){pc.recSel=o.rec??0;pc.auto=true;}
  cam.x=pos[0]*TS;cam.y=pos[1]*TS;clampCam();
  snd("research");
  return {ok:`⚙️ Готово: ${d.ic} ${d.nm}${RECIPES[o.proc]?` · рецепт «${ITEM[RECIPES[o.proc][o.rec??0].out]}» · сырьё берёт со склада сам`:" — работает сама"}`};
}

const mmapEl=document.getElementById("mmap"),mmapCx=mmapEl.getContext("2d");
function drawMinimap(){
  if(!S.started||zen)return;
  const sc=Math.min(108/W,76/H);
  const mw=Math.max(2,Math.round(W*sc)),mh=Math.max(2,Math.round(H*sc));
  if(mmapEl.width!==mw)mmapEl.width=mw;
  if(mmapEl.height!==mh)mmapEl.height=mh;
  const g=mmapCx;
  const m=mapStyle(S.map);
  g.fillStyle="#101a12";g.fillRect(0,0,mw,mh);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(terr[y][x]==="water"){g.fillStyle=m.waterColor||"#1b4a63";g.fillRect(x*sc,y*sc,Math.ceil(sc),Math.ceil(sc));}
    else if(ore[y][x]){g.fillStyle=oreColor(ore[y][x]);g.fillRect(x*sc,y*sc,Math.ceil(sc),Math.ceil(sc));}
    const c=grid[y][x];
    if(c){g.fillStyle=c.t==="gen"?"#ffd45e":c.t==="belt"?"#6b7480":"#e8eef7";g.fillRect(x*sc,y*sc,Math.ceil(sc),Math.ceil(sc));}
  }
  g.fillStyle="#ffd98a";
  workers.forEach(w=>g.fillRect(w.x*sc-1,w.y*sc-1,2,2));
  // рамка видимой области
  const r=cv.getBoundingClientRect();
  const vw=r.width/cam.z/TS*sc,vh=r.height/cam.z/TS*sc;
  g.strokeStyle="rgba(255,255,255,.85)";g.lineWidth=1;
  g.strokeRect(cam.x/TS*sc-vw/2,cam.y/TS*sc-vh/2,vw,vh);
}
mmapEl.addEventListener("pointerdown",e=>{
  const r=mmapEl.getBoundingClientRect();
  const sc=Math.min(108/W,76/H);
  cam.x=(e.clientX-r.left)/sc*TS;cam.y=(e.clientY-r.top)/sc*TS;clampCam();drawMinimap();
});

function calcEpochReady(){
  let ready=1;
  for(let i=1;i<EPOCHS.length;i++){
    if(EPOCHS[i].chk(S))ready=i+1;
    else break;
  }
  return ready;
}
function updateProgression(announce){
  const ready=Math.max(S.epoch||1,calcEpochReady());
  const oldReady=S.epochReady||S.epoch||1;
  S.epochReady=ready;
  S.bestEpoch=Math.max(S.bestEpoch||1,S.epoch||1);
  if(announce&&ready>(S.epoch||1)&&ready!==oldReady){
    const e=EPOCHS[(S.epoch||1)];
    toast(`🏭 Рубеж готов: ${e.nm}`);
    say(`🏭 Готов переход в эпоху ${S.epoch+1}: ${e.nm}. Закрой его в «Развитие x20».`);
    snd("research");
  }
}
function claimEpoch(){

/* ℹ️ инспектор: объясняет, что это */
function describe(x,y){
  const c=grid[y][x];
  let msg;
  if(c){
    const d=DEFS[c.t];
    msg=`${d.ic} ${d.nm} ур.${cellLevel(c)}/${MAX_UPGRADE_LEVEL}`;
    if(c.t==="miner")msg+=` — добывает ${ore[y][x]?oreName(ore[y][x]):"…"}; без ленты складывает кучей (тапни кучу — соберёшь)`;
    if(c.t==="gen")msg+=` — питает радиус ${genRadius()} клеток (до ${genCap(c)}⚡️); топливо: ${c.fuel>0?"горит ("+Math.ceil(c.fuel/60)+"с)":"НЕТ"}; в бункере ⚫${c.buf.coal||0} 🌲${c.buf.wood||0}${c.auto!==false?"; сам берёт со склада":""}`;
    if(c.t==="belt")msg+=" — везёт предметы по стрелке; тап → 🔄 Повернуть";
    if(RECIPES[c.t])msg+=` — рецепты: ${RECIPES[c.t].map(r=>recipeStr(r)).join("; ")}`;
    if(c.t==="turret")msg+=" — стреляет по рейдерам рядом (нужна энергия)";
    if(c.t==="wall")msg+=" — прочная преграда для рейдеров";
    if(c.t==="core")msg+=" — сердце базы: потеряешь его — конец";
    const buf=Object.entries(c.buf||{}).filter(([,n])=>n>0).map(([k,n])=>n+" "+ITEM[k]).join(", ");
    if(buf&&c.t!=="gen")msg+=` · внутри: ${buf}`;
    if(c.hp<DEFS[c.t].hp)msg+=` · HP ${c.hp}/${DEFS[c.t].hp}`;
  }
  else if(ore[y][x])msg=`${oreName(ore[y][x])} — осталось ${oreAmt[y][x]||"?"} ед. Тапни и выбери 🛠 Бур`;
  else if(terr[y][x]==="water")msg="🌊 Вода — строить нельзя, обходи";
  else if(terr[y][x]==="tree")msg="🌲 Дерево — тапни → 🪓 Срубить: даст древесину (горит в генераторе)";
  else msg="Пустая земля — тапни, чтобы выбрать постройку";
  toast(msg.slice(0,140));say("ℹ️ "+msg);
}
function tapAt(clientX,clientY){
  if(!S.started||S.over||S.win)return;
  // тап по карте закрывает открытые панели (и «съедает» этот тап)
  if(smartEl.classList.contains("open"))return closeSmart();
  if(ctxEl.classList.contains("on"))return closeCtx();
  if(sheetEl.classList.contains("on"))return closeSheet();
  const [x,y]=tileAt(clientX,clientY);
  if(x<0||y<0||x>=W||y>=H)return;
  if(S.moveFrom){ // режим переноса: тап = новая позиция
    const {x:fx,y:fy}=S.moveFrom,c=grid[fy][fx];
    if(!c){clearQuick();return}
    if(x===fx&&y===fy){clearQuick();return toast("Осталось на месте")}
    if(grid[y][x])return toast("Клетка занята");
    if(terr[y][x]==="water")return toast("Здесь вода");
    if(terr[y][x]==="tree")return toast("Здесь дерево — сначала сруби");
    if(c.t==="miner"&&!ore[y][x])return toast("Бур можно перенести только на залежь");
    pushU(fx,fy);pushU(x,y);
    grid[y][x]=c;grid[fy][fx]=null;
    if(c.t==="belt")c.dir=smartBeltDir(x,y);
    snd("place");puff(x,y,"#7aa2ff",4);toast("↔️ Перенесено");
    clearQuick();drawHud();return;
  }
  { // тап по человечку — меню специализации
    const r=cv.getBoundingClientRect();
    const fx=(clientX-r.left-r.width/2)/cam.z+cam.x, fy=(clientY-r.top-r.height/2)/cam.z+cam.y;
    const wn=workers.find(w=>Math.hypot(w.x*TS-fx,w.y*TS-fy)<TS*0.75);
    if(wn){openWorkerCtx(wn,clientX,clientY);return}
  }
  if(drops[x+","+y]){collectDrops(x,y);return} // тап по куче — собрать
  if(S.quick){ // быстрая укладка одинаковых построек тапами
    const t=S.quick;
    if(grid[y][x])return toast("Клетка занята");
    if(terr[y][x]==="water")return toast("Здесь вода");
    if(terr[y][x]==="tree")return toast("Сначала сруби дерево (выключи ✕ быстрый режим)");
    if(t==="miner"&&!ore[y][x])return toast("Здесь нет залежи");
    if(buildAt(x,y,t)&&t==="belt")chainBelt(x,y);
    return;
  }
  openCtx(x,y,clientX,clientY);
}

/* ---------- симуляция ---------- */
function outputTo(x,y,item){
  for(let di=0;di<4;di++){
    const [dx,dy]=DIRS[di];
    const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const c=grid[ny][nx];
    if(!c||c.t!=="belt"||c.item)continue;
    const [bdx,bdy]=DIRS[c.dir];
    if(nx+bdx===x&&ny+bdy===y)continue;
    c.item=item;c.itemAge=S.tick;return true;
  }
  return false;
}
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function step(){
  if(S.over||!S.started||S.win)return;
  S.tick++;
  if(S.tick%15===0)recomputePower(); // зоны питания: ближайший генератор кормит своих
  workers.forEach(workerStep);
  animals.forEach(animalStep);
  if(S.tick%3600===0){rolloverEconomy();scenarioTick();updateAuthority();if(animals.length<8)spawnAnimals(1);}
  if(S.tick%30===0)drawMinimap();
  const speed=tech("t_speed")?2:1;
  const beltPeriod=beltTickPeriod();
  const belts=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c&&c.t==="belt")belts.push([x,y,c])}
  if(S.tick%beltPeriod===0){
    belts.forEach(([x,y,c])=>{
      if(!c.item)return;
      const [dx,dy]=DIRS[c.dir],nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H)return;
      const t=grid[ny][nx];
      if(!t){ // лента упирается в землю — предмет ложится кучей (собери тапом)
        if(terr[ny][nx]!=="water"&&dropAt(nx,ny,c.item))c.item=null;
        return;
      }
      if(t.t==="belt"&&!t.item){t.item=c.item;t.itemAge=S.tick;c.item=null}
      else if(t.t==="furnace"||t.t==="asm"||t.t==="lab"){t.buf[c.item]=(t.buf[c.item]||0)+1;c.item=null}
      else if(t.t==="gen"&&(c.item==="coal"||c.item==="wood")){t.buf[c.item]=(t.buf[c.item]||0)+1;c.item=null}
      else if(t.t!=="belt"&&S.tick-(c.itemAge||0)>900){inv[c.item]++;c.item=null} // упёрлось в глухое здание — через 15с на склад
    });
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];if(!c)continue;
    if(c.t==="gen"){ // генератор жрёт уголь: 1 уголь = 12 сек света
      if(c.fuel>0)c.fuel--;
      if(c.fuel<=0&&(c.buf.coal||0)>0){c.buf.coal--;c.fuel=1500;puff(x,y,"#5c6a7d",1)} // 1 уголь ≈ 25с
      else if(c.fuel<=0&&(c.buf.wood||0)>0){c.buf.wood--;c.fuel=600;puff(x,y,"#4dbb72",1)} // 1 древесина ≈ 10с
      // авто-уголь со склада: свет не гаснет, пока на складе есть топливо (выкл. тапом по генератору)
      else if(c.fuel<=0&&c.auto!==false&&S.autoAll!==false){
        if(inv.coal>0){const t2=Math.min(inv.coal,3);inv.coal-=t2;c.buf.coal=(c.buf.coal||0)+t2;}
        else if(inv.wood>0){const t2=Math.min(inv.wood,4);inv.wood-=t2;c.buf.wood=(c.buf.wood||0)+t2;}
      }
      continue;
    }
    if(c.t==="miner"){
      if(!c.pw)continue;
      c.prog+=speed*machineMult(c);
      if(c.prog>=90){
        const k=ore[y][x];
        if(!k){c.prog=0;continue} // залежь исчерпана — рабочие перенесут бур
        if(outputTo(x,y,k)||dropAt(x,y,k)){
          c.prog=0;S.made[k]++;minedMin[k]=(minedMin[k]||0)+1;if(S.tick%180<90)puff(x,y,oreColor(k),1);
          if(--oreAmt[y][x]<=0){ // руда КОНЕЧНА
            ore[y][x]=null;oreAmt[y][x]=0;terrDirty=true;
            say("⛏ Залежь под буром исчерпана — рабочие поищут новую");
          }
        }
        else c.prog=90; // куча под буром полна — ждём, пока соберут
      }
    }
    if(c.t==="farm"){ // 🌾 еда растёт медленно, но сама
      if(!c.pw)continue;
      c.prog+=speed*machineMult(c);
      if(c.prog>=1100){
        if(dropAt(x,y,"food")){c.prog=0;S.made.food++;puff(x,y,"#e8a25b",2,"+1 🍞")}
        else c.prog=1100;
      }
      continue;
    }
    if(c.t==="lodge"){ // 🏹 охота: нужен зверь в радиусе 6 клеток
      c.prog+=machineMult(c);
      if(c.prog>=1400){
        const ai=animals.findIndex(an=>{const dx=an.x-(x+0.5),dy=an.y-(y+0.5);return dx*dx+dy*dy<=36});
        if(ai>=0){
          animals.splice(ai,1);c.prog=0;
          let got=0;for(let i=0;i<3;i++)if(dropAt(x,y,"food")){S.made.food++;got++}
          puff(x,y,"#e8a25b",3,"+"+got+" 🍞");
        } else c.prog=1400; // ждём, пока зверь забредёт
      }
      continue;
    }
    if(c.t==="furnace"||c.t==="asm"||c.t==="lab"){
      if(DEFS[c.t].power>0&&!c.pw)continue;
      if(c.auto!==false&&S.autoAll!==false&&c.recSel!=null&&S.tick%90===(x*7+y*13)%90){ // авто-подсос сырья со склада под выбранный рецепт
        activeRecipes(c).forEach(r=>Object.entries(r.in).forEach(([k,n])=>{
          let take=Math.min(n*2-(c.buf[k]||0),inv[k]);
          if(supplyBudget)take=Math.min(take,supplyBudget[k]||0); // 📊 лимит: не больше доли добычи в минуту
          if(take>0){inv[k]-=take;c.buf[k]=(c.buf[k]||0)+take;if(supplyBudget)supplyBudget[k]-=take}
        }));
      }
      const recs=activeRecipes(c);
      if(!c.rec){c.rec=recs.find(r=>Object.entries(r.in).every(([k,n])=>(c.buf[k]||0)>=n))||null}
      if(c.rec){
        if(c.prog===0){
          if(!Object.entries(c.rec.in).every(([k,n])=>(c.buf[k]||0)>=n)){c.rec=null;continue}
          Object.entries(c.rec.in).forEach(([k,n])=>c.buf[k]-=n);
        }
        c.prog+=speed*machineMult(c);
        if(c.t==="furnace"&&S.tick%50===0)puff(x,y,"#e8762b",1);
        if(c.prog>=c.rec.t){
          const out=c.rec.out;
          // как у бура: без ленты продукт копится КУЧЕЙ у здания (собирают тапом или рабочие)
          if(outputTo(x,y,out)||dropAt(x,y,out)){
            S.made[out]++;c.prog=0;c.rec=null;
            snd("craft");puff(x,y,"#4dbb72",2,"+1 "+ITEM[out].split(" ")[0]);
          } else c.prog=c.rec.t; // куча полна — ждём, пока заберут
        }
      }
    }
  }
  belts.forEach(([x,y,c])=>{
    if(!c.item)return;
    const [dx,dy]=DIRS[c.dir],nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H){inv[c.item]++;S.made[c.item]++;c.item=null}
  });
  /* выживание и захваченные ботом планеты */
  const botHostile=regionCaptured();
  if(S.mode==="survival"||botHostile){
    if(S.mode==="survival"&&S.tick>=S.nextWave){
      S.wave++;S.nextWave+=S.map==="desert"?2400:3000;
      const n=2+S.wave, hp=25+(S.map==="desert"?8:6)*S.wave;
      for(let i=0;i<n;i++){
        const side=Math.floor(Math.random()*4);
        const ex=side===0?0:side===1?W-1:Math.random()*W;
        const ey=side===2?0:side===3?H-1:Math.random()*H;
        enemies.push({x:ex,y:ey,hp,maxHp:hp});
      }
      toast(`🌊 Волна ${S.wave}: ${n} рейдеров!`);say(`🌊 Волна ${S.wave} (${n} врагов)`);snd("wave");
    }
    if(botHostile&&S.tick%2400===0){
      const g=currentGov(),maxBots=3+Math.floor((g.bot||51)/18)+Math.floor((g.industry||0)/85);
      if(enemies.filter(e=>e.robot).length<maxBots){
        const active=enemies.filter(e=>e.robot).length;
        const reserve=Math.max(0,(g.robots||0)-active);
        const n=Math.max(1,Math.min(3,maxBots-active,reserve||1));
        for(let i=0;i<n;i++){
          const side=Math.floor(Math.random()*4);
          const ex=side===0?0:side===1?W-1:Math.random()*W;
          const ey=side===2?0:side===3?H-1:Math.random()*H;
          const hp=42+g.bot+Math.floor((g.industry||0)/4);
          enemies.push({x:ex,y:ey,hp,maxHp:hp,robot:true});
        }
        toast(`🤖 Роботы бота высадились: ${n}`);
        say(`🤖 ${S.regionName}: бот отправил ${n} роботов защищать захваченную власть. Гарнизон: ${g.robots||0}.`);
      }
    }
    const bl=[];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])bl.push([x,y]);
    enemies.forEach(en=>{
      let bx=-1,by=-1,bd=1e9;
      bl.forEach(([x,y])=>{const d=Math.abs(x+0.5-en.x)+Math.abs(y+0.5-en.y);if(d<bd){bd=d;bx=x;by=y}});
      if(bx<0)return;
      if(bd>0.9){
        const dx=bx+0.5-en.x,dy=by+0.5-en.y,L=Math.hypot(dx,dy)||1;
        en.x+=dx/L*0.028;en.y+=dy/L*0.028;
      } else if(S.tick%30===0){
        const b=grid[by][bx];b.hp-=8;
        if(b.hp<=0){
          puff(bx,by,"#ff6b6b",8);snd("boom");
          if(b.t==="core"){grid[by][bx]=null;gameOver();return}
          grid[by][bx]=null;say("💥 Разрушено: "+DEFS[b.t].nm);
        }
      }
    });
    if(S.tick%20===0){
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const c=grid[y][x];if(!c||c.t!=="turret"||!c.pw)continue;
        let tgt=null,td=4.5;
        enemies.forEach(en=>{const d=Math.hypot(en.x-(x+0.5),en.y-(y+0.5));if(d<td){td=d;tgt=en}});
        if(tgt){tgt.hp-=7;c.shotAt={x:tgt.x,y:tgt.y,t:S.tick};
          if(tgt.hp<=0){
            if(tgt.robot){const g=currentGov();g.robots=Math.max(0,(g.robots||0)-1);g.bot=Math.max(0,g.bot-1);g.industry=Math.max(0,+(g.industry-.8).toFixed(1));}
            enemies=enemies.filter(e=>e!==tgt);puff(tgt.x-0.5,tgt.y-0.5,"#ffb14b",6)
          }}
      }
    }
    enemies=enemies.filter(e=>e.hp>0);
  }
  /* цели и обучение */
  if(S.tick%60===0)updateProgression(true);
  const g=GOALS[S.goal];
  if(g&&g.chk(S)){say("✅ Цель выполнена: "+g.txt);toast("✅ "+g.txt);snd("research");S.goal++;drawGoal()}
  tutCheck();
  if(S.tick%30===7)questCheck();
  if(S.tick%30===0){drawInv();drawTech();drawQuest();drawHud()}
}

/* ---------- обучение ---------- */
function findB(t){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]&&grid[y][x].t===t)return [x,y];return null}
function findOre(kind){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(ore[y][x]===kind&&!grid[y][x])return [x,y];return null}
const minerOn=kind=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]&&grid[y][x].t==="miner"&&ore[y][x]===kind)return true;return false};
const TUT=[

   chk:()=>minerOn("iron"),
   target:()=>findOre("iron")},
  {txt:"Тапни по пустой клетке РЯДОМ с буром → ⚡️ Генератор. Он питает постройки в радиусе ~9 клеток (жёлтое кольцо) и сам берёт уголь со склада. Генераторов можно ставить сколько угодно — далёким постройкам нужен свой.",
   chk:()=>grid.flat().some(c=>c&&c.t==="gen"&&c.fuel>0),
   target:()=>findB("gen")},
  {txt:"Уголь догорает! Тапни по угольной залежи (чёрные блестящие кучки) → 🛠 Бур — свой уголь важнее покупного запаса.",
   chk:()=>minerOn("coal"),
   target:()=>findOre("coal")},
  {txt:"Тапни по пустой клетке в паре клеток от бура → 🔥 Плавильня.",
   chk:()=>grid.flat().some(c=>c&&c.t==="furnace"),
   target:()=>findB("furnace")},
  {txt:"Соедини бур и плавильню ➡️ Конвейером: тап по клетке → Конвейер, дальше просто тапай клетки по пути — лента сама поворачивается куда надо.",

function adviseHint(){
  const gens=grid.flat().filter(c=>c&&c.t==="gen");
  // приоритет: энергия → топливо → обучение → квест
  if(!gens.length&&grid.flat().some(c=>c&&DEFS[c.t].power>0))return {txt:"Нет генератора — постройки без энергии. Поставь ⚡️ Генератор.",target:findOre("coal")};
  if(gens.length&&gens.every(g=>g.fuel<=0&&!(g.buf.coal>0)))
    return {txt:inv.coal>0?"Генератор без угля! Тапни по нему — заправится со склада.":"Уголь кончился! Поставь бур на угольную залежь и вези уголь конвейером.",target:findB("gen")||findOre("coal")};
  if(!S.powerOk)return {txt:powerStat.noZone?"Постройки вне зоны генератора (радиус "+GEN_RADIUS+" клеток) — поставь ⚡️ Генератор ближе к ним.":"Генераторы перегружены — поставь ещё один ⚡️ рядом с цехом.",target:findB("gen")};
  if(S.tut>=0&&S.tut<TUT.length&&!TUT[S.tut].last)return {txt:"Обучение: "+TUT[S.tut].txt,target:TUT[S.tut].target&&TUT[S.tut].target()};
  const q=QUESTS[S.quest];
  if(q){
    if(q.chk===undefined)return null;
    // подсказки по типу квеста
    if(/стал/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: вези в плавильню 2 листа + уголь (или тапни по ней с запасом на складе).`,target:findB("furnace")};
    if(/медь|провод|плат/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: бур на медь → плавильня (медь+уголь) → сборщик.`,target:minerOn("copper")?findB("asm"):findOre("copper")};
    if(/наук|колб/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: лаборатории нужны 🟩 плата + ⚙️ шестерня.`,target:findB("lab")||findB("asm")};
    if(/конвейер/i.test(q.t))return {txt:`Задание «${q.t}»: тяни ленты — соединяй буры, плавильни и сборщики.`,target:findB("belt")};
    if(/генератор|электр/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: ещё генераторы + угольная логистика.`,target:findB("gen")};
    return {txt:`Задание «${q.t}»: ${q.s}`,target:null};
  }
  return {txt:"Всё идёт отлично. Расширяй производство и копи 🧪 на Fable-ядро!",target:findB("lab")};
}
