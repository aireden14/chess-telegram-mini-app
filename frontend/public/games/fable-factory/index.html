<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fable Factory</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141b24; --panel2:#1b2532; --line:#2a3646;
    --ink:#e8eef7; --dim:#8b9bb0; --gold:#e8b04b; --accent:#7aa2ff; --ok:#4dbb72; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;display:flex;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  #canvasWrap{flex:1;min-height:0;position:relative}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;top:8px;left:8px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
  .pill{background:rgba(20,27,36,.66);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:.5px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:.8rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .pill.bad{color:var(--bad)}
  #goal{position:absolute;top:8px;right:8px;background:rgba(20,27,36,.72);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:.5px solid rgba(232,176,75,.5);border-radius:14px;padding:8px 12px;font-size:.8rem;max-width:230px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  #goal b{color:var(--gold)}
  #tut{position:absolute;left:8px;bottom:8px;max-width:300px;background:rgba(20,27,36,.8);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:.5px solid rgba(122,162,255,.5);border-radius:16px;padding:12px 14px;font-size:.84rem;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;animation:tutIn .35s cubic-bezier(.2,1.2,.3,1)}
  #tut.on{display:block}
  #tut .step{color:var(--accent);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:4px}
  #tut .skip{color:var(--dim);font-size:.72rem;margin-top:8px;cursor:pointer;text-decoration:underline}
  @keyframes tutIn{0%{transform:translateY(12px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
  #zoomCtl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
  #zoomCtl button{width:40px;height:40px;padding:0;text-align:center;font-size:1.1rem;border-radius:12px}
  #side{width:270px;flex-shrink:0;background:rgba(20,27,36,.72);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-left:.5px solid rgba(255,255,255,.08);display:flex;flex-direction:column;overflow-y:auto}
  .sec{padding:11px 13px;border-bottom:.5px solid rgba(255,255,255,.07)}
  .sec h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:8px;font-weight:600}
  #build{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.1);border-radius:13px;padding:8px 8px;cursor:pointer;font-size:.78rem;text-align:left;font-weight:500;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), background .2s, opacity .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  button:disabled{opacity:.3;cursor:default;box-shadow:none}
  button.armed{outline:2px solid var(--accent);background:rgba(122,162,255,.14)}
  button:active:not(:disabled){transform:scale(.95)}
  button small{color:var(--dim);display:block;font-size:.68rem}
  #inv{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:.8rem}
  #inv div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:8px;padding:4px 8px}
  #inv .n{font-variant-numeric:tabular-nums;font-weight:700}
  #tech button{width:100%;margin-bottom:6px}
  #tech button.done{border-color:var(--ok);opacity:.6}
  #log{height:74px;overflow-y:auto;padding:5px 10px;font-size:.75rem;color:var(--dim);border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
  #toast{position:fixed;left:50%;top:12px;transform:translateX(-50%) translateY(-8px) scale(.96);background:rgba(27,37,50,.78);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:.5px solid rgba(232,176,75,.5);padding:9px 18px;border-radius:999px;font-size:.85rem;opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  @media(max-width:820px){
    body{flex-direction:column}
    #side{width:100%;height:42%;border-left:none;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
    .sec{flex:1 1 46%}
    #tut{max-width:230px}
  }
</style>
</head>
<body>
<div id="main">
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="goal"></div>
    <div id="tut"><div class="step"></div><div class="txt"></div><div class="skip">пропустить обучение</div></div>
    <div id="zoomCtl">
      <button id="zIn">＋</button><button id="zOut">－</button><button id="zFit" title="вся карта">🗺</button>
      <button id="undoBtn" title="отменить">↩️</button><button id="hintBtn" title="подсказка">💡</button><button id="sndBtn">🔊</button>
    </div>
  </div>
  <div id="log"></div>
</div>
<div id="side">
  <div class="sec"><h3>Постройки <small style="color:var(--dim)">(тап по конвейеру — поворот; тап по зданию — загрузка со склада; ✖ — снос с возвратом 50%)</small></h3><div id="build"></div></div>
  <div class="sec"><h3>Склад</h3><div id="inv"></div></div>
  <div class="sec"><h3>Задание мастера Фейбла</h3><div id="quest" style="font-size:.8rem"></div></div>
  <div class="sec"><h3>Исследования</h3><div id="tech"></div></div>
  <div class="sec"><button id="exitBtn" style="width:100%;text-align:center">← В меню игр</button></div>
</div>
<div id="toast"></div>
<script>
"use strict";
/* ============ Fable Factory v3 — карты, камера, обучение, энергия на угле ============ */
const W=56,H=36,TS=26;
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
const ORE={iron:"#9fb0c4",copper:"#d08a5b",coal:"#3c4450",stone:"#7d8471"};
const ITEM={iron:"⛏ жел.руда",copper:"⛏ медь",coal:"⚫ уголь",stone:"🪨 камень",
  ironPlate:"▪️ жел.лист",copperPlate:"🟧 мед.лист",steelPlate:"🔩 сталь",gear:"⚙️ шестерня",wire:"〰️ провод",circuit:"🟩 плата",science:"🧪 наука"};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------- карты ---------- */
const MAPS={
  valley:{nm:"🌿 Долина",desc:"классика: ровная земля",oreMul:1,water:false},
  desert:{nm:"🏜 Пустошь",desc:"руды больше, волны злее",oreMul:1.6,water:false},
  isles: {nm:"🏝 Архипелаг",desc:"озёра мешают строить",oreMul:1.2,water:true},
};
const ore=Array.from({length:H},()=>Array(W).fill(null));
const terr=Array.from({length:H},()=>Array(W).fill(null)); // "water"|null
function genMap(mapId){
  const m=MAPS[mapId];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ore[y][x]=null;terr[y][x]=null}
  if(m.water){ // озёра-кляксы
    for(let i=0;i<7;i++){let x=rnd(4,W-5),y=rnd(4,H-5);
      for(let j=0;j<50;j++){if(x>1&&y>1&&x<W-2&&y<H-2)terr[y][x]="water";x+=rnd(-1,1);y+=rnd(-1,1)}}
  }
  const blob=(kind,n)=>{let x=rnd(3,W-4),y=rnd(3,H-4),guard=0;
    while(terr[y][x]==="water"&&guard++<40){x=rnd(3,W-4);y=rnd(3,H-4)}
    for(let i=0;i<n;i++){if(x>0&&y>0&&x<W-1&&y<H-1&&!terr[y][x])ore[y][x]=kind;x+=rnd(-1,1);y+=rnd(-1,1)}};
  const base=Math.round(34*m.oreMul);
  ["iron","iron","iron","copper","copper","coal","coal","coal","stone","stone"].forEach(k=>blob(k,base));
}

/* ---------- здания / рецепты / технологии ---------- */
const DEFS={
  belt:  {nm:"Конвейер",ic:"➡️",cost:{ironPlate:1},power:0,unlock:null,hp:40},
  miner: {nm:"Бур",ic:"🛠",cost:{ironPlate:5,gear:2},power:2,unlock:null,hp:120},
  furnace:{nm:"Плавильня",ic:"🔥",cost:{stone:5},power:0,unlock:null,hp:150},
  gen:   {nm:"Генератор",ic:"⚡️",cost:{ironPlate:4,stone:4},power:-8,unlock:null,hp:150},
  asm:   {nm:"Сборщик",ic:"🏭",cost:{ironPlate:8,gear:4},power:3,unlock:"t_asm",hp:150},
  lab:   {nm:"Лаборатория",ic:"🧪",cost:{ironPlate:10,circuit:2},power:4,unlock:"t_lab",hp:150},
  turret:{nm:"Турель",ic:"🗼",cost:{ironPlate:6,gear:4},power:2,unlock:"t_def",hp:220},
  wall:  {nm:"Стена",ic:"🧿",cost:{stone:2},power:0,unlock:"t_def",hp:420},
  core:  {nm:"Ядро",ic:"💠",cost:{},power:0,unlock:"hidden",hp:600},
  del:   {nm:"Снос",ic:"✖",cost:{},power:0,unlock:null,hp:0},
};
const RECIPES={
  furnace:[{in:{iron:1,coal:1},out:"ironPlate",t:60},{in:{copper:1,coal:1},out:"copperPlate",t:60},{in:{ironPlate:2,coal:1},out:"steelPlate",t:100}],
  asm:[{in:{ironPlate:2},out:"gear",t:80},{in:{copperPlate:1},out:"wire",t:50},{in:{wire:2,ironPlate:1},out:"circuit",t:110}],
  lab:[{in:{circuit:1,gear:1},out:"science",t:140}],
};
const TECHS=[
  {id:"t_asm",nm:"Сборка (15 ▪️)",cost:{ironPlate:15},done:false,desc:"Открывает Сборщик"},
  {id:"t_def",nm:"Оборона (8 ⚙️)",cost:{gear:8},done:false,desc:"Турель и стена"},
  {id:"t_lab",nm:"Наука (8 🟩)",cost:{circuit:8},done:false,desc:"Открывает Лабораторию"},
  {id:"t_belt",nm:"Быстрые конвейеры (4 🧪)",cost:{science:4},done:false,desc:"Конвейеры ×2"},
  {id:"t_speed",nm:"Турбо-буры (5 🧪)",cost:{science:5},done:false,desc:"Буры ×2 быстрее"},
  {id:"t_win",nm:"Fable-ядро (25 🧪)",cost:{science:25},done:false,desc:"ПОБЕДА"},
];
const GOALS=[
  {txt:"Скрафти 10 жел.листов",chk:s=>s.made.ironPlate>=10},
  {txt:"Исследуй «Сборку» и поставь Сборщик",chk:s=>tech("t_asm")&&grid.flat().some(c=>c&&c.t==="asm")},
  {txt:"Выплави 5 стали (2 листа + уголь в плавильне)",chk:s=>s.made.steelPlate>=5},
  {txt:"Собери 8 плат и открой «Науку»",chk:s=>tech("t_lab")},
  {txt:"Произведи 25 🧪 и собери Fable-ядро",chk:s=>tech("t_win")},
];

/* ---------- состояние ---------- */
const grid=Array.from({length:H},()=>Array(W).fill(null));
const inv={iron:0,copper:0,coal:10,stone:12,ironPlate:14,copperPlate:0,steelPlate:0,gear:4,wire:0,circuit:0,science:0};
const S={tool:"belt",goal:0,quest:0,made:{},tick:0,win:false,over:false,mode:"peace",map:"valley",wave:0,nextWave:5400,started:false,tut:-1,hint:null};
Object.keys(ITEM).forEach(k=>S.made[k]=0);
let enemies=[]; let parts=[]; // частицы {x,y,vx,vy,life,color,text}
const tech=id=>TECHS.find(t=>t.id===id).done;

const logEl=document.getElementById("log");
function say(t){const d=document.createElement("div");d.textContent=t;logEl.appendChild(d);logEl.scrollTop=1e9}
let toastT;function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),2400)}

/* ---------- звук (WebAudio, лениво) ---------- */
let AC=null,muted=localStorage.getItem("ff.muted")==="1";
function snd(kind){
  if(muted)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime;
    const cfg={place:[220,.08,"square",.05],rotate:[330,.05,"square",.03],craft:[520,.09,"sine",.05],
      research:[660,.25,"sine",.07],wave:[110,.5,"sawtooth",.09],boom:[70,.3,"sawtooth",.1],win:[880,.6,"sine",.09]}[kind]||[440,.1,"sine",.05];
    o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],t);
    if(kind==="win"||kind==="research")o.frequency.exponentialRampToValueAtTime(cfg[0]*1.5,t+cfg[1]);
    if(kind==="boom"||kind==="wave")o.frequency.exponentialRampToValueAtTime(cfg[0]*0.5,t+cfg[1]);
    g.gain.setValueAtTime(cfg[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+cfg[1]);
    o.start(t);o.stop(t+cfg[1]+.02);
  }catch(e){}
}
const sndBtn=document.getElementById("sndBtn");
sndBtn.textContent=muted?"🔇":"🔊";
sndBtn.onclick=()=>{muted=!muted;localStorage.setItem("ff.muted",muted?"1":"0");sndBtn.textContent=muted?"🔇":"🔊"};

/* ---------- частицы ---------- */
function puff(x,y,color,n=4,text){
  for(let i=0;i<n;i++)parts.push({x:x*TS+TS/2,y:y*TS+TS/2,vx:(Math.random()-.5)*.7,vy:-.4-Math.random()*.5,life:50+Math.random()*30,color,text:i===0?text:null});
  if(parts.length>220)parts.splice(0,parts.length-220);
}

/* ---------- камера ---------- */
const cam={x:W*TS/2,y:H*TS/2,z:1};
function clampCam(){
  cam.z=Math.min(2.4,Math.max(.42,cam.z));
  cam.x=Math.min(W*TS,Math.max(0,cam.x));
  cam.y=Math.min(H*TS,Math.max(0,cam.y));
}
function fitAll(){
  const r=cv.getBoundingClientRect();
  cam.z=Math.min(r.width/(W*TS),r.height/(H*TS))*.96;
  cam.x=W*TS/2;cam.y=H*TS/2;clampCam();
}
document.getElementById("zIn").onclick=()=>{cam.z*=1.25;clampCam()};
document.getElementById("zOut").onclick=()=>{cam.z/=1.25;clampCam()};
document.getElementById("zFit").onclick=fitAll;
cv.addEventListener("wheel",e=>{e.preventDefault();cam.z*=e.deltaY<0?1.12:0.9;clampCam()},{passive:false});

/* тап против пана; пинч-зум */
const pointers=new Map();
let panStart=null,movedFar=false,pinchD=0;
function tileAt(clientX,clientY){
  const r=cv.getBoundingClientRect();
  const wx=(clientX-r.left-r.width/2)/cam.z+cam.x;
  const wy=(clientY-r.top-r.height/2)/cam.z+cam.y;
  return [Math.floor(wx/TS),Math.floor(wy/TS)];
}
cv.addEventListener("pointerdown",e=>{
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){panStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};movedFar=false}
  else if(pointers.size===2){const p=[...pointers.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
});
cv.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD>0){cam.z*=d/pinchD;clampCam()}
    pinchD=d;movedFar=true;
  } else if(panStart){
    const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
    if(Math.hypot(dx,dy)>7)movedFar=true;
    if(movedFar){cam.x=panStart.cx-dx/cam.z;cam.y=panStart.cy-dy/cam.z;clampCam()}
  }
});
cv.addEventListener("pointerup",e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchD=0;
  if(pointers.size===0){
    if(!movedFar&&panStart)tapAt(e.clientX,e.clientY);
    panStart=null;
  }
});
cv.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);panStart=null});

/* ---------- UI: постройки/склад/технологии ---------- */
const buildEl=document.getElementById("build");
function costStr(c){return Object.entries(c).map(([k,n])=>n+" "+ITEM[k].split(" ")[0]).join(" ")||"—"}
function canPay(c){return Object.entries(c).every(([k,n])=>inv[k]>=n)}
function pay(c){Object.entries(c).forEach(([k,n])=>inv[k]-=n)}
function drawBuild(){
  buildEl.innerHTML="";
  for(const [t,d] of Object.entries(DEFS)){
    if(d.unlock==="hidden")continue;
    if(d.unlock&&!TECHS.find(x=>x.id===d.unlock).done)continue;
    if((t==="turret"||t==="wall")&&S.mode!=="survival")continue;
    const b=document.createElement("button");
    b.innerHTML=`${d.ic} ${d.nm}<small>${costStr(d.cost)}</small>`;
    b.className=S.tool===t?"armed":"";
    b.disabled=t!=="del"&&!canPay(d.cost);
    b.onclick=()=>{S.tool=t;drawBuild()};
    buildEl.appendChild(b);
  }
}
function drawInv(){
  document.getElementById("inv").innerHTML=Object.entries(ITEM)
    .filter(([k])=>inv[k]>0||["coal","ironPlate","steelPlate","gear","circuit","science"].includes(k))
    .map(([k,nm])=>`<div><span>${nm}</span><span class="n">${inv[k]}</span></div>`).join("");
}
function drawTech(){
  document.getElementById("tech").innerHTML="";
  TECHS.forEach(t=>{
    const b=document.createElement("button");
    b.className=t.done?"done":"";
    b.innerHTML=`${t.done?"✅":"🔬"} ${t.nm}<small>${t.desc}</small>`;
    b.disabled=t.done||!canPay(t.cost);
    b.onclick=()=>{pay(t.cost);t.done=true;say("Исследовано: "+t.nm);toast("🔬 "+t.nm);snd("research");
      if(t.id==="t_win")winGame();
      drawTech();drawBuild();drawInv()};
    document.getElementById("tech").appendChild(b);
  });
}
function drawGoal(){
  const g=GOALS[S.goal];
  document.getElementById("goal").innerHTML=g?`<b>Цель ${S.goal+1}/${GOALS.length}:</b><br>${g.txt}`:"<b>Все цели выполнены!</b>";
}
function drawHud(){
  let gen=0,use=0;
  grid.flat().forEach(c=>{if(!c)return;const p=DEFS[c.t].power;
    if(p<0){if(c.fuel>0)gen-=p}else use+=p});
  const ok=gen>=use;
  let wavePill="";
  if(S.mode==="survival"){
    const secs=Math.max(0,Math.ceil((S.nextWave-S.tick)/60));
    wavePill=`<div class="pill ${enemies.length?"bad":""}">🌊 волна ${S.wave+1} через ${secs}с${enemies.length?` · врагов: ${enemies.length}`:""}</div>`;
  }
  const noFuel=grid.flat().some(c=>c&&c.t==="gen"&&c.fuel<=0);
  document.getElementById("hud").innerHTML=
    `<div class="pill ${ok?"":"bad"}">⚡️ ${gen}/${use}${ok?"":" — не хватает энергии!"}</div>`+
    (noFuel?`<div class="pill bad">⚫ генератор без угля!</div>`:"")+wavePill;
  S.powerOk=ok;
}
document.getElementById("exitBtn").onclick=()=>parent.postMessage("hexland:exit","*");

/* ---------- тап: постройка / поворот / загрузка / снос ---------- */
function tapAt(clientX,clientY){
  if(!S.started||S.over||S.win)return;
  const [x,y]=tileAt(clientX,clientY);
  if(x<0||y<0||x>=W||y>=H)return;
  const c=grid[y][x];
  if(S.tool==="del"){if(c){
    if(c.t==="core")return toast("Ядро сносить нельзя");
    pushU(x,y);
    Object.entries(DEFS[c.t].cost).forEach(([k,n])=>inv[k]+=Math.floor(n/2));
    grid[y][x]=null;say("Снесено: "+DEFS[c.t].nm+" (возврат 50%)");snd("boom");puff(x,y,"#8b9bb0",5);
    drawInv();drawBuild();drawHud()}return}
  if(c){
    if(c.t==="belt"&&S.tool==="belt"){pushU(x,y);c.dir=(c.dir+1)%4;snd("rotate");return}
    if(c.t==="gen"){ // ручная заправка углём
      const take=Math.min(inv.coal,3);
      if(take>0){pushU(x,y);inv.coal-=take;c.buf.coal=(c.buf.coal||0)+take;toast("⚫ Уголь в генератор: "+take);snd("place");drawInv()}
      else toast("На складе нет угля");
      return;
    }
    if(RECIPES[c.t]){
      let fed=[];
      const needs=new Set();RECIPES[c.t].forEach(r=>Object.keys(r.in).forEach(k=>needs.add(k)));
      if(c.t==="furnace"&&S.goal<2)needs.delete("ironPlate"); // сталь кормим руками только когда дошли до цели о стали
      pushU(x,y);
      needs.forEach(k=>{const take=Math.min(inv[k],3);if(take>0){inv[k]-=take;c.buf[k]=(c.buf[k]||0)+take;fed.push(take+" "+ITEM[k].split(" ")[0])}});
      if(fed.length){toast("Загружено: "+fed.join(", "));snd("place");drawInv()}else toast("На складе нет нужных входов");
      return;
    }
    return toast("Клетка занята");
  }
  if(terr[y][x]==="water")return toast("Тут вода 🌊");
  const d=DEFS[S.tool];
  if(!canPay(d.cost))return toast("Не хватает ресурсов");
  if(S.tool==="miner"&&!ore[y][x])return toast("Бур ставится на залежь");
  if(S.tool!=="miner"&&S.tool!=="belt"&&ore[y][x])return toast("Тут залежь — только бур/конвейер");
  pushU(x,y);
  pay(d.cost);
  grid[y][x]={t:S.tool,dir:0,item:null,prog:0,buf:{},hp:d.hp,fuel:0};
  snd("place");puff(x,y,"#7aa2ff",3);
  drawBuild();drawInv();drawHud();
}

/* ---------- симуляция ---------- */
function outputTo(x,y,item){
  for(let di=0;di<4;di++){
    const [dx,dy]=DIRS[di];
    const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const c=grid[ny][nx];
    if(!c||c.t!=="belt"||c.item)continue;
    const [bdx,bdy]=DIRS[c.dir];
    if(nx+bdx===x&&ny+bdy===y)continue;
    c.item=item;c.itemAge=S.tick;return true;
  }
  return false;
}
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function step(){
  if(S.over||!S.started||S.win)return;
  S.tick++;
  const speed=tech("t_speed")?2:1;
  const beltPeriod=tech("t_belt")?6:12;
  const belts=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c&&c.t==="belt")belts.push([x,y,c])}
  if(S.tick%beltPeriod===0){
    belts.forEach(([x,y,c])=>{
      if(!c.item)return;
      const [dx,dy]=DIRS[c.dir],nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H)return;
      const t=grid[ny][nx];
      if(!t)return;
      if(t.t==="belt"&&!t.item){t.item=c.item;t.itemAge=S.tick;c.item=null}
      else if(t.t==="furnace"||t.t==="asm"||t.t==="lab"){t.buf[c.item]=(t.buf[c.item]||0)+1;c.item=null}
      else if(t.t==="gen"&&c.item==="coal"){t.buf.coal=(t.buf.coal||0)+1;c.item=null}
    });
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x];if(!c)continue;
    if(c.t==="gen"){ // генератор жрёт уголь: 1 уголь = 12 сек света
      if(c.fuel>0)c.fuel--;
      if(c.fuel<=0&&(c.buf.coal||0)>0){c.buf.coal--;c.fuel=720;puff(x,y,"#5c6a7d",1)}
      continue;
    }
    if(c.t==="miner"){
      if(!S.powerOk)continue;
      c.prog+=speed;
      if(c.prog>=90){c.prog=0;
        const k=ore[y][x];
        if(k){if(!outputTo(x,y,k))inv[k]++;S.made[k]++;if(S.tick%180<90)puff(x,y,ORE[k],1)}
      }
    }
    if(c.t==="furnace"||c.t==="asm"||c.t==="lab"){
      if(DEFS[c.t].power>0&&!S.powerOk)continue;
      const recs=RECIPES[c.t];
      if(!c.rec){c.rec=recs.find(r=>Object.entries(r.in).every(([k,n])=>(c.buf[k]||0)>=n))||null}
      if(c.rec){
        if(c.prog===0){
          if(!Object.entries(c.rec.in).every(([k,n])=>(c.buf[k]||0)>=n)){c.rec=null;continue}
          Object.entries(c.rec.in).forEach(([k,n])=>c.buf[k]-=n);
        }
        c.prog+=speed;
        if(c.t==="furnace"&&S.tick%50===0)puff(x,y,"#e8762b",1);
        if(c.prog>=c.rec.t){
          const out=c.rec.out;
          if(!outputTo(x,y,out))inv[out]++;
          S.made[out]++;c.prog=0;c.rec=null;
          snd("craft");puff(x,y,"#4dbb72",2,"+1 "+ITEM[out].split(" ")[0]);
        }
      }
    }
  }
  belts.forEach(([x,y,c])=>{
    if(!c.item)return;
    const [dx,dy]=DIRS[c.dir],nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H){inv[c.item]++;S.made[c.item]++;c.item=null}
  });
  /* выживание */
  if(S.mode==="survival"){
    if(S.tick>=S.nextWave){
      S.wave++;S.nextWave+=S.map==="desert"?2400:3000;
      const n=2+S.wave, hp=25+(S.map==="desert"?8:6)*S.wave;
      for(let i=0;i<n;i++){
        const side=Math.floor(Math.random()*4);
        const ex=side===0?0:side===1?W-1:Math.random()*W;
        const ey=side===2?0:side===3?H-1:Math.random()*H;
        enemies.push({x:ex,y:ey,hp,maxHp:hp});
      }
      toast(`🌊 Волна ${S.wave}: ${n} рейдеров!`);say(`🌊 Волна ${S.wave} (${n} врагов)`);snd("wave");
    }
    const bl=[];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])bl.push([x,y]);
    enemies.forEach(en=>{
      let bx=-1,by=-1,bd=1e9;
      bl.forEach(([x,y])=>{const d=Math.abs(x+0.5-en.x)+Math.abs(y+0.5-en.y);if(d<bd){bd=d;bx=x;by=y}});
      if(bx<0)return;
      if(bd>0.9){
        const dx=bx+0.5-en.x,dy=by+0.5-en.y,L=Math.hypot(dx,dy)||1;
        en.x+=dx/L*0.028;en.y+=dy/L*0.028;
      } else if(S.tick%30===0){
        const b=grid[by][bx];b.hp-=8;
        if(b.hp<=0){
          puff(bx,by,"#ff6b6b",8);snd("boom");
          if(b.t==="core"){grid[by][bx]=null;gameOver();return}
          grid[by][bx]=null;say("💥 Разрушено: "+DEFS[b.t].nm);
        }
      }
    });
    if(S.tick%20===0&&S.powerOk){
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const c=grid[y][x];if(!c||c.t!=="turret")continue;
        let tgt=null,td=4.5;
        enemies.forEach(en=>{const d=Math.hypot(en.x-(x+0.5),en.y-(y+0.5));if(d<td){td=d;tgt=en}});
        if(tgt){tgt.hp-=7;c.shotAt={x:tgt.x,y:tgt.y,t:S.tick};
          if(tgt.hp<=0){enemies=enemies.filter(e=>e!==tgt);puff(tgt.x-0.5,tgt.y-0.5,"#ffb14b",6)}}
      }
    }
    enemies=enemies.filter(e=>e.hp>0);
  }
  /* цели и обучение */
  const g=GOALS[S.goal];
  if(g&&g.chk(S)){say("✅ Цель выполнена: "+g.txt);toast("✅ "+g.txt);snd("research");S.goal++;drawGoal()}
  tutCheck();
  if(S.tick%30===7)questCheck();
  if(S.tick%30===0){drawInv();drawTech();drawBuild();drawHud()}
}

  tutEl.querySelector(".step").textContent=`Обучение · шаг ${S.tut+1}/${TUT.length}`;
  tutEl.querySelector(".txt").textContent=TUT[S.tut].txt;
}
function tutCheck(){
  if(S.tut<0||S.tut>=TUT.length)return;
  const st=TUT[S.tut];
  if(st.last){ // финальный шаг закрывается сам через 12с
    if(!st.shownAt)st.shownAt=S.tick;
    if(S.tick-st.shownAt>720){S.tut=-1;tutShow()}
    return;
  }
  if(st.chk()){S.tut++;snd("craft");tutShow()}
}

/* ---------- 💡 подсказка по запросу: анализ состояния + подсветка цели ---------- */
function adviseHint(){
  const gens=grid.flat().filter(c=>c&&c.t==="gen");
  // приоритет: энергия → топливо → обучение → квест
  if(!gens.length&&grid.flat().some(c=>c&&DEFS[c.t].power>0))return {txt:"Нет генератора — постройки без энергии. Поставь ⚡️ Генератор.",target:findOre("coal")};
  if(gens.length&&gens.every(g=>g.fuel<=0&&!(g.buf.coal>0)))
    return {txt:inv.coal>0?"Генератор без угля! Тапни по нему — заправится со склада.":"Уголь кончился! Поставь бур на угольную залежь и вези уголь конвейером.",target:findB("gen")||findOre("coal")};
  if(!S.powerOk)return {txt:"Не хватает энергии — поставь ещё один ⚡️ Генератор с углём.",target:findB("gen")};
  if(S.tut>=0&&S.tut<TUT.length&&!TUT[S.tut].last)return {txt:"Обучение: "+TUT[S.tut].txt,target:TUT[S.tut].target&&TUT[S.tut].target()};
  const q=QUESTS[S.quest];
  if(q){
    if(q.chk===undefined)return null;
    // подсказки по типу квеста
    if(/стал/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: вези в плавильню 2 листа + уголь (или тапни по ней с запасом на складе).`,target:findB("furnace")};
    if(/медь|провод|плат/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: бур на медь → плавильня (медь+уголь) → сборщик.`,target:minerOn("copper")?findB("asm"):findOre("copper")};
    if(/наук|колб/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: лаборатории нужны 🟩 плата + ⚙️ шестерня.`,target:findB("lab")||findB("asm")};
    if(/конвейер/i.test(q.t))return {txt:`Задание «${q.t}»: тяни ленты — соединяй буры, плавильни и сборщики.`,target:findB("belt")};
    if(/генератор|электр/i.test(q.t+q.s))return {txt:`Задание «${q.t}»: ещё генераторы + угольная логистика.`,target:findB("gen")};
    return {txt:`Задание «${q.t}»: ${q.s}`,target:null};
  }
  return {txt:"Всё идёт отлично. Расширяй производство и копи 🧪 на Fable-ядро!",target:findB("lab")};
}
document.getElementById("hintBtn").onclick=()=>{

  toast("💡 "+h.txt.slice(0,120));say("💡 "+h.txt);
};

/* ---------- рендер ---------- */
function render(){
  const r=cv.getBoundingClientRect();
  if(cv.width!==Math.round(r.width*devicePixelRatio)){cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio}
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,r.width,r.height);
  cx.save();
  cx.translate(r.width/2,r.height/2);cx.scale(cam.z,cam.z);cx.translate(-cam.x,-cam.y);
  const x0=Math.max(0,Math.floor((cam.x-r.width/2/cam.z)/TS)),x1=Math.min(W-1,Math.ceil((cam.x+r.width/2/cam.z)/TS));
  const y0=Math.max(0,Math.floor((cam.y-r.height/2/cam.z)/TS)),y1=Math.min(H-1,Math.ceil((cam.y+r.height/2/cam.z)/TS));
  const beltPeriod=tech("t_belt")?6:12;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(terr[y][x]==="water"){cx.fillStyle="#153245";cx.fillRect(x*TS,y*TS,TS,TS);
      cx.fillStyle="rgba(255,255,255,.05)";if((x+y+Math.floor(S.tick/40))%5===0)cx.fillRect(x*TS+4,y*TS+TS/2,TS-8,1.5);
      continue}
    cx.fillStyle=(x+y)%2?"#101720":"#0e141c";
    cx.fillRect(x*TS,y*TS,TS,TS);
    if(ore[y][x]){cx.fillStyle=ORE[ore[y][x]];cx.globalAlpha=.55;
      cx.beginPath();cx.arc(x*TS+TS/2,y*TS+TS/2,TS/3,0,7);cx.fill();cx.globalAlpha=1}
  }
  cx.font="16px sans-serif";cx.textAlign="center";cx.textBaseline="middle";
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const c=grid[y][x];if(!c)continue;
    const px=x*TS+TS/2,py=y*TS+TS/2;
    if(c.t==="belt"){
      cx.fillStyle="#22303f";cx.fillRect(x*TS+2,y*TS+2,TS-4,TS-4);
      cx.fillStyle="#5b7080";
      cx.save();cx.translate(px,py);cx.rotate(c.dir*Math.PI/2);
      cx.beginPath();cx.moveTo(6,0);cx.lineTo(-3,-5);cx.lineTo(-3,5);cx.fill();cx.restore();
      if(c.item){ // плавное движение к следующей клетке
        const f=Math.min(1,((S.tick%beltPeriod)+1)/beltPeriod)*0.55;
        const [dx,dy]=DIRS[c.dir];
        cx.fillStyle=ORE[c.item]||"#c9d4e0";
        cx.beginPath();cx.arc(px+dx*TS*f*0.5,py+dy*TS*f*0.5,5,0,7);cx.fill();
        cx.strokeStyle="rgba(0,0,0,.4)";cx.stroke();
      }
    } else {
      cx.fillStyle="#1d2836";cx.fillRect(x*TS+1,y*TS+1,TS-2,TS-2);
      cx.strokeStyle=DEFS[c.t].power<0?(c.fuel>0?"#e8b04b":"#7d3535"):"#3a4a5e";cx.strokeRect(x*TS+1,y*TS+1,TS-2,TS-2);
      cx.fillText(DEFS[c.t].ic,px,py);
      if(c.prog>0&&c.rec){cx.fillStyle="#4dbb72";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*c.prog/c.rec.t,2)}
      if(c.t==="miner"&&c.prog>0){cx.fillStyle="#4dbb72";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*c.prog/90,2)}
      if(c.t==="gen"&&c.fuel>0){cx.fillStyle="#e8b04b";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*Math.min(1,c.fuel/720),2)}
      if(c.t==="turret"&&c.shotAt&&S.tick-c.shotAt.t<8){
        cx.strokeStyle="#ffd76b";cx.lineWidth=1.5;
        cx.beginPath();cx.moveTo(px,py);cx.lineTo(c.shotAt.x*TS,c.shotAt.y*TS);cx.stroke();cx.lineWidth=1;
      }
    }
    if(c.hp!==undefined&&c.hp<DEFS[c.t].hp){
      cx.fillStyle="#000";cx.fillRect(x*TS+2,y*TS+1,TS-4,3);
      cx.fillStyle="#ff6b6b";cx.fillRect(x*TS+2,y*TS+1,(TS-4)*Math.max(0,c.hp)/DEFS[c.t].hp,3);
    }
  }
  enemies.forEach(en=>{
    cx.fillStyle="#c03a3a";cx.beginPath();cx.arc(en.x*TS,en.y*TS,6,0,7);cx.fill();
    cx.strokeStyle="#5c1010";cx.stroke();
    cx.fillStyle="#000";cx.fillRect(en.x*TS-7,en.y*TS-11,14,3);
    cx.fillStyle="#ffb14b";cx.fillRect(en.x*TS-7,en.y*TS-11,14*en.hp/en.maxHp,3);
  });
  // частицы и всплывающие +1
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
    const a=Math.min(1,p.life/40);
    if(p.text){cx.globalAlpha=a;cx.fillStyle="#dff5e6";cx.font="11px sans-serif";cx.fillText(p.text,p.x,p.y);cx.font="16px sans-serif";cx.globalAlpha=1}
    else{cx.globalAlpha=a*.8;cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,2.4,0,7);cx.fill();cx.globalAlpha=1}
  });
  // подсветка цели обучения или 💡 подсказки
  let hl=null,hcol="rgba(122,162,255,.9)";
  if(S.hint&&S.tick<S.hint.until&&S.hint.target){hl=S.hint.target;hcol="rgba(232,176,75,.95)"}
  else if(S.tut>=0&&S.tut<TUT.length){hl=TUT[S.tut].target&&TUT[S.tut].target()}
  if(hl){
    const pulse=6+Math.sin(S.tick/8)*3;
    cx.strokeStyle=hcol;cx.lineWidth=2.5;
    cx.beginPath();cx.arc(hl[0]*TS+TS/2,hl[1]*TS+TS/2,TS/2+pulse,0,7);cx.stroke();cx.lineWidth=1;
  }
  cx.restore();
}

/* ---------- оверлеи / старт / сейв ---------- */
function overlay(html){
  let o=document.getElementById("ovl");
  if(!o){o=document.createElement("div");o.id="ovl";
    o.style.cssText="position:fixed;inset:0;background:rgba(5,8,12,.78);display:grid;place-items:center;z-index:70";
    document.body.appendChild(o)}
  o.innerHTML=`<div style="background:rgba(20,27,36,.82);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:.5px solid rgba(255,255,255,.12);border-radius:22px;padding:20px;max-width:360px;width:92%;box-shadow:0 24px 60px rgba(0,0,0,.5)">${html}</div>`;
  o.style.display="grid";
  return o;
}
function hideOverlay(){const o=document.getElementById("ovl");if(o)o.style.display="none"}
function gameOver(){
  S.over=true;saveGame();const sc=recordRating("lost");
  overlay(`<h2 style="margin-bottom:8px">💥 Ядро разрушено</h2>
    <p style="color:var(--dim);font-size:.85rem">Ты продержался ${S.wave} волн(ы). Рейтинг: <b>${sc}</b> 🏅</p>
    <div style="display:flex;gap:8px;margin-top:14px">
    <button style="flex:1" onclick="location.reload()">Меню</button>
    <button style="flex:1" onclick="parent.postMessage('hexland:exit','*')">В игры</button></div>`);
}
const RATE_KEY="ff.rating.v1";
function ratingList(){try{return JSON.parse(localStorage.getItem(RATE_KEY))||[]}catch(e){return[]}}
function recordRating(result){
  const mins=Math.round(S.tick/3600);
  const prod=Object.values(S.made).reduce((a,b)=>a+b,0);
  const score=Math.max(0,Math.round(S.made.science*20+prod+S.wave*100+(result==="won"?500:0)));
  const list=ratingList();
  list.push({name:S.sessionName||"Партия",score,waves:S.wave,science:S.made.science,mins,result,date:new Date().toISOString().slice(0,10)});
  list.sort((a,b)=>b.score-a.score);
  localStorage.setItem(RATE_KEY,JSON.stringify(list.slice(0,10)));
  return score;
}
function winGame(){
  S.win=true;snd("win");saveGame();const sc=recordRating("won");
  say("🏆 ПОБЕДА: Fable-ядро собрано за "+Math.round(S.tick/60)+" сек!");
  overlay(`<h2 style="margin-bottom:8px">🏆 Победа!</h2>
    <p style="color:var(--dim);font-size:.85rem">Fable-ядро собрано за ${Math.round(S.tick/60)} сек${S.mode==="survival"?`, отбито волн: ${S.wave}`:""}. Рейтинг: <b>${sc}</b> 🏅</p>
    <div style="display:flex;gap:8px;margin-top:14px">
    <button style="flex:1" onclick="location.reload()">Меню</button>
    <button style="flex:1" onclick="parent.postMessage('hexland:exit','*')">В игры</button></div>`);
}
/* сессии: каждая партия — отдельный сейв, удаляется ТОЛЬКО вручную из меню */
const SESS_KEY="ff.sessions.v1";
function sessionsList(){try{return JSON.parse(localStorage.getItem(SESS_KEY))||[]}catch(e){return[]}}
function writeSessions(l){localStorage.setItem(SESS_KEY,JSON.stringify(l))}
function saveGame(){
  if(!S.started||!S.sessionId)return;
  const gridSer=grid.map(row=>row.map(c=>c?{t:c.t,dir:c.dir,item:c.item,prog:c.prog,buf:c.buf,hp:c.hp,fuel:c.fuel}:null));
  const data={ore,terr,grid:gridSer,inv,made:S.made,goal:S.goal,quest:S.quest,tick:S.tick,
    mode:S.mode,map:S.map,wave:S.wave,nextWave:S.nextWave,tut:S.tut,techs:TECHS.map(t=>t.done),
    status:S.win?"🏆":S.over?"💀":"▶"};
  const list=sessionsList();
  const rec={id:S.sessionId,name:S.sessionName,updated:Date.now(),data};
  const i=list.findIndex(s=>s.id===S.sessionId);
  if(i>=0)list[i]=rec;else list.unshift(rec);
  writeSessions(list.slice(0,8));
}
function loadGame(d){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    ore[y][x]=d.ore[y][x];terr[y][x]=(d.terr&&d.terr[y][x])||null;
    grid[y][x]=d.grid[y][x]?{...d.grid[y][x],rec:null}:null}
  Object.assign(inv,d.inv);Object.assign(S.made,d.made);
  S.goal=d.goal;S.quest=d.quest||0;S.tick=d.tick;S.mode=d.mode;S.map=d.map||"valley";S.wave=d.wave;S.nextWave=d.nextWave;S.tut=d.tut??-1;
  // завершённые партии можно продолжать строить (song-of-factorio); рейтинг уже записан
  S.win=false;S.over=false;
  TECHS.forEach((t,i)=>t.done=!!d.techs[i]);
}
function startGame(opts){
  S.started=true;S.mode=opts.mode;
  if(opts.session){
    S.sessionId=opts.session.id;S.sessionName=opts.session.name;
    loadGame(opts.session.data);
  }
  else{
    S.sessionId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    S.sessionName=`${MAPS[opts.map].nm} ${opts.mode==="survival"?"⚔️":"🌿"} ${new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}`;
    S.map=opts.map;genMap(opts.map);
    S.tut=opts.tutorial?0:-1;
    if(opts.mode==="survival"){
      const cx0=Math.floor(W/2),cy0=Math.floor(H/2);
      ore[cy0][cx0]=null;terr[cy0][cx0]=null;
      grid[cy0][cx0]={t:"core",dir:0,item:null,prog:0,buf:{},hp:DEFS.core.hp,fuel:0};
      S.nextWave=S.tick+5400;
      say("Выживание: защищай 💠 Ядро! Первая волна через 90 сек. Исследуй Оборону для турелей.");
    }
  }
  hideOverlay();fitAll();cam.z=1;clampCam();
  // камера на стартовую точку: ядро или первая железная залежь
  const tgt=findB("core")||(()=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(ore[y][x]==="iron")return[x,y];return [W/2,H/2]})();
  cam.x=tgt[0]*TS;cam.y=tgt[1]*TS;clampCam();
  drawBuild();drawInv();drawTech();drawGoal();drawHud();drawQuest();tutShow();
  say("Fable Factory: карту можно таскать и зумить. Тап по зданию — загрузка со склада. 💡 — подсказка.");
  toast(opts.session?"Партия продолжена 💾":opts.mode==="survival"?"Выживание: 90с до волны!":"Поехали! 🏭");
}
setInterval(()=>{if(!S.win&&!S.over)saveGame()},5000);

/* ---------- ↩️ отмена последнего действия (стройка/снос/поворот/загрузка) ---------- */
let undoStack=[];
const cellCopy=c=>c?{t:c.t,dir:c.dir,item:c.item,prog:c.prog,buf:{...c.buf},hp:c.hp,fuel:c.fuel}:null;
function pushU(x,y){undoStack.push({x,y,cell:cellCopy(grid[y][x]),inv:{...inv}});if(undoStack.length>25)undoStack.shift()}
document.getElementById("undoBtn").onclick=()=>{
  const u=undoStack.pop();
  if(!u)return toast("Нечего отменять");
  grid[u.y][u.x]=u.cell?{...u.cell,rec:null}:null;
  Object.keys(inv).forEach(k=>inv[k]=u.inv[k]??0);
  toast("Отменено ↩️");snd("rotate");
  drawBuild();drawInv();drawHud();
};

/* стартовое меню: сессии (удаление только вручную) / рейтинг / новая партия */
function showMenu(){
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const firstTime=!localStorage.getItem("ff.played");
  const sess=sessionsList();
  const sessRows=sess.map(s=>{
    const d=new Date(s.updated).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
    return `<div style="display:flex;gap:6px;margin-bottom:6px">
      <button class="sRow" data-id="${esc(s.id)}" style="flex:1">${s.data.status||"▶"} ${esc(s.name)}<small>${d} · цель ${(s.data.goal||0)+1} · задание ${(s.data.quest||0)+1}</small></button>
      <button class="sDel" data-id="${esc(s.id)}" style="width:44px;text-align:center">🗑</button></div>`;
  }).join("");
  const mapBtns=Object.entries(MAPS).map(([id,m])=>
    `<button class="mapBtn" data-m="${id}">${m.nm}<small>${m.desc}</small></button>`).join("");
  const o=overlay(`<h2 style="margin-bottom:8px">🏭 Fable Factory</h2>
    ${sess.length?`<div style="font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Мои партии</div>${sessRows}<div style="margin-bottom:8px"></div>`:""}
    <div style="font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Новая партия · карта</div>
    <div style="display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:10px">${mapBtns}</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button id="sPeace" style="flex:1" class="armed">🌿 Мирный</button>
      <button id="sSurv" style="flex:1">⚔️ Выживание</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="sTut" ${firstTime?"checked":""}> Пошаговое обучение
    </label>
    <div style="display:flex;gap:8px">
      <button id="sGo" style="flex:2;background:linear-gradient(180deg,#f0bc5e,#d08a2c);color:#241a08;font-weight:700;border:none;text-align:center">Играть</button>
      <button id="sRate" style="flex:1;text-align:center">🏅 Рейтинг</button>
    </div>`);
  let map="valley",mode="peace";
  const mb=[...o.querySelectorAll(".mapBtn")];
  const setMap=id=>{map=id;mb.forEach(b=>b.classList.toggle("armed",b.dataset.m===id))};
  mb.forEach(b=>b.onclick=()=>setMap(b.dataset.m));
  setMap("valley");
  const pe=o.querySelector("#sPeace"),su=o.querySelector("#sSurv");
  pe.onclick=()=>{mode="peace";pe.classList.add("armed");su.classList.remove("armed")};
  su.onclick=()=>{mode="survival";su.classList.add("armed");pe.classList.remove("armed")};
  o.querySelectorAll(".sRow").forEach(b=>b.onclick=()=>{
    const s=sessionsList().find(x=>x.id===b.dataset.id);
    if(s){localStorage.setItem("ff.played","1");startGame({mode:s.data.mode,session:s})}
  });
  o.querySelectorAll(".sDel").forEach(b=>b.onclick=()=>{
    if(b.textContent!=="точно?"){b.textContent="точно?";setTimeout(()=>{b.textContent="🗑"},2500);return}
    writeSessions(sessionsList().filter(x=>x.id!==b.dataset.id));
    showMenu(); // перерисовать
  });
  o.querySelector("#sRate").onclick=()=>{
    const rows=ratingList().map((r,i)=>
      `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:.5px solid rgba(255,255,255,.07)">
        <span>${i+1}. ${r.result==="won"?"🏆":"💀"} ${esc(r.name)}</span>
        <span style="font-variant-numeric:tabular-nums"><b>${+r.score||0}</b> · 🧪${+r.science||0} · 🌊${+r.waves||0}</span></div>`).join("");
    overlay(`<h2 style="margin-bottom:10px">🏅 Рейтинг</h2>
      ${rows||'<p style="color:var(--dim)">Пока пусто — доиграй партию до победы или поражения.</p>'}
      <button style="width:100%;margin-top:14px;text-align:center" onclick="showMenu()">← Назад</button>`);
  };
  o.querySelector("#sGo").onclick=()=>{
    localStorage.setItem("ff.played","1");
    startGame({mode,map,tutorial:o.querySelector("#sTut").checked});
  };
}
showMenu();

/* симуляция по реальному времени + рендер */
let last=performance.now();
setInterval(()=>{
  const now=performance.now();
  const steps=Math.min(120,Math.floor((now-last)/(1000/60)));
  for(let i=0;i<steps;i++)step();
  if(steps>0)last+=steps*(1000/60);
},50);
(function raf(){render();requestAnimationFrame(raf)})();
</script>
