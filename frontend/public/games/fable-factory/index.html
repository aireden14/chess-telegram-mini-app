/* ---------- статичный слой мира: земля, залежи, деревья (кэш ×2, перерисовка только при изменении) ---------- */
const SS=2;
const terrCv=document.createElement("canvas");
terrCv.width=W*TS*SS;terrCv.height=H*TS*SS;
let terrDirty=true;
const hash=(x,y)=>{let h=Math.imul(x+31,0x9E3779B1)^Math.imul(y+17,0x85EBCA6B);
  h^=h>>>13;h=Math.imul(h,0xC2B2AE35);return (h^h>>>16)>>>0};
function lcg(seed){let s=(seed|1)>>>0;return()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff)}
const ORE_FACES={ // [светлая грань, тело, тёмная грань, блик]
  iron:  ["#c7d8ea","#93aecb","#5e7a99","#eef5fc"],
  copper:["#e8955a","#c26a2e","#8a4318","#ffd9ae"],
  coal:  ["#3a3f4a","#22262e","#0f1216","#8b97ad"],
  stone: ["#c4b99c","#9c9075","#6f6550","#e5dbc0"],
  gold:  ["#f5e08e","#e0b23c","#a87d1e","#fff3c4"],
  crystal:["#c8f4f8","#8bd8e0","#4fa3ac","#eefdff"],
};
function drawOreSprite(g,k,x,y){
  const C=oreFaces(k),rn=lcg(hash(x,y));
  g.save();g.translate(x*TS+TS/2,y*TS+TS/2);
  g.fillStyle="rgba(48,38,26,.5)"; // вытоптанная земля под рудой
  g.beginPath();g.ellipse(0,1.5,TS*.46,TS*.36,0,0,7);g.fill();
  const n=4+Math.floor(rn()*3);
  for(let i=0;i<n;i++){
    const a=rn()*6.28,d=rn()*TS*.26;
    const ox=Math.cos(a)*d,oy=Math.sin(a)*d*.75;
    const r=TS*(.15+rn()*.12);
    g.beginPath(); // неровный кусок породы
    const v=5+Math.floor(rn()*2);
    for(let j=0;j<v;j++){const aa=j/v*6.28+rn()*.5,rr=r*(.75+rn()*.5);
      const X=ox+Math.cos(aa)*rr,Y=oy+Math.sin(aa)*rr*.85;
      j?g.lineTo(X,Y):g.moveTo(X,Y)}
    g.closePath();
    g.fillStyle=C[1];g.fill();
    g.strokeStyle=C[2];g.lineWidth=1;g.stroke();
    g.beginPath();g.moveTo(ox-r*.4,oy-r*.1);g.lineTo(ox+r*.1,oy-r*.6);g.lineTo(ox+r*.45,oy-r*.15);g.closePath();
    g.fillStyle=C[0];g.fill();
    g.fillStyle=C[3];g.fillRect(ox-r*.15,oy-r*.35,Math.max(1.2,r*.2),Math.max(1.2,r*.2));
  }
  g.restore();g.lineWidth=1;
}
function drawTreeSprite(g,x,y){
  const rn=lcg(hash(x,y)^0x5eed);
  const cx0=x*TS+TS/2+(rn()-.5)*5,cy0=y*TS+TS/2+(rn()-.5)*4,h=.85+rn()*.35;
  g.fillStyle="rgba(0,0,0,.28)";g.beginPath();g.ellipse(cx0+2,cy0+TS*.32,TS*.3,TS*.1,0,0,7);g.fill();
  g.fillStyle="#4a3826";g.fillRect(cx0-2,cy0+TS*.08,4,TS*.28); // ствол видно под кроной
  // хвойная крона: три яруса-треугольника, свет слева-сверху
  const tier=(w,yy,col)=>{g.fillStyle=col;g.beginPath();
    g.moveTo(cx0,yy-w*1.15);g.lineTo(cx0+w,yy);g.lineTo(cx0-w,yy);g.closePath();g.fill()};
  tier(TS*.4*h, cy0+TS*.14,"#274423");
  tier(TS*.33*h,cy0-TS*.02,"#37582c");
  tier(TS*.25*h,cy0-TS*.17,"#4a7238");
  g.fillStyle="#5f8f46";g.beginPath(); // блик
  g.moveTo(cx0,cy0-TS*.17-TS*.25*h*1.15);g.lineTo(cx0-TS*.14*h,cy0-TS*.17);g.lineTo(cx0-TS*.04,cy0-TS*.17);g.closePath();g.fill();
}
function drawGround(g,x,y){
  const m=mapStyle(S.map),h=hash(x,y);
  g.fillStyle=m.pal[h%m.pal.length];
  g.fillRect(x*TS,y*TS,TS,TS);
  if(h%7===0){g.fillStyle="rgba(0,0,0,.07)";g.fillRect(x*TS+(h>>3)%10,y*TS+(h>>5)%10,TS*.6,TS*.45)}
  if(h%11===3){g.fillStyle="rgba(255,250,220,.06)";g.fillRect(x*TS+(h>>4)%14,y*TS+(h>>6)%14,5,4)}
  if(h%13===5){g.fillStyle=m.dirt;g.globalAlpha=.22;
    g.beginPath();g.ellipse(x*TS+TS/2,y*TS+TS/2,TS*.5,TS*.34,(h%314)/100,0,7);g.fill();g.globalAlpha=1}
  if(m.grass&&h%5<2){g.strokeStyle="rgba(200,235,150,.2)";g.lineWidth=1;
    for(let i=0;i<3;i++){const gx=x*TS+3+((h>>i)%(TS-6)),gy=y*TS+3+((h>>(i+3))%(TS-6));
      g.beginPath();g.moveTo(gx,gy+3);g.lineTo(gx+1.2,gy);g.stroke()}}
}
function drawWater(g,x,y){
  const m=mapStyle(S.map);
  g.fillStyle=m.waterColor||"#1b4a63";g.fillRect(x*TS,y*TS,TS,TS);
  const shore=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{
    const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<W&&ny<H&&terr[ny][nx]!=="water"});
  if(shore){g.fillStyle="rgba(120,205,235,.16)";g.fillRect(x*TS,y*TS,TS,TS)}
  const h=hash(x,y);
  if(h%6===0){g.fillStyle="rgba(255,255,255,.07)";g.fillRect(x*TS+3+h%9,y*TS+5+(h>>4)%12,7,1.5)}
}
function redrawTerrain(){
  const g=terrCv.getContext("2d");
  g.setTransform(SS,0,0,SS,0,0);
  g.clearRect(0,0,W*TS,H*TS);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(terr[y][x]==="water"){drawWater(g,x,y);continue}
    drawGround(g,x,y);
    if(ore[y][x])drawOreSprite(g,ore[y][x],x,y);
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(terr[y][x]==="tree")drawTreeSprite(g,x,y);
  terrDirty=false;
}

/* ---------- рендер ---------- */
function render(){
  const r=cv.getBoundingClientRect();
  if(cv.width!==Math.round(r.width*devicePixelRatio)){cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio}
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,r.width,r.height);
  cx.fillStyle="#0e1912";cx.fillRect(0,0,r.width,r.height); // «пустота» за краем мира — глубокий тон, не чёрный
  cx.save();
  cx.translate(r.width/2,r.height/2);cx.scale(cam.z,cam.z);cx.translate(-cam.x,-cam.y);
  const x0=Math.max(0,Math.floor((cam.x-r.width/2/cam.z)/TS)),x1=Math.min(W-1,Math.ceil((cam.x+r.width/2/cam.z)/TS));
  const y0=Math.max(0,Math.floor((cam.y-r.height/2/cam.z)/TS)),y1=Math.min(H-1,Math.ceil((cam.y+r.height/2/cam.z)/TS));
  const beltPeriod=beltTickPeriod();
  if(terrDirty)redrawTerrain();
  cx.drawImage(terrCv,0,0,terrCv.width,terrCv.height,0,0,W*TS,H*TS);
  // живая вода: бегущие блики поверх кэша
  if((mapStyle(S.map)||{}).water){
    cx.fillStyle="rgba(255,255,255,.06)";
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
      if(terr[y][x]==="water"&&(x+y+Math.floor(S.tick/40))%5===0)cx.fillRect(x*TS+4,y*TS+TS/2,TS-8,1.5);
  }
  cx.font="16px sans-serif";cx.textAlign="center";cx.textBaseline="middle";
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const c=grid[y][x];if(!c)continue;
    const px=x*TS+TS/2,py=y*TS+TS/2;
    if(c.t==="belt"){
      cx.save();cx.translate(px,py);cx.rotate(c.dir*Math.PI/2);
      cx.fillStyle="#1d2127";cx.fillRect(-TS/2+2,-TS/2+2,TS-4,TS-4); // полотно
      cx.fillStyle="#454c58";cx.fillRect(-TS/2+2,-TS/2+2,TS-4,2.5);cx.fillRect(-TS/2+2,TS/2-4.5,TS-4,2.5); // борта
      cx.strokeStyle="#39404c";cx.lineWidth=1.5; // бегущие поперечины ленты
      const off=(S.tick*TS/beltPeriod)%7;
      for(let sx=-TS/2+2+off;sx<TS/2-2;sx+=7){cx.beginPath();cx.moveTo(sx,-TS/2+6);cx.lineTo(sx,TS/2-6);cx.stroke()}
      cx.lineWidth=1;
      cx.fillStyle="#8fa3b8";cx.beginPath();cx.moveTo(6.5,0);cx.lineTo(-2,-4.5);cx.lineTo(-2,4.5);cx.fill();
      cx.restore();
      if(c.item){ // плавное движение к следующей клетке
        const f=Math.min(1,((S.tick%beltPeriod)+1)/beltPeriod)*0.55;
        const [dx,dy]=DIRS[c.dir];
        cx.fillStyle=ITEM_COL[c.item]||"#c9d4e0";
        cx.beginPath();cx.arc(px+dx*TS*f*0.5,py+dy*TS*f*0.5,5,0,7);cx.fill();
        cx.strokeStyle="rgba(0,0,0,.45)";cx.stroke();
      }
      if(cellLevel(c)>1){cx.font="7px sans-serif";cx.fillStyle="#ffd98a";cx.fillText("L"+cellLevel(c),x*TS+TS-7,y*TS+7);cx.font="16px sans-serif";}
    } else {
      cx.fillStyle="#3a414c";cx.fillRect(x*TS+1,y*TS+1,TS-2,TS-2); // металлическая рама
      cx.fillStyle="#232932";cx.fillRect(x*TS+3,y*TS+3,TS-6,TS-6);
      cx.strokeStyle=DEFS[c.t].power<0?(c.fuel>0?"#e8b04b":"#7d3535"):"#4c5560";cx.strokeRect(x*TS+1.5,y*TS+1.5,TS-3,TS-3);
      // машины показывают продукт, бур — понятный значок руды + мини-значок здания в углу
      const prod=RECIPES[c.t]?(c.rec?c.rec.out:(c.recSel!=null&&RECIPES[c.t][c.recSel]?RECIPES[c.t][c.recSel].out:null)):null;
      const mk2=c.t==="miner"?(ore[y][x]||c.oreKind):null;
      if(mk2){
        cx.fillStyle=oreColor(mk2);cx.beginPath();cx.arc(px,py+1,6.5,0,7);cx.fill();
        cx.strokeStyle="rgba(0,0,0,.55)";cx.stroke();
        cx.font="10px sans-serif";cx.fillText(oreIcon(mk2),px,py+1.5);
        cx.font="9px sans-serif";cx.fillText("🛠",x*TS+7,y*TS+7);cx.font="16px sans-serif";
      } else if(prod){
        cx.fillText(ITEM[prod].split(" ")[0],px,py+1);
        cx.font="9px sans-serif";cx.fillText(DEFS[c.t].ic,x*TS+7,y*TS+7);cx.font="16px sans-serif";
      } else cx.fillText(DEFS[c.t].ic,px,py);
      if(cellLevel(c)>1){cx.font="7px sans-serif";cx.fillStyle="#ffd98a";cx.fillText("L"+cellLevel(c),x*TS+TS-7,y*TS+7);cx.font="16px sans-serif";}
      if((c.t==="farm"||c.t==="lodge")&&c.prog>0){ // полоска созревания/охоты
        cx.fillStyle="#e8a25b";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*Math.min(1,c.prog/(c.t==="farm"?1100:1400)),2);
      }
      // нет питания — мигающий значок
      if(DEFS[c.t].power>0&&!c.pw&&S.tick%40<26){
        cx.font="10px sans-serif";
        cx.fillStyle="rgba(10,12,16,.8)";cx.fillRect(x*TS+TS-12,y*TS+1,11,11);
        cx.fillText("⚡️",x*TS+TS-6.5,y*TS+7);cx.font="16px sans-serif";
      }
      if(c.prog>0&&c.rec){cx.fillStyle="#4dbb72";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*c.prog/c.rec.t,2)}
      if(c.t==="miner"&&c.prog>0){cx.fillStyle="#4dbb72";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*c.prog/90,2)}
      if(c.t==="gen"&&c.fuel>0){cx.fillStyle="#e8b04b";cx.fillRect(x*TS+2,y*TS+TS-4,(TS-4)*Math.min(1,c.fuel/1500),2)}
      if(c.t==="turret"&&c.shotAt&&S.tick-c.shotAt.t<8){
        cx.strokeStyle="#ffd76b";cx.lineWidth=1.5;
        cx.beginPath();cx.moveTo(px,py);cx.lineTo(c.shotAt.x*TS,c.shotAt.y*TS);cx.stroke();cx.lineWidth=1;
      }
    }
    if(c.hp!==undefined&&c.hp<DEFS[c.t].hp){
      cx.fillStyle="#000";cx.fillRect(x*TS+2,y*TS+1,TS-4,3);
      cx.fillStyle="#ff6b6b";cx.fillRect(x*TS+2,y*TS+1,(TS-4)*Math.max(0,c.hp)/DEFS[c.t].hp,3);
    }
  }
  // зоны генераторов: тонкое кольцо (видно, кого он питает)
  for(let y=y0-GEN_RADIUS;y<=y1+GEN_RADIUS;y++)for(let x=x0-GEN_RADIUS;x<=x1+GEN_RADIUS;x++){
    if(x<0||y<0||x>=W||y>=H)continue;
    const c=grid[y][x];
    if(c&&c.t==="gen"&&c.fuel>0){
      cx.strokeStyle="rgba(232,176,75,.14)";cx.lineWidth=1.5;
      cx.beginPath();cx.arc(x*TS+TS/2,y*TS+TS/2,genRadius()*TS,0,7);cx.stroke();cx.lineWidth=1;
    }
  }
  // 🦌 животные
  cx.font="13px sans-serif";
  animals.forEach(an=>{
    if(an.x*TS<x0*TS-30||an.x*TS>x1*TS+30||an.y*TS<y0*TS-30||an.y*TS>y1*TS+30)return;
    cx.fillText(ANIMAL_KINDS[an.k].ic,an.x*TS,an.y*TS);
  });
  cx.font="16px sans-serif";
  // 🧍 рабочие (у каждого свой облик)
  workers.forEach(w=>{
    const wx=w.x*TS,wy=w.y*TS,run=w.job?Math.sin(S.tick/3+w.ph)*1.6:0;
    const lk=w.look||{skin:"#e8c39a",shirt:"#4a6a8f",hat:null};
    cx.fillStyle="rgba(0,0,0,.3)";cx.beginPath();cx.ellipse(wx,wy+5,4.5,1.8,0,0,7);cx.fill();
    cx.fillStyle=lk.shirt;cx.fillRect(wx-2.5,wy-3+Math.abs(run)*.3,5,7); // тело
    cx.fillStyle=lk.skin;cx.beginPath();cx.arc(wx,wy-5,3,0,7);cx.fill(); // голова
    if(lk.hat){cx.fillStyle=lk.hat;cx.fillRect(wx-3.5,wy-8.5,7,2);cx.fillRect(wx-2,wy-10.5,4,2.5);} // шляпа
    cx.fillStyle="#2f3f52";cx.fillRect(wx-2.5,wy+3,2,2+run);cx.fillRect(wx+0.5,wy+3,2,2-run); // ноги
    if(w.hungry&&S.tick%50<32){cx.font="8px sans-serif";cx.fillText("🍽",wx+5,wy-8);cx.font="16px sans-serif";}
    if(w.carry){const k=Object.keys(w.carry)[0];
      cx.fillStyle=ITEM_COL[k]||"#c9d4e0";cx.beginPath();cx.arc(wx+4,wy-2,2.6,0,7);cx.fill();
      cx.strokeStyle="rgba(0,0,0,.4)";cx.stroke();}
    if(w.spec&&w.spec!=="any"){cx.font="8px sans-serif";cx.fillText(SPECS[w.spec].ic,wx,wy-10);cx.font="16px sans-serif";}
    if(w.carryCell){cx.font="9px sans-serif";cx.fillText("🛠",wx+5,wy-7);cx.font="16px sans-serif";}
    if((w.lvl||1)>1){cx.font="7px sans-serif";cx.fillStyle="#ffd98a";cx.fillText("★"+w.lvl,wx-6,wy-9);cx.font="16px sans-serif";}
  });
  // кучи ресурсов на земле (сбор тапом)
  cx.font="10px sans-serif";
  for(const key in drops){
    const [ddx,ddy]=key.split(",").map(Number);
    if(ddx<x0-1||ddx>x1+1||ddy<y0-1||ddy>y1+1)continue;
    const d=drops[key];const rn=lcg(hash(ddx,ddy)^0xd207);let tot=0;
    for(const k in d){tot+=d[k];
      const n=Math.min(5,Math.ceil(d[k]/8));
      for(let m=0;m<n;m++){
        const ox=ddx*TS+TS/2+(rn()-.5)*TS*.62,oy=ddy*TS+TS/2+(rn()-.5)*TS*.5+3;
        cx.fillStyle=ITEM_COL[k]||"#c9d4e0";
        cx.beginPath();cx.arc(ox,oy,3.2,0,7);cx.fill();
        cx.strokeStyle="rgba(0,0,0,.45)";cx.stroke();
      }
    }
    const bx=ddx*TS+TS/2,by=ddy*TS+4;
    cx.fillStyle="rgba(8,12,18,.78)";cx.fillRect(bx-10,by-6,20,11);
    cx.fillStyle="#ffd98a";cx.fillText(tot,bx,by);
  }
  cx.font="16px sans-serif";
  enemies.forEach(en=>{
    cx.fillStyle=en.robot?"#8a9bb8":"#c03a3a";cx.beginPath();cx.arc(en.x*TS,en.y*TS,6,0,7);cx.fill();
    cx.strokeStyle=en.robot?"#26364f":"#5c1010";cx.stroke();
    if(en.robot){cx.font="9px sans-serif";cx.fillText("🤖",en.x*TS,en.y*TS-9);cx.font="16px sans-serif";}
    cx.fillStyle="#000";cx.fillRect(en.x*TS-7,en.y*TS-11,14,3);
    cx.fillStyle="#ffb14b";cx.fillRect(en.x*TS-7,en.y*TS-11,14*en.hp/en.maxHp,3);
  });
  // частицы и всплывающие +1
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
    const a=Math.min(1,p.life/40);
    if(p.text){cx.globalAlpha=a;cx.fillStyle="#dff5e6";cx.font="11px sans-serif";cx.fillText(p.text,p.x,p.y);cx.font="16px sans-serif";cx.globalAlpha=1}
    else{cx.globalAlpha=a*.8;cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,2.4,0,7);cx.fill();cx.globalAlpha=1}
  });
  // подсветка цели обучения или 💡 подсказки
  let hl=null,hcol="rgba(122,162,255,.9)";
  if(S.hint&&S.tick<S.hint.until&&S.hint.target){hl=S.hint.target;hcol="rgba(232,176,75,.95)"}
  else if(S.tut>=0&&S.tut<TUT.length){hl=TUT[S.tut].target&&TUT[S.tut].target()}
  if(hl){
    const pulse=6+Math.sin(S.tick/8)*3;
    cx.strokeStyle=hcol;cx.lineWidth=2.5;
    cx.beginPath();cx.arc(hl[0]*TS+TS/2,hl[1]*TS+TS/2,TS/2+pulse,0,7);cx.stroke();cx.lineWidth=1;
  }
  cx.restore();
}

/* ---------- оверлеи / старт / сейв ---------- */
function overlay(html){
  let o=document.getElementById("ovl");
  if(!o){o=document.createElement("div");o.id="ovl";
    o.style.cssText="position:fixed;inset:0;background:rgba(5,8,12,.78);display:grid;place-items:center;z-index:70";
    document.body.appendChild(o)}
  o.innerHTML=`<div style="background:rgba(13,18,25,.95);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:.5px solid rgba(255,255,255,.16);border-radius:22px;padding:20px;max-width:360px;width:92%;box-shadow:0 24px 60px rgba(0,0,0,.55)">${html}</div>`;
  o.style.display="grid";
  return o;
}
function hideOverlay(){const o=document.getElementById("ovl");if(o)o.style.display="none"}
function gameOver(){
  S.over=true;saveGame();const sc=recordRating("lost");
  overlay(`<h2 style="margin-bottom:8px">💥 Ядро разрушено</h2>
    <p style="color:var(--dim);font-size:.85rem">Ты продержался ${S.wave} волн(ы). Рейтинг: <b>${sc}</b> 🏅</p>
    <div style="display:flex;gap:8px;margin-top:14px">
    <button style="flex:1" onclick="location.reload()">Меню</button>
    <button style="flex:1" onclick="parent.postMessage('hexland:exit','*')">В игры</button></div>`);
}
const RATE_KEY="ff.rating.v1";
function ratingList(){try{return JSON.parse(localStorage.getItem(RATE_KEY))||[]}catch(e){return[]}}
function recordRating(result){
  const mins=Math.round(S.tick/3600);
  const prod=Object.values(S.made).reduce((a,b)=>a+b,0);
  const score=Math.max(0,Math.round(S.made.science*20+prod+S.wave*100+(result==="won"?500:0)));
  const list=ratingList();
  list.push({name:S.sessionName||"Партия",score,waves:S.wave,science:S.made.science,mins,result,date:new Date().toISOString().slice(0,10)});
  list.sort((a,b)=>b.score-a.score);
  localStorage.setItem(RATE_KEY,JSON.stringify(list.slice(0,10)));
  return score;
}
function runTimeText(ticks){
  const sec=Math.max(0,Math.round((ticks||0)/60));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return `${h} ч ${m} мин`;
  if(m>0)return `${m} мин ${s} сек`;
  return `${s} сек`;
}
function winGame(){
  if(S.coreBuilt)return;
  S.coreBuilt=true;snd("win");updateProgression(true);saveGame();const sc=recordRating("won");
  const rt=runTimeText(S.tick);
  say("💠 Fable-ядро собрано за "+rt+". Теперь открыт бесконечный цикл.");
  overlay(`<h2 style="margin-bottom:8px">💠 Fable-ядро запущено</h2>
    <p style="color:var(--dim);font-size:.85rem">Время проекта: <b>${rt}</b>. Это больше не конец партии. Дожимай эпоху 20, качай здания до ур.20 и перезапускай ядро ради постоянного бонуса. Рейтинг milestone: <b>${sc}</b> 🏅</p>
    <div style="display:flex;gap:8px;margin-top:14px">
    <button style="flex:1" onclick="hideOverlay()">Продолжить</button>
    <button style="flex:1" onclick="hideOverlay();openSheet('x20')">Развитие</button></div>`);
}
/* ---------- 🌍 земли-регионы: уходи в новые края и возвращайся ---------- */
const serCell=c=>c?{t:c.t,dir:c.dir,item:c.item,prog:c.prog,buf:c.buf,hp:c.hp,fuel:c.fuel,recSel:c.recSel,auto:c.auto,oreKind:c.oreKind,lv:cellLevel(c)}:null;
function regionDefaults(){ // дефолты для машин/буров после десериализации
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const g2=grid[y][x];if(!g2)continue;
    if(g2.lv===undefined)g2.lv=g2.level||1;
    if(RECIPES[g2.t]){if(g2.recSel===undefined)g2.recSel=0;if(g2.auto===undefined)g2.auto=true}
    if(g2.t==="miner"&&g2.oreKind===undefined)g2.oreKind=ore[y][x];
  }
}
function serializeRegion(){
  return {nm:S.regionName,map:S.map,w:W,h:H,ore,oreAmt,terr,
    grid:grid.map(r=>r.map(serCell)),drops,animals:animals.map(a=>({x:a.x,y:a.y,k:a.k})),
    worldSkin:S.worldSkin||null,oreSkins:S.oreSkins||null,worldInfo:S.worldInfo||null,gov:currentGov(),
    wave:S.wave,nextWave:S.nextWave};
}
function loadRegion(rg){
  W=rg.w;H=rg.h;S.map=rg.map;S.regionName=rg.nm;
  S.worldSkin=rg.worldSkin||null;S.oreSkins=rg.oreSkins||null;S.worldInfo=rg.worldInfo||null;S.regionGov=ensureGov(rg.gov,S.curRegion||0);S.regionGov.lastVisit=S.tick||0;
  ore=rg.ore;oreAmt=rg.oreAmt||mk();terr=rg.terr;
  grid=rg.grid.map(r=>r.map(c=>c?{...c,rec:null}:null));
  drops=rg.drops||{};
  animals=(rg.animals||[]).map(a=>({x:a.x,y:a.y,k:a.k||0,a:Math.random()*7,t:0,rest:false}));
  if(!animals.length)spawnAnimals(6);
  S.wave=rg.wave||0;S.nextWave=rg.nextWave||S.tick+5400;
  enemies=[];parts=[];
  regionDefaults();seedOreAmounts(1);
  resizeTerrCanvas();terrDirty=true;
  workers.forEach(w=>{w.x=W/2+(Math.random()-0.5)*3;w.y=H/2+(Math.random()-0.5)*3;w.job=null;w.carryCell=null;});
  undoStack.length=0;S.hint=null;
  fitAll();cam.z=1.15;clampCam();
  recomputePower();drawHud();drawGoal();
}
function travelTo(idx){
  if(idx===S.curRegion)return;
  S.regions[S.curRegion]=serializeRegion();
  S.curRegion=idx;
  loadRegion(S.regions[idx]);
  const g=currentGov();
  toast(g.captured?`🤖 Вернулись в захваченную зону: ${S.regionName}`:"🌍 Вернулись: "+S.regionName);
  if(g.captured)say(`🤖 ${S.regionName}: власть бота ${g.bot}%. Роботы считают эту планету своей.`);
  else if(g.bot>0)say(`🟢 ${S.regionName}: ты снова на месте, влияние бота начнёт падать с ${g.bot}%.`);
  snd("research");closeSheet();saveGame();
}
function applyWorldBonus(w,depth){
  (w.bonus||[]).forEach(([kind,blobs,size,mul])=>scatterOre(kind,blobs,size,(mul||1)*(1+depth*.18)));
  seedOreAmounts(1+depth*.15);
  terrDirty=true;
}
function travelNew(targetId){
  const w=worldById(targetId);
  const mapId=w?w.map:targetId;
  S.regions=S.regions||[];
  const oldName=S.regionName||"прошлая планета";
  S.regions[S.curRegion||0]=serializeRegion();
  say(`🛰️ ${oldName}: оставлена авто-администрации. Если долго не возвращаться, власть бота начнёт расти.`);
  S.curRegion=S.regions.length;
  const depth=w?(w.proc?w.depth:w.depth+(S.launches||0)-1):S.curRegion;
  S.worldSkin=w?(w.skin||null):null;
  S.oreSkins=w?(w.oreSkins||null):null;
  S.worldInfo=w?{id:w.id,nm:w.nm,desc:w.desc,res:w.res,codex:w.codex||"",seed:w.seed||0,index:w.index??null}:null;
  S.regionGov=defaultGov(S.curRegion);
  genMap(mapId,depth);S.map=mapId;
  if(w)applyWorldBonus(w,depth);
  S.regionName=w?`${w.nm} · планета ${S.curRegion+1}`:`${MAPS[mapId].nm} · земля ${S.curRegion+1}`;
  S.regions.push(serializeRegion());
  workers.forEach(wrk=>{wrk.x=W/2+(Math.random()-0.5)*3;wrk.y=H/2+(Math.random()-0.5)*3;wrk.job=null;wrk.carryCell=null;});
  enemies=[];undoStack.length=0;S.hint=null;
  fitAll();cam.z=1.15;clampCam();
  if(S.mode==="survival")toast("⚠️ Ядро осталось в родной земле — не бросай его надолго!");
  else toast((w?"🚀 Посадка: ":"🌍 Новая земля: ")+S.regionName+" — свежая руда ждёт");
  snd("research");closeSheet();recomputePower();updateProgression(true);drawHud();saveGame();
}

/* сессии: каждая партия — отдельный сейв, удаляется ТОЛЬКО вручную из меню */
const SESS_KEY="ff.sessions.v1";
function sessionsList(){try{return JSON.parse(localStorage.getItem(SESS_KEY))||[]}catch(e){return[]}}
function writeSessions(l){localStorage.setItem(SESS_KEY,JSON.stringify(l))}
function saveGame(){
  if(!S.started||!S.sessionId)return;
  S.regions=S.regions||[];
  S.regions[S.curRegion||0]=serializeRegion(); // текущая земля — всегда свежая в списке
  const data={w:W,h:H,ore,oreAmt,terr,grid:grid.map(r=>r.map(serCell)),drops,
    workers:workers.map(w=>({x:w.x,y:w.y,spec:w.spec,xp:w.xp,lvl:w.lvl,name:w.name,look:w.look,belly:w.belly,hungry:w.hungry})),
    animals:animals.map(a=>({x:a.x,y:a.y,k:a.k})),
    regions:S.regions,curRegion:S.curRegion||0,regionName:S.regionName,
    worldSkin:S.worldSkin||null,oreSkins:S.oreSkins||null,worldInfo:S.worldInfo||null,regionGov:currentGov(),galaxySeed:S.galaxySeed||ensureGalaxySeed(),scenario:S.scenario||ensureScenario(),
    autoAll:S.autoAll,builtCount:S.builtCount,supplyPct:S.supplyPct,
    inv,made:S.made,goal:S.goal,quest:S.quest,tick:S.tick,
    prestige:S.prestige||0,coreShards:S.coreShards||0,epoch:S.epoch||1,epochReady:S.epochReady||1,bestEpoch:S.bestEpoch||1,coreBuilt:!!S.coreBuilt,launches:S.launches||0,
    mode:S.mode,map:S.map,wave:S.wave,nextWave:S.nextWave,tut:S.tut,techs:TECHS.map(t=>t.done),
    status:S.coreBuilt?"💠":S.win?"🏆":S.over?"💀":"▶"};
  const list=sessionsList();
  const rec={id:S.sessionId,name:S.sessionName,updated:Date.now(),data};
  const i=list.findIndex(s=>s.id===S.sessionId);
  if(i>=0)list[i]=rec;else list.unshift(rec);
  writeSessions(list.slice(0,8));
}
function loadGame(d){
  W=d.w||(d.grid[0]?d.grid[0].length:W0);H=d.h||(d.grid?d.grid.length:H0);
  ore=mk();oreAmt=mk();terr=mk();grid=mk();resizeTerrCanvas();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    ore[y][x]=d.ore[y][x];oreAmt[y][x]=(d.oreAmt&&d.oreAmt[y][x])||0;terr[y][x]=(d.terr&&d.terr[y][x])||null;
    grid[y][x]=d.grid[y][x]?{...d.grid[y][x],rec:null}:null}
  regionDefaults();seedOreAmounts(1); // старые сейвы: руда получает запас, машины — дефолты
  drops=d.drops||{};
  workers=[];
  (d.workers&&d.workers.length?d.workers:[{x:W/2,y:H/2}]).forEach(w=>{
    spawnWorker(w.x-0.5,w.y-0.5);
    const nw=workers[workers.length-1];
    nw.spec=w.spec||"any";nw.xp=w.xp||0;nw.lvl=w.lvl||1;
    if(w.name)nw.name=w.name;if(w.look)nw.look=w.look;
    if(w.belly!=null)nw.belly=w.belly;nw.hungry=!!w.hungry;
  });
  animals=(d.animals||[]).map(a=>({x:a.x,y:a.y,k:a.k||0,a:Math.random()*7,t:0,rest:false}));
  if(!animals.length)spawnAnimals(7);
  S.supplyPct=d.supplyPct??100;
  S.regions=d.regions||[];S.curRegion=d.curRegion||0;
  S.regionName=d.regionName||`${(MAPS[d.map||"valley"]||MAPS.valley).nm} · земля 1`;
  S.galaxySeed=d.galaxySeed||makeGalaxySeed();
  S.scenario=d.scenario||makeScenario(d.map||"valley",d.mode||"peace",S.galaxySeed);
  ensureScenario();
  const curRg=S.regions[S.curRegion]||{};
  S.worldSkin=d.worldSkin||curRg.worldSkin||null;S.oreSkins=d.oreSkins||curRg.oreSkins||null;S.worldInfo=d.worldInfo||curRg.worldInfo||null;S.regionGov=ensureGov(d.regionGov||curRg.gov,S.curRegion||0);
  S.autoAll=d.autoAll!==false;S.builtCount=d.builtCount??grid.flat().filter(c=>c&&c.t!=="belt").length;
  Object.assign(inv,d.inv);Object.assign(S.made,d.made);
  S.goal=d.goal;S.quest=d.quest||0;S.tick=d.tick;S.mode=d.mode;S.map=d.map||"valley";S.wave=d.wave;S.nextWave=d.nextWave;S.tut=d.tut??-1;
  S.prestige=d.prestige||0;S.coreShards=d.coreShards||0;S.epoch=d.epoch||1;S.epochReady=d.epochReady||S.epoch||1;S.bestEpoch=d.bestEpoch||S.epoch||1;S.coreBuilt=!!d.coreBuilt;S.launches=d.launches||0;
  // завершённые партии можно продолжать строить (song-of-factorio); рейтинг уже записан
  S.win=false;S.over=false;
  const savedTechs=d.techs||[];
  TECHS.forEach((t,i)=>t.done=!!savedTechs[i]);
  if(d.epochReady===undefined){
    const real=calcEpochReady();
    if((S.epoch||1)>real)S.epoch=real;
  }
  updateProgression(false);
  terrDirty=true;
}
function startGame(opts){
  S.started=true;S.mode=opts.mode;
  if(opts.session){
    S.sessionId=opts.session.id;S.sessionName=opts.session.name;
    loadGame(opts.session.data);
  }
  else{
    resetMade();resetInventoryForPrestige(0);TECHS.forEach(t=>t.done=false);
    S.goal=0;S.quest=0;S.tick=0;S.wave=0;S.nextWave=5400;S.win=false;S.over=false;
    S.prestige=0;S.coreShards=0;S.epoch=1;S.epochReady=1;S.bestEpoch=1;S.epochSeen=1;S.coreBuilt=false;S.launches=0;S.galaxySeed=makeGalaxySeed();
    S.scenario=makeScenario(opts.map,opts.mode,S.galaxySeed);
    S.sessionId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    S.sessionName=`${MAPS[opts.map].nm} ${opts.mode==="survival"?"⚔️":"🌿"} ${new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}`;
    applyScenarioStart(S.scenario);
    S.map=opts.map;S.worldSkin=null;S.oreSkins=null;S.worldInfo=null;S.regionGov=defaultGov(0);genMap(opts.map);
    S.curRegion=0;S.regions=[];S.regionName=`${MAPS[opts.map].nm} · земля 1`;S.autoAll=true;S.builtCount=0;
    S.tut=opts.tutorial?0:-1;
    if(opts.mode==="survival"){
      const cx0=Math.floor(W/2),cy0=Math.floor(H/2);
      ore[cy0][cx0]=null;terr[cy0][cx0]=null;
      grid[cy0][cx0]={t:"core",dir:0,item:null,prog:0,buf:{},hp:DEFS.core.hp,fuel:0,lv:1};
      S.nextWave=S.tick+5400;
      say("Выживание: защищай 💠 Ядро! Первая волна через 90 сек. Исследуй Оборону для турелей.");
    }
  }
  hideOverlay();closeSheet();closeCtx();closeSmart();clearQuick();
  fitAll();cam.z=1.4;clampCam();
  // камера на стартовую точку: ядро или первая железная залежь
  const tgt=findB("core")||(()=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(ore[y][x]==="iron")return[x,y];return [W/2,H/2]})();
  cam.x=tgt[0]*TS;cam.y=tgt[1]*TS;clampCam();
  if(!opts.session){workers=[];spawnWorker(tgt[0]+1,tgt[1]+1);} // стартовый 🧍 рабочий
  applyZen();recomputePower();updateProgression(false);
  mmapEl.style.display="block";drawMinimap();
  drawGoal();drawHud();tutShow();
  say("Fable Factory: тап по клетке — меню постройки. Все панели — в ⋯ справа снизу.");
  const sc=ensureScenario();
  say(`🎲 Сценарий: ${sc.title} — ${sc.mandate}`);
  toast(opts.session?"Партия продолжена 💾":`🎲 ${sc.title}: ${sc.tag}`);
}
setInterval(()=>{if(!S.win&&!S.over)saveGame()},5000);

/* ---------- ↩️ отмена последнего действия (стройка/снос/поворот/загрузка) ---------- */
let undoStack=[];
const cellCopy=c=>c?{t:c.t,dir:c.dir,item:c.item,prog:c.prog,buf:{...c.buf},hp:c.hp,fuel:c.fuel,recSel:c.recSel,auto:c.auto,lv:cellLevel(c),oreKind:c.oreKind}:null;
function pushU(x,y){undoStack.push({x,y,cell:cellCopy(grid[y][x]),inv:{...inv}});if(undoStack.length>25)undoStack.shift()}
function doUndo(){
  const u=undoStack.pop();
  if(!u)return toast("Нечего отменять");
  grid[u.y][u.x]=u.cell?{...u.cell,rec:null}:null;
  Object.keys(inv).forEach(k=>inv[k]=u.inv[k]??0);
  toast("Отменено ↩️");snd("rotate");
  drawInv();drawHud();
}

/* стартовое меню: сессии (удаление только вручную) / рейтинг / новая партия */
function showMenu(){
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const firstTime=!localStorage.getItem("ff.played");
  const sess=sessionsList();
  const sessRows=sess.map(s=>{
    const d=new Date(s.updated).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
    return `<div style="display:flex;gap:6px;margin-bottom:6px">
      <button class="sRow" data-id="${esc(s.id)}" style="flex:1">${s.data.status||"▶"} ${esc(s.name)}<small>${d} · цель ${(s.data.goal||0)+1} · задание ${(s.data.quest||0)+1}</small></button>
      <button class="sDel" data-id="${esc(s.id)}" style="width:44px;text-align:center">🗑</button></div>`;
  }).join("");
  const mapBtns=Object.entries(MAPS).map(([id,m])=>
    `<button class="mapBtn choiceBtn" data-m="${id}" aria-pressed="false">${m.nm}<small>${m.desc}</small><span class="pickMark">✓ выбрано</span></button>`).join("");
  const o=overlay(`<h2 style="margin-bottom:8px">🏭 Fable Factory</h2>
    ${sess.length?`<div style="font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Мои партии</div>${sessRows}<div style="margin-bottom:8px"></div>`:""}
    <div style="font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Новая партия · карта</div>
    <div style="display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:10px">${mapBtns}</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button id="sPeace" style="flex:1" class="modeBtn choiceBtn armed" aria-pressed="true">🌿 Мирный<span class="pickMark">✓</span></button>
      <button id="sSurv" style="flex:1" class="modeBtn choiceBtn" aria-pressed="false">⚔️ Выживание<span class="pickMark">✓</span></button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="sTut" ${firstTime?"checked":""}> Пошаговое обучение
    </label>
    <div style="display:flex;gap:8px">
      <button id="sGo" style="flex:2;background:linear-gradient(180deg,#f0bc5e,#d08a2c);color:#241a08;font-weight:700;border:none;text-align:center">Играть</button>
      <button id="sRate" style="flex:1;text-align:center">🏅 Рейтинг</button>
    </div>`);
  let map="valley",mode="peace";
  const mb=[...o.querySelectorAll(".mapBtn")];
  const setMap=id=>{map=id;mb.forEach(b=>{const on=b.dataset.m===id;b.classList.toggle("armed",on);b.setAttribute("aria-pressed",on?"true":"false")})};
  mb.forEach(b=>b.onclick=()=>setMap(b.dataset.m));
  setMap("valley");
  const pe=o.querySelector("#sPeace"),su=o.querySelector("#sSurv");
  const setMode=id=>{mode=id;const peace=id==="peace";pe.classList.toggle("armed",peace);su.classList.toggle("armed",!peace);pe.setAttribute("aria-pressed",peace?"true":"false");su.setAttribute("aria-pressed",peace?"false":"true")};
  pe.onclick=()=>setMode("peace");
  su.onclick=()=>setMode("survival");
  o.querySelectorAll(".sRow").forEach(b=>b.onclick=()=>{
    const s=sessionsList().find(x=>x.id===b.dataset.id);
    if(s){localStorage.setItem("ff.played","1");startGame({mode:s.data.mode,session:s})}
  });
  o.querySelectorAll(".sDel").forEach(b=>b.onclick=()=>{
    if(b.textContent!=="точно?"){b.textContent="точно?";setTimeout(()=>{b.textContent="🗑"},2500);return}
    writeSessions(sessionsList().filter(x=>x.id!==b.dataset.id));
    showMenu(); // перерисовать
  });
  o.querySelector("#sRate").onclick=()=>{
    const rows=ratingList().map((r,i)=>
      `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:.5px solid rgba(255,255,255,.07)">
        <span>${i+1}. ${r.result==="won"?"🏆":"💀"} ${esc(r.name)}</span>
        <span style="font-variant-numeric:tabular-nums"><b>${+r.score||0}</b> · 🧪${+r.science||0} · 🌊${+r.waves||0}</span></div>`).join("");
    overlay(`<h2 style="margin-bottom:10px">🏅 Рейтинг</h2>
      ${rows||'<p style="color:var(--dim)">Пока пусто — доиграй партию до победы или поражения.</p>'}
      <button style="width:100%;margin-top:14px;text-align:center" onclick="showMenu()">← Назад</button>`);
  };
  o.querySelector("#sGo").onclick=()=>{
    localStorage.setItem("ff.played","1");
    startGame({mode,map,tutorial:o.querySelector("#sTut").checked});
  };
}
showMenu();

/* симуляция по реальному времени + рендер */
let last=performance.now();
setInterval(()=>{
  const now=performance.now();
  const steps=Math.min(120,Math.floor((now-last)/(1000/60)));
  for(let i=0;i<steps;i++)step();
  if(steps>0)last+=steps*(1000/60);
},50);
(function raf(){render();requestAnimationFrame(raf)})();
</script>
</body>
</html>
