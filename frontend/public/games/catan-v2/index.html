<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hexland</title>
    <script type="module" crossorigin src="./assets/index-BPcBGK06.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BmqFvjT1.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="noise"></div>
      <header class="topbar glass">
        <div class="tg-user">
          <img id="userAvatar" alt="avatar" />
          <div>
            <span class="eyebrow">Telegram connected</span>
            <strong id="username"></strong>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn layout-btn" id="layoutModeBtn">iPad</button>
          <button class="icon-btn" id="notifyBtn">⚡<span class="badge">3</span></button>
        </div>
      </header>

      <main id="screen" class="screen"></main>

      <nav class="tabbar glass">
        <button class="tab-handle" id="tabHandle" title="Двигать / свернуть" aria-label="Двигать или свернуть меню">⋮</button>
        <button class="tab active" data-route="home">⌂<span>Home</span></button>
        <button class="tab" data-route="play">⬢<span>Table</span></button>
        <button class="tab" data-route="friends">◉<span>Friends</span></button>
        <button class="tab" data-route="rating">★<span>Rating</span></button>
        <button class="tab" data-route="season">✦<span>Season</span></button>
      </nav>
    </div>

    <div id="toast" class="toast"></div>
  </body>
</html>
