<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ea6e8"/>
      <stop offset="0.65" stop-color="#8fd0f2"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#5e3c18"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="1" stop-color="#ffe680"/>
    </radialGradient>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="115" ry="115"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="120" cy="130" r="52" fill="url(#sun)"/>
    <!-- hill -->
    <path d="M -20 360 C 90 300 170 300 256 340 C 340 380 430 360 532 320 L 532 532 L -20 532 Z" fill="url(#dirt)"/>
    <path d="M -20 360 C 90 300 170 300 256 340 C 340 380 430 360 532 320" fill="none" stroke="#5fa832" stroke-width="26"/>
    <path d="M -20 360 C 90 300 170 300 256 340 C 340 380 430 360 532 320" fill="none" stroke="#7bc94a" stroke-width="10"/>

    <!-- car -->
    <g transform="translate(232 322) rotate(-9)">
      <rect x="-78" y="-30" width="156" height="46" rx="14" fill="#e14b2a"/>
      <rect x="-34" y="-64" width="82" height="42" rx="10" fill="#c33d1f"/>
      <rect x="-22" y="-56" width="54" height="26" rx="6" fill="#bfeaff"/>
      <circle cx="-48" cy="22" r="34" fill="#1c1c1c"/>
      <circle cx="-48" cy="22" r="14" fill="#cfcfcf"/>
      <circle cx="52" cy="22" r="34" fill="#1c1c1c"/>
      <circle cx="52" cy="22" r="14" fill="#cfcfcf"/>
    </g>

    <!-- glossy acrylic highlight -->
    <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#gloss)"/>
    <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
