function drawBullet(b){
  cx.save(); cx.translate(b.x,b.y);
  if(b.kind==='saberThrow'){
    // ghost-трейл летящего меча
    for(let k=1;k<=2;k++){
      cx.save(); cx.translate(-b.vx*0.014*k,-b.vy*0.014*k); cx.rotate(b.spin-0.4*k);
      cx.globalAlpha=0.16/k; cx.fillStyle=b.ev?'#7dff6a':'#4db2ff'; cx.fillRect(-16,-2,32,4);
      cx.restore();
    }
    cx.rotate(b.spin);
    cx.shadowColor=b.ev?'#7dff6a':'#4db2ff'; cx.shadowBlur=10;
    cx.fillStyle=b.ev?'#7dff6a':'#4db2ff';
    cx.fillRect(-16,-2,32,4);
    cx.shadowBlur=0;
    cx.fillStyle='#eaffea'; cx.fillRect(-14,-0.8,28,1.6);
    cx.fillStyle='#9aa5b5'; cx.fillRect(-4,-2.5,8,5);
  } else if(b.kind==='shard'){
    // светящийся хвост
    cx.globalAlpha=0.25; cx.strokeStyle=b.ev?'#e9b8ff':'#9fd4ff'; cx.lineWidth=3; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(-b.vx*0.03,-b.vy*0.03); cx.lineTo(0,0); cx.stroke();
    cx.globalAlpha=1;
    const a=Math.atan2(b.vy,b.vx); cx.rotate(a);
    cx.shadowColor='#c9f'; cx.shadowBlur=8;
    cx.fillStyle=b.ev?'#e9b8ff':'#bfe3ff';
    cx.beginPath(); cx.moveTo(8,0); cx.lineTo(-6,-4); cx.lineTo(-3,0); cx.lineTo(-6,4); cx.closePath(); cx.fill();
    cx.shadowBlur=0;
  } else if(b.kind==='nade'){
    const k=b.t/b.tMax;
    const x=lerp(b.sx,b.tx,k)-b.x, y=lerp(b.sy,b.ty,k)-b.y - Math.sin(k*Math.PI)*90;
    cx.translate(x,y);
    cx.fillStyle='#8892a5'; cx.beginPath(); cx.arc(0,0,6,0,TAU); cx.fill();
    cx.fillStyle=Math.sin(G.time*20)>0?'#ff4b4b':'#701818';
    cx.beginPath(); cx.arc(0,-2,2,0,TAU); cx.fill();
    // target marker
    cx.restore(); cx.save(); cx.translate(b.tx,b.ty);
    cx.strokeStyle='rgba(255,120,80,.5)'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(0,0,b.R*0.35+Math.sin(G.time*8)*4,0,TAU); cx.stroke();
  } else if(b.kind==='wave'){
    cx.strokeStyle='rgba(120,210,255,.8)'; cx.lineWidth=5; cx.lineCap='round';
    const dir=Math.sign(b.vx)||1;
    cx.beginPath(); cx.arc(0,0,b.r,-1.1,1.1); cx.stroke();
    cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(0,0,b.r*0.8,-1.0,1.0); cx.stroke();
  }
  cx.restore();
}

const el=id=>document.getElementById(id);
const menuEl=el('menu'), endEl=el('endscr'), shopEl=el('shop'), pausedEl=el('paused'),
      settingsEl=el('settings'), hudEl=el('hud');
function goFullscreen(){
  const d=document.documentElement;
  try{ if(d.requestFullscreen) d.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
       else if(d.webkitRequestFullscreen) d.webkitRequestFullscreen(); }catch(e){}
}
function startRun(){
  goFullscreen();
  newGame();
  menuEl.classList.add('hidden'); settingsEl.classList.add('hidden');
  endEl.classList.add('hidden'); hudEl.classList.remove('hidden');
  music.currentTime=0;
  music.play().catch(()=>{});
}
function endRun(win){
  if(G.state==='dead') return;
  G.state='dead';
  checkAchs();
  luEl.classList.add('hidden'); pausedEl.classList.add('hidden');
  save.gold+=G.goldRun-(G.goldCredited||0);
  G.goldCredited=G.goldRun;
  save.best=Math.max(save.best,G.time);
  save.bestKills=Math.max(save.bestKills,G.killCount);
  // итоги: при продолжении в бесконечном режиме зачитываем только дельту
  save.stats.kills+=G.killCount-(G.killsCredited||0); G.killsCredited=G.killCount;
  save.stats.timePlayed+=G.time-(G.timeCredited||0); G.timeCredited=G.time;
  if(!G.statsCredited){ G.statsCredited=true; save.stats.runs++; }
  save.stats.maxLvl=Math.max(save.stats.maxLvl,G.p.lvl);
  persist();
  el('contBtn').classList.toggle('hidden', !win);
  el('endTitle').textContent = win? '🏆 ТЫ ПЕРЕЖИЛ ОСАДУ!' : '💀 ТЫ СТАЛ ЕДИНЫМ С СИЛОЙ';
  el('endTitle').style.color = win? '#7dffa0' : '#ff5b5b';
  const wl=G.p.weapons.map(w=>WEAPONS[w.id].ico+(w.evolved?'🔥':'')).join(' ');
  el('endStats').innerHTML =
    'Время: <b>'+fmtTime(G.time)+'</b> &nbsp; Уровень: <b>'+G.p.lvl+'</b><br>'+
    'Убито имперцев: <b>'+G.killCount+'</b>'+(G.vaderKilled?' &nbsp;·&nbsp; <b style="color:#ff8d6b">Вейдер повержен ⚔️</b>':'')+'<br>'+
    'Арсенал: '+wl+'<br>'+
    'Заработано: <b>🪙 '+G.goldRun+'</b> (всего: '+save.gold+')';
  endEl.classList.remove('hidden'); hudEl.classList.add('hidden');
  music.pause();
}
function renderPauseInfo(){
  if(!G) return;
  const p=G.p, boss=G.bossRef&&G.bossRef.hp>0?G.bossRef:null;
  const stats=[
    ['Время',fmtTime(G.time)],
    ['Уровень',p.lvl],
    ['Опыт',Math.floor(p.xp)+' / '+p.xpNext],
    ['Убийства',G.killCount],
    ['Золото за забег','🪙 '+G.goldRun],
    ['HP',Math.ceil(p.hp)+' / '+Math.ceil(p.hpMax)]
  ];
  if(boss) stats.push(['Босс',Math.ceil(boss.hp)+' / '+Math.ceil(boss.hpMax)]);
  stats.push(['Урон','×'+p.might.toFixed(2)],['Броня',p.armor],['Скорость',Math.round(p.speed)],['Область','×'+p.area.toFixed(2)],['Удача','×'+p.luck.toFixed(2)],['Воскрешений',p.revives]);
  el('pauseStats').innerHTML=stats.map(([k,v])=>'<div class="pause-stat">'+k+'<b>'+v+'</b></div>').join('');
  const pips=(cur,max,color)=>{
    let s='';
    for(let i=0;i<max;i++) s+='<span style="color:'+(i<cur?color:'#3a4770')+'">●</span>';
    return s;
  };
  // ветка оружия: уровень + условие эволюции
  const weapons=p.weapons.map(w=>{
    const wd=WEAPONS[w.id], pairId=wd.pair, pairOwn=(p.passives[pairId]||0)>0;
    let line=wd.ico+' <b>'+(w.evolved?EVOS[w.id].nm:wd.nm)+'</b> '+(w.evolved?'<span style="color:#ff8d6b">🔥 ЭВОЛЮЦИЯ</span>':pips(w.lvl,8,'#5ec8ff'));
    if(!w.evolved){
      line+='<br><span style="color:#66719b;font-size:11px">→ '+EVOS[w.id].nm+': ур. 8 '+(w.lvl>=8?'✅':'('+w.lvl+'/8)')+
        ' + '+PASSIVES[pairId].ico+' '+PASSIVES[pairId].nm+' '+(pairOwn?'✅':'❌')+' + 📦 сундук</span>';
    }
    return line;
  }).join('<br>');
  const passives=Object.entries(p.passives).map(([id,lvl])=>
    PASSIVES[id].ico+' '+PASSIVES[id].nm+' '+pips(lvl,PASSIVES[id].max,'#7dffa0')).join('<br>');
  el('pauseBuild').innerHTML='<b>⚔️ ОРУЖИЕ И ВЕТКА ЭВОЛЮЦИЙ</b> ('+p.weapons.length+'/6)<br>'+weapons+
    (passives?'<br><br><b>🧬 ПАССИВНЫЕ НАВЫКИ</b><br>'+passives:'')+
    '<br><br><span style="color:#66719b;font-size:11px">Эволюция выпадает из сундука элиты, когда оружие 8 ур. и есть парный навык — как в Vampire Survivors.</span>';
}

    d.className='sel-card'+(save.selChar===id?' on':'')+(!owned?' lock':'');
    d.innerHTML='<span class="ic">'+c.ico+'</span><b>'+c.nm+'</b><br>'+
      (owned?c.bonus:(achOk?'<span class="pr">🪙 '+c.cost+'</span>':'🔒 '+((ACHS.find(a=>a.id===c.ach)||{}).nm||'достижение')));
    d.onclick=()=>{
      if(owned){ save.selChar=id; persist(); renderMenuMeta(); }
      else if(achOk&&save.gold>=c.cost){ save.gold-=c.cost; save.chars[id]=true; save.selChar=id; persist(); S.chest(); renderMenuMeta(); updateRec(); }
      else S.hurt();
    };
    cr.appendChild(d);
  }
  const sr=el('stageRow'); sr.innerHTML='';
  const stages=[['tatooine','🏜','Татуин','классика',true],['hoth','❄️','Хот','+25% сложность и награды',!!save.achs.surv15]];
  for(const [id,ic,nm,ds,unl] of stages){
    const d=document.createElement('div');
    d.className='sel-card'+(save.selStage===id&&unl?' on':'')+(!unl?' lock':'');
    d.innerHTML='<span class="ic">'+ic+'</span><b>'+nm+'</b><br>'+(unl?ds:'🔒 выживи 15 минут');
    d.onclick=()=>{ if(unl){ save.selStage=id; persist(); renderMenuMeta(); } else S.hurt(); };
    sr.appendChild(d);
  }
  if(save.achs.win){
    const d=document.createElement('div');
    d.className='sel-card'+(save.hyper?' on':'');
    d.innerHTML='<span class="ic">⚡</span><b>Гипер</b><br>'+(save.hyper?'враги быстрее, награды ×1.5':'выкл');
    d.onclick=()=>{ save.hyper=!save.hyper; persist(); renderMenuMeta(); };
    sr.appendChild(d);
  }
}
function renderCollection(){
  const st=save.stats;
  let html='<b>🏆 ДОСТИЖЕНИЯ</b> ('+ACHS.filter(a=>save.achs[a.id]).length+'/'+ACHS.length+')<br>';
  html+=ACHS.map(a=>(save.achs[a.id]?'✅':'⬜')+' <b>'+a.nm+'</b> <span style="color:#66719b">→ '+a.rw+'</span>').join('<br>');
  html+='<br><br><b>📖 БЕСТИАРИЙ</b><br>';
  const seen=Object.entries(st.perEnemy||{}).filter(([k])=>k!=='crate'&&ENEMY_NAMES[k]);
  html+=seen.length?seen.sort((a,b)=>b[1]-a[1]).map(([k,v])=>ENEMY_NAMES[k]+' — <b>'+v+'</b>').join('<br>'):'<span style="color:#66719b">пока никого не встретил</span>';
  html+='<br><br><b>📊 ИТОГИ</b><br>Забегов: <b>'+st.runs+'</b> · Убийств: <b>'+st.kills+'</b><br>'+
    'Времени в бою: <b>'+fmtTime(st.timePlayed)+'</b> · Макс. уровень: <b>'+st.maxLvl+'</b>';
  el('collBody').innerHTML=html;
}
el('collBtn').onclick=()=>{ renderCollection(); menuEl.classList.add('hidden'); el('collection').classList.remove('hidden'); };
el('collBack').onclick=()=>{ el('collection').classList.add('hidden'); menuEl.classList.remove('hidden'); };
el('contBtn').onclick=()=>{
  if(!G) return;
  G.endless=true; G.state='playing';
  endEl.classList.add('hidden'); hudEl.classList.remove('hidden');
  music.play().catch(()=>{});
};
el('startBtn').onclick=startRun;
el('againBtn').onclick=startRun;
el('menuBtn').onclick=toMenu;
el('pauseBtn').onclick=()=>{ if(G&&G.state==='playing') pauseGame(); else resumeGame(); };
el('resumeBtn').onclick=resumeGame;
el('quitBtn').onclick=toMenu;
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });

/* settings */
let settingsFrom='menu';
function renderSettings(){
  el('zoomRange').value=String(cameraZoom());
  el('zoomValue').textContent=Math.round(cameraZoom()*100)+'%';
  el('soundBtn').textContent=muted?'🔇 Звук: выключен':'🔊 Звук: включён';
  el('shakeBtn').textContent=save.settings.shake?'📳 Тряска экрана: включена':'📴 Тряска экрана: выключена';
  el('ecoBtn').textContent=save.settings.eco?'🔋 Экономия батареи: вкл':'🪫 Экономия батареи: выкл';
}
function setZoom(v){
  save.settings.zoom=clamp(Math.round(v*20)/20,0.5,1);
  persist(); renderSettings();
}
function openSettings(from){
  settingsFrom=from;
  if(from==='pause') pausedEl.classList.add('hidden');
  else menuEl.classList.add('hidden');
  renderSettings(); settingsEl.classList.remove('hidden');
}
function closeSettings(){
  settingsEl.classList.add('hidden');
  if(settingsFrom==='pause'){ renderPauseInfo(); pausedEl.classList.remove('hidden'); }
  else menuEl.classList.remove('hidden');
}
el('settingsMenuBtn').onclick=()=>openSettings('menu');
el('settingsPauseBtn').onclick=()=>openSettings('pause');
el('settingsBackBtn').onclick=closeSettings;
el('zoomRange').oninput=e=>{
  save.settings.zoom=clamp(Number(e.target.value)||0.5,0.5,1);
  el('zoomValue').textContent=Math.round(save.settings.zoom*100)+'%';
  persist();
};
el('soundBtn').onclick=()=>{
  muted=!muted; save.settings.muted=muted; music.muted=muted; persist(); renderSettings();
};
el('shakeBtn').onclick=()=>{
  save.settings.shake=!save.settings.shake; persist(); renderSettings();
};
el('zoomMinus').onclick=()=>setZoom(cameraZoom()-0.05);
el('zoomPlus').onclick=()=>setZoom(cameraZoom()+0.05);
el('ecoBtn').onclick=()=>{
  save.settings.eco=!save.settings.eco; persist(); resize(); renderSettings();
};

/* shop */
function renderShop(){
  el('shopGold').textContent='🪙 '+save.gold;
  const box=el('shopItems'); box.innerHTML='';
  for(const m of META){
    const r=save.meta[m.id]||0;
    const d=document.createElement('div'); d.className='shopItem'+(r>=m.max?' max':'');
    d.innerHTML='<div class="ico">'+m.ico+'</div><div class="nm">'+m.nm+'</div>'+
      '<div class="rk">'+'★'.repeat(r)+'☆'.repeat(m.max-r)+'</div>'+
      '<div style="color:#93a1c4;font-size:11px;margin-top:3px">'+m.desc+'</div>'+
      '<div class="cost">'+(r>=m.max?'МАКС':'🪙 '+m.cost(r))+'</div>';
    d.onclick=()=>{
      if(r>=m.max) return;
      const c=m.cost(r);
      if(save.gold>=c){ save.gold-=c; save.meta[m.id]=r+1; persist(); S.pick(); renderShop(); }
      else S.hurt();
    };
    box.appendChild(d);
  }
}
el('shopBtn').onclick=()=>{ renderShop(); menuEl.classList.add('hidden'); shopEl.classList.remove('hidden'); };
el('shopBack').onclick=()=>{ shopEl.classList.add('hidden'); menuEl.classList.remove('hidden'); updateRec(); renderMenuMeta(); };
updateRec(); renderMenuMeta();

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(G){
    // хитстоп: короткая заморозка мира на крит/убийство босса
    if(G.state==='playing'){
      if(G.hitStop>0) G.hitStop-=dt;
      else update(dt);
    }
    // затухание толчка камеры и zoom-пульса
    G.kickX*=Math.pow(0.002,dt); G.kickY*=Math.pow(0.002,dt);
    if(G.zoomPulse>0) G.zoomPulse=Math.max(0,G.zoomPulse-dt*0.2);
    if(G.state!=='dead'||true) draw();
  } else {
    // menu backdrop: starfield
    cx.fillStyle='#05070f'; cx.fillRect(0,0,W,H);
    for(let i=0;i<90;i++){
      const x=hash2(i,7)*W, y=(hash2(i,13)*H+now*0.01*(0.3+hash2(i,3)))%H;
      cx.fillStyle='rgba(255,255,255,'+(0.2+hash2(i,5)*0.6)+')';
      cx.fillRect(x,y,hash2(i,9)>0.9?2:1,hash2(i,9)>0.9?2:1);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
