<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jedi Survivors</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',system-ui,sans-serif; touch-action:none; overscroll-behavior:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; color:#fff; text-align:center; }
  .hidden { display:none !important; }

  /* ---- Menu ---- */
  #menu { background:radial-gradient(ellipse at 50% 30%, #1a2340 0%, #05070f 70%); }
  #menu h1 { font-size:min(11vw,64px); letter-spacing:4px; font-weight:900;
    background:linear-gradient(180deg,#9fd8ff,#3fa9f5 45%,#0b5fa5); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(63,169,245,.35); margin-bottom:2px; }
  #menu .sub { color:#ffd76a; letter-spacing:6px; font-size:min(3.4vw,15px); margin-bottom:22px; text-transform:uppercase; }
  .btn { cursor:pointer; user-select:none; border:none; color:#fff; font-weight:700; border-radius:14px; font-family:inherit; }
  .btn-big { font-size:min(5.5vw,24px); padding:14px 54px; margin:7px;
    background:linear-gradient(180deg,#4db2ff,#1567c4); box-shadow:0 6px 24px rgba(38,132,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn-big:active { transform:scale(.96); }
  .btn-sec { font-size:min(4vw,17px); padding:11px 34px; margin:6px; background:#232c45; border:1px solid #3a4770; }
  #menu .rec { color:#8b98b8; font-size:13px; margin-top:14px; }
  .menu-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .sel-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; max-width:94vw; }
  .sel-card { cursor:pointer; user-select:none; background:#161e36; border:1.5px solid #3a4770; border-radius:12px;
    padding:7px 10px; text-align:center; min-width:64px; color:#c8d7f4; font-size:11px; line-height:1.3; }
  .sel-card .ic { font-size:22px; display:block; }
  .sel-card.on { border-color:#4db2ff; background:#1b2a4d; box-shadow:0 0 14px rgba(77,178,255,.35); }
  .sel-card.lock { opacity:.55; }
  .sel-card .pr { color:#ffd76a; }
  .sel-card:active { transform:scale(.95); }
  .lu-act { font-size:13px !important; padding:9px 16px !important; }
  #menu footer { position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); color:#66719b; font-size:12px; }
  #menu footer a { color:#8fbaff; text-decoration:none; font-weight:600; }

  /* ---- Level up / chest ---- */
  #levelup { background:rgba(3,6,14,.82); backdrop-filter:blur(3px); z-index:30; }
  #levelup h2 { color:#ffd76a; font-size:min(6vw,28px); letter-spacing:2px; margin-bottom:16px; text-shadow:0 0 24px rgba(255,215,106,.4); }
  #cards { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .card { width:min(29vw,210px); min-width:150px; background:linear-gradient(180deg,#1b2440,#10162b); border:1px solid #3a4770; border-radius:14px;
    padding:14px 12px; cursor:pointer; text-align:center; transition:transform .12s, border-color .12s; position:relative; }
  .card:hover { transform:translateY(-4px); border-color:#4db2ff; }
  .card .ico { font-size:38px; line-height:1.1; filter:drop-shadow(0 0 10px rgba(77,178,255,.5)); }
  .card .nm { color:#fff; font-weight:700; font-size:15px; margin:7px 0 3px; }
  .card .lv { color:#ffd76a; font-size:12px; margin-bottom:6px; }
  .card .ds { color:#93a1c4; font-size:12px; line-height:1.35; }
  .card.evo { border-color:#ff5b5b; background:linear-gradient(180deg,#39182a,#160a14); }
  .card.evo .nm { color:#ff8d6b; }
  .card.new-w .lv { color:#7dffa0; }

  /* ---- Death / win ---- */
  #endscr { background:rgba(3,6,14,.9); z-index:35; }
  #endscr h2 { font-size:min(9vw,44px); margin-bottom:8px; }
  #endscr .stats { color:#aab6d8; font-size:16px; line-height:1.8; margin:10px 0 18px; }
  #endscr .stats b { color:#ffd76a; }

  /* ---- Shop ---- */
  #shop { background:rgba(3,6,14,.94); z-index:32; }
  #shop h2 { color:#ffd76a; margin-bottom:4px; font-size:24px; letter-spacing:2px;}
  #shop .gold { color:#ffd76a; font-size:16px; margin-bottom:14px; }
  #shopItems { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:92vw; }
  .shopItem { background:#161e36; border:1px solid #3a4770; border-radius:12px; padding:12px; width:150px; cursor:pointer; }
  .shopItem .ico { font-size:26px; }
  .shopItem .nm { color:#fff; font-size:13px; font-weight:700; margin:4px 0; }
  .shopItem .rk { color:#7dffa0; font-size:12px; }
  .shopItem .cost { color:#ffd76a; font-size:12px; margin-top:4px; }
  .shopItem.max .cost { color:#66719b; }
  .shopItem:active { transform:scale(.96); }

  /* ---- Pause / settings ---- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #pauseBtn { pointer-events:auto; position:fixed; top:calc(64px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right));
    width:44px; height:44px; border-radius:13px;
    background:rgba(10,16,34,.72); border:1px solid #3a4770; color:#cfe0ff; font-size:18px; cursor:pointer; }
  #paused, #settings { background:rgba(3,6,14,.9); backdrop-filter:blur(8px); z-index:31; padding:24px 16px; }
  #paused h2, #settings h2 { color:#fff; margin-bottom:14px; font-size:28px; letter-spacing:3px; }
  .pause-panel, .settings-panel { width:min(420px,94vw); max-height:82vh; overflow:auto;
    padding:16px; border-radius:18px; background:rgba(18,27,50,.88); border:1px solid #3a4770;
    box-shadow:0 18px 60px rgba(0,0,0,.38); }
  .pause-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px; text-align:left; }
  .pause-stat { padding:10px; border-radius:12px; background:rgba(7,12,27,.72); color:#9fb0d8; font-size:11px; }
  .pause-stat b { display:block; margin-top:3px; color:#fff; font-size:15px; }
  .pause-build { margin:10px 0 14px; color:#c8d7f4; font-size:12px; line-height:1.55; text-align:left; }
  .settings-row { margin:14px 0; padding:13px; border-radius:14px; background:rgba(7,12,27,.72); text-align:left; }
  .settings-row label { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; color:#dce8ff; font-size:13px; font-weight:700; }
  .settings-row input[type=range] { width:100%; accent-color:#5ec8ff; }
  .settings-actions { display:grid; gap:8px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="pauseBtn">⏸</button>
</div>

<div id="menu" class="overlay">
  <h1>JEDI SURVIVORS</h1>
  <div class="sub">выживи в атаке Империи</div>
  <div id="charRow" class="sel-row"></div>
  <div id="stageRow" class="sel-row"></div>
  <button class="btn btn-big" id="startBtn">▶ ИГРАТЬ</button>
  <div class="menu-row">
    <button class="btn btn-sec" id="shopBtn">🏛 Академия</button>
    <button class="btn btn-sec" id="collBtn">📚 Коллекция</button>
    <button class="btn btn-sec" id="settingsMenuBtn">⚙️</button>
  </div>
  <div class="rec" id="recLine"></div>
  <footer>Powered by <a href="https://t.me/Denrech" target="_blank" rel="noopener noreferrer">@Denrech</a></footer>
</div>

<div id="levelup" class="overlay hidden">
  <h2 id="luTitle">НОВЫЙ УРОВЕНЬ!</h2>
  <div id="cards"></div>
  <div id="luActions" class="hidden" style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center"></div>
</div>

<div id="paused" class="overlay hidden">
  <div class="pause-panel">
    <h2>ПАУЗА</h2>
    <div id="pauseStats" class="pause-stats"></div>
    <div id="pauseBuild" class="pause-build"></div>
    <button class="btn btn-big" id="resumeBtn">Продолжить</button>
    <button class="btn btn-sec" id="settingsPauseBtn">⚙️ Настройки</button>
    <button class="btn btn-sec" id="quitBtn">Выйти в меню</button>
  </div>
</div>

<div id="settings" class="overlay hidden">
  <div class="settings-panel">
    <h2>НАСТРОЙКИ</h2>
    <div class="settings-row">
      <label for="zoomRange"><span>Масштаб камеры</span><span id="zoomValue">50%</span></label>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-sec" id="zoomMinus" style="padding:6px 16px;font-size:20px;line-height:1">−</button>
        <input id="zoomRange" type="range" min="0.5" max="1" step="0.05" value="0.5" style="flex:1">
        <button class="btn btn-sec" id="zoomPlus" style="padding:6px 16px;font-size:20px;line-height:1">+</button>
      </div>
    </div>
    <div class="settings-actions">
      <button class="btn btn-sec" id="soundBtn">🔊 Звук: включён</button>
      <button class="btn btn-sec" id="shakeBtn">📳 Тряска экрана: включена</button>
      <button class="btn btn-sec" id="ecoBtn">🔋 Экономия батареи: выкл</button>
      <button class="btn btn-big" id="settingsBackBtn">← Назад</button>
    </div>
  </div>
</div>

<div id="endscr" class="overlay hidden">
  <h2 id="endTitle">ТЫ ПАЛ…</h2>
  <div class="stats" id="endStats"></div>
  <button class="btn btn-big hidden" id="contBtn" style="background:linear-gradient(180deg,#b06aff,#6a2fc4)">♾ Продолжить бесконечно</button>
  <button class="btn btn-big" id="againBtn">⟳ Ещё раз</button>
  <button class="btn btn-sec" id="menuBtn">В меню</button>
</div>

<div id="collection" class="overlay hidden">
  <div class="pause-panel">
    <h2 style="color:#ffd76a;letter-spacing:2px">📚 КОЛЛЕКЦИЯ</h2>
    <div id="collBody" class="pause-build"></div>
    <button class="btn btn-big" id="collBack">← Назад</button>
  </div>
</div>

<div id="shop" class="overlay hidden">
  <h2>🏛 АКАДЕМИЯ</h2>
  <div class="gold" id="shopGold"></div>
  <div id="shopItems"></div>
  <button class="btn btn-sec" id="shopBack" style="margin-top:16px">← Назад</button>
</div>

<script>
'use strict';
/* ============================================================
   JEDI SURVIVORS — Vampire Survivors-like, Star Wars flavored
   ============================================================ */
const cv = document.getElementById('game');
const cx = cv.getContext('2d',{alpha:false,desynchronized:true});
function ecoOn(){ try{ return !!save.settings.eco; }catch(e){ return false; } }
let W=0,H=0,DPR=1;
function resize(){
  // Telegram WebView sometimes reports DPR=1 and then scales the canvas,
  // which makes vector graphics and HUD text visibly blurry.
  // Эко-режим: рендерим меньше пикселей — телефон греется заметно меньше.
  DPR = ecoOn() ? Math.min(window.devicePixelRatio||1, 1.35)
                : Math.min(Math.max(window.devicePixelRatio||1, 2), 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.imageSmoothingEnabled=true;
  cx.imageSmoothingQuality='high';
}
window.addEventListener('resize', resize); resize();
document.addEventListener('selectionstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('dragstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});

/* ---------- utils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177|0;return ((h^(h>>16))>>>0)/4294967296;}
const TAU=Math.PI*2;
function fmtTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':' + (s<10?'0':'')+s;}

/* ---------- audio ---------- */
const music = new Audio('music.mp3'); music.loop=true; music.volume=0.45;
let actx=null, muted=false;
function sfx(freq,dur,type='square',vol=0.08,slide=0){
  if(muted) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const S={
  hit:()=>sfx(200,0.08,'sawtooth',0.05,-120),
  hurt:()=>sfx(110,0.25,'sawtooth',0.12,-60),
  gem:()=>sfx(880,0.07,'square',0.045,300),
  lvl:()=>{sfx(523,0.12,'square',0.09);setTimeout(()=>sfx(659,0.12,'square',0.09),110);setTimeout(()=>sfx(784,0.2,'square',0.09),220);},
  saber:()=>sfx(90,0.15,'sawtooth',0.06,160),
  zap:()=>sfx(1400,0.1,'sawtooth',0.05,-900),
  boom:()=>sfx(70,0.4,'sawtooth',0.14,-40),
  chest:()=>{sfx(659,0.1,'square',0.08);setTimeout(()=>sfx(880,0.1,'square',0.08),100);setTimeout(()=>sfx(1046,0.25,'square',0.08),200);},
  pick:()=>sfx(660,0.09,'triangle',0.07,200),
};

/* ---------- meta save ---------- */
const SAVE_KEY='jediSurvSave1';
let save={gold:0,best:0,bestKills:0,meta:{},settings:{zoom:0.5,muted:false,shake:true}};
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s) save=Object.assign(save,s);}catch(e){}
save.settings=Object.assign({zoom:0.5,muted:false,shake:true},save.settings||{});
save.settings.zoom=clamp(Number(save.settings.zoom)||0.5,0.5,1);
muted=!!save.settings.muted;
music.muted=muted;
function persist(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){} }
function cameraZoom(){ return clamp(Number(save.settings.zoom)||0.5,0.5,1); }
/* --- прогрессия как в VS: герои, достижения, этапы, бестиарий --- */
save.chars=Object.assign({obiwan:true},save.chars||{});
save.selChar=save.chars[save.selChar]?save.selChar:'obiwan';
save.achs=save.achs||{};
save.stats=Object.assign({kills:0,timePlayed:0,runs:0,maxLvl:0,perEnemy:{}},save.stats||{});
save.selStage=save.selStage||'tatooine';
save.hyper=!!save.hyper;
// миграция: ветераны до системы достижений получают их по своим рекордам
if(save.best>=300) save.achs.surv5=true;
if(save.best>=900) save.achs.surv15=true;
if(save.best>=1200) save.achs.surv20=true;
if(save.bestKills>=500) save.achs.kills500=true;
if(save.best>=420) save.achs.chests3=true;
if(save.best>=1799) save.achs.win=true;

const CHARS={
  obiwan:{ico:'🧙‍♂️',nm:'Оби-Ван',weapon:'saber',  bonus:'+2 брони, +10% урона',cost:0},
  grogu: {ico:'👶',  nm:'Грогу',  weapon:'push',   bonus:'+15% скорости, −8% перезарядки',cost:800},
  ahsoka:{ico:'👩‍🎤',nm:'Асока',  weapon:'throw',  bonus:'+1 снаряд ко всем атакам',cost:1200,ach:'evo1'},
  han:   {ico:'🔫',  nm:'Хан Соло',weapon:'shards', bonus:'+30% удачи, +25% золота',cost:1500,ach:'surv20'},
  chewie:{ico:'🐻',  nm:'Чубакка',weapon:'grenade',bonus:'+60 HP, +20% области',cost:2000,ach:'kills5000'},
};
const ACHS=[
  {id:'surv5',    nm:'Продержаться 5 минут',      rw:'оружие 🛸 Дроиды-стражи', cond:g=>g.time>=300},
  {id:'kills500', nm:'500 убийств за забег',      rw:'оружие 🌀 Бросок меча',   cond:g=>g.killCount>=500},
  {id:'chests3',  nm:'3 сундука за забег',        rw:'оружие 💣 Термодетонатор',cond:g=>g.chestsRun>=3},
  {id:'boss1',    nm:'Убить босса',               rw:'+300 🪙', gold:300,       cond:g=>g.bossKills>=1},
  {id:'surv15',   nm:'Продержаться 15 минут',     rw:'этап ❄️ Хот',             cond:g=>g.time>=900},
  {id:'evo1',     nm:'Первая эволюция оружия',    rw:'герой 👩‍🎤 Асока',         cond:g=>g.evosRun>=1},
  {id:'surv20',   nm:'Продержаться 20 минут',     rw:'герой 🔫 Хан Соло',       cond:g=>g.time>=1200},
  {id:'kills5000',nm:'5000 убийств суммарно',     rw:'герой 🐻 Чубакка',        cond:g=>save.stats.kills+g.killCount>=5000},
  {id:'vader',    nm:'Победить Дарта Вейдера',    rw:'+1000 🪙', gold:1000,     cond:g=>g.vaderKilled},
  {id:'maxw',     nm:'6 оружий в билде',          rw:'+300 🪙', gold:300,       cond:g=>g.p.weapons.length>=6},
  {id:'lvl50',    nm:'Достичь 50 уровня',         rw:'+500 🪙', gold:500,       cond:g=>g.p.lvl>=50},
  {id:'win',      nm:'Пережить осаду (30:00)',    rw:'⚡ Гипер-режим',           cond:g=>g.won},
];
function checkAchs(){
  if(!G) return;
  for(const a of ACHS){
    if(save.achs[a.id]) continue;
    let ok=false; try{ ok=a.cond(G); }catch(e){}
    if(ok){
      save.achs[a.id]=true;
      if(a.gold) save.gold+=a.gold;
      persist();
      G.dmgTexts.push({x:G.p.x,y:G.p.y-58,v:'🏆 '+a.nm+' — '+a.rw,t:2.4,crit:true,str:true});
      S.chest();
    }
  }
}
function weaponUnlocked(id){
  if(id==='drones') return !!save.achs.surv5;
  if(id==='throw') return !!save.achs.kills500;
  if(id==='grenade') return !!save.achs.chests3;
  return true;
}
const ENEMY_NAMES={trooper:'Штурмовик',scout:'Развед-дроид',b1:'Дроид B1',heavy:'Тяжёлый штурмовик',probe:'Пробо-дроид',dark:'Тёмный солдат',sith:'Сит-адепт',swarm:'Рой дроидов',tusken:'Тускен',jawa:'Джава',interro:'Дроид-дознаватель',magna:'Магна-страж',deka:'Дроидека',officer:'Имперский офицер',wampa:'Вампа',crate:'Ящик припасов',atst:'AT-ST',maul:'Дарт Мол',boba:'Боба Фетт',inquis:'Великий Инквизитор',vader:'Дарт Вейдер',emperor:'Император'};
const META=[
  {id:'might', ico:'💎', nm:'Кристалл силы', desc:'+5% урона за ранг', max:5, cost:r=>Math.round(200*Math.pow(1.9,r))},
  {id:'hp',    ico:'❤️', nm:'Стойкость',     desc:'+15 макс. HP за ранг', max:5, cost:r=>Math.round(160*Math.pow(1.9,r))},
  {id:'speed', ico:'👢', nm:'Проворность',   desc:'+4% скорости за ранг', max:5, cost:r=>Math.round(180*Math.pow(1.9,r))},
  {id:'magnet',ico:'🧲', nm:'Голокрон',      desc:'+12% радиуса сбора за ранг', max:5, cost:r=>Math.round(140*Math.pow(1.9,r))},
  {id:'growth',ico:'📈', nm:'Мудрость',      desc:'+5% опыта за ранг', max:5, cost:r=>Math.round(220*Math.pow(1.9,r))},
  {id:'luck',  ico:'🍀', nm:'Удача',         desc:'+8% удачи за ранг', max:5, cost:r=>Math.round(240*Math.pow(1.9,r))},
  {id:'armor', ico:'🛡️', nm:'Закалка',       desc:'-1 урон от врагов за ранг', max:3, cost:r=>Math.round(400*Math.pow(2.1,r))},
  {id:'recovery',ico:'🧘',nm:'Дух джедая',   desc:'+0.3 HP/сек за ранг', max:3, cost:r=>Math.round(350*Math.pow(2.1,r))},

  if(ptr) return;
  ptr={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  G.joy={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,active:false};
});

  if(!ptr||e.pointerId!==ptr.id) return;
  ptr.x=e.clientX; ptr.y=e.clientY;
  if(dist2(ptr.x,ptr.y,ptr.sx,ptr.sy)>14*14) ptr.moved=true;
  if(G&&G.joy){ G.joy.x=e.clientX; G.joy.y=e.clientY; G.joy.active=ptr.moved; }
});
function ptrUp(e){
  if(!ptr||e.pointerId!==ptr.id) return;
  const quick = performance.now()-ptr.t<250 && !ptr.moved;
  if(quick&&G&&G.state==='playing'){
    // tap → set move-to point in world coords
    const zoom=cameraZoom();
    G.target={x:(ptr.x-W/2)/zoom+G.cam.x, y:(ptr.y-H/2)/zoom+G.cam.y, pulse:0};
  }
  ptr=null; if(G) G.joy=null;
}

/* ============================================================
   TERRAIN — solid obstacles + special zones (deterministic per cell)
   ============================================================ */
const OB_CELL=760;
function cellObstacle(i,j){
  const h=hash2(i*13+7,j*17+3);
  if(h>0.34) return null;
  const ox=(i+0.3+hash2(i*3+1,j*5+2)*0.4)*OB_CELL;
  const oy=(j+0.3+hash2(i*7+4,j*11+6)*0.4)*OB_CELL;
  if(h<0.10) return {x:ox,y:oy,r:62,kind:'mesa',solid:true,h};
  if(h<0.17) return {x:ox,y:oy,r:22,kind:'vap',solid:true,h};
  if(h<0.24) return {x:ox,y:oy,r:44,kind:'hut',solid:true,h};
  if(h<0.29) return {x:ox,y:oy,r:88,kind:'pit',solid:false,h};
  return {x:ox,y:oy,r:78,kind:'beacon',solid:false,h};
}
function nearObstacles(x,y){
  const res=[], ci=Math.floor(x/OB_CELL), cj=Math.floor(y/OB_CELL);
  for(let j=cj-2;j<=cj+2;j++) for(let i=ci-2;i<=ci+2;i++){
    const o=cellObstacle(i,j); if(o) res.push(o);
  }
  return res;
}

/* ============================================================
   SPAWNING
   ============================================================ */
function waveCfg(){ return WAVES[Math.min(WAVES.length-1, Math.floor(G.time/60))]; }
function hpMul(){ const mn=G.time/60; return (1+mn*0.42+mn*mn*0.027)*(G.curse||1); }
function spawnPos(){
  const a=rnd(0,TAU), R=Math.hypot(W,H)/(2*cameraZoom())+60;
  return {x:G.p.x+Math.cos(a)*R, y:G.p.y+Math.sin(a)*R};
}
function spawnEnemy(type,px,py,mul){
  // Ranged units are tactical pressure, not the main horde. Replace excess B1s
  // with melee enemies so a random wave can never become an unavoidable bullet wall.
  if(type==='b1'){
    const shooterLimit=G.time<480?3:(G.time<720?4:5);
    let activeShooters=0;
    for(const enemy of G.enemies) if(enemy.type==='b1'&&enemy.hp>0) activeShooters++;
    if(activeShooters>=shooterLimit) type=G.time<600?'trooper':'heavy';
  }
  const d=ETYPES[type]; if(!d) return;
  const pos=(px!==undefined)?{x:px,y:py}:spawnPos();
  const e={type, x:pos.x, y:pos.y, hp:d.hp*(mul||hpMul())*(d.boss?1:1), hpMax:0,
    sp:d.sp*rnd(0.9,1.1)*(G.eSpd||1), dmg:d.dmg, r:d.r, xp:d.xp, draw:d.draw,
    face:1, walkT:rnd(0,10), flash:0, kx:0, ky:0, kb:d.kb ?? 1,
    shootT:rnd(3.5,5), aimT:0, aimX:0, aimY:0,
    chargeT:rnd(2,4), charging:0, chargeDx:0, chargeDy:0,
    fly:!!d.fly, shooter:!!d.shooter, charger:!!d.charger, boss:!!d.boss, elite:!!d.elite,
    vader:!!d.vader, emperor:!!d.emperor, inq:!!d.inq, buffer:!!d.buffer, crate:!!d.crate,
    burst:d.burst||0, phaseT:0, seed:Math.random()*10,
    spawnT:d.crate?0:0.45 };
  if(e.boss){ e.hp=d.hp*(1+G.time/600); G.bossRef=e; }
  e.hpMax=e.hp;
  G.enemies.push(e);
  return e;
}
function spawnRing(type,count){
  for(let i=0;i<count;i++){
    const a=i/count*TAU, R=Math.hypot(W,H)/(2*cameraZoom())+40;
    spawnEnemy(type, G.p.x+Math.cos(a)*R, G.p.y+Math.sin(a)*R);
  }
}
function updateSpawns(dt){
  const cfg=waveCfg(), mn=Math.floor(G.time/60);
  // Император на поле — как Смерть в VS: обычные волны прекращаются, остаётся только погоня
  if(mn>G.bossDone&&cfg.boss){ G.bossDone=mn; spawnEnemy(cfg.boss); S.boom(); }
  for(const e of G.enemies) if(e.emperor&&!G.endless) return;
  // periodic spawn
  G.spawnT-=dt;
  const cap=clamp(60+mn*22,60,320);
  if(G.spawnT<=0 && G.enemies.length<cap){
    G.spawnT=cfg.int*(G.spawnMul||1);
    for(let i=0;i<cfg.batch;i++) spawnEnemy(cfg.types[rndi(0,cfg.types.length-1)]);
  }
  // minute events: ring (once per minute row)
  if(mn>G.ringDone){ G.ringDone=mn; if(cfg.ring) spawnRing(cfg.ring, 26+mn*2); }
  if(mn>G.bossDone) G.bossDone=mn;
  // elite sith every 75s after min 5
  if(G.time>300){ G.eliteT-=dt; if(G.eliteT<=0){ G.eliteT=75; spawnEnemy('sith'); } }
  // supply crates near the player (VS braziers)
  G.crateT-=dt;
  if(G.crateT<=0){
    G.crateT=22;
    const a=rnd(0,TAU), R=Math.min(W,H)/(2*cameraZoom())*rnd(0.5,0.85);
    spawnEnemy('crate', G.p.x+Math.cos(a)*R, G.p.y+Math.sin(a)*R, 1);
  }
}

/* ============================================================
   WEAPONS — firing
   ============================================================ */
function weaponCooldown(w){
  const base={saber:1.15,lightning:1.3,throw:2.3,push:1.25,shards:1.0,grenade:2.6,drones:6.0}[w.id];
  let cd=base*G.p.cdr;
  if(w.id==='saber') cd*= (w.evolved?0.75:1) * (1-0.04*(w.lvl-1));
  if(w.id==='lightning') cd*= 1-0.05*(w.lvl-1);
  if(w.id==='shards') cd*= (w.evolved?0.55:1) * (1-0.05*(w.lvl-1));
  if(w.id==='throw') cd*= w.evolved?0.6:1;
  if(w.id==='grenade') cd*= 1-0.06*(w.lvl-1);
  return cd;
}
function nearestEnemies(n,maxR){
  const arr=[]; const mr2=maxR*maxR;
  for(const e of G.enemies){ const d=dist2(e.x,e.y,G.p.x,G.p.y); if(d<mr2) arr.push([d,e]); }
  arr.sort((a,b)=>a[0]-b[0]);
  return arr.slice(0,n).map(a=>a[1]);
}
function fireWeapon(w){
  const p=G.p, lv=w.lvl, ev=w.evolved, might=p.might, area=p.area;
  switch(w.id){
    case 'saber':{
      const dmg=(12+lv*4)*might*(ev?2.2:1);
      const R=(72+lv*7)*area*(ev?1.5:1);
      p.swingT=0.24; // анимация замаха на персонаже
      G.slashes.push({dir:p.face, r:R, t:0.2, tMax:0.2, dmg, hit:new Set(), back:false, ev});
      if(lv>=4||ev) setTimeout(()=>{ if(G&&G.state==='playing') G.slashes.push({dir:-p.face, r:R*0.92, t:0.2, tMax:0.2, dmg, hit:new Set(), back:true, ev}); },130);
      if(ev){ // shockwave projectile
        G.bullets.push({x:p.x,y:p.y,vx:p.face*380,vy:0,r:26,dmg:dmg*0.5,life:0.8,pierce:99,kind:'wave',hitCd:{}});
      }
      S.saber();
      break;
    }
    case 'lightning':{
      const n=1+Math.floor(lv/2)+p.amount+(ev?2:0);
      const dmg=(10+lv*5)*might;
      const targets=nearestEnemies(n, 520);
      for(const t of targets){
        damageEnemy(t,dmg,true);
        G.parts.push({kind:'zap',x1:p.x,y1:p.y-30,x2:t.x,y2:t.y,t:0.14,ev});
        if(ev){ // chain to 2 nearby
          let last=t;
          for(let c=0;c<2;c++){
            let best=null,bd=180*180;
            for(const e2 of G.enemies){ if(e2===last||e2.hp<=0) continue; const d=dist2(e2.x,e2.y,last.x,last.y); if(d<bd){bd=d;best=e2;} }
            if(!best) break;
            damageEnemy(best,dmg*0.6,true);
            G.parts.push({kind:'zap',x1:last.x,y1:last.y,x2:best.x,y2:best.y,t:0.14,ev});
            last=best;
          }
        }
      }
      if(targets.length) S.zap();
      break;
    }
    case 'throw':{
      const n=ev?3:(1+Math.floor(p.amount/1));
      const dmg=(16+lv*6)*might*(ev?1.4:1);
      for(let i=0;i<n;i++){
        const a=Math.atan2(p.lastMove.y,p.lastMove.x)+(i-(n-1)/2)*0.5;
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,r:16*area,dmg,life:2.4,pierce:999,kind:'saberThrow',phase:0,spin:0,hitCd:{},ev});
      }
      S.saber();
      break;
    }
    case 'push':{
      const R=(68+lv*8)*area*(ev?1.55:1);
      const dmg=(4+lv*1.5)*might*(ev?2:1);
      for(const e of G.enemies){
        const d=dist2(e.x,e.y,p.x,p.y);
        if(d<R*R){
          damageEnemy(e,dmg,false);
          const dd=Math.sqrt(d)||1, kb=(ev?135:58+lv*4)*e.kb;
          e.kx+=(e.x-p.x)/dd*kb; e.ky+=(e.y-p.y)/dd*kb;
        }
      }
      G.parts.push({kind:'ring',x:p.x,y:p.y,t:0.35,tMax:0.35,R,ev});
      break;
    }
    case 'drones':{
      G.dronesActive=true;
      G.droneLife=ev?1e9:(4+lv*0.5);
      const n=(2+Math.floor(lv/2)+p.amount+(ev?2:0));
      G.drones=[];
      for(let i=0;i<n;i++) G.drones.push({a:i/n*TAU, hitCd:{}});
      break;
    }
    case 'shards':{
      const dmg=(9+lv*4)*might*(ev?1.3:1);
      const n=ev?10:(1+p.amount+Math.floor(lv/3));
      const baseA=Math.atan2(p.lastMove.y,p.lastMove.x);
      for(let i=0;i<n;i++){
        const a=ev? i/n*TAU : baseA+(i-(n-1)/2)*0.14;
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:7,dmg,life:1.1,pierce:1+Math.floor(lv/2),kind:'shard',hitCd:{},ev});
      }
      break;
    }
    case 'grenade':{
      const n=(ev?2:1)+Math.floor(p.amount/2);
      for(let i=0;i<n;i++){
        const tgt = G.enemies.length? G.enemies[rndi(0,G.enemies.length-1)] : null;
        const tx = tgt? tgt.x+rnd(-40,40) : p.x+rnd(-250,250);
        const ty = tgt? tgt.y+rnd(-40,40) : p.y+rnd(-250,250);
        G.bullets.push({x:p.x,y:p.y,sx:p.x,sy:p.y,tx,ty,kind:'nade',t:0,tMax:0.7,dmg:(24+w.lvl*9)*might*(ev?1.5:1),R:(78+w.lvl*7)*area*(ev?1.6:1),ev,lvl:w.lvl});
      }
      break;
    }
  }
}
function updateWeapons(dt){
  for(const w of G.p.weapons){
    w.cd-=dt;
    if(w.cd<=0){ w.cd=weaponCooldown(w); fireWeapon(w); }
  }
  // drones update
  if(G.dronesActive){
    G.droneLife-=dt;
    if(G.droneLife<=0){ G.dronesActive=false; G.drones=[]; }
    const wd=G.p.weapons.find(w=>w.id==='drones');
    if(wd){
      const spd=(wd.evolved?2.6:2.0), R=(92+wd.lvl*6)*G.p.area, dmg=(10+wd.lvl*5)*G.p.might*(wd.evolved?1.8:1);
      G.droneAngle+=spd*dt;
      for(const d of G.drones){
        const ax=G.p.x+Math.cos(d.a+G.droneAngle)*R, ay=G.p.y+Math.sin(d.a+G.droneAngle)*R;
        d.x=ax; d.y=ay;
        for(const e of G.enemies){
          if(e.hp<=0) continue;
          const key=e.seed;
          if(d.hitCd[key]>G.time-0.5) continue;
          if(dist2(ax,ay,e.x,e.y)<(14+e.r)*(14+e.r)){ d.hitCd[key]=G.time; damageEnemy(e,dmg,true); }
        }
      }
    }
  }
}

/* ============================================================
   DAMAGE / DEATH / DROPS
   ============================================================ */
function damageEnemy(e,dmg,knock){
  if(e.hp<=0) return;
  if(e.emperor){ // Император неуязвим — от него можно только убежать
    if(Math.random()<0.06) G.dmgTexts.push({x:e.x,y:e.y-e.r-10,v:'НЕУЯЗВИМ',t:0.7,crit:true,str:true});
    return;
  }
  const crit=Math.random()<0.05*G.p.luck;
  if(crit) dmg*=2;
  e.hp-=dmg; e.flash=0.1;
  if(crit){ G.hitStop=Math.max(G.hitStop,0.05); e.flash=0.14; }
  G.dmgTexts.push({x:e.x+rnd(-8,8),y:e.y-e.r-6,v:Math.round(dmg),t:0.6,crit});
  if(knock&&e.kb>0){ const d=Math.hypot(e.x-G.p.x,e.y-G.p.y)||1; e.kx+=(e.x-G.p.x)/d*60*e.kb; e.ky+=(e.y-G.p.y)/d*60*e.kb; }
  S.hit();
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  G.killCount++;
  if(!e.crate) save.stats.perEnemy[e.type]=(save.stats.perEnemy[e.type]||0)+1;
  if(e.boss) G.bossKills=(G.bossKills||0)+1;
  // death pop: враг «лопается» — растянутое кольцо цвета тела
  G.parts.push({kind:'pop',x:e.x,y:e.y,t:0.22,tMax:0.22,R:e.r*1.6,c:e.boss?'255,140,60':'205,218,242'});
  if(e.boss){ G.hitStop=Math.max(G.hitStop,0.09); G.shake=Math.min(14,G.shake+8); }
  else if(e.elite) G.hitStop=Math.max(G.hitStop,0.05);
  // particles
  for(let i=0;i<(e.boss?40:8);i++)
    G.parts.push({kind:'p',x:e.x,y:e.y,vx:rnd(-160,160),vy:rnd(-200,60),t:rnd(0.3,0.7),c:e.boss?'#ff8d3a':'#aebbd8',s:rnd(2,e.boss?7:4)});
  const d=ETYPES[e.type];
  // drops
  if(e.crate){ // supply crate: guaranteed useful loot
    const roll=Math.random();
    if(roll<0.42) G.pickups.push({kind:'gold',x:e.x,y:e.y,v:rndi(8,20),t:0});
    else if(roll<0.68) G.pickups.push({kind:'chicken',x:e.x,y:e.y,t:0});
    else if(roll<0.82) G.pickups.push({kind:'vacuum',x:e.x,y:e.y,t:0});
    else if(roll<0.90) for(let i=0;i<5;i++) G.gems.push({x:e.x+rnd(-25,25),y:e.y+rnd(-25,25),v:3,t:0});
    else if(roll<0.96) G.pickups.push({kind:'freeze',x:e.x,y:e.y,t:0});
    else G.pickups.push({kind:'bomb',x:e.x,y:e.y,t:0});
    G.killCount--; // crates are not kills
  } else if(e.elite||e.boss){
    G.pickups.push({kind:'chest',x:e.x,y:e.y,t:0});
    for(let i=0;i<(e.boss?14:6);i++) G.gems.push({x:e.x+rnd(-40,40),y:e.y+rnd(-40,40),v:e.boss?10:5,t:0});
    G.pickups.push({kind:'gold',x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),v:e.boss?(e.vader?300:60):20,t:0});
  } else {
    G.gems.push({x:e.x,y:e.y,v:e.xp,t:0});
    const roll=Math.random();
    if(roll<d.gold*G.p.luck) G.pickups.push({kind:'gold',x:e.x,y:e.y,v:rndi(1,4),t:0});
    else if(roll<d.gold*G.p.luck+0.008*G.p.luck) G.pickups.push({kind:'chicken',x:e.x,y:e.y,t:0});
    else if(roll>0.9985) G.pickups.push({kind:'vacuum',x:e.x,y:e.y,t:0});
    else if(roll>0.9975&&roll<=0.9985) G.pickups.push({kind:'bomb',x:e.x,y:e.y,t:0});
    else if(roll>0.9963&&roll<=0.9975) G.pickups.push({kind:'freeze',x:e.x,y:e.y,t:0});
  }
  if(e.boss) G.bossRef=null;
  if(e.vader){
    G.vaderKilled=true;
    G.dmgTexts.push({x:e.x,y:e.y-50,v:'⚔️ ВЕЙДЕР ПОВЕРЖЕН! ПРОДЕРЖИСЬ ДО 30:00',t:2.5,crit:true,str:true});
  }
  if(G.gems.length>420){ // merge oldest gems (VS-like)
    let v=0; for(let i=0;i<60;i++) v+=G.gems[i].v;
    G.gems.splice(0,60); G.gems.push({x:G.gems.length?G.gems[0].x:e.x, y:G.gems.length?G.gems[0].y:e.y, v, t:0});
  }
}
function hurtPlayer(dmg){
  const p=G.p;
  if(p.inv>0) return false;
  const real=Math.max(1,dmg-p.armor);
  p.hp-=real; p.inv=0.45; G.shake=Math.min(12,G.shake+5);
  S.hurt();
  if(p.hp<=0){
    if(p.revives>0){ // Воля Силы: воскрешение (как Tiragisú в VS)
      p.revives--; p.hp=p.hpMax*0.5; p.inv=2.5;
      for(const e of G.enemies){ // отбросить толпу
        const d=Math.hypot(e.x-p.x,e.y-p.y)||1;
        if(d<260&&e.kb>0){ e.kx+=(e.x-p.x)/d*400*e.kb; e.ky+=(e.y-p.y)/d*400*e.kb; }
      }
      G.dmgTexts.push({x:p.x,y:p.y-40,v:'✨ СИЛА ВЕРНУЛА ТЕБЯ',t:1.6,crit:true,str:true});
      G.parts.push({kind:'ring',x:p.x,y:p.y,t:0.5,tMax:0.5,R:260,ev:true});
      S.chest();
      return true;
    }
    p.hp=0; endRun(false);
  }
  return true;
}

/* ============================================================
   LEVEL UP / UPGRADES / CHESTS
   ============================================================ */
const luEl=document.getElementById('levelup'), cardsEl=document.getElementById('cards'), luTitle=document.getElementById('luTitle');
function gainXP(v){
  const p=G.p; p.xp+=v*p.growth*(G.rewardMul||1);
  while(p.xp>=p.xpNext){
    p.xp-=p.xpNext; p.lvl++;
    // VS-кривая: +10 XP за уровень до 20, +13 до 40, +16 дальше
    p.xpNext = p.lvl<20 ? 5+(p.lvl-1)*10
             : p.lvl<40 ? 195+(p.lvl-19)*13
             : 455+(p.lvl-39)*16;
    showLevelUp();
  }
}
function upgradeOptions(){
  const p=G.p, opts=[];
  const banned=G.banned||[];
  for(const w of p.weapons) if(w.lvl<8&&!w.evolved&&!banned.includes('w'+w.id)) opts.push({kind:'w-up',id:w.id});
  if(p.weapons.length<6) for(const id in WEAPONS)
    if(!p.weapons.find(w=>w.id===id)&&weaponUnlocked(id)&&!banned.includes('w'+id)) opts.push({kind:'w-new',id});
  for(const id in PASSIVES){
    const cur=p.passives[id]||0;
    if(cur<PASSIVES[id].max&&!banned.includes('p'+id)) opts.push({kind:'p',id});
  }
  // shuffle, pick 3
  for(let i=opts.length-1;i>0;i--){ const j=rndi(0,i); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const picks=opts.slice(0, 3+(Math.random()<(p.luck-1)*0.5?1:0));
  if(!picks.length) picks.push({kind:'gold', id:'gold'});
  return picks;
}
function applyPassive(id){
  const p=G.p;
  p.passives[id]=(p.passives[id]||0)+1;
  switch(id){
    case 'might': p.might+=0.10; break;
    case 'armor': p.armor+=1; break;
    case 'speed': p.speed*=1.08; break;
    case 'recovery': p.recovery+=0.3; break;
    case 'magnet': p.magnet*=1.25; break;
    case 'area': p.area+=0.08; break;
    case 'cooldown': p.cdr*=0.94; break;
    case 'hpmax': { const add=p.hpMax*0.2; p.hpMax+=add; p.hp+=add; break; }
    case 'amount': p.amount+=1; break;
    case 'luck': p.luck+=0.15; break;
  }
}
function showLevelUp(){
  G.state='levelup'; S.lvl(); G.zoomPulse=0.05;
  luTitle.textContent='⬆ УРОВЕНЬ '+G.p.lvl+'!';
  renderCards(upgradeOptions(),true);
}
let banishMode=false;
function renderCards(picks,withActions){
  banishMode=false;
  cardsEl.innerHTML='';
  for(const o of picks){
    const c=document.createElement('div'); c.className='card';
    if(o.kind==='w-new') c.classList.add('new-w');
    if(o.kind==='evo') c.classList.add('evo');
    let ico,nm,lvTxt,ds;
    if(o.kind==='w-up'){ const w=G.p.weapons.find(w=>w.id===o.id); ico=WEAPONS[o.id].ico; nm=WEAPONS[o.id].nm; lvTxt='Уровень '+(w.lvl+1); ds=WEAPONS[o.id].ds; }
    else if(o.kind==='w-new'){ ico=WEAPONS[o.id].ico; nm=WEAPONS[o.id].nm; lvTxt='НОВОЕ ОРУЖИЕ'; ds=WEAPONS[o.id].ds; }
    else if(o.kind==='p'){ const cur=G.p.passives[o.id]||0; ico=PASSIVES[o.id].ico; nm=PASSIVES[o.id].nm; lvTxt=cur?('Уровень '+(cur+1)):'НОВЫЙ НАВЫК'; ds=PASSIVES[o.id].ds; }
    else if(o.kind==='evo'){ ico='🔥'; nm=EVOS[o.id].nm; lvTxt='ЭВОЛЮЦИЯ'; ds=EVOS[o.id].ds; }
    else { ico='🪙'; nm='Кредиты'; lvTxt='+25'; ds='Всё прокачано — держи золото.'; }
    c.innerHTML='<div class="ico">'+ico+'</div><div class="nm">'+nm+'</div><div class="lv">'+lvTxt+'</div><div class="ds">'+ds+'</div>';
    c.onclick=()=>{
      if(banishMode){
        if(o.kind==='w-up'||o.kind==='w-new'||o.kind==='p'){
          // изгнание: этот предмет больше не появится в этом забеге (как в VS)
          G.banned.push((o.kind==='p'?'p':'w')+o.id);
          G.banishes--;
        }
        banishMode=false;
        renderCards(upgradeOptions(),true);
        return;
      }
      if(o.kind==='w-up'){ G.p.weapons.find(w=>w.id===o.id).lvl++; }
      else if(o.kind==='w-new'){ G.p.weapons.push({id:o.id,lvl:1,cd:0.2,evolved:false}); }
      else if(o.kind==='p'){ applyPassive(o.id); }
      else if(o.kind==='evo'){ const w=G.p.weapons.find(w=>w.id===o.id); w.evolved=true; G.evosRun++; S.chest(); }
      else { G.goldRun+=25; }
      luEl.classList.add('hidden');
      G.state='playing';
    };
    cardsEl.appendChild(c);
  }
  // панель действий: реролл / изгнание / пропуск (механики VS)
  const act=document.getElementById('luActions');
  if(withActions){
    act.classList.remove('hidden');
    act.innerHTML='';
    const mk=(txt,n,fn,dis)=>{
      const b=document.createElement('button');
      b.className='btn btn-sec lu-act'; b.textContent=txt+(n!==null?' ('+n+')':'');
      if(dis) b.disabled=true;
      b.onclick=fn; act.appendChild(b);
    };
    mk('🔄 Реролл',G.rerolls,()=>{ if(G.rerolls>0){ G.rerolls--; renderCards(upgradeOptions(),true); } },G.rerolls<=0);
    mk('🚫 Изгнать',G.banishes,()=>{
      if(G.banishes>0){ banishMode=!banishMode;
        luTitle.textContent=banishMode?'🚫 ВЫБЕРИ КАРТУ ДЛЯ ИЗГНАНИЯ':'⬆ УРОВЕНЬ '+G.p.lvl+'!';
      }
    },G.banishes<=0);
    mk('⏭ Пропустить',G.skips,()=>{ if(G.skips>0){ G.skips--; luEl.classList.add('hidden'); G.state='playing'; } },G.skips<=0);
  } else act.classList.add('hidden');
  luEl.classList.remove('hidden');
}
function openChest(){
  S.chest();
  G.chestsRun++; G.zoomPulse=0.05;
  // золотая лихорадка как в VS: из сундука иногда льётся дождь монет
  if(Math.random()<0.3){ G.feverT=5; G.dmgTexts.push({x:G.p.x,y:G.p.y-44,v:'💰 ЗОЛОТАЯ ЛИХОРАДКА!',t:1.6,crit:true,str:true}); }
  // evolution if eligible (VS rule: weapon max lvl + paired passive)
  const evo=G.p.weapons.find(w=>w.lvl>=8&&!w.evolved&&(G.p.passives[WEAPONS[w.id].pair]||0)>0);
  if(evo){
    G.state='levelup';
    luTitle.textContent='📦 ИМПЕРСКИЙ СУНДУК';
    renderCards([{kind:'evo',id:evo.id}]);
  } else {
    // gold + random free upgrade
    G.goldRun+=rndi(15,40);
    const ups=upgradeOptions().filter(o=>o.kind!=='gold');
    if(ups.length){
      const o=ups[0];
      if(o.kind==='w-up') G.p.weapons.find(w=>w.id===o.id).lvl++;
      else if(o.kind==='w-new') G.p.weapons.push({id:o.id,lvl:1,cd:0.2,evolved:false});
      else if(o.kind==='p') applyPassive(o.id);
    }
    G.dmgTexts.push({x:G.p.x,y:G.p.y-40,v:'📦 +улучшение!',t:1.4,crit:true,str:true});
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  const p=G.p;
  G.time+=dt;
  /* --- player movement --- */
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp)my-=1; if(keys.KeyS||keys.ArrowDown)my+=1;
  if(keys.KeyA||keys.ArrowLeft)mx-=1; if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(G.joy&&G.joy.active){
    const dx=G.joy.x-G.joy.sx, dy=G.joy.y-G.joy.sy, d=Math.hypot(dx,dy);
    if(d>8){ mx=dx/d; my=dy/d; }
    G.target=null;
  }
  if(mx||my){ G.target=null; }
  else if(G.target){
    const dx=G.target.x-p.x, dy=G.target.y-p.y, d=Math.hypot(dx,dy);
    if(d<8) G.target=null; else { mx=dx/d; my=dy/d; }
  }
  const ml=Math.hypot(mx,my);
  if(ml>0){
    mx/=ml; my/=ml;
    p.x+=mx*p.speed*dt; p.y+=my*p.speed*dt;
    p.moving=true; p.walkT+=dt*9;
    p.lastMove={x:mx,y:my};
    if(mx!==0) p.face=mx>0?1:-1;
  } else p.moving=false;
  p.hp=Math.min(p.hpMax,p.hp+p.recovery*dt);
  if(p.inv>0)p.inv-=dt;
  if(p.swingT>0)p.swingT-=dt;
  /* --- terrain: solid obstacles, sarlacc pits, rebel beacons --- */
  const obs=nearObstacles(p.x,p.y);
  let inPit=false, inBeacon=false;
  for(const o of obs){
    const d2o=dist2(p.x,p.y,o.x,o.y);
    if(o.solid){
      const rr=o.r+p.r;
      if(d2o<rr*rr){ const d=Math.sqrt(d2o)||1; p.x=o.x+(p.x-o.x)/d*rr; p.y=o.y+(p.y-o.y)/d*rr; }
    } else if(o.kind==='pit'&&d2o<o.r*o.r) inPit=true;
    else if(o.kind==='beacon'&&d2o<o.r*o.r) inBeacon=true;
  }
  if(inPit){
    G.pitTick-=dt;
    if(G.pitTick<=0){ G.pitTick=0.8; const dmgT=Math.max(2,4+G.time/120); p.hp-=dmgT; G.dmgTexts.push({x:p.x,y:p.y-24,v:'-'+Math.round(dmgT)+' яма',t:0.6,crit:false}); if(p.hp<=0){p.hp=0;endRun(false);return;} }
  }
  if(inBeacon) p.hp=Math.min(p.hpMax,p.hp+5*dt);
  /* camera */
  G.cam.x=lerp(G.cam.x,p.x,1-Math.pow(0.001,dt));
  G.cam.y=lerp(G.cam.y,p.y,1-Math.pow(0.001,dt));
  if(G.shake>0)G.shake=Math.max(0,G.shake-30*dt);
  if(G.target){G.target.pulse+=dt*5;}

  updateSpawns(dt);
  updateWeapons(dt);

  /* --- крионические часы / золотая лихорадка / достижения --- */
  if(G.freezeT>0) G.freezeT-=dt;
  if(G.feverT>0){
    G.feverT-=dt; G.feverTick-=dt;
    if(G.feverTick<=0){
      G.feverTick=0.14;
      const a=rnd(0,TAU), R=rnd(30,150);
      G.pickups.push({kind:'gold',x:p.x+Math.cos(a)*R,y:p.y+Math.sin(a)*R,v:rndi(2,6),t:0,fly:true});
      G.parts.push({kind:'p',x:p.x+Math.cos(a)*R,y:p.y+Math.sin(a)*R-20,vx:0,vy:60,t:0.5,c:'#ffd76a',s:3});
    }
  }
  G.achTick-=dt;
  if(G.achTick<=0){ G.achTick=1; checkAchs(); }
  const frozen=G.freezeT>0;

  /* --- enemies --- */
  const officers=[];
  for(const e of G.enemies) if(e.buffer&&e.hp>0) officers.push(e);
  let contactCount=0, contactDamage=0;
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.hp<=0){ G.enemies[i]=G.enemies[G.enemies.length-1]; G.enemies.pop(); continue; }
    e.flash=Math.max(0,e.flash-dt);
    if(frozen&&!e.emperor) continue; // крио-часы: все, кроме Императора, замирают
    if(e.spawnT>0){ e.spawnT-=dt; continue; } // вылезает из портала — ещё не двигается и не бьёт
    e.walkT+=dt*8;
    // knockback decay
    e.x+=e.kx*dt; e.y+=e.ky*dt; e.kx*=Math.pow(0.01,dt); e.ky*=Math.pow(0.01,dt);
    const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
    e.face=dx>0?1:-1;
    let vx=dx/d, vy=dy/d, spd=e.sp;
    // имперский офицер разгоняет ближайших солдат
    e.buffed=false;
    if(!e.boss&&!e.buffer&&!e.crate&&officers.length){
      for(const o of officers) if(dist2(e.x,e.y,o.x,o.y)<260*260){ spd*=1.35; e.buffed=true; break; }
    }
    if(e.fly){ const s=Math.sin(G.time*3+e.seed*7); vx+=-dy/d*s*0.7; vy+=dx/d*s*0.7; }
    if(e.charger){
      e.chargeT-=dt;
      if(e.charging>0){
        e.charging-=dt; e.x+=e.chargeDx*dt; e.y+=e.chargeDy*dt; spd=0;
      } else if(e.chargeT<=0 && d<420){
        e.chargeT=rnd(2.5,4.5); e.charging=0.55;
        e.chargeDx=dx/d*(e.boss?520:420); e.chargeDy=dy/d*(e.boss?520:420);
        e.telegraph=0.35;
      }
      if(e.telegraph>0){ e.telegraph-=dt; spd=8; if(e.telegraph<=0){} }
    }
    if(e.shooter){
      const zoom=cameraZoom();
      const screenX=(e.x-G.cam.x)*zoom+W/2, screenY=(e.y-G.cam.y)*zoom+H/2;
      const visible=screenX>-24&&screenX<W+24&&screenY>-24&&screenY<H+24;
      if(d<300) spd*=0.4; // keep some distance
      if(e.aimT>0){
        e.aimT-=dt;
        spd*=0.12;
        if(e.aimT<=0){
          const shotCap=e.boss?18:12;
          if(G.eshots.length<shotCap){
            const adx=e.aimX-e.x, ady=e.aimY-e.y;
            const baseA=Math.atan2(ady,adx);
            const n=e.boss?5:(e.burst||1), shotSpeed=e.boss?210:190;
            for(let k=0;k<n&&G.eshots.length<shotCap;k++){
              const a=baseA+(k-(n-1)/2)*(e.boss?0.15:(e.burst?0.12:0));
              G.eshots.push({
                x:e.x,y:e.y-10,vx:Math.cos(a)*shotSpeed,vy:Math.sin(a)*shotSpeed,
                life:e.boss?3.5:3,dmg:e.dmg*(e.boss?0.45:0.55),r:e.boss?6:5,
                c:e.boss?'#7dff6a':'#ff4b4b',bossShot:e.boss,reflected:false
              });
            }
          }
          e.shootT=e.boss?2.6:rnd(4.2,5.4);
        }
      } else {
        e.shootT-=dt;
        const range=e.boss?620:480;
        const cap=e.boss?18:12;
        if(e.shootT<=0&&d<range&&visible&&G.eshots.length<cap){
          e.aimT=e.boss?0.9:0.7;
          e.aimX=p.x; e.aimY=p.y;
        } else if(e.shootT<=0){
          e.shootT=0.6;
        }
      }
    }
    if(e.inq){ // Великий Инквизитор кидает вращающийся меч
      e.phaseT-=dt;
      if(e.phaseT<=0){
        e.phaseT=3.2;
        const a=Math.atan2(p.y-e.y,p.x-e.x);
        G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*290,vy:Math.sin(a)*290,life:2.4,dmg:24,r:13,c:'#ff2b2b',saber:true});
      }
    }
    if(e.vader){
      e.phaseT-=dt;
      if(e.phaseT<=0){
        e.phaseT=5;
        const act=rndi(0,2);
        if(act===0){ // force pull player
          G.dmgTexts.push({x:e.x,y:e.y-50,v:'ПРИТЯЖЕНИЕ СИЛЫ',t:1,crit:true,str:true});
          const pd=Math.hypot(p.x-e.x,p.y-e.y)||1;
          p.x=lerp(p.x,e.x,0.35); p.y=lerp(p.y,e.y,0.35); G.shake=10;
        } else if(act===1){ // spawn troopers
          for(let k=0;k<6;k++) spawnEnemy('trooper', e.x+rnd(-120,120), e.y+rnd(-120,120));
        } else { // saber throw at player
          const a=Math.atan2(p.y-e.y,p.x-e.x);
          G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,life:2.5,dmg:26,r:14,c:'#ff2b2b',saber:true});
        }
      }
    }
    if(e.charging<=0){ e.x+=vx*spd*dt; e.y+=vy*spd*dt; }
    // solid terrain blocks ground enemies (fliers pass over)
    if(!e.fly&&!e.boss) for(const o of obs){
      if(!o.solid) continue;
      const rr=o.r+e.r*0.5, dd2=dist2(e.x,e.y,o.x,o.y);
      if(dd2<rr*rr){ const dd=Math.sqrt(dd2)||1; e.x=o.x+(e.x-o.x)/dd*rr; e.y=o.y+(e.y-o.y)/dd*rr; }
    }
    // separation (cheap, sample few neighbors)
    // Collect the whole crowd as one damage event. Extra bodies add pressure,
    // instead of becoming harmless behind the first enemy's invulnerability hit.
    if(!e.crate && d < e.r+p.r){
      contactCount++;
      contactDamage=Math.max(contactDamage,e.dmg);
    }
    if(e.crate){ // ящики не двигаются и не телепортируются; далёкие убираем
      if(d>Math.hypot(W,H)/cameraZoom()+400){ G.enemies[i]=G.enemies[G.enemies.length-1]; G.enemies.pop(); }
      continue;
    }
    // despawn far non-boss
    if(!e.boss && d>Math.hypot(W,H)*0.9/cameraZoom()+300){
      // teleport to other side (VS-style)
      const a=Math.atan2(e.y-p.y,e.x-p.x)+Math.PI+rnd(-0.5,0.5);
      const R=Math.hypot(W,H)/(2*cameraZoom())+80;
      e.x=p.x+Math.cos(a)*R; e.y=p.y+Math.sin(a)*R;
    }
  }
  if(contactCount>0){
    const crowdPressure=Math.min(12,(contactCount-1)*2);
    hurtPlayer(contactDamage+crowdPressure);
  }

  /* --- slashes --- */
  for(let i=G.slashes.length-1;i>=0;i--){
    const s=G.slashes[i]; s.t-=dt;
    if(s.t<=0){ G.slashes.splice(i,1); continue; }
    const cxp=p.x, cyp=p.y;
    for(const e of G.enemies){
      if(e.hp<=0||s.hit.has(e.seed)) continue;
      const dx=e.x-cxp, dy=e.y-cyp, d=Math.hypot(dx,dy);
      if(d<s.r+e.r && Math.sign(dx||s.dir)===s.dir && Math.abs(dy)<s.r*0.85){
        s.hit.add(e.seed); damageEnemy(e,s.dmg,true);
      }
    }
    // A lightsaber swing can return blaster bolts to the nearest enemy.
    for(const bolt of G.eshots){
      if(bolt.reflected||bolt.saber) continue;
      const bdx=bolt.x-p.x, bdy=bolt.y-p.y, bd=Math.hypot(bdx,bdy);
      if(bd>s.r+bolt.r||Math.abs(bdy)>s.r*0.85||Math.sign(bdx||s.dir)!==s.dir) continue;
      let target=null, targetD=Infinity;
      for(const enemy of G.enemies){
        if(enemy.hp<=0) continue;
        const td=dist2(bolt.x,bolt.y,enemy.x,enemy.y);
        if(td<targetD){targetD=td;target=enemy;}
      }
      const ta=target?Math.atan2(target.y-bolt.y,target.x-bolt.x):Math.atan2(-bolt.vy,-bolt.vx);
      bolt.vx=Math.cos(ta)*360; bolt.vy=Math.sin(ta)*360;
      bolt.life=1.8; bolt.dmg=Math.max(24,s.dmg*0.9);
      bolt.r=6; bolt.c='#72d9ff'; bolt.reflected=true;
      G.parts.push({kind:'ring',x:bolt.x,y:bolt.y,R:28,t:0.22,tMax:0.22,ev:false});
      S.saber();
    }
  }

  /* --- player bullets --- */
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    if(b.kind==='nade'){
      b.t+=dt;
      const k=b.t/b.tMax;
      if(k>=1){
        G.zones.push({x:b.tx,y:b.ty,R:b.R,t:3,dmg:b.dmg*0.25,tick:0,ev:b.ev});
        for(const e of G.enemies){ if(dist2(e.x,e.y,b.tx,b.ty)<b.R*b.R) damageEnemy(e,b.dmg,true); }
        G.parts.push({kind:'boom',x:b.tx,y:b.ty,t:0.4,tMax:0.4,R:b.R});
        G.shake=Math.min(10,G.shake+4); S.boom();
        // направленный толчок камеры ОТ взрыва
        { const kdx=p.x-b.tx, kdy=p.y-b.ty, kdd=Math.hypot(kdx,kdy)||1;
          G.kickX+=kdx/kdd*7; G.kickY+=kdy/kdd*7; }
        G.bullets.splice(i,1);
      }
      continue;
    }
    if(b.kind==='saberThrow'){
      b.phase+=dt; b.spin+=dt*20;
      if(b.phase>0.55){ // return to player
        const dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy)||1;
        b.vx=dx/d*560; b.vy=dy/d*560;
        if(d<24){ G.bullets.splice(i,1); continue; }
      }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0){ G.bullets.splice(i,1); continue; }
    for(const e of G.enemies){
      if(e.hp<=0) continue;
      if(b.hitCd && b.hitCd[e.seed]>G.time-0.4) continue;
      if(dist2(b.x,b.y,e.x,e.y)<(b.r+e.r)*(b.r+e.r)){
        if(b.hitCd) b.hitCd[e.seed]=G.time;
        damageEnemy(e,b.dmg,true);
        if(b.kind==='shard'){ b.pierce--; if(b.pierce<=0){ G.bullets.splice(i,1); break; } }
      }
    }
  }

  /* --- enemy shots --- */
  for(let i=G.eshots.length-1;i>=0;i--){
    const s=G.eshots[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.life<=0){ G.eshots.splice(i,1); continue; }
    if(s.reflected){
      let hit=false;
      for(const e of G.enemies){
        if(e.hp<=0) continue;
        if(dist2(s.x,s.y,e.x,e.y)<(s.r+e.r)*(s.r+e.r)){
          damageEnemy(e,s.dmg,true); G.eshots.splice(i,1); hit=true; break;
        }
      }
      if(hit) continue;
      continue;
    }
    if(dist2(s.x,s.y,p.x,p.y)<(s.r+p.r)*(s.r+p.r)){
      hurtPlayer(s.dmg); G.eshots.splice(i,1);
    }
  }

  /* --- zones (burning plasma) --- */
  for(let i=G.zones.length-1;i>=0;i--){
    const z=G.zones[i]; z.t-=dt; z.tick-=dt;
    if(z.t<=0){ G.zones.splice(i,1); continue; }
    if(z.tick<=0){
      z.tick=0.5;
      for(const e of G.enemies) if(dist2(e.x,e.y,z.x,z.y)<z.R*z.R) damageEnemy(e,z.dmg,false);
    }
  }

  /* --- gems --- */
  const mag2=p.magnet*p.magnet;
  for(let i=G.gems.length-1;i>=0;i--){
    const g=G.gems[i]; g.t+=dt;
    const d2=dist2(g.x,g.y,p.x,p.y);
    if(g.pull||d2<mag2){
      g.pull=true;
      const d=Math.sqrt(d2)||1;
      const sp=Math.max(240, 560-d);
      g.x+=(p.x-g.x)/d*sp*dt; g.y+=(p.y-g.y)/d*sp*dt;
      if(d<18){ gainXP(g.v); S.gem(); G.gems.splice(i,1); }
    }
  }

  /* --- pickups --- */
  for(let i=G.pickups.length-1;i>=0;i--){
    const u=G.pickups[i]; u.t+=dt;
    if(u.fly){ // монеты лихорадки сами летят к игроку
      const d=Math.hypot(p.x-u.x,p.y-u.y)||1;
      u.x+=(p.x-u.x)/d*300*dt; u.y+=(p.y-u.y)/d*300*dt;
    }
    if(dist2(u.x,u.y,p.x,p.y)<(p.r+16)*(p.r+16)){
      switch(u.kind){
        case 'gold': G.goldRun+=Math.round(u.v*p.goldMul*(G.rewardMul||1)); S.pick(); break;
        case 'chicken': p.hp=Math.min(p.hpMax,p.hp+30); S.pick(); G.dmgTexts.push({x:p.x,y:p.y-30,v:'+30 HP',t:0.8,heal:true,str:true}); break;
        case 'vacuum': for(const g of G.gems) g.pull=true; S.pick(); break;
        case 'bomb': { S.boom(); G.shake=14; G.zoomPulse=0.05; for(const e of [...G.enemies]) if(!e.boss) damageEnemy(e,9999,false); break; }
        case 'freeze': { G.freezeT=8; S.zap(); G.dmgTexts.push({x:p.x,y:p.y-30,v:'❄️ ВРЕМЯ ЗАМЕРЛО',t:1.4,crit:true,str:true}); break; }
        case 'chest': openChest(); break;
      }
      G.pickups.splice(i,1);
    }
  }

  /* --- particles / texts --- */
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i]; q.t-=dt;
    if(q.kind==='p'){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=500*dt; }
    if(q.t<=0) G.parts.splice(i,1);
  }
  for(let i=G.dmgTexts.length-1;i>=0;i--){
    const t=G.dmgTexts[i]; t.t-=dt; t.y-=34*dt;
    if(t.t<=0) G.dmgTexts.splice(i,1);
  }

  /* --- win: пережить 30-минутную осаду (в бесконечном режиме — играем дальше) --- */
  if(G.time>=1800&&!G.endless){ G.won=true; checkAchs(); endRun(true); return; }
}

/* ============================================================
   DRAW
   ============================================================ */
function draw(){
  const p=G.p;
  const zoom=cameraZoom()*(1+(G.zoomPulse||0));
  const shake=save.settings.shake?G.shake:0;
  const shx=shake?rnd(-shake,shake):0, shy=shake?rnd(-shake,shake):0;
  const camX=G.cam.x+(shx+(G.kickX||0))/zoom, camY=G.cam.y+(shy+(G.kickY||0))/zoom;

  cx.fillStyle=pal().base; cx.fillRect(0,0,W,H);
  cx.save();
  cx.translate(W/2,H/2);
  cx.scale(zoom,zoom);
  cx.translate(-camX,-camY);
  drawGround(camX,camY,W/zoom,H/zoom);

  // контраст ААА: фон темнее и холоднее к краям, вокруг игрока — тёплое световое пятно
  if(!ecoOn()){
    const vw=W/zoom, vh=H/zoom;
    const dk=cx.createRadialGradient(p.x,p.y,110,p.x,p.y,Math.max(vw,vh)*0.62);
    dk.addColorStop(0,'rgba(10,8,28,0.10)');
    dk.addColorStop(1,'rgba(10,8,28,0.34)');
    cx.fillStyle=dk; cx.fillRect(camX-vw/2-8,camY-vh/2-8,vw+16,vh+16);
    const lt=cx.createRadialGradient(p.x,p.y,10,p.x,p.y,175);
    lt.addColorStop(0,'rgba(255,240,205,0.10)'); lt.addColorStop(1,'rgba(255,240,205,0)');
    cx.fillStyle=lt; cx.beginPath(); cx.arc(p.x,p.y,175,0,TAU); cx.fill();
  }

  // zones
  for(const z of G.zones){
    const a=clamp(z.t/3,0,1);
    const gr=cx.createRadialGradient(z.x,z.y,0,z.x,z.y,z.R);
    gr.addColorStop(0,'rgba(120,220,255,'+(0.22*a)+')');
    gr.addColorStop(1,'rgba(60,140,255,0)');
    cx.fillStyle=gr; cx.beginPath(); cx.arc(z.x,z.y,z.R,0,TAU); cx.fill();
    cx.strokeStyle='rgba(140,220,255,'+(0.35*a)+')'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(z.x,z.y,z.R*(0.8+0.2*Math.sin(G.time*6)),0,TAU); cx.stroke();
  }

  // move target marker
  if(G.target){
    const t=G.target, pu=(Math.sin(t.pulse)+1)/2;
    cx.strokeStyle='rgba(125,255,160,'+(0.7-pu*0.4)+')'; cx.lineWidth=2.5;
    cx.beginPath(); cx.arc(t.x,t.y,10+pu*10,0,TAU); cx.stroke();
    cx.fillStyle='rgba(125,255,160,0.9)';
    cx.beginPath(); cx.arc(t.x,t.y,3.5,0,TAU); cx.fill();
  }

  // gems
  for(const g of G.gems){
    const bob=Math.sin(g.t*4+g.x)*2;
    const big=g.v>=10, mid=g.v>=5&&!big;
    cx.fillStyle=big?'#ff5b6e':(mid?'#7dffa0':'#5ec8ff');
    cx.save(); cx.translate(g.x,g.y+bob); cx.rotate(0.785);
    // подскок при выпадении
    const pop=g.t<0.35? 0.4+0.6*(g.t/0.35)+Math.sin(Math.min(g.t*9,Math.PI))*0.45 : 1;
    const s=(big?7:(mid?6:4.5))*pop;
    cx.fillRect(-s/2,-s/2,s,s);
    cx.restore();
  }
  // pickups
  for(const u of G.pickups){
    let bob=Math.sin(u.t*3)*3;
    if(u.t<0.4) bob-=Math.abs(Math.sin(u.t*7.8))*12*(1-u.t/0.4); // подскок при дропе
    cx.font='20px serif'; cx.textAlign='center';
    const ico={gold:'🪙',chicken:'🍗',vacuum:'🧲',bomb:'💥',chest:'📦',freeze:'❄️'}[u.kind];
    if(u.kind==='gold'){ // пульсирующее золотое свечение — «полезное» читается издалека
      cx.fillStyle='rgba(255,215,106,'+(0.10+0.06*Math.sin(u.t*6))+')';
      cx.beginPath(); cx.arc(u.x,u.y,13,0,TAU); cx.fill();
    }
    if(u.kind==='chest'){ cx.font='26px serif';
      cx.fillStyle='rgba(255,215,106,'+(0.25+0.15*Math.sin(u.t*5))+')';
      cx.beginPath(); cx.arc(u.x,u.y,22,0,TAU); cx.fill();
    }
    cx.fillText(ico,u.x,u.y+7+bob);
  }

  // slashes (lightsaber arcs)
  for(const s of G.slashes){
    const k=1-s.t/s.tMax;
    const a0=-1.15+(s.dir<0?Math.PI:0), a1=1.15+(s.dir<0?Math.PI:0);
    cx.save(); cx.translate(p.x,p.y);
    const alpha=(1-k)*0.9;
    const col=s.ev?'125,240,160':'110,200,255';
    cx.strokeStyle='rgba('+col+','+alpha+')';
    cx.lineWidth=10+8*(1-k); cx.lineCap='round';
    cx.beginPath(); cx.arc(0,0,s.r*(0.6+0.4*k), a0+k*0.5*s.dir*0, a1); cx.stroke();
    cx.strokeStyle='rgba(255,255,255,'+alpha*0.8+')'; cx.lineWidth=3;
    cx.beginPath(); cx.arc(0,0,s.r*(0.6+0.4*k), a0, a1); cx.stroke();
    cx.restore();
  }

  // Telegraph ranged attacks: the target is locked when the warning appears,
  // giving the player a readable lane to dodge before the bolt is released.
  for(const e of G.enemies){
    if(!(e.aimT>0)) continue;
    const total=e.boss?0.9:0.7;
    const progress=clamp(1-e.aimT/total,0,1);
    cx.save();
    cx.strokeStyle='rgba(255,70,70,'+(0.25+progress*0.65)+')';
    cx.lineWidth=e.boss?3:2;
    cx.setLineDash([7,7]);
    cx.beginPath(); cx.moveTo(e.x,e.y-10); cx.lineTo(e.aimX,e.aimY); cx.stroke();
    cx.setLineDash([]);
    cx.strokeStyle='rgba(255,100,100,'+(0.35+progress*0.65)+')';
    cx.lineWidth=2;
    cx.beginPath(); cx.arc(e.aimX,e.aimY,10+progress*9,0,TAU); cx.stroke();
    cx.restore();
  }

  // enemies (sorted by y for pseudo-depth)
  const es=[...G.enemies].sort((a,b)=>a.y-b.y);
  for(const e of es) drawEnemy(e);

  // bullets
  for(const b of G.bullets) drawBullet(b);

  // drones
  if(G.dronesActive) for(const d of G.drones){
    if(d.x===undefined) continue;
    cx.save(); cx.translate(d.x,d.y);
    cx.fillStyle='#39c9ff'; cx.beginPath(); cx.arc(0,0,7,0,TAU); cx.fill();
    cx.fillStyle='#cfeeff'; cx.beginPath(); cx.arc(-2,-2,2.5,0,TAU); cx.fill();
    cx.strokeStyle='rgba(57,201,255,.5)'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(0,0,10+Math.sin(G.time*8+d.a)*2,0,TAU); cx.stroke();
    cx.restore();
  }

  // enemy shots
  for(const s of G.eshots){
    cx.save(); cx.translate(s.x,s.y);
    if(s.saber){
      cx.rotate(G.time*18);
      cx.strokeStyle='#ff2b2b'; cx.lineWidth=4; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(-14,0); cx.lineTo(14,0); cx.stroke();
      cx.beginPath(); cx.moveTo(0,-14); cx.lineTo(0,14); cx.stroke();
    } else {
      const a=Math.atan2(s.vy,s.vx); cx.rotate(a);
      cx.strokeStyle=s.c; cx.lineWidth=4; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(-9,0); cx.lineTo(9,0); cx.stroke();
      cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=1.5;
      cx.beginPath(); cx.moveTo(-7,0); cx.lineTo(7,0); cx.stroke();
    }
    cx.restore();
  }

  drawPlayer();

  // particles
  for(const q of G.parts){
    if(q.kind==='p'){
      cx.globalAlpha=clamp(q.t*2,0,1);
      cx.fillStyle=q.c; cx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);
      cx.globalAlpha=1;
    } else if(q.kind==='zap'){
      const a=q.t/0.14;
      cx.strokeStyle=q.ev?'rgba(255,90,255,'+a+')':'rgba(140,220,255,'+a+')';
      cx.lineWidth=2.5;
      cx.beginPath(); cx.moveTo(q.x1,q.y1);
      const seg=5;
      for(let i=1;i<=seg;i++){
        const t=i/seg;
        cx.lineTo(lerp(q.x1,q.x2,t)+(i<seg?rnd(-9,9):0), lerp(q.y1,q.y2,t)+(i<seg?rnd(-9,9):0));
      }
      cx.stroke();
      cx.fillStyle='rgba(200,240,255,'+a+')';
      cx.beginPath(); cx.arc(q.x2,q.y2,6,0,TAU); cx.fill();
    } else if(q.kind==='ring'){
      const k=1-q.t/q.tMax;
      cx.strokeStyle=q.ev?'rgba(180,120,255,'+(1-k)*0.7+')':'rgba(150,220,255,'+(1-k)*0.6+')';
      cx.lineWidth=4;
      cx.beginPath(); cx.arc(q.x,q.y,q.R*k,0,TAU); cx.stroke();
    } else if(q.kind==='pop'){
      const k=1-q.t/q.tMax;
      cx.strokeStyle='rgba('+q.c+','+((1-k)*0.8)+')'; cx.lineWidth=3;
      cx.save(); cx.translate(q.x,q.y); cx.scale(1+k*0.6,1-k*0.35);
      cx.beginPath(); cx.arc(0,0,q.R*(0.4+k*0.9),0,TAU); cx.stroke();
      cx.restore();
    } else if(q.kind==='boom'){
      const k=1-q.t/q.tMax;
      cx.fillStyle='rgba(255,170,60,'+(1-k)*0.55+')';
      cx.beginPath(); cx.arc(q.x,q.y,q.R*k,0,TAU); cx.fill();
      cx.strokeStyle='rgba(255,230,150,'+(1-k)+')'; cx.lineWidth=3;
      cx.beginPath(); cx.arc(q.x,q.y,q.R*k,0,TAU); cx.stroke();
    }
  }

  // damage texts
  cx.textAlign='center';
  for(const t of G.dmgTexts){
    cx.globalAlpha=clamp(t.t*2.2,0,1);
    cx.font=(t.crit?'bold 15px':'12px')+' Verdana';
    cx.fillStyle=t.heal?'#7dffa0':(t.crit?'#ffd76a':'#fff');
    cx.strokeStyle='rgba(0,0,0,.6)'; cx.lineWidth=3;
    cx.strokeText(t.v,t.x,t.y); cx.fillText(t.v,t.x,t.y);
    cx.globalAlpha=1;
  }

  // joystick
  cx.restore();
  if(G.joy&&G.joy.active){
    cx.strokeStyle='rgba(255,255,255,.25)'; cx.lineWidth=3;
    cx.beginPath(); cx.arc(G.joy.sx,G.joy.sy,46,0,TAU); cx.stroke();
    const dx=G.joy.x-G.joy.sx, dy=G.joy.y-G.joy.sy, d=Math.hypot(dx,dy)||1, cl=Math.min(d,46);
    cx.fillStyle='rgba(255,255,255,.3)';
    cx.beginPath(); cx.arc(G.joy.sx+dx/d*cl,G.joy.sy+dy/d*cl,20,0,TAU); cx.fill();
  }

  // метель на Хоте + ледяной оттенок при заморозке (screen-space)
  if(G.stage==='hoth'){
    cx.strokeStyle='rgba(255,255,255,.55)'; cx.lineWidth=1.5;
    for(let i=0;i<50;i++){
      const spd=90+hash2(i,2)*140;
      const sx=(hash2(i,1)*W+G.time*spd)%W, sy=(hash2(i,3)*H+G.time*spd*1.6)%H;
      cx.beginPath(); cx.moveTo(sx,sy); cx.lineTo(sx-4,sy-7); cx.stroke();
    }
  }
  if(G.freezeT>0){
    cx.fillStyle='rgba(120,190,255,'+Math.min(0.14,G.freezeT*0.1)+')';
    cx.fillRect(0,0,W,H);
  }
  drawHUD();
}

/* ---------- top HUD (screen-space; keeps Telegram top chrome clear) ---------- */
function drawHUD(){
  const p=G.p;
  // таймер по центру (ниже верхней safe-зоны Telegram)
  cx.textAlign='center'; cx.font='bold 22px Verdana';
  cx.strokeStyle='rgba(0,0,0,.75)'; cx.lineWidth=4;
  cx.strokeText(fmtTime(G.time), W/2, 84);
  cx.fillStyle=G.time>=1500?'#ff8d6b':'#fff'; cx.fillText(fmtTime(G.time), W/2, 84);
  // иконки оружия слева сверху
  let wx=10;
  cx.textAlign='left'; cx.font='15px serif';
  for(const w of p.weapons){
    cx.fillStyle='rgba(10,16,34,.72)';
    cx.beginPath(); cx.roundRect(wx,72,25,25,6); cx.fill();
    cx.fillText(WEAPONS[w.id].ico,wx+3,90);
    cx.font='bold 9px Verdana';
    cx.fillStyle=w.evolved?'#ff8d6b':'#ffd76a';
    cx.fillText(w.evolved?'EV':w.lvl,wx+14,98);
    cx.font='15px serif';
    wx+=29;
  }
  // минимальный блок HP+XP снизу слева
  const bw2=Math.min(W*0.26,190), bx=12;
  const byH=H-34, byX=H-20;
  cx.fillStyle='rgba(4,8,18,.66)';
  cx.beginPath(); cx.roundRect(bx-6,byH-6,bw2+12,32,10); cx.fill();
  const hr=clamp(p.hp/p.hpMax,0,1);
  cx.fillStyle='rgba(74,22,32,.92)'; cx.beginPath(); cx.roundRect(bx,byH,bw2,9,4.5); cx.fill();
  if(hr>0){ cx.fillStyle=hr>0.35?'#63e88e':'#ff5b67'; cx.beginPath(); cx.roundRect(bx,byH,Math.max(9,bw2*hr),9,4.5); cx.fill(); }
  const xr=clamp(p.xp/p.xpNext,0,1);
  cx.fillStyle='#182038'; cx.beginPath(); cx.roundRect(bx,byX,bw2,5,2.5); cx.fill();
  if(xr>0){ cx.fillStyle='#5ec8ff'; cx.beginPath(); cx.roundRect(bx,byX,Math.max(5,bw2*xr),5,2.5); cx.fill(); }
  cx.font='bold 10px Verdana';
  cx.strokeStyle='rgba(0,0,0,.8)'; cx.lineWidth=3;
  const hpTxt=Math.ceil(p.hp)+'/'+Math.ceil(p.hpMax);
  cx.strokeText(hpTxt, bx+bw2+10, byH+9); cx.fillStyle='#fff'; cx.fillText(hpTxt, bx+bw2+10, byH+9);
  cx.strokeText('УР '+p.lvl, bx+bw2+10, byX+6); cx.fillStyle='#ffd76a'; cx.fillText('УР '+p.lvl, bx+bw2+10, byX+6);
  // золото и убийства справа, ниже кнопки паузы
  cx.font='bold 13px Verdana'; cx.textAlign='right';
  cx.strokeStyle='rgba(0,0,0,.75)'; cx.lineWidth=3;
  cx.strokeText('💀 '+G.killCount, W-14, 132); cx.fillStyle='#fff'; cx.fillText('💀 '+G.killCount, W-14, 132);
  cx.strokeText('🪙 '+G.goldRun, W-14, 152); cx.fillStyle='#ffd76a'; cx.fillText('🪙 '+G.goldRun, W-14, 152);
  // стрелки к сундукам и боссу за краем экрана (как подсветка элит в VS)
  const zoomA=cameraZoom();
  const arrowTo=(tx,ty,color)=>{
    const sx=W/2+(tx-G.cam.x)*zoomA, sy=H/2+(ty-G.cam.y)*zoomA;
    if(sx>-10&&sx<W+10&&sy>-10&&sy<H+10) return;
    const a=Math.atan2(sy-H/2,sx-W/2);
    const ex=clamp(W/2+Math.cos(a)*W, 26, W-26), ey=clamp(H/2+Math.sin(a)*H, 46, H-46);
    cx.save(); cx.translate(ex,ey); cx.rotate(a);
    cx.fillStyle=color;
    cx.beginPath(); cx.moveTo(12,0); cx.lineTo(-7,-8); cx.lineTo(-3,0); cx.lineTo(-7,8); cx.closePath(); cx.fill();
    cx.restore();
  };
  for(const u of G.pickups) if(u.kind==='chest') arrowTo(u.x,u.y,'rgba(255,215,106,.9)');
  if(G.bossRef&&G.bossRef.hp>0) arrowTo(G.bossRef.x,G.bossRef.y,G.bossRef.emperor?'rgba(201,160,255,.9)':'rgba(255,75,75,.9)');
  // полоса босса снизу
  if(G.bossRef&&G.bossRef.hp>0&&!G.bossRef.emperor){
    const e=G.bossRef, bw=Math.min(W*0.5,440);
    cx.fillStyle='rgba(5,8,18,.8)'; cx.fillRect(W/2-bw/2-3,H-62,bw+6,22);
    cx.fillStyle='#411'; cx.fillRect(W/2-bw/2,H-59,bw,14);
    cx.fillStyle='#ff4b4b'; cx.fillRect(W/2-bw/2,H-59,bw*clamp(e.hp/e.hpMax,0,1),14);
    cx.fillStyle='#fff'; cx.font='bold 11px Verdana'; cx.textAlign='center';
    const nm={atst:'AT-ST «ИМПЕРСКИЙ ШАГОХОД»',maul:'ДАРТ МОЛ',boba:'БОБА ФЕТТ',inquis:'ВЕЛИКИЙ ИНКВИЗИТОР',vader:'ДАРТ ВЕЙДЕР'}[e.type]||'БОСС';
    cx.strokeStyle='rgba(0,0,0,.7)'; cx.lineWidth=3;
    cx.strokeText(nm, W/2, H-47); cx.fillText(nm, W/2, H-47);
  }
  if(G.bossRef&&G.bossRef.emperor){
    cx.font='bold 14px Verdana'; cx.textAlign='center';
    cx.strokeStyle='rgba(0,0,0,.8)'; cx.lineWidth=4;
    const msg='⚡ ИМПЕРАТОР ПРИШЁЛ — БЕГИ ДО 30:00 ⚡';
    cx.strokeText(msg, W/2, H-50); cx.fillStyle='#c9a0ff'; cx.fillText(msg, W/2, H-50);
  }
}

/* ---------- ground: Tatooine desert / Hoth snowfields ---------- */
const STAGE_PAL={
  tatooine:{base:'#c9a05e',rock:'#a3793f',crater:'90,60,20',bones:'#e8dcc0',tuft:'120,110,50'},
  hoth:    {base:'#dce7f2',rock:'#9fb3c8',crater:'70,95,130',bones:'#f8fcff',tuft:'140,160,195'},
};
function pal(){ return STAGE_PAL[(G&&G.stage)||'tatooine']; }
function drawGround(camX,camY,viewW,viewH){
  const P=pal();
  const TS=240;
  const x0=Math.floor((camX-viewW/2)/TS)-1, x1=Math.floor((camX+viewW/2)/TS)+1;
  const y0=Math.floor((camY-viewH/2)/TS)-1, y1=Math.floor((camY+viewH/2)/TS)+1;
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const h=hash2(tx,ty);
    const px=tx*TS, py=ty*TS;
    // subtle tile shading variation
    if(h<0.5){ cx.fillStyle='rgba(0,0,0,'+(0.02+h*0.03)+')'; cx.fillRect(px,py,TS,TS); }
    // props
    const h2=hash2(tx*7+1,ty*3+5);
    const cxp=px+hash2(tx,ty*2)*TS, cyp=py+hash2(tx*3,ty)*TS;
    if(h2<0.14){ // rock
      cx.fillStyle=P.rock;
      cx.beginPath(); cx.ellipse(cxp,cyp,14+h2*60,9+h2*40,h2*3,0,TAU); cx.fill();
      cx.fillStyle='rgba(255,255,255,.13)';
      cx.beginPath(); cx.ellipse(cxp-3,cyp-4,8+h2*30,4+h2*15,h2*3,0,TAU); cx.fill();
    } else if(h2<0.2){ // crater
      cx.strokeStyle='rgba('+P.crater+',.35)'; cx.lineWidth=3;
      cx.beginPath(); cx.arc(cxp,cyp,16+h2*40,0,TAU); cx.stroke();
      cx.fillStyle='rgba('+P.crater+',.15)';
      cx.beginPath(); cx.arc(cxp,cyp,16+h2*40,0,TAU); cx.fill();
    } else if(h2<0.25){ // krayt bones
      cx.strokeStyle=P.bones; cx.lineWidth=4; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(cxp-20,cyp); cx.quadraticCurveTo(cxp,cyp-16,cxp+22,cyp-2); cx.stroke();
      cx.lineWidth=3;
      for(let k=-1;k<=1;k++){ cx.beginPath(); cx.moveTo(cxp+k*10,cyp-8+Math.abs(k)*3); cx.lineTo(cxp+k*10,cyp+8); cx.stroke(); }
    } else if(h2<0.31){ // wreckage panel
      cx.save(); cx.translate(cxp,cyp); cx.rotate(h2*20);
      cx.fillStyle='#6f7787'; cx.fillRect(-18,-8,36,16);
      cx.fillStyle='#4d5464'; cx.fillRect(-18,-8,36,5);
      cx.fillStyle='#2c313d'; cx.fillRect(-10,0,7,5);
      cx.restore();
    } else if(h2<0.42){ // tufts
      cx.strokeStyle='rgba('+P.tuft+',.5)'; cx.lineWidth=2;
      for(let k=0;k<3;k++){ cx.beginPath(); cx.moveTo(cxp+k*5,cyp); cx.quadraticCurveTo(cxp+k*5+3,cyp-9,cxp+k*5+6,cyp-12); cx.stroke(); }
    }
  }
  // landmark terrain features (solid rocks / vaporators / huts, pits, beacons)
  const ci0=Math.floor((camX-viewW/2)/OB_CELL)-1, ci1=Math.floor((camX+viewW/2)/OB_CELL)+1;
  const cj0=Math.floor((camY-viewH/2)/OB_CELL)-1, cj1=Math.floor((camY+viewH/2)/OB_CELL)+1;
  for(let j=cj0;j<=cj1;j++) for(let i=ci0;i<=ci1;i++){
    const o=cellObstacle(i,j); if(!o) continue;
    drawTerrain(o);
  }
  // vignette (screen-space: reset world transform; gradient cached per size)
  if(!ecoOn()){
    cx.save(); cx.setTransform(DPR,0,0,DPR,0,0);
    if(!drawGround._vg||drawGround._vgW!==W||drawGround._vgH!==H){
      const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(10,5,25,0.42)');
      drawGround._vg=vg; drawGround._vgW=W; drawGround._vgH=H;
    }
    cx.fillStyle=drawGround._vg; cx.fillRect(0,0,W,H);
    cx.restore();
  }
}
function drawTerrain(o){
  cx.save(); cx.translate(o.x,o.y);
  const h=o.h*100;
  if(o.kind==='mesa'){ // столовая скала
    cx.fillStyle='rgba(0,0,0,.2)'; cx.beginPath(); cx.ellipse(6,o.r*0.55,o.r*1.05,o.r*0.42,0,0,TAU); cx.fill();
    cx.fillStyle='#8f6a35';
    cx.beginPath(); cx.ellipse(0,0,o.r,o.r*0.72,0,0,TAU); cx.fill();
    cx.fillStyle='#a87f42';
    cx.beginPath(); cx.ellipse(-4,-14,o.r*0.86,o.r*0.55,0,0,TAU); cx.fill();
    cx.fillStyle='#c49a55';
    cx.beginPath(); cx.ellipse(-6,-26,o.r*0.7,o.r*0.4,0,0,TAU); cx.fill();
    cx.fillStyle='rgba(255,235,190,.25)';
    cx.beginPath(); cx.ellipse(-14,-32,o.r*0.4,o.r*0.18,0,0,TAU); cx.fill();
    cx.strokeStyle='rgba(70,45,15,.4)'; cx.lineWidth=2;
    for(let k=0;k<4;k++){ const a=h*0.7+k*1.7; cx.beginPath(); cx.moveTo(Math.cos(a)*o.r*0.8,Math.sin(a)*o.r*0.5); cx.lineTo(Math.cos(a)*o.r*0.55,Math.sin(a)*o.r*0.3-14); cx.stroke(); }
  } else if(o.kind==='vap'){ // влагоуловитель
    cx.fillStyle='rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(3,10,20,8,0,0,TAU); cx.fill();
    cx.fillStyle='#9aa0ad'; cx.fillRect(-6,-58,12,66);
    cx.fillStyle='#6f7787'; cx.fillRect(-6,-58,4,66);
    for(let k=0;k<3;k++){ cx.fillStyle='#c7ccd6'; cx.fillRect(-13,-52+k*16,26,6); cx.fillStyle='#8a8f9c'; cx.fillRect(-13,-52+k*16,26,2); }
    cx.fillStyle='#2c313d'; cx.fillRect(-4,-64,8,7);
    cx.fillStyle=Math.sin(G?G.time*3:0)>0?'#ff4b4b':'#5b1a1a'; cx.fillRect(-2,-62,4,3);
  } else if(o.kind==='hut'){ // купольная хижина
    cx.fillStyle='rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(5,o.r*0.5,o.r*1.05,o.r*0.4,0,0,TAU); cx.fill();
    cx.fillStyle='#e8dcc0';
    cx.beginPath(); cx.ellipse(0,0,o.r,o.r*0.62,0,Math.PI,0); cx.lineTo(o.r,o.r*0.28); cx.ellipse(0,o.r*0.28,o.r,o.r*0.3,0,0,Math.PI); cx.closePath(); cx.fill();
    cx.fillStyle='#d3c3a0';
    cx.beginPath(); cx.ellipse(0,o.r*0.28,o.r,o.r*0.3,0,0,Math.PI); cx.fill();
    cx.fillStyle='#5a4a30';
    cx.beginPath(); cx.ellipse(o.r*0.45,o.r*0.2,o.r*0.22,o.r*0.3,0,Math.PI,0); cx.fill();
    cx.strokeStyle='rgba(120,100,60,.5)'; cx.lineWidth=2;
    cx.beginPath(); cx.ellipse(0,-o.r*0.1,o.r*0.7,o.r*0.35,0,Math.PI*1.1,Math.PI*1.9); cx.stroke();
  } else if(o.kind==='pit'){ // яма сарлакка — опасная зона
    const t=G?G.time:0;
    cx.fillStyle='rgba(40,22,8,.55)';
    cx.beginPath(); cx.ellipse(0,0,o.r,o.r*0.8,0,0,TAU); cx.fill();
    cx.fillStyle='rgba(15,8,3,.8)';
    cx.beginPath(); cx.ellipse(0,0,o.r*0.66,o.r*0.5,0,0,TAU); cx.fill();
    cx.strokeStyle='rgba(180,120,60,.5)'; cx.lineWidth=3;
    cx.beginPath(); cx.ellipse(0,0,o.r*(0.94+Math.sin(t*2)*0.03),o.r*0.76,0,0,TAU); cx.stroke();
    // зубы по краю
    cx.fillStyle='#d8c9a8';
    for(let k=0;k<10;k++){ const a=k/10*TAU+t*0.15;
      const tx=Math.cos(a)*o.r*0.6, ty=Math.sin(a)*o.r*0.46;
      cx.beginPath(); cx.moveTo(tx,ty); cx.lineTo(tx*0.82,ty*0.82); cx.lineTo(tx*0.95+3,ty*0.95+3); cx.closePath(); cx.fill(); }
    // щупальце
    const wob=Math.sin(t*2.2)*8;
    cx.strokeStyle='#6a4a28'; cx.lineWidth=5; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(0,0); cx.quadraticCurveTo(14,-26+wob,4+wob,-42); cx.stroke();
  } else if(o.kind==='beacon'){ // маяк повстанцев — лечит
    const t=G?G.time:0, bl=(Math.sin(t*4)+1)/2;
    const gr=cx.createRadialGradient(0,0,6,0,0,o.r);
    gr.addColorStop(0,'rgba(90,200,255,'+(0.16+bl*0.08)+')'); gr.addColorStop(1,'rgba(90,200,255,0)');
    cx.fillStyle=gr; cx.beginPath(); cx.arc(0,0,o.r,0,TAU); cx.fill();
    cx.strokeStyle='rgba(120,220,255,'+(0.3+bl*0.25)+')'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(0,0,o.r*(0.85+bl*0.1),0,TAU); cx.stroke();
    cx.fillStyle='rgba(0,0,0,.22)'; cx.beginPath(); cx.ellipse(2,8,14,6,0,0,TAU); cx.fill();
    cx.fillStyle='#8a8f9c'; cx.fillRect(-3,-38,6,44);
    cx.fillStyle='#c7ccd6'; cx.fillRect(-3,-38,2,44);
    cx.fillStyle='rgba(120,220,255,'+(0.6+bl*0.4)+')';
    cx.beginPath(); cx.arc(0,-44,6+bl*2,0,TAU); cx.fill();
    cx.fillStyle='#fff'; cx.beginPath(); cx.arc(0,-44,2.5,0,TAU); cx.fill();
    cx.font='bold 10px Verdana'; cx.textAlign='center'; cx.fillStyle='rgba(140,230,255,.8)';
    cx.fillText('+HP',0,26);
  }
  cx.restore();
}

/* ---------- player (jedi, high-contrast light robes) ---------- */
function drawPlayer(){
  const p=G.p, t=p.walkT;
  const bob=p.moving?Math.abs(Math.sin(t))*3:Math.sin(G.time*2)*1.2;
  const legA=p.moving?Math.sin(t)*6:0;
  cx.save(); cx.translate(p.x,p.y-bob);
  // shadow (before flip, symmetric anyway)
  cx.fillStyle='rgba(0,0,0,.3)';
  cx.beginPath(); cx.ellipse(0,14+bob,13,5,0,0,TAU); cx.fill();
  cx.scale(p.face,1);
  if(p.inv>0&&Math.floor(p.inv*20)%2===0) cx.globalAlpha=0.45;
  const OUT='#241a10'; // тёмная обводка для контраста на песке
  // legs (dark trousers + boots)
  cx.strokeStyle='#3a3226'; cx.lineWidth=5; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(-3,2); cx.lineTo(-3+legA*0.5,13); cx.stroke();
  cx.beginPath(); cx.moveTo(4,2); cx.lineTo(4-legA*0.5,13); cx.stroke();
  cx.fillStyle='#1e1812';
  cx.fillRect(-6+legA*0.5,11,6,4); cx.fillRect(1-legA*0.5,11,6,4); // boots
  // robe body — light cream tunic with dark outline
  cx.fillStyle='#f4ecd9';
  cx.strokeStyle=OUT; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(-9,-9); cx.quadraticCurveTo(-13,8,-8,11); cx.lineTo(8,11); cx.quadraticCurveTo(13,8,9,-9); cx.closePath();
  cx.fill(); cx.stroke();
  // inner tunic V + belt
  cx.fillStyle='#d9cdb0';
  cx.beginPath(); cx.moveTo(-4,-9); cx.lineTo(0,-2); cx.lineTo(4,-9); cx.closePath(); cx.fill();
  cx.fillStyle='#4a341f';
  cx.fillRect(-9,-1,18,4); // тёмный пояс
  cx.fillStyle='#c8a54a'; cx.fillRect(-2,-1,4,4); // пряжка
  // arms
  cx.strokeStyle='#f4ecd9'; cx.lineWidth=4.5;
  const swinging=p.swingT>0;
  const armA=p.moving?Math.sin(t+1)*3:0;
  cx.beginPath(); cx.moveTo(-6,-5); cx.lineTo(-10,3+armA); cx.stroke();
  // head — визор-капюшон убран: тёмные волосы, светлое лицо
  cx.fillStyle='#ffdbb0'; cx.strokeStyle=OUT; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(1,-15,6.5,0,TAU); cx.fill(); cx.stroke();
  cx.fillStyle='#2e2016';
  cx.beginPath(); cx.arc(0,-17,6.6,Math.PI*0.95,Math.PI*1.95); cx.fill(); // волосы
  cx.fillStyle='#1c140c'; cx.fillRect(3,-16,2.4,1.8); // глаз
  // saber arm + lightsaber with swing animation
  const evo=p.weapons.find(w=>w.id==='saber'&&w.evolved);
  const bladeCol=evo?'#7df0a0':'#3fb6ff';
  let saberA;
  if(swinging){
    const k=1-p.swingT/0.24; // 0→1
    const ease=k<0.5? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    saberA=-2.5+ease*3.1; // замах из-за головы вниз-вперёд
    // ghost trail
    for(let g2=1;g2<=2;g2++){
      const ga=-2.5+Math.max(0,ease-g2*0.22)*3.1;
      cx.save(); cx.translate(9,-4); cx.rotate(ga);
      cx.globalAlpha=(p.inv>0&&Math.floor(p.inv*20)%2===0?0.45:1)*0.18/g2;
      cx.fillStyle=bladeCol; cx.fillRect(-2.2,-30,4.4,30);
      cx.restore();
    }
    cx.globalAlpha=p.inv>0&&Math.floor(p.inv*20)%2===0?0.45:1;
  } else {
    saberA=-0.9+Math.sin(G.time*30)*0.05;
  }
  // saber arm
  cx.strokeStyle='#f4ecd9'; cx.lineWidth=4.5;
  const hx=9+Math.cos(saberA+1.5)*4, hy=-4+Math.sin(saberA+1.5)*4;
  cx.beginPath(); cx.moveTo(5,-6); cx.lineTo(hx,hy); cx.stroke();
  cx.save(); cx.translate(hx,hy); cx.rotate(saberA);
  cx.fillStyle='#9aa5b5'; cx.fillRect(-1.5,0,3,8); // hilt
  cx.fillStyle='#2c313d'; cx.fillRect(-1.5,3,3,2);
  cx.shadowColor=bladeCol; cx.shadowBlur=swinging?18:12;
  cx.fillStyle=bladeCol; cx.fillRect(-2.4,-28,4.8,28);
  cx.shadowBlur=0;
  cx.fillStyle='#f2fbff'; cx.fillRect(-1,-27,2,27);
  cx.restore();
  cx.restore();
  cx.globalAlpha=1;
}

/* ---------- enemies ---------- */
function drawEnemy(e){
  // спавн-портал: тёмная тень растёт из земли, враг выпрыгивает с overshoot
  let spS=1;
  if(e.spawnT>0){
    const k=clamp(1-e.spawnT/0.45,0,1);
    cx.save(); cx.translate(e.x,e.y);
    cx.fillStyle='rgba(24,10,44,'+(0.55*Math.min(1,k*2.2))+')';
    cx.beginPath(); cx.ellipse(0,e.r*0.5,e.r*1.25*Math.min(1,k*1.5),e.r*0.5*Math.min(1,k*1.5),0,0,TAU); cx.fill();
    cx.strokeStyle='rgba(170,110,255,'+(0.7*(1-k))+')'; cx.lineWidth=2;
    cx.beginPath(); cx.ellipse(0,e.r*0.5,e.r*1.45*k+2,e.r*0.58*k+1,0,0,TAU); cx.stroke();
    cx.restore();
    if(k<0.3) return;
    const kk=(k-0.3)/0.7, c1=1.7;
    spS=1+(c1+1)*Math.pow(kk-1,3)+c1*Math.pow(kk-1,2);
  }
  const bob=e.fly? Math.sin(G.time*4+e.seed*9)*4 : Math.abs(Math.sin(e.walkT))*2.5;
  const legA=Math.sin(e.walkT)*5;
  cx.save(); cx.translate(e.x,e.y-(e.fly?12+bob:bob));
  // shadow
  cx.fillStyle='rgba(0,0,0,.22)';
  cx.beginPath(); cx.ellipse(0,(e.fly?24:e.r*0.85),e.r*0.8,e.r*0.3,0,0,TAU); cx.fill();
  cx.scale(e.face,1);
  // squash & stretch при получении урона (flash → сжатие)
  if(e.flash>0){ const sq=e.flash*1.2; cx.scale(spS*(1+sq*0.5),spS*(1-sq)); }
  else if(spS!==1) cx.scale(spS,spS);
  if(e.telegraph>0){ // charge warning glow
    cx.shadowColor='#ff3b3b'; cx.shadowBlur=18;
  } else if((e.elite||e.boss)&&!ecoOn()){ // rim-свечение угрозы у элит и боссов
    cx.shadowColor=e.emperor?'#b06aff':'#ff3b3b'; cx.shadowBlur=12;
  }
  switch(e.draw){
    case 'trooper': drawTrooper(legA,'#e8e8ee','#16161c'); break;
    case 'heavy': cx.scale(1.35,1.35); drawTrooper(legA,'#d8d8de','#8c1d1d'); break;
    case 'scout': drawScout(); break;
    case 'b1': drawB1(legA); break;
    case 'probe': drawProbe(); break;
    case 'dark': drawDark(legA, e); break;
    case 'sith': drawSith(legA,e); break;
    case 'tusken': drawTusken(legA,e); break;
    case 'jawa': drawJawa(legA,e); break;
    case 'interro': drawInterro(e); break;
    case 'magna': drawMagna(legA,e); break;
    case 'deka': drawDeka(e); break;
    case 'officer': drawOfficer(legA,e); break;
    case 'wampa': drawWampa(legA,e); break;
    case 'crate': drawCrate(e); break;
    case 'atst': drawATST(e); break;
    case 'maul': drawMaul(legA,e); break;
    case 'boba': drawBoba(e); break;
    case 'inquis': drawInquis(legA,e); break;
    case 'vader': drawVader(legA,e); break;
    case 'emperor': drawEmperor(legA,e); break;
  }
  cx.shadowBlur=0;
  // ледяная корка при заморозке
  if(G.freezeT>0&&!e.emperor){
    cx.fillStyle='rgba(150,210,255,.35)';
    cx.beginPath(); cx.arc(0,-e.r*0.3,e.r+3,0,TAU); cx.fill();
  }
  // hit flash
  if(e.flash>0){
    cx.globalCompositeOperation='source-atop';
    cx.globalAlpha=e.flash*8;
    cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
    cx.fillStyle='rgba(255,255,255,'+clamp(e.flash*7,0,0.8)+')';
    cx.beginPath(); cx.arc(0,-e.r*0.3,e.r,0,TAU); cx.fill();
  }
  cx.restore();
  // hp bar for elites/bosses
  if((e.elite||e.boss)&&e.hp<e.hpMax){
    const w=e.boss?60:36;
    cx.fillStyle='rgba(0,0,0,.5)'; cx.fillRect(e.x-w/2,e.y-e.r-20,w,5);
    cx.fillStyle=e.boss?'#ff4b4b':'#ffd76a'; cx.fillRect(e.x-w/2,e.y-e.r-20,w*clamp(e.hp/e.hpMax,0,1),5);
  }
}

function drawJawa(legA,e){
  cx.fillStyle='#3d2c14';
  cx.beginPath(); cx.moveTo(-7,-6); cx.quadraticCurveTo(-9,6,-6,10); cx.lineTo(6,10); cx.quadraticCurveTo(9,6,7,-6); cx.closePath(); cx.fill();
