<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<link rel="icon" href="data:,">
<title>Каркассон</title>
<style>
  :root{
    --bg:#0e1420; --panel:#161f30; --panel2:#1c2740; --line:#2a3752; --text:#eef2ff; --muted:#8fa0c4;
    --gold:#c9a34e; --gold2:#8a6d34;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 14px;font-size:14px;}
  button:active{transform:scale(.96);}
  button:disabled{opacity:.35;cursor:default;}
  button.primary{background:linear-gradient(150deg,var(--gold),var(--gold2));color:#221a06;font-weight:700;}
  button.ghost{background:transparent;border:1px solid var(--line);}
  h1,h2,h3{margin:0 0 8px;}
  .hidden{display:none !important;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:auto;padding:16px;padding-top:calc(16px + var(--safe-top,0px));}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .between{justify-content:space-between;}
  .muted{color:var(--muted);font-size:12px;}
  .pill{padding:4px 10px;border-radius:20px;background:var(--panel2);font-size:12px;}

  /* ---- setup ---- */
  .setup-seat{background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .seat-dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(255,255,255,.35);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{border-radius:0;background:transparent;padding:7px 12px;font-size:13px;}
  .seg button.on{background:var(--panel2);color:#fff;font-weight:700;}

  /* ---- game ---- */
  .topbar{display:flex;align-items:center;gap:8px;background:var(--panel);padding:8px 12px;padding-top:calc(8px + var(--safe-top,0px));border-bottom:1px solid var(--line);}
  .scoreboard{display:flex;gap:6px;overflow-x:auto;flex:1;}
  .score-chip{background:var(--panel2);border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;border:2px solid transparent;display:flex;align-items:center;gap:6px;}
  .score-chip.active{border-color:var(--gold);}
  .score-chip .mk{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.4);}
  #boardWrap{flex:1;position:relative;overflow:hidden;background:
     radial-gradient(ellipse at 50% 32%,#16233a,#0b1120);}
  #boardScroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;}
  #boardLayer{position:relative;transform-origin:0 0;}
  .tile{position:absolute;width:100px;height:100px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.36));}
  .tileFrame{position:relative;width:100px;height:100px;border-radius:8px;background:#314a25;isolation:isolate;overflow:hidden;box-shadow:0 0 0 2px rgba(5,9,8,.88),inset 0 1px 0 rgba(255,255,255,.16);}
  .tileFrame::before{content:"";position:absolute;inset:0;border-radius:8px;z-index:7;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .tileVisual{position:absolute;inset:0;border-radius:8px;background-size:cover;background-position:center;transform-origin:50% 50%;z-index:3;}
  .tileSide{display:none;}
  .tileOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
  .meepleSprite{position:absolute;z-index:8;transform:translate(-50%,-72%);object-fit:contain;filter:drop-shadow(0 8px 5px rgba(0,0,0,.62));pointer-events:none;}
  .meepleSprite.meeple-farmer{transform:translate(-50%,-50%);}
  #drawTile{overflow:hidden;}
  #drawTile .tileFrame{width:66px;height:66px;border-radius:8px;}
  .slot{position:absolute;border:2px dashed rgba(201,163,78,.75);border-radius:8px;background:rgba(201,163,78,.14);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:22px;}
  .slot:active{background:rgba(201,163,78,.3);}
  .slot.best{border-color:#7ff2a0;background:rgba(120,255,160,.2);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .meepleBtn{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),rgba(0,0,0,.72));border:2px solid #7ff2a0;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:12;box-shadow:0 0 0 3px rgba(0,0,0,.32),0 8px 12px rgba(0,0,0,.45);}
  .meepleBtn img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));}
  .meepleBtn:active{transform:translate(-50%,-50%) scale(.9);}

  #bottomBar{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
  .draw-wrap{display:flex;align-items:center;gap:10px;}
  #drawTile{width:66px;height:66px;flex:0 0 auto;border-radius:8px;overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.4);}
  .hintline{font-size:13px;line-height:1.35;}
  .toast{position:absolute;top:calc(10px + var(--safe-top,0px));left:50%;transform:translateX(-50%);background:#1c2740;border:1px solid var(--line);padding:8px 14px;border-radius:20px;font-size:13px;z-index:70;max-width:90%;text-align:center;}
  .fab{position:absolute;right:10px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:40;}
  .fab button{width:42px;height:42px;border-radius:50%;background:rgba(20,28,46,.85);border:1px solid var(--line);font-size:17px;padding:0;}

  /* ---- modal ---- */
  .modal-back{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;}
  .modal{background:var(--panel);border-radius:16px;padding:16px;max-width:440px;width:100%;max-height:86vh;overflow:auto;position:relative;}
  .close-x{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.08);border-radius:50%;width:30px;height:30px;padding:0;}
  .sess-item{background:var(--panel2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .final-row{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--panel2);margin-bottom:6px;}
  .final-row.win{background:linear-gradient(150deg,var(--gold),var(--gold2));color:#221a06;font-weight:700;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== SETUP ===== -->
  <div class="screen" id="scrSetup">
    <h1>🏰 Каркассон</h1>
    <p class="muted">Выкладывай тайлы, замыкай города и дороги, ставь миплов и считай очки. Локально: до 5 игроков за одним устройством + боты.</p>
    <div class="col" id="seatList" style="margin-top:12px;"></div>
    <div class="row" style="margin-top:10px;">
      <button id="btnAddSeat">+ Игрок</button>
      <button id="btnRmSeat">− Игрок</button>
    </div>
    <p class="muted" style="margin-top:14px;">Крестьяне лежат в полях и приносят очки в конце партии за завершённые города рядом с их полем.</p>
    <div style="flex:1"></div>
    <div class="col" id="resumeBox"></div>
    <button class="primary" id="btnStart" style="padding:14px;font-size:16px;margin-top:10px;">Начать игру</button>
  </div>

  <!-- ===== GAME ===== -->
  <div class="screen hidden" id="scrGame" style="padding:0;">
    <div class="topbar">
      <button class="ghost" id="btnExit" style="padding:8px 10px;">✕</button>
      <div class="scoreboard" id="scoreboard"></div>
    </div>
    <div id="boardWrap">
      <div id="boardScroll"><div id="boardLayer"></div></div>
      <div class="fab">
        <button id="btnZoomIn">＋</button>
        <button id="btnZoomOut">－</button>
        <button id="btnCenter">◎</button>
      </div>
      <div class="toast hidden" id="toast"></div>
    </div>
    <div id="bottomBar">
      <div class="draw-wrap">
        <div id="drawTile"></div>
        <div style="flex:1;min-width:0;">
          <div class="hintline" id="hintLine">—</div>
          <div class="row" style="margin-top:6px;gap:6px;">
            <button id="btnRotate">🔄 Повернуть</button>
            <button id="btnSkipMeeple" class="hidden">Пропустить мипла</button>
          </div>
        </div>
      </div>
      <div class="row between" style="margin-top:8px;gap:6px;">
        <button class="ghost" id="btnUndo" style="flex:1;">↩️ Отменить</button>
        <button class="ghost" id="btnHint" style="flex:1;">💡 Подсказка</button>
        <button class="ghost" id="btnMenu" style="flex:1;">☰ Меню</button>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
</div>

<script>
"use strict";
/* ===================== SAFE AREA / TELEGRAM ===================== */
(function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    if(tg){ tg.expand && tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }
  }catch(e){}
  document.documentElement.style.setProperty('--safe-top','env(safe-area-inset-top,0px)');
})();
function exitGame(){ try{ window.parent.postMessage("hexland:exit","*"); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function $(id){ return document.getElementById(id); }

/* ===================== GEOMETRY ===================== */
const IDX={N:0,E:1,S:2,W:3};
const SIDES=['N','E','S','W'];
const OPP={N:'S',E:'W',S:'N',W:'E'};
const DIRV={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};
function rotSide(s,t){ return SIDES[(IDX[s]+t)%4]; }              // повернуть сторону по часовой на t шагов
function key(x,y){ return x+","+y; }
function parseKey(k){ const p=k.split(","); return [ +p[0], +p[1] ]; }

/* ===================== TILE CATALOG =====================
   edges: строка NESW из c(город)/r(дорога)/f(поле).
   cities: список городов, каждый = список сторон (соединённых в один город).
   roads:  список дорог, каждая = список концов-сторон (2=прямая/поворот, 1=упирается в центр).
   pennant: щит (в единственном городе тайла) → +2 очка.
   monastery: монастырь в центре. */
const RAW = [
  ['mon',    'ffff', {monastery:true},                                   4],
  ['monR',   'ffrf', {monastery:true, roads:[['S']]},                    2],
  ['cityAll','cccc', {cities:[['N','E','S','W']], pennant:true},          1],
  ['city1',  'cfff', {cities:[['N']]},                                    6],
  ['city2oP','cfcf', {cities:[['N','S']], pennant:true},                  2],
  ['city2o', 'cfcf', {cities:[['N','S']]},                               1],
  ['city2s', 'cfcf', {cities:[['N'],['S']]},                            3],
  ['city2a', 'ccff', {cities:[['N','E']]},                              3],
  ['city2aP','ccff', {cities:[['N','E']], pennant:true},                 2],
  ['city3',  'ccfc', {cities:[['N','E','W']]},                          3],
  ['city3P', 'ccfc', {cities:[['N','E','W']], pennant:true},             1],
  ['city3R', 'ccrc', {cities:[['N','E','W']], roads:[['S']]},           1],
  ['city3RP','ccrc', {cities:[['N','E','W']], roads:[['S']], pennant:true},2],
  ['cityRd', 'rcrf', {cities:[['E']], roads:[['N','S']]},               5],
  ['cityCv1','crrf', {cities:[['N']], roads:[['E','S']]},               3],
  ['cityCv2','cfrr', {cities:[['N']], roads:[['S','W']]},               3],
  ['cityT',  'crrr', {cities:[['N']], roads:[['E'],['S'],['W']]},       3],
  ['city2aR','ccrr', {cities:[['N','E']], roads:[['S','W']]},           2],
  ['city2aRP','ccrr',{cities:[['N','E']], roads:[['S','W']], pennant:true},2],
  ['roadS',  'rfrf', {roads:[['N','S']]},                               8],
  ['roadC',  'ffrr', {roads:[['S','W']]},                              10],
  ['roadT',  'frrr', {roads:[['E'],['S'],['W']]},                       4],
  ['roadX',  'rrrr', {roads:[['N'],['E'],['S'],['W']]},                 1],
];

// Поля нельзя строить просто как "все f-края тайла вместе": дороги и города
// разрезают луга. Для фермеров держим явные регионы и какие города они касаются.
const FIELD_SPECS={
  mon:       [{sides:['N','E','S','W'], cities:[]}],
  monR:      [{sides:['N','E','W'], cities:[]}],
  city1:     [{sides:['E','S','W'], cities:['N']}],
  city2oP:   [{sides:['E'], cities:['N','S']}, {sides:['W'], cities:['N','S']}],
  city2o:    [{sides:['E'], cities:['N','S']}, {sides:['W'], cities:['N','S']}],
  city2s:    [{sides:['E'], cities:['N','S']}, {sides:['W'], cities:['N','S']}],
  city2a:    [{sides:['S','W'], cities:['N','E']}],
  city2aP:   [{sides:['S','W'], cities:['N','E']}],
  city3:     [{sides:['S'], cities:['N','E','W']}],
  city3P:    [{sides:['S'], cities:['N','E','W']}],
  cityRd:    [{sides:['W'], cities:[]}],
  cityCv1:   [{sides:['W'], cities:['N']}],
  cityCv2:   [{sides:['E'], cities:['N']}],
  roadS:     [{sides:['E'], cities:[]}, {sides:['W'], cities:[]}],
  roadC:     [{sides:['N','E'], cities:[]}],
  roadT:     [{sides:['N'], cities:[]}],
};

// собрать каталог с feats (city*/road*/field*)
const CAT={};
RAW.forEach(([id,edges,spec])=>{
  const feats=[];
  (spec.cities||[]).forEach((sides,i)=>feats.push({kind:'city',sides:sides.slice(),pennant:!!spec.pennant && i===0}));
  (spec.roads||[]).forEach(sides=>feats.push({kind:'road',sides:sides.slice()}));
  (FIELD_SPECS[id]||[]).forEach(f=>feats.push({kind:'field',sides:f.sides.slice(),cities:(f.cities||[]).slice()}));
  CAT[id]={ id, edges:edges.split(''), feats, monastery:!!spec.monastery };
});
const START_TYPE='cityRd';
const TILE_ART={field:'assets/tiles/field.png?v=wizard3-restored'};
RAW.forEach(([id])=>{ TILE_ART[id]='assets/tiles/'+id+'.png?v=wizard3-restored'; });

// поворот тайла: кеш {edges[], feats[], monastery}
const _rotCache={};
function rotTile(t){
  const ck=t.type+"@"+t.rot;
  if(_rotCache[ck]) return _rotCache[ck];
  const base=CAT[t.type], r=t.rot%4;
  const edges=[0,0,0,0];
  for(let i=0;i<4;i++) edges[(i+r)%4]=base.edges[i];     // сдвиг NESW вправо на r
  const feats=base.feats.map(f=>({kind:f.kind,sides:f.sides.map(s=>rotSide(s,r)),cities:(f.cities||[]).map(s=>rotSide(s,r)),pennant:f.pennant}));
  return _rotCache[ck]={edges,feats,monastery:base.monastery};
}
function featIndexForSide(feats,side,kind){
  for(let i=0;i<feats.length;i++){ const f=feats[i]; if(f.kind===kind && f.sides.indexOf(side)>=0) return i; }
  return -1;
}

/* ===================== GAME STATE =====================
   Всё авторитетное состояние — в G (plain object). Граф фич (comps) — чистая функция от
   board+meeplePlacements, пересобирается через buildFeatures. Это делает undo тривиальным. */
const PLAYER_COLORS=["#eb5757","#3a7bd5","#27ae60","#f2c94c","#8e5fd6"];
const PLAYER_NAMES=["Красный","Синий","Зелёный","Жёлтый","Фиолетовый"];
const MEEPLES_PER=7;
const TS=100;                 // логический размер тайла (px в layer до scale)
let G=null;                   // текущая игра
let seats=[{ai:false},{ai:true}];
let ui={ phase:'idle', rot:0, valid:[], placedKey:null, best:null };
let zoom=0.82;
let undoStack=[];

/* ---- union-find по фичам ---- */
function buildFeatures(g){
  const nodes={}, parent={};
  function find(a){ while(parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; }
  function uni(a,b){ a=find(a); b=find(b); if(a!==b) parent[a]=b; }
  for(const k in g.board){
    const rt=rotTile(g.board[k]);
    rt.feats.forEach((f,ci)=>{ const id=k+"#"+ci; parent[id]=id; nodes[id]={k,ci,f}; });
  }
  for(const k in g.board){
    const [x,y]=parseKey(k), rt=rotTile(g.board[k]);
    for(const dir of SIDES){
      const [dx,dy]=DIRV[dir], nk=key(x+dx,y+dy), nb=g.board[nk];
      if(!nb) continue;
      const et=rt.edges[IDX[dir]];
      if(et!=='c'&&et!=='r'&&et!=='f') continue;
      const kind=et==='c'?'city':et==='r'?'road':'field';
      const myCi=featIndexForSide(rt.feats,dir,kind);
      const nbCi=featIndexForSide(rotTile(nb).feats,OPP[dir],kind);
      if(myCi>=0 && nbCi>=0) uni(k+"#"+myCi, nk+"#"+nbCi);
    }
  }
  const byRoot={};
  for(const id in nodes){
    const r=find(id), n=nodes[id];
    let c=byRoot[r];
    if(!c) c=byRoot[r]={root:r,type:n.f.kind,tiles:new Set(),ports:[],pennants:0,fieldCities:[],meeples:[],mps:[]};
    c.tiles.add(n.k);
    n.f.sides.forEach(s=>c.ports.push({k:n.k,side:s}));
    if(n.f.kind==='field') (n.f.cities||[]).forEach(s=>c.fieldCities.push({k:n.k,side:s}));
    if(n.f.pennant) c.pennants++;
  }
  g.meeplePlacements.forEach(mp=>{
    if(mp.kind==='monastery') return;
    const id=mp.key+"#"+mp.ci, r=parent[id]!=null?find(id):null;
    if(r && byRoot[r]){ byRoot[r].meeples.push(mp.player); byRoot[r].mps.push(mp); }
  });
  return { comps:Object.values(byRoot), find, has:(id)=>parent[id]!=null };
}
function openPorts(comp,g){
  let o=0;
  comp.ports.forEach(p=>{ const [x,y]=parseKey(p.k), [dx,dy]=DIRV[p.side]; if(!g.board[key(x+dx,y+dy)]) o++; });
  return o;
}
function neighborsPresent(g,k){
  const [x,y]=parseKey(k); let n=0;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){ if(!dx&&!dy)continue; if(g.board[key(x+dx,y+dy)]) n++; }
  return n;
}

/* ---- размещение ---- */
function edgesOf(t){ return rotTile(t).edges; }
function canPlace(g,x,y,type,rot){
  if(g.board[key(x,y)]) return false;
  const e=edgesOf({type,rot}); let nb=false,ok=true;
  for(const dir of SIDES){
    const [dx,dy]=DIRV[dir], n=g.board[key(x+dx,y+dy)];
    if(n){ nb=true; if(e[IDX[dir]] !== edgesOf(n)[IDX[OPP[dir]]]) ok=false; }
  }
  return nb && ok;
}
function frontier(g){
  const set={};
  for(const k in g.board){ const [x,y]=parseKey(k);
    for(const dir of SIDES){ const [dx,dy]=DIRV[dir], nk=key(x+dx,y+dy); if(!g.board[nk]) set[nk]=1; } }
  return Object.keys(set);
}
function allPlacements(g,type){
  const res=[];
  frontier(g).forEach(k=>{ const [x,y]=parseKey(k);
    for(let r=0;r<4;r++) if(canPlace(g,x,y,type,r)) res.push({x,y,rot:r,k}); });
  return res;
}

/* ===================== SCORING ===================== */
function scoreValue(comp,complete){
  if(comp.type==='city') return complete ? 2*comp.tiles.size+2*comp.pennants : comp.tiles.size+comp.pennants;
  if(comp.type==='road') return comp.tiles.size; // дорога: 1/тайл в любом случае
  return 0;
}
function majority(players){
  const cnt={}; players.forEach(p=>cnt[p]=(cnt[p]||0)+1);
  let mx=0; for(const p in cnt) mx=Math.max(mx,cnt[p]);
  return Object.keys(cnt).filter(p=>cnt[p]===mx).map(Number);
}
// разрешить всё, что замкнулось этим ходом (placedKey). Возвращает список событий для тоста.
function resolveCompletions(g,placedKey){
  const F=buildFeatures(g), events=[], removeMp=new Set();
  F.comps.forEach(c=>{
    if(c.type==='field') return;
    if(!c.tiles.has(placedKey)) return;
    if(c.meeples.length===0) return;
    if(openPorts(c,g)!==0) return;
    const pts=scoreValue(c,true), win=majority(c.meeples);
    win.forEach(p=>g.scores[p]+=pts);
    c.meeples.forEach(p=>g.meeplesLeft[p]++);
    c.mps.forEach(mp=>removeMp.add(mp));
    events.push({icon:c.type==='city'?'🏰':'🛣️', pts, win});
  });
  // монастыри в окрестности 3×3 (включая сам тайл)
  const [px,py]=parseKey(placedKey);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    const mk=key(px+dx,py+dy), t=g.board[mk];
    if(!t || !CAT[t.type].monastery) continue;
    const owner=g.monMeeples[mk];
    if(owner==null) continue;
    if(neighborsPresent(g,mk)===8){
      g.scores[owner]+=9; g.meeplesLeft[owner]++; delete g.monMeeples[mk];
      events.push({icon:'⛪',pts:9,win:[owner]});
    }
  }
  if(removeMp.size) g.meeplePlacements=g.meeplePlacements.filter(mp=>!removeMp.has(mp));
  return events;
}
function completedCitiesTouchingField(comp,g,F){
  const roots=new Set();
  (comp.fieldCities||[]).forEach(ref=>{
    const rt=rotTile(g.board[ref.k]);
    const ci=featIndexForSide(rt.feats,ref.side,'city');
    if(ci<0) return;
    const id=ref.k+"#"+ci;
    if(!F.has(id)) return;
    const root=F.find(id);
    const city=F.comps.find(c=>c.root===root);
    if(city && openPorts(city,g)===0) roots.add(root);
  });
  return roots.size;
}
// финальный подсчёт незамкнутых фич + недостроенных монастырей
function finalScore(g){
  const F=buildFeatures(g);
  F.comps.forEach(c=>{
    if(c.meeples.length===0) return;
    if(c.type==='field'){
      const pts=completedCitiesTouchingField(c,g,F)*3;
      if(pts>0) majority(c.meeples).forEach(p=>g.scores[p]+=pts);
      return;
    }
    if(openPorts(c,g)===0) return; // замкнутые уже посчитаны при игре
    const pts=scoreValue(c,false), win=majority(c.meeples);
    win.forEach(p=>g.scores[p]+=pts);
  });
  for(const mk in g.monMeeples){
    const owner=g.monMeeples[mk];
    g.scores[owner]+=1+neighborsPresent(g,mk);
  }
}

/* ===================== FEATURE OPTIONS (для мипла) ===================== */
// какие фичи только что положенного тайла свободны под мипла
function meepleOptions(g,placedKey){
  const t=g.board[placedKey], rt=rotTile(t), opts=[];
  if(g.meeplesLeft[g.cur]<=0) return opts;
  const F=buildFeatures(g);
  rt.feats.forEach((f,ci)=>{
    const id=placedKey+"#"+ci, r=F.find(id);
    const comp=F.comps.find(c=>c.root===r);
    if(comp && comp.meeples.length===0) opts.push({kind:f.kind,ci,feat:f});
  });
  if(rt.monastery && g.monMeeples[placedKey]==null) opts.push({kind:'monastery',ci:-1,feat:null});
  return opts;
}

/* ===================== RENDER: TILE PNG + ROLE MEEPLE PNG ===================== */
const MID={N:[50,8],E:[92,50],S:[50,92],W:[8,50]};
function meepleRole(kind){ return kind==='city'?'knight':kind==='road'?'robber':kind==='field'?'farmer':'mage'; }
function meepleAsset(kind,player){ return `assets/meeples/${meepleRole(kind)}-${player%PLAYER_COLORS.length}.png?v=ai3d1`; }
function meepleSprite(x,y,kind,player,size){
  const role=meepleRole(kind), src=meepleAsset(kind,player), sz=size||34;
  return `<img class="meepleSprite meeple-${role}" src="${src}" alt="" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px">`;
}
function tileSVG(t, meeples, colorOf){
  const rot=(((t.rot||0)%4)+4)%4;
  const art=TILE_ART[t.type] || TILE_ART.field;
  let m='';
  (meeples||[]).forEach(mp=>{ m+=meepleSprite(mp.pt[0],mp.pt[1],mp.kind,mp.player,meepleRole(mp.kind)==='farmer'?48:54); });
  return `<div class="tileFrame">`+
    `<div class="tileVisual" style="background-image:url('${art}');transform:rotate(${rot*90}deg)"></div>`+
    m+
  `</div>`;
}
function featPoint(feat){
  if(feat.kind==='monastery') return [50,58];
  if(feat.kind==='road'){ const m=MID[feat.sides[0]]; return [(m[0]+50)/2,(m[1]+50)/2]; }
  if(feat.kind==='field'){
    if(feat.sides.length>=4) return [30,74];
    const ss=feat.sides.slice().sort().join('');
    if(ss==='NS') return [50,30];
    if(ss==='EW') return [30,50];
    let x=0,y=0; feat.sides.forEach(s=>{x+=MID[s][0];y+=MID[s][1];}); x/=feat.sides.length; y/=feat.sides.length;
    return [Math.max(26,Math.min(74,x)), Math.max(26,Math.min(74,y))];
  }
  let x=0,y=0; feat.sides.forEach(s=>{x+=MID[s][0];y+=MID[s][1];}); x/=feat.sides.length; y/=feat.sides.length;
  return [(x+50)/2,(y+50)/2];
}
/* ===================== RENDER: BOARD ===================== */
function boardBounds(g,extra){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  const add=(x,y)=>{minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);};
  for(const k in g.board){ const [x,y]=parseKey(k); add(x,y); }
  (extra||[]).forEach(p=>add(p.x,p.y));
  minX--;minY--;maxX++;maxY++;
  return {minX,minY,maxX,maxY};
}
function colorOf(p){ return PLAYER_COLORS[p%PLAYER_COLORS.length]; }
let layoutOff={x:0,y:0};
function renderBoard(){
  const g=G, layer=$('boardLayer');
  const b=boardBounds(g, ui.phase==='place'? ui.valid : []);
  layoutOff={x:b.minX,y:b.minY};
  const W=(b.maxX-b.minX+1)*TS, H=(b.maxY-b.minY+1)*TS;
  layer.style.width=W+'px'; layer.style.height=H+'px'; layer.style.transform='scale('+zoom+')';
  $('boardScroll').style.setProperty('--w',W);
  let html='';
  // тайлы + миплы
  for(const k in g.board){
    const [x,y]=parseKey(k), t=g.board[k], rt=rotTile(t);
    const mps=[];
    g.meeplePlacements.forEach(mp=>{ if(mp.key===k && mp.kind!=='monastery'){ mps.push({player:mp.player,kind:mp.kind,pt:featPoint(rt.feats[mp.ci])}); } });
    if(g.monMeeples[k]!=null) mps.push({player:g.monMeeples[k],kind:'monastery',pt:[50,58]});
    const L=(x-b.minX)*TS, T=(y-b.minY)*TS;
    html+=`<div class="tile" style="left:${L}px;top:${T}px;">${tileSVG(t,mps,colorOf)}</div>`;
  }
  // слоты для размещения
  if(ui.phase==='place'){
    ui.valid.forEach(v=>{
      const L=(v.x-b.minX)*TS, T=(v.y-b.minY)*TS;
      const isBest=ui.best && ui.best.x===v.x && ui.best.y===v.y && ui.best.rot===ui.rot;
      html+=`<div class="slot${isBest?' best':''}" style="left:${L+4}px;top:${T+4}px;width:${TS-8}px;height:${TS-8}px;" data-x="${v.x}" data-y="${v.y}">＋</div>`;
    });
  }
  // кнопки-миплы (фаза meeple)
  if(ui.phase==='meeple' && ui.placedKey){
    const [x,y]=parseKey(ui.placedKey), t=g.board[ui.placedKey], rt=rotTile(t);
    const L=(x-b.minX)*TS, T=(y-b.minY)*TS;
    ui.meepleOpts.forEach(o=>{
      const pt=o.kind==='monastery'?[50,58]:featPoint(o.feat);
      const label=o.kind==='city'?'Рыцарь':o.kind==='road'?'Разбойник':o.kind==='field'?'Крестьянин':'Маг';
      html+=`<div class="meepleBtn" role="button" aria-label="${label}" style="left:${L+pt[0]/100*TS}px;top:${T+pt[1]/100*TS}px;" data-mopt="${o.ci}" data-mkind="${o.kind}"><img src="${meepleAsset(o.kind,G.cur)}" alt=""></div>`;
    });
  }
  layer.innerHTML=html;
  // навесить обработчики на слоты
  layer.querySelectorAll('.slot').forEach(el=>el.addEventListener('click',()=>onPlaceAt(+el.dataset.x,+el.dataset.y)));
  layer.querySelectorAll('.meepleBtn').forEach(el=>el.addEventListener('click',()=>onPlaceMeeple(el.dataset.mkind, +el.dataset.mopt)));
}
function centerOn(x,y){
  const sc=$('boardScroll'), b=boardBounds(G, ui.phase==='place'?ui.valid:[]);
  const L=(x-b.minX)*TS*zoom, T=(y-b.minY)*TS*zoom;
  sc.scrollLeft=L - sc.clientWidth/2 + TS*zoom/2;
  sc.scrollTop =T - sc.clientHeight/2 + TS*zoom/2;
}

/* ===================== TOAST ===================== */
let toastT=null;
function toast(msg,ms){ const el=$('toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.add('hidden'), ms||1800); }

/* ===================== TURN FLOW ===================== */
function snapshot(){ return JSON.stringify({board:G.board,deck:G.deck,scores:G.scores,meeplesLeft:G.meeplesLeft,meeplePlacements:G.meeplePlacements,monMeeples:G.monMeeples,cur:G.cur,drawn:G.drawn}); }
function pushUndo(){ undoStack.push(snapshot()); if(undoStack.length>40) undoStack.shift(); }
function doUndo(){
  if(!undoStack.length) return;
  const s=JSON.parse(undoStack.pop());
  G.board=s.board; G.deck=s.deck; G.scores=s.scores; G.meeplesLeft=s.meeplesLeft;
  G.meeplePlacements=s.meeplePlacements; G.monMeeples=s.monMeeples; G.cur=s.cur; G.drawn=s.drawn;
  ui.phase='place'; ui.rot=0; ui.placedKey=null; ui.best=null;
  ui.valid=allPlacements(G,G.drawn);
  saveSession(); render();
  toast('Ход отменён');
}
function nextTurn(){
  // конец игры?
  if(G.deck.length===0){ endGame(); return; }
  G.cur=(G.cur+1)%G.players.length;
  drawForCurrent();
}
function drawForCurrent(){
  pushUndo();
  // взять тайл, у которого есть хоть одно легальное место (иначе сбрасываем)
  let tile=null, guard=0;
  while(G.deck.length && guard++<80){
    const cand=G.deck[G.deck.length-1];
    if(allPlacements(G,cand).length){ tile=G.deck.pop(); break; }
    G.deck.pop(); // некуда положить — сбрасываем
  }
  if(!tile){ endGame(); return; }
  G.drawn=tile; ui.rot=0; ui.placedKey=null; ui.best=null;
  ui.valid=allPlacements(G,tile);
  ui.phase = G.players[G.cur].ai ? 'ai' : 'place';
  saveSession(); render(); mpPublish(false);
  if(G.players[G.cur].ai){ setTimeout(aiTurn, 620); }
  else { const v=ui.valid[0]; if(v) centerOn(v.x,v.y); }
}
function onRotate(){
  if(ui.phase!=='place') return;
  ui.rot=(ui.rot+1)%4;
  ui.valid=allPlacements(G,G.drawn).filter(v=>v.rot===ui.rot);
  if(!ui.valid.length){ // нет мест в этом повороте — покажем все и подскажем
    ui.valid=allPlacements(G,G.drawn); toast('В этом повороте мест нет — крути дальше');
  }
  render();
}
function currentRotValid(){ return allPlacements(G,G.drawn).filter(v=>v.rot===ui.rot); }
function onPlaceAt(x,y){
  if(ui.phase!=='place') return;
  if(MP.active){
    if(G.cur!==MP.seat) return;                       // не мой ход
    let rot=ui.rot;
    if(!canPlace(G,x,y,G.drawn,rot)){ for(let r=0;r<4;r++) if(canPlace(G,x,y,G.drawn,r)){ rot=r; break; } }
    if(!canPlace(G,x,y,G.drawn,rot)) return;
    if(!MP.isHost){ mpSend({type:'mp:intent',intent:{kind:'place',x:x,y:y,rot:rot}}); return; }
  }
  if(!canPlace(G,x,y,G.drawn,ui.rot)){
    // попробуем найти поворот, подходящий сюда
    for(let r=0;r<4;r++) if(canPlace(G,x,y,G.drawn,r)){ ui.rot=r; break; }
    if(!canPlace(G,x,y,G.drawn,ui.rot)) return;
  }
  placeTile(x,y,ui.rot);
}
function placeTile(x,y,rot){
  const k=key(x,y);
  G.board[k]={type:G.drawn,rot}; G.drawn=null; ui.placedKey=k;
  ui.meepleOpts=meepleOptions(G,k);
  if(ui.meepleOpts.length){ ui.phase='meeple'; render(); centerOn(x,y); }
  else finishTurn();
}
function onPlaceMeeple(kind,ci){
  if(ui.phase!=='meeple') return;
  if(MP.active){
    if(G.cur!==MP.seat) return;
    if(!MP.isHost){ mpSend({type:'mp:intent',intent:{kind:'meeple',what:kind,ci:ci}}); return; }
  }
  if(kind==='monastery') G.monMeeples[ui.placedKey]=G.cur;
  else G.meeplePlacements.push({key:ui.placedKey,ci:ci,kind:kind,player:G.cur});
  G.meeplesLeft[G.cur]--;
  finishTurn();
}
function onSkipMeeple(){
  if(ui.phase!=='meeple') return;
  if(MP.active){
    if(G.cur!==MP.seat) return;
    if(!MP.isHost){ mpSend({type:'mp:intent',intent:{kind:'skip'}}); return; }
  }
  finishTurn();
}
function finishTurn(){
  const ev=resolveCompletions(G, ui.placedKey);
  ui.phase='between';
  render();
  if(ev.length){
    const msg=ev.map(e=>{
      const names=e.win.map(p=>G.players[p].name).join(', ');
      return `${e.icon} +${e.pts} → ${names}`;
    }).join('   ');
    toast(msg, 2200);
  }
  saveSession();
  setTimeout(nextTurn, ev.length?900:350);
}

/* ===================== AI ===================== */
function aiTurn(){
  const g=G, type=g.drawn, places=allPlacements(g,type);
  if(!places.length){ nextTurn(); return; }
  let best=null,bestScore=-1e9;
  places.forEach(pl=>{
    const k=key(pl.x,pl.y);
    g.board[k]={type,rot:pl.rot};
    let sc=aiEvalPlacement(g,k,pl);
    delete g.board[k];
    sc += (Math.random()*0.4);
    if(sc>bestScore){ bestScore=sc; best=pl; }
  });
  // разместить
  const k=key(best.x,best.y);
  g.board[k]={type,rot:best.rot}; g.drawn=null; ui.placedKey=k;
  // выбор мипла
  const opts=meepleOptions(g,k);
  const pick=aiPickMeeple(g,k,opts);
  render(); centerOn(best.x,best.y);
  setTimeout(()=>{
    if(pick){ if(pick.kind==='monastery') g.monMeeples[k]=g.cur; else g.meeplePlacements.push({key:k,ci:pick.ci,kind:pick.kind,player:g.cur}); g.meeplesLeft[g.cur]--; }
    finishTurn();
  }, 520);
}
function aiEvalPlacement(g,k,pl){
  // немедленные очки за замыкания с моим миплом + бонус за развитие своих фич
  const F=buildFeatures(g); let sc=0;
  F.comps.forEach(c=>{
    if(!c.tiles.has(k)) return;
    const closed=openPorts(c,g)===0;
    const mine=c.meeples.filter(p=>p===g.cur).length;
    const oppMax=Math.max(0,...c.meeples.filter(p=>p!==g.cur).map(()=>1));
    if(closed && c.meeples.length && majority(c.meeples).indexOf(g.cur)>=0) sc+=scoreValue(c,true)*3;
    if(mine>0 && !closed) sc+=c.tiles.size*0.6;                 // растим свои
    if(oppMax>0 && closed && majority(c.meeples).indexOf(g.cur)<0) sc-=1; // помогли врагу — плохо
  });
  // монастыри рядом (свои)
  const [px,py]=parseKey(k);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){ const mk=key(px+dx,py+dy),t=g.board[mk];
    if(t&&CAT[t.type].monastery&&g.monMeeples[mk]===g.cur) sc+=neighborsPresent(g,mk)===8?9:0.5; }
  return sc;
}
function aiPickMeeple(g,k,opts){
  if(!opts.length || g.meeplesLeft[g.cur]<=0) return null;
  // ценность: монастырь > город > дорога; учитываем размер потенциала
  const F=buildFeatures(g);
  let best=null,bv=-1;
  opts.forEach(o=>{
    let v=0;
    if(o.kind==='monastery') v=6 + neighborsPresent(g,k);
    else if(o.kind==='field'){
      const id=k+"#"+o.ci, r=F.find(id), comp=F.comps.find(c=>c.root===r);
      const cityCount=comp?completedCitiesTouchingField(comp,g,F):0;
      const open=comp?openPorts(comp,g):4;
      v=1 + cityCount*3 - open*0.12;
    }
    else{
      const id=k+"#"+o.ci, r=F.find(id), comp=F.comps.find(c=>c.root===r);
      const size=comp?comp.tiles.size:1, open=comp?openPorts(comp,g):2;
      v=(o.kind==='city'?4:2) + size - open*0.7 + (comp?comp.pennants*2:0);
    }
    if(v>bv){ bv=v; best=o; }
  });
  // если бедно и миплов мало — иногда воздержаться
  if(g.meeplesLeft[g.cur]<=2 && bv<3) return null;
  return best;
}

/* ===================== HINT ===================== */
function doHint(){
  if(ui.phase!=='place'){ toast('Подсказка — во время выкладки тайла'); return; }
  const places=allPlacements(G,G.drawn);
  if(!places.length) return;
  let best=null,bv=-1e9;
  places.forEach(pl=>{ const k=key(pl.x,pl.y); G.board[k]={type:G.drawn,rot:pl.rot};
    let v=aiEvalPlacement(G,k,pl); delete G.board[k]; if(v>bv){bv=v;best=pl;} });
  ui.best=best; ui.rot=best.rot;
  ui.valid=allPlacements(G,G.drawn).filter(v=>v.rot===best.rot);
  render(); centerOn(best.x,best.y);
  toast('💡 Рекомендованный ход подсвечен');
}

/* ===================== END ===================== */
function endGame(){
  finalScore(G);
  ui.phase='end';
  mpPublish(true);
  const order=G.players.map((p,i)=>({i,name:p.name,ai:p.ai,score:G.scores[i]})).sort((a,b)=>b.score-a.score);
  const win=order[0].score;
  clearSession();
  const rows=order.map(o=>`<div class="final-row${o.score===win?' win':''}"><span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${colorOf(o.i)};margin-right:8px"></span>${esc(o.name)}${o.ai?' 🤖':''}</span><b>${o.score}</b></div>`).join('');
  openModal(`<h2>🏁 Итоги</h2>${rows}
    <div class="row" style="margin-top:12px;gap:8px;">
      <button class="primary" style="flex:1" onclick="location.reload()">Ещё партия</button>
      <button style="flex:1" onclick="exitGame()">В игры</button>
    </div>`);
}

   <div class="col muted" style="font-size:13px;line-height:1.5;color:#c7d2ee">
    <p><b>Ход:</b> возьми тайл → поверни 🔄 → положи на подсвеченную клетку (края должны совпадать: город к городу, дорога к дороге, поле к полю).</p>
    <p><b>Мипл:</b> после укладки можешь поставить одного мипла на <b>🏰 город</b>, <b>🛣️ дорогу</b>, <b>🌾 поле</b> или <b>⛪ монастырь</b> этого тайла — но только если на этой фиче ещё нет чужих/своих миплов. У каждого 7 миплов.</p>
    <p><b>Очки при замыкании:</b> город — 2 за тайл + 2 за щит; дорога — 1 за тайл; монастырь — 9, когда окружён 8 тайлами. Мипл возвращается.</p>
    <p><b>Конец:</b> когда закончились тайлы — недостроенные города (1/тайл+1/щит), дороги (1/тайл), монастыри (1+соседи) и крестьяне (3 за каждый завершённый город рядом с полем) досчитываются. Больше всех очков — победа.</p>
   </div>`);
}

/* ===================== SESSIONS ===================== */
const SESS_KEY="carc.session.v1";
function saveSession(){ try{ localStorage.setItem(SESS_KEY, JSON.stringify({players:G.players, state:snapshot(), t:Date.now()})); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} }
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)); }catch(e){ return null; } }

/* ===================== SETUP UI ===================== */
function renderSeats(){
  $('seatList').innerHTML=seats.map((s,i)=>`
    <div class="setup-seat">
      <div class="row" style="gap:10px">
        <span class="seat-dot" style="background:${colorOf(i)}"></span>
        <b>${PLAYER_NAMES[i]}</b>
      </div>
      <div class="seg">
        <button data-seat="${i}" data-ai="0" class="${s.ai?'':'on'}">🧑 Человек</button>
        <button data-seat="${i}" data-ai="1" class="${s.ai?'on':''}">🤖 Бот</button>
      </div>
    </div>`).join('');
  $('seatList').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    seats[+b.dataset.seat].ai = b.dataset.ai==='1'; renderSeats();
  }));
  $('btnRmSeat').disabled = seats.length<=2;
  $('btnAddSeat').disabled = seats.length>=5;
}
function renderResume(){
  const s=loadSession();
  if(!s){ $('resumeBox').innerHTML=''; return; }
  $('resumeBox').innerHTML=`<div class="sess-item">
     <div><b>▶ Продолжить</b><div class="muted">${s.players.length} игрока · ${new Date(s.t).toLocaleString('ru')}</div></div>
     <div class="row" style="gap:6px"><button class="primary" id="btnResume">Играть</button><button id="btnDropSess">🗑</button></div>
   </div>`;
  $('btnResume').addEventListener('click',()=>resumeGame(s));
  $('btnDropSess').addEventListener('click',()=>{ clearSession(); renderResume(); });
}

/* ===================== NEW / RESUME GAME ===================== */
function buildDeck(){
  const deck=[];
  RAW.forEach(([id,,,count])=>{ for(let i=0;i<count;i++) deck.push(id); });
  // убрать один стартовый тайл
  const si=deck.indexOf(START_TYPE); if(si>=0) deck.splice(si,1);
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  return deck;
}
function newGame(){
  const players=seats.map((s,i)=>({name:PLAYER_NAMES[i],ai:s.ai}));
  G={
    players,
    board:{ '0,0':{type:START_TYPE,rot:0} },
    deck:buildDeck(),
    scores:players.map(()=>0),
    meeplesLeft:players.map(()=>MEEPLES_PER),
    meeplePlacements:[],
    monMeeples:{},
    cur:-1, drawn:null,
  };
  undoStack=[];
  $('scrSetup').classList.add('hidden'); $('scrGame').classList.remove('hidden');
  nextTurn();
  setTimeout(()=>centerOn(0,0),60);
}
function resumeGame(sess){
  const s=JSON.parse(sess.state);
  G={ players:sess.players, board:s.board, deck:s.deck, scores:s.scores, meeplesLeft:s.meeplesLeft,
      meeplePlacements:s.meeplePlacements, monMeeples:s.monMeeples, cur:s.cur, drawn:s.drawn };
  undoStack=[];
  $('scrSetup').classList.add('hidden'); $('scrGame').classList.remove('hidden');
  if(G.drawn){
    ui.rot=0; ui.valid=allPlacements(G,G.drawn); ui.phase=G.players[G.cur].ai?'ai':'place'; render();
    if(G.players[G.cur].ai) setTimeout(aiTurn,600);
  }else nextTurn();
  setTimeout(()=>centerOn(0,0),60);
}

/* ===================== RENDER ROOT ===================== */
function render(){ renderBoard(); renderHUD(); }

/* ===================== WIRE ===================== */
$('btnAddSeat').addEventListener('click',()=>{ if(seats.length<5){ seats.push({ai:true}); renderSeats(); } });
$('btnRmSeat').addEventListener('click',()=>{ if(seats.length>2){ seats.pop(); renderSeats(); } });
$('btnStart').addEventListener('click',newGame);
$('btnExit').addEventListener('click',()=>{ saveSession(); exitGame(); });
$('btnRotate').addEventListener('click',onRotate);
$('btnSkipMeeple').addEventListener('click',onSkipMeeple);

$('btnHint').addEventListener('click',doHint);
$('btnMenu').addEventListener('click',openMenu);
$('btnZoomIn').addEventListener('click',()=>{ zoom=Math.min(1.4,zoom+0.15); render(); });
$('btnZoomOut').addEventListener('click',()=>{ zoom=Math.max(0.45,zoom-0.15); render(); });
$('btnCenter').addEventListener('click',()=>{ if(ui.placedKey){const[x,y]=parseKey(ui.placedKey);centerOn(x,y);}else centerOn(0,0); });
renderSeats(); renderResume();

/* ===================== MULTIPLAYER BRIDGE =====================
   Правила считает клиент-ведущий: он применяет ходы и рассылает снапшот.
   Остальные шлют намерения и накатывают присланное состояние. */
const MP={active:false,isHost:false,seat:0,players:[]};
function mpSend(msg){ try{ parent.postMessage(Object.assign({source:'carcassonne'},msg),'*'); }catch(e){} }
function mpPublish(finished){
  if(!MP.active||!MP.isHost||!G) return;
  mpSend({type:'mp:snapshot',snapshot:snapshot(),turnIndex:G.cur,finished:finished===true});
}
function mpApplySnapshot(raw){
  if(!G) return;
  let s; try{ s=JSON.parse(raw); }catch(e){ return; }
  G.board=s.board; G.deck=s.deck; G.scores=s.scores; G.meeplesLeft=s.meeplesLeft;
  G.meeplePlacements=s.meeplePlacements; G.monMeeples=s.monMeeples; G.cur=s.cur; G.drawn=s.drawn;
  undoStack=[];                                      // чужую партию откатывать нельзя
  ui.rot=0; ui.placedKey=null; ui.best=null; ui.meepleOpts=[];
  if(G.drawn){ ui.valid=allPlacements(G,G.drawn); ui.phase='place'; }
  else { ui.valid=[]; ui.phase='between'; }
  render();
}
function mpHandleIntent(from,intent){
  if(!MP.isHost||!G||!intent) return;
  if(G.cur!==from) return;                           // ходит не он — молча игнорируем
  if(intent.kind==='place'){
    if(ui.phase!=='place') return;
    if(!canPlace(G,intent.x,intent.y,G.drawn,intent.rot)) return;
    placeTile(intent.x,intent.y,intent.rot);
  } else if(intent.kind==='meeple'){
    if(ui.phase!=='meeple') return;
    if(intent.what==='monastery') G.monMeeples[ui.placedKey]=G.cur;
    else G.meeplePlacements.push({key:ui.placedKey,ci:intent.ci,kind:intent.what,player:G.cur});
    G.meeplesLeft[G.cur]--;
    finishTurn();
  } else if(intent.kind==='skip'){
    if(ui.phase!=='meeple') return;
    finishTurn();
  }
}
function mpStart(){
  G={
    players:MP.players.map(p=>({name:p.name,ai:p.bot===true})),
    board:{ '0,0':{type:START_TYPE,rot:0} },
    deck:buildDeck(),
    scores:MP.players.map(()=>0),
    meeplesLeft:MP.players.map(()=>MEEPLES_PER),
    meeplePlacements:[],
    monMeeples:{},
    cur:-1, drawn:null,
  };
  undoStack=[];
  $('scrSetup').classList.add('hidden'); $('scrGame').classList.remove('hidden');
  setTimeout(()=>centerOn(0,0),60);
  if(MP.isHost) nextTurn();                          // колоду тасует ведущий, остальные ждут снапшот
  else render();
}
window.addEventListener('message',function(e){
  const d=e.data;
  if(!d||typeof d!=='object'||d.source==='carcassonne') return;
  if(d.type==='mp:init'){
    MP.active=true; MP.isHost=d.isHost===true; MP.seat=d.seat|0; MP.players=d.players||[];
    mpStart();
    if(d.snapshot) mpApplySnapshot(d.snapshot);      // вернулись в идущую партию
  } else if(d.type==='mp:host'){
    MP.isHost=d.isHost===true;                       // ведущий сменился — подхватываем роль
    if(MP.isHost&&G&&!G.drawn&&ui.phase!=='end') nextTurn();
  } else if(d.type==='mp:snapshot'){
    if(!MP.isHost) mpApplySnapshot(d.snapshot);
  } else if(d.type==='mp:intent'){
    mpHandleIntent(d.from|0,d.intent);
  }
});
mpSend({type:'mp:ready'});

/* ===================== SELF-TEST (для проверки движка) ===================== */
window.CARC={
  state:()=>G, buildFeatures, canPlace, rotTile, CAT, RAW,
  // headless: сыграть N полных случайных партий до конца (вкл. эндгейм) и проверить инварианты
  simulate(n){
    let err=null, samples=[];
    for(let it=0; it<(n||30) && !err; it++){
      const g={players:[{name:'A',ai:true},{name:'B',ai:true}], board:{'0,0':{type:START_TYPE,rot:0}},
        deck:buildDeck(), scores:[0,0], meeplesLeft:[MEEPLES_PER,MEEPLES_PER], meeplePlacements:[], monMeeples:{}, cur:0, drawn:null};
      let turns=0;
      try{
        while(g.deck.length){
          let tile=null,guard=0;
          while(g.deck.length && guard++<90){ const c=g.deck[g.deck.length-1]; if(allPlacements(g,c).length){ tile=g.deck.pop(); break; } g.deck.pop(); }
          if(!tile) break;
          const places=allPlacements(g,tile), pl=places[Math.floor(Math.random()*places.length)], k=key(pl.x,pl.y);
          g.board[k]={type:tile,rot:pl.rot};
          const opts=meepleOptions(g,k);
          if(opts.length && g.meeplesLeft[g.cur]>0 && Math.random()<0.7){
            const o=opts[Math.floor(Math.random()*opts.length)];
            if(o.kind==='monastery') g.monMeeples[k]=g.cur; else g.meeplePlacements.push({key:k,ci:o.ci,kind:o.kind,player:g.cur});
            g.meeplesLeft[g.cur]--;
          }
          resolveCompletions(g,k);
          g.cur=(g.cur+1)%2; turns++;
        }
        finalScore(g);
        const inv = g.meeplesLeft.every(m=>m>=0&&m<=MEEPLES_PER) && g.scores.every(s=>s>=0) && (g.meeplePlacements.length+Object.keys(g.monMeeples).length) === (2*MEEPLES_PER - g.meeplesLeft[0] - g.meeplesLeft[1]);
        samples.push({turns, tiles:Object.keys(g.board).length, scores:g.scores, meeplesLeft:g.meeplesLeft, inv});
      }catch(e){ err=String(e&&e.stack||e); }
    }
    return JSON.stringify({error:err, ranGames:samples.length, allInvariantsOk:samples.every(s=>s.inv), sample:samples.slice(0,3)});
  },
  selftest(){
    const out=[];
    const ok=(n,c)=>out.push((c?'✅':'❌')+' '+n);
    // 1. поворот: cityRd edges rcrf, rot1 → должно стать f r c r (сдвиг вправо)
    const e0=rotTile({type:'cityRd',rot:0}).edges.join('');
    const e1=rotTile({type:'cityRd',rot:1}).edges.join('');
    ok('rot0 cityRd = rcrf', e0==='rcrf');
    ok('rot1 cityRd = frcr', e1==='frcr');
    // 2. сопоставление краёв: город к городу можно, город к полю нельзя
    const g={board:{'0,0':{type:'cityAll',rot:0}}};
    ok('city-to-field запрещён', canPlace(g,1,0,'roadS',0)===false); // roadS восток=f, cityAll восток=c → нет
    ok('нужен сосед', canPlace(g,5,5,'cityAll',0)===false);
    // 3. замкнутая дорога из 2 тайлов cityRd (город E) — соединяем по вертикали дорогой N-S
    //    cityRd: N=r,S=r. Поставим два вертикально: дорога N у одного упрётся в дорогу S другого.
    const g2={board:{'0,0':{type:'roadS',rot:0}}, meeplePlacements:[], monMeeples:{}, scores:[0,0], meeplesLeft:[7,7], players:[{},{}], cur:0};
    // roadS edges rfrf (N=r,S=r). сосед сверху 0,-1 roadS, снизу 0,1 — оба roadS
    g2.board['0,-1']={type:'roadS',rot:0}; g2.board['0,1']={type:'roadS',rot:0};
    // это ещё не замкнуто (концы у -1 сверху и 1 снизу открыты) — проверим что не complete
    let F=buildFeatures(g2); let road=F.comps.find(c=>c.type==='road');
    ok('дорога 3 тайла не замкнута', road && openPorts(road,g2)>0);
    // замкнём поворотами сверху и снизу (roadC: S,W → повернём чтобы дать заглушку)
    // проще: заглушки cityRd (город + дорога) не подойдут по краям. Проверим монастырь.
    const g3={board:{}, meeplePlacements:[], monMeeples:{'0,0':0}, scores:[0,0], meeplesLeft:[6,7], players:[{name:'A'},{name:'B'}], cur:0};
    g3.board['0,0']={type:'mon',rot:0};
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){ if(dx||dy) g3.board[key(dx,dy)]={type:'mon',rot:0}; }
    const ev=resolveCompletions(g3,'1,1'); // положили последний угол
    ok('монастырь замкнут = 9 очков', g3.scores[0]===9);
    ok('мипл вернулся', g3.meeplesLeft[0]===7 && g3.monMeeples['0,0']===undefined);
    // 4. счёт города: замкнутый город из 2 половинок city1 (N) навстречу
    const g4={board:{'0,0':{type:'city1',rot:0}, '0,-1':{type:'city1',rot:2}}, meeplePlacements:[{key:'0,0',ci:0,kind:'city',player:0}], monMeeples:{}, scores:[0,0], meeplesLeft:[6,7], players:[{name:'A'},{name:'B'}], cur:0};
    // city1 rot0: N=c. city1 rot2: N→S значит город на S у верхнего тайла (0,-1) смотрит вниз в (0,0).N → замыкается
    F=buildFeatures(g4); const city=F.comps.find(c=>c.type==='city');
    ok('город 2 тайла замкнут', city && openPorts(city,g4)===0);
    const ev2=resolveCompletions(g4,'0,-1');
    ok('город 2 тайла = 4 очка', g4.scores[0]===4);
    // 5. поля: city1 имеет поле, крестьянин лежит до финального подсчёта
    const g5={board:{'0,0':{type:'city1',rot:0}}, meeplePlacements:[], monMeeples:{}, scores:[0,0], meeplesLeft:[7,7], players:[{name:'A'},{name:'B'}], cur:0};
    ok('поле доступно под крестьянина', meepleOptions(g5,'0,0').some(o=>o.kind==='field'));
    const roadFields=rotTile({type:'roadS',rot:0}).feats.filter(f=>f.kind==='field');
    ok('прямая дорога делит поля слева/справа', roadFields.length===2 && roadFields.every(f=>f.sides.length===1));
    g5.board['0,-1']={type:'city1',rot:2};
    g5.meeplePlacements.push({key:'0,0',ci:1,kind:'field',player:0});
    finalScore(g5);
    ok('крестьянин = 3 очка за завершённый город у поля', g5.scores[0]===3);
    return out.join('\n');
  }
};
</script>
