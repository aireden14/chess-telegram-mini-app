<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nebula Drift</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

  function resize() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  new ResizeObserver(resize).observe(canvas);

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var worldSeed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  var rng = mulberry32(worldSeed);
  function rand(min, max) { return min + rng() * (max - min); }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

  var NEON = [190, 320, 300, 170, 210, 45];

  function hsla(hue, sat, light, alpha) {
    return "hsla(" + hue + "," + sat + "%," + light + "%," + alpha + ")";
  }

  var SAVE_KEY = "gamepass.nebula-drift.highscore.v1";
  var highScore = 0;
  try { highScore = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0; } catch (e) {}

  var stars = [];
  (function initStars() {
    var layers = [
      { n: 70, speed: 22, size: [0.6, 1.2], alpha: 0.5 },
      { n: 45, speed: 46, size: [1, 1.8], alpha: 0.75 },
      { n: 22, speed: 78, size: [1.4, 2.6], alpha: 1 }
    ];
    layers.forEach(function (layer) {
      for (var i = 0; i < layer.n; i++) {
        stars.push({
          x: rand(0, 1), y: rand(0, 1),
          size: rand(layer.size[0], layer.size[1]),
          speed: layer.speed, alpha: layer.alpha * rand(0.6, 1)
        });
      }
    });
  })();

  var blobs = [];
  function spawnBlob() {
    blobs.push({
      x: rand(0.05, 0.95), y: -0.15,
      r: rand(0.16, 0.4),
      hue: pick(NEON),
      alpha: rand(0.08, 0.18),
      driftX: rand(-0.01, 0.01),
      speed: rand(0.012, 0.03),
      phase: rand(0, Math.PI * 2)
    });
  }
  for (var bi = 0; bi < 5; bi++) { spawnBlob(); blobs[bi].y = rand(0, 1); }

  var planets = [];
  function maybeSpawnPlanet() {
    if (rng() > 0.15) return;
    planets.push({
      x: rand(0.1, 0.9), y: -0.1, r: rand(0.05, 0.11),
      hue: pick(NEON), speed: rand(0.006, 0.012)
    });
  }

  function advanceWorld(dt) {
    stars.forEach(function (s) {
      s.y += (s.speed * dt) / H;
      if (s.y > 1.02) { s.y = -0.02; s.x = rand(0, 1); }
    });
    blobs.forEach(function (b) {
      b.y += b.speed * dt;
      b.x += b.driftX * dt;
      b.phase += dt * 0.6;
    });
    for (var i = blobs.length - 1; i >= 0; i--) {
      if (blobs[i].y - blobs[i].r > 1.2) { blobs.splice(i, 1); spawnBlob(); }
    }
    planets.forEach(function (p) { p.y += p.speed * dt; });
    for (var j = planets.length - 1; j >= 0; j--) {
      if (planets[j].y - planets[j].r > 1.2) planets.splice(j, 1);
    }
    if (rng() < dt * 0.05) maybeSpawnPlanet();
  }

  function drawBackground() {
    ctx.fillStyle = "#05060a";
    ctx.fillRect(0, 0, W, H);

    blobs.forEach(function (b) {
      var r = b.r * H * (1 + Math.sin(b.phase) * 0.08);
      var x = b.x * W, y = b.y * H;
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, hsla(b.hue, 100, 65, b.alpha));
      g.addColorStop(1, hsla(b.hue, 100, 50, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    });

    planets.forEach(function (p) {
      var r = p.r * H, x = p.x * W, y = p.y * H;
      var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
      g.addColorStop(0, hsla(p.hue, 70, 55, 0.9));
      g.addColorStop(1, hsla(p.hue, 70, 15, 0.9));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    });

    stars.forEach(function (s) {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = "#eaf6ff";
      ctx.fillRect(s.x * W, s.y * H, s.size, s.size * 1.6);
    });
    ctx.globalAlpha = 1;
  }

  function jaggedPolygon(rng2, points, radiusJitter) {
    var pts = [];
    for (var i = 0; i < points; i++) {
      var a = (i / points) * Math.PI * 2;
      var r = 1 - radiusJitter + rng2() * radiusJitter * 2;
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return pts;
  }

  function organicPolygon(rng2, points) {
    var pts = [];
    var base = 0.7 + rng2() * 0.3;
    for (var i = 0; i < points; i++) {
      var a = (i / points) * Math.PI * 2;
      var r = base + Math.sin(a * (2 + Math.floor(rng2() * 3)) + rng2() * 6) * 0.28;
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return pts;
  }

  function abstractPolygon(rng2) {
    var layers = 2 + Math.floor(rng2() * 2);
    var pts = [];
    for (var l = 0; l < layers; l++) {
      var count = 3 + Math.floor(rng2() * 3);
      var rot = rng2() * Math.PI * 2;
      var scale = 0.5 + l * 0.3;
      for (var i = 0; i < count; i++) {
        var a = rot + (i / count) * Math.PI * 2;
        pts.push([Math.cos(a) * scale, Math.sin(a) * scale]);
      }
    }
    return pts;
  }

  function generateEnemyShape() {
    var kind = pick(["geo", "organic", "abstract"]);
    var pts = kind === "geo" ? jaggedPolygon(rng, 5 + randInt(0, 3), 0.35)
      : kind === "organic" ? organicPolygon(rng, 10 + randInt(0, 6))
      : abstractPolygon(rng);
    return { kind: kind, pts: pts };
  }

  function drawPolygon(pts, size, hue, alpha, glow) {
    ctx.save();
    ctx.beginPath();
    pts.forEach(function (p, i) {
      var x = p[0] * size, y = p[1] * size;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.shadowColor = hsla(hue, 100, 60, 0.9);
    ctx.shadowBlur = glow;
    ctx.fillStyle = hsla(hue, 90, 55, alpha);
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = hsla(hue, 100, 80, 0.9);
    ctx.stroke();
    ctx.restore();
  }

  function generateShip() {
    var wingSpan = rand(0.9, 1.3);
    var wingSweep = rand(0.4, 0.9);
    return {
      hull: [[0, -1], [0.32, 0.15], [0.18, 0.55], [-0.18, 0.55], [-0.32, 0.15]],
      wingL: [[-0.12, 0.1], [-wingSpan, wingSweep * 0.6], [-wingSpan * 0.7, wingSweep], [-0.15, 0.4]],
      wingR: [[0.12, 0.1], [wingSpan, wingSweep * 0.6], [wingSpan * 0.7, wingSweep], [0.15, 0.4]],
      engines: [
        [-0.16, 0.5], [0.16, 0.5], [0, 0.58]
      ].slice(0, 2 + randInt(0, 1)),
      hueA: 205, hueB: 32
    };
  }

  function drawShip(ship, x, y, size, t, thrust) {
    var mix = (Math.sin(t * 0.6) + 1) / 2;
    var hue = ship.hueA + (ship.hueB - ship.hueA) * mix;
    ctx.save();
    ctx.translate(x, y);

    ship.engines.forEach(function (e) {
      var ex = e[0] * size, ey = e[1] * size;
      var r = size * (0.22 + Math.sin(t * 18 + ex) * 0.05) * (thrust ? 1.2 : 0.8);
      var g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r);
      g.addColorStop(0, hsla(hue + 30, 100, 75, 0.9));
      g.addColorStop(1, hsla(hue + 30, 100, 50, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill();
    });

    [ship.wingL, ship.wingR, ship.hull].forEach(function (poly) {
      ctx.beginPath();
      poly.forEach(function (p, i) {
        var px = p[0] * size, py = p[1] * size;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.shadowColor = hsla(hue, 100, 60, 0.85);
      ctx.shadowBlur = 14;
      var grad = ctx.createLinearGradient(0, -size, 0, size * 0.6);
      grad.addColorStop(0, hsla(hue, 80, 70, 0.95));
      grad.addColorStop(1, hsla(hue, 70, 35, 0.95));
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = hsla(hue + 10, 100, 85, 0.9);
      ctx.stroke();
    });

    var coreR = size * (0.06 + Math.sin(t * 8) * 0.015);
    ctx.beginPath(); ctx.arc(0, -size * 0.05, coreR, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.shadowBlur = 18; ctx.shadowColor = hsla(hue, 100, 80, 1);
    ctx.fill();
    ctx.restore();
    return hue;
  }

  var player, enemies, playerBullets, enemyBullets, particles;
  var score, level, gameState, elapsed, spawnTimer, difficultyLevel;

  function resetGame() {
    worldSeed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    rng = mulberry32(worldSeed);
    player = {
      shape: generateShip(),
      x: 0.5, y: 0.82, vx: 0, vy: 0,
      radius: 0.028,
      health: 100, maxHealth: 100,
      fireTimer: 0, fireInterval: 0.16,
      invuln: 0
    };
    enemies = [];
    playerBullets = [];
    enemyBullets = [];
    particles = [];
    score = 0; level = 1; elapsed = 0; spawnTimer = 0; difficultyLevel = 1;
    gameState = "start";
  }
  resetGame();

  var pointer = { active: false, x: 0.5, y: 0.82 };
  function toUnit(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left) / rect.width, y: (clientY - rect.top) / rect.height };
  }
  function startOrRestart() {
    resetGame();
    gameState = "playing";
  }
  function onDown(clientX, clientY) {
    if (gameState !== "playing") { startOrRestart(); return; }
    pointer.active = true;
    var u = toUnit(clientX, clientY);
    pointer.x = u.x; pointer.y = u.y;
  }
  function onMove(clientX, clientY) {
    if (!pointer.active) return;
    var u = toUnit(clientX, clientY);
    pointer.x = u.x; pointer.y = u.y;
  }
  function onUp() { pointer.active = false; }

  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); var t = e.touches[0]; onDown(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener("touchmove", function (e) { e.preventDefault(); var t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener("touchend", function (e) { e.preventDefault(); onUp(); }, { passive: false });
  canvas.addEventListener("mousedown", function (e) { onDown(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { onMove(e.clientX, e.clientY); });
  window.addEventListener("mouseup", onUp);

  var MOVE_PATTERNS = ["straight", "sine", "zigzag", "homing"];
  var FIRE_PATTERNS = ["single", "spread", "spiral"];

  function spawnEnemy() {
    var shape = generateEnemyShape();
    var size = rand(0.028, 0.05) * (1 + difficultyLevel * 0.03);
    enemies.push({
      shape: shape,
      x: rand(0.12, 0.88), y: -0.08,
      size: size,
      hue: pick(NEON),
      speed: rand(0.06, 0.11) * (1 + difficultyLevel * 0.06),
      move: pick(MOVE_PATTERNS),
      fire: pick(FIRE_PATTERNS),
      phase: rand(0, Math.PI * 2),
      dir: rng() > 0.5 ? 1 : -1,
      age: 0,
      fireTimer: rand(0.4, 1.4),
      hp: 2 + Math.floor(difficultyLevel / 2),
      maxHp: 2 + Math.floor(difficultyLevel / 2)
    });
  }

  function spawnExplosion(x, y, hue) {
    var n = 14;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2);
      var speed = rand(0.15, 0.5);
      particles.push({
        x: x, y: y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: rand(0.3, 0.7), age: 0, hue: hue
      });
    }
  }

  function fireEnemy(e) {
    var speed = 0.32;
    var dx = player.x - e.x, dy = player.y - e.y;
    var baseAngle = Math.atan2(dy, dx);
    if (e.fire === "single") {
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(baseAngle) * speed, vy: Math.sin(baseAngle) * speed, hue: e.hue });
    } else if (e.fire === "spread") {
      for (var i = -2; i <= 2; i++) {
        var a = baseAngle + i * 0.18;
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, hue: e.hue });
      }
    } else if (e.fire === "spiral") {
      e.spiralAngle = (e.spiralAngle || 0) + 0.7;
      for (var s = 0; s < 3; s++) {
        var sa = e.spiralAngle + s * (Math.PI * 2 / 3);
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(sa) * speed * 0.8, vy: Math.sin(sa) * speed * 0.8, hue: e.hue });
      }
    }
  }

  function damagePlayer(amount) {
    player.health = Math.max(0, player.health - amount);
    player.invuln = 0.6;
  }

  function endGame() {
    gameState = "gameover";
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem(SAVE_KEY, String(highScore)); } catch (e) {}
    }
  }

  function tick(dt) {
    advanceWorld(dt);
    if (gameState !== "playing") return;

    elapsed += dt;
    var newLevel = 1 + Math.floor(score / 400);
    if (newLevel !== level) { level = newLevel; difficultyLevel = level; }

    if (pointer.active) {
      player.x += (pointer.x - player.x) * Math.min(1, dt * 10);
      player.y += (pointer.y - player.y) * Math.min(1, dt * 10);
    }
    player.x = Math.max(0.06, Math.min(0.94, player.x));
    player.y = Math.max(0.15, Math.min(0.94, player.y));
    if (player.invuln > 0) player.invuln -= dt;

    player.fireTimer -= dt;
    if (player.fireTimer <= 0) {
      player.fireTimer = player.fireInterval;
      var variant = pick(["laser", "plasma"]);
      var jitterHue = pick(NEON);
      playerBullets.push({
        x: player.x, y: player.y - 0.03, vx: 0, vy: -0.95,
        variant: variant, hue: jitterHue
      });
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = Math.max(0.35, 1.1 - difficultyLevel * 0.05);
      spawnEnemy();
    }

    playerBullets.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; });
    playerBullets = playerBullets.filter(function (b) { return b.y > -0.05; });

    enemyBullets.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; });
    enemyBullets = enemyBullets.filter(function (b) { return b.y < 1.05 && b.y > -0.05 && b.x > -0.05 && b.x < 1.05; });

    enemies.forEach(function (e) {
      e.age += dt;
      e.y += e.speed * dt;
      if (e.move === "sine") e.x += Math.sin(e.age * 2 + e.phase) * 0.35 * dt;
      else if (e.move === "zigzag") {
        e.zigzagTimer = (e.zigzagTimer || 0) - dt;
        if (e.zigzagTimer <= 0) { e.dir *= -1; e.zigzagTimer = rand(0.5, 1.1); }
        e.x += e.dir * 0.5 * dt;
      } else if (e.move === "homing") {
        e.x += (player.x - e.x) * dt * 0.5;
      }
      e.x = Math.max(0.05, Math.min(0.95, e.x));

      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && e.y > 0.05 && e.y < 0.85) {
        e.fireTimer = rand(1.1, 2.2) - difficultyLevel * 0.03;
        fireEnemy(e);
      }
    });
    enemies = enemies.filter(function (e) { return e.y - e.size < 1.1; });

    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      for (var j = playerBullets.length - 1; j >= 0; j--) {
        var b = playerBullets[j];
        var dx = (b.x - e.x) * W, dy = (b.y - e.y) * H;
        var rr = (e.size * H * 0.9);
        if (dx * dx + dy * dy < rr * rr) {
          playerBullets.splice(j, 1);
          e.hp -= 1;
          if (e.hp <= 0) {
            spawnExplosion(e.x, e.y, e.hue);
            score += 20 + difficultyLevel * 5;
            enemies.splice(i, 1);
          }
          break;
        }
      }
    }

    if (player.invuln <= 0) {
      var pr = player.radius * H;
      for (var k = enemyBullets.length - 1; k >= 0; k--) {
        var eb = enemyBullets[k];
        var ddx = (eb.x - player.x) * W, ddy = (eb.y - player.y) * H;
        if (ddx * ddx + ddy * ddy < pr * pr) {
          enemyBullets.splice(k, 1);
          damagePlayer(8);
        }
      }
      for (var m = enemies.length - 1; m >= 0; m--) {
        var em = enemies[m];
        var edx = (em.x - player.x) * W, edy = (em.y - player.y) * H;
        var er = (em.size + player.radius) * H;
        if (edx * edx + edy * edy < er * er) {
          spawnExplosion(em.x, em.y, em.hue);
          enemies.splice(m, 1);
          damagePlayer(22);
        }
      }
    }

    particles.forEach(function (p) {
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += dt * 0.2;
    });
    particles = particles.filter(function (p) { return p.age < p.life; });

    if (player.health <= 0) endGame();
  }

  function drawBullets() {
    playerBullets.forEach(function (b) {
      var x = b.x * W, y = b.y * H;
      ctx.save();
      ctx.shadowColor = hsla(b.hue, 100, 65, 1);
      ctx.shadowBlur = 12;
      if (b.variant === "laser") {
        ctx.fillStyle = hsla(b.hue, 100, 75, 0.95);
        ctx.fillRect(x - 1.6, y - 11, 3.2, 16);
      } else {
        ctx.fillStyle = hsla(b.hue, 100, 70, 0.95);
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    });
    enemyBullets.forEach(function (b) {
      var x = b.x * W, y = b.y * H;
      ctx.save();
      ctx.shadowColor = hsla(b.hue, 100, 60, 1);
      ctx.shadowBlur = 10;
      ctx.fillStyle = hsla(b.hue, 100, 65, 0.95);
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawEnemies() {
    enemies.forEach(function (e) {
      var x = e.x * W, y = e.y * H, size = e.size * H;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(e.age * 1.5 + e.phase) * 0.15);
      drawPolygon(e.shape.pts, size, e.hue, 0.85, 10);
      ctx.restore();
      if (e.hp < e.maxHp) {
        var barW = size * 1.6;
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(x - barW / 2, y - size - 10, barW, 3);
        ctx.fillStyle = hsla(e.hue, 100, 65, 1);
        ctx.fillRect(x - barW / 2, y - size - 10, barW * (e.hp / e.maxHp), 3);
      }
    });
  }

  function drawParticles() {
    particles.forEach(function (p) {
      var t = 1 - p.age / p.life;
      ctx.globalAlpha = t;
      ctx.fillStyle = hsla(p.hue, 100, 70, 1);
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 2.5 * t + 0.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawHud(t) {
    var narrow = W < 480;
    var fontSize = narrow ? 10 : 13;
    ctx.save();
    ctx.font = "600 " + fontSize + "px 'SF Mono', 'Menlo', monospace";
    ctx.textBaseline = "top";
    ctx.shadowColor = "rgba(60,220,255,0.8)";
    ctx.shadowBlur = 6;

    ctx.fillStyle = "rgba(160,240,255,0.95)";
    ctx.textAlign = "left";
    ctx.fillText("SCORE: " + score, 14, 14);
    ctx.fillText("LEVEL: " + level, 14, 14 + fontSize + 5);

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,120,230,0.9)";
    ctx.fillText(narrow ? "PROC_GEN: ACTIVE" : "SYSTEM: PROCEDURAL_GENERATION_ACTIVE", W / 2, 14);

    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,200,90,0.95)";
    ctx.fillText("VARIANCE: HIGH", W - 14, 14);
    var fx = W - 14, fy = 14 + fontSize + 5;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = t * 1.5 + (i / 6) * Math.PI * 2;
      ctx.moveTo(fx - 6, fy + 6);
      ctx.lineTo(fx - 6 + Math.cos(a) * 8, fy + 6 + Math.sin(a) * 8);
    }
    ctx.strokeStyle = "rgba(255,200,90,0.8)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();

    var barY = H - 22;
    var barW = Math.min(320, W - 40);
    var barX = (W - barW) / 2;
    var pulse = 0.75 + Math.sin(t * 6) * 0.25;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(barX, barY); ctx.lineTo(barX + barW, barY); ctx.stroke();
    var hpFrac = player.health / player.maxHealth;
    var barHue = 150 * hpFrac;
    ctx.shadowColor = hsla(barHue, 100, 60, pulse);
    ctx.shadowBlur = 10 * pulse;
    ctx.strokeStyle = hsla(barHue, 100, 60, 0.95);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(barX, barY); ctx.lineTo(barX + barW * hpFrac, barY); ctx.stroke();
    ctx.restore();
  }

  function drawOverlayScreen() {
    ctx.save();
    ctx.fillStyle = "rgba(5,6,10,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(80,220,255,0.9)";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#eaf9ff";
    ctx.font = "700 30px 'SF Pro Display', sans-serif";
    ctx.fillText("NEBULA DRIFT", W / 2, H * 0.38);
    ctx.font = "500 14px 'SF Mono', monospace";
    ctx.fillStyle = "rgba(200,240,255,0.85)";
    if (gameState === "start") {
      ctx.fillText("Тапни и веди пальцем — корабль летит следом", W / 2, H * 0.38 + 40);
      ctx.fillText("Лучший счёт: " + highScore, W / 2, H * 0.38 + 62);
      ctx.fillText("НАЖМИ, ЧТОБЫ НАЧАТЬ", W / 2, H * 0.38 + 96);
    } else {
      var isRecord = score >= highScore && score > 0;
      ctx.fillText("СЧЁТ: " + score + (isRecord ? "  (рекорд!)" : ""), W / 2, H * 0.38 + 40);
      ctx.fillText("Лучший счёт: " + highScore, W / 2, H * 0.38 + 62);
      ctx.fillText("НАЖМИ, ЧТОБЫ СЫГРАТЬ ЕЩЁ", W / 2, H * 0.38 + 96);
    }
    ctx.restore();
  }

  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;

    tick(dt);
    drawBackground();

    if (gameState === "playing") {
      drawEnemies();
      drawBullets();
      drawParticles();
      var thrust = pointer.active;
      drawShip(player.shape, player.x * W, player.y * H, player.radius * H * 2.4, elapsed, thrust);
      drawHud(elapsed);
    } else {
      drawShip(player.shape, W / 2, H * 0.7, Math.min(W, H) * 0.09, ts / 1000, false);
      drawOverlayScreen();
    }

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
