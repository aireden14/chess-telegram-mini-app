<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hexland — локальный тест</title>
<style>
:root {
  /* Палитра из канонического макета (catan-2 дизайн.../index.html) */
  --bg: #F2EFE8;
  --bg-tint: #E9E2D2;
  --water: #A8D0E6;
  --water-2: #8FBFDB;
  --ink: #1A1A1F;
  --ink-2: rgba(26,26,31,0.62);
  --ink-3: rgba(26,26,31,0.36);
  /* Совместимость со старыми именами переменных */
  --panel: rgba(255, 255, 255, 0.55);
  --panel-strong: rgba(255, 255, 255, 0.72);
  --line: rgba(26, 26, 31, 0.10);
  --text: var(--ink);
  --muted: var(--ink-2);
  --blue: #007AFF;
  --blue-2: #4DA3FF;
  --violet: #7A5AE0;
  --lime: #3FB373;
  --amber: #E8954B;
  --red: #E14B4B;
  /* ресурсы / игроки */
  --r-wood: #3F8C5F; --r-brick: #C9603F; --r-sheep: #B6CC54; --r-wheat: #E9B83A; --r-stone: #7A8590; --r-desert: #D9C9A3;
  --p-red: #E14B4B; --p-blue: #4B7BE1; --p-green: #3FB373; --p-orange: #E8954B;
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --shadow: 0 10px 40px rgba(20,30,60,0.10), 0 1px 0 rgba(255,255,255,0.6) inset;
  --glow-blue: 0 6px 18px rgba(0,122,255,.28);
  --glow-violet: 0 6px 18px rgba(122,90,224,.26);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, sans-serif;
  --font-rounded: "SF Pro Rounded", -apple-system, "Inter", system-ui, sans-serif;
  font-family: var(--font);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: #EDE9E0; color: var(--ink); }
body { display: grid; place-items: center; overflow-x: hidden; }
button, input, select { font: inherit; }
button { border: 0; color: inherit; cursor: pointer; }

.app-shell {
  position: relative;
  width: min(100vw, 430px);
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% -5%, #BBDDED 0%, transparent 42%),
    radial-gradient(circle at 95% 12%, rgba(232,149,75,0.12), transparent 36%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-tint) 100%);
  padding: max(14px, env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));
}
.noise { position: fixed; inset: 0; opacity: .04; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); }
.glass { background: var(--glass, rgba(255,255,255,.55)); border: 1px solid rgba(255,255,255,.7); box-shadow: var(--shadow); backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px) saturate(1.4); }
.topbar { position: sticky; top: 10px; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 24px; }
.tg-user { display: flex; align-items: center; gap: 10px; }
.tg-user img { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); box-shadow: var(--glow-blue); }
.eyebrow { display: block; font-size: 11px; color: var(--blue); letter-spacing: .05em; text-transform: uppercase; }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 16px; background: rgba(255,255,255,.6); border: 1px solid var(--line); color: var(--ink); }
.badge { position: absolute; top: -4px; right: -4px; display: grid; place-items: center; min-width: 19px; height: 19px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; }
.screen { position: relative; z-index: 1; padding: 16px 0; animation: screenIn .38s ease both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

.hero { padding: 22px; border-radius: var(--radius-xl); margin-bottom: 14px; position: relative; overflow: hidden; }
.hero::after, .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.13), transparent 44%); transform: translateX(-130%); animation: shimmer 5s infinite; pointer-events: none; }
@keyframes shimmer { 0%, 55% { transform: translateX(-130%); } 80%, 100% { transform: translateX(130%); } }
h1, h2, h3, p { margin: 0; } h1 { font-size: 30px; line-height: .98; letter-spacing: -.04em; } h2 { font-size: 21px; letter-spacing: -.025em; } h3 { font-size: 16px; }
p { color: var(--muted); line-height: 1.45; }
.status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; margin-bottom: 14px; border-radius: 999px; background: rgba(0,122,255,.10); color: var(--blue); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 18px var(--lime); animation: pulse 1.35s infinite; }
@keyframes pulse { 50% { transform: scale(1.4); opacity: .55; } }
.grid { display: grid; gap: 12px; } .grid.two { grid-template-columns: 1fr 1fr; }
.card { position: relative; overflow: hidden; padding: 16px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(18px); }
.cta { min-height: 54px; border-radius: 18px; background: var(--blue); color: white; font-weight: 800; box-shadow: var(--glow-blue); transition: transform .18s ease, filter .18s ease; }
.cta:active, .chip:active, .tab:active, .mini-btn:active { transform: scale(.96); filter: brightness(1.05); }
.cta.secondary { background: rgba(255,255,255,.7); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
.cta.lime { background: var(--lime); color: #fff; box-shadow: 0 6px 18px rgba(63,179,115,.32); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.section-title { margin: 20px 0 10px; display: flex; align-items: end; justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.friend-rail, .theme-rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.friend { min-width: 92px; padding: 12px; text-align: center; border-radius: 22px; background: rgba(255,255,255,.6); border: 1px solid var(--line); }
.avatar { width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff; font-weight: 900; }
.chip, .mini-btn { border-radius: 999px; padding: 9px 12px; background: rgba(255,255,255,.6); border: 1px solid var(--line); color: var(--ink); font-size: 12px; }
.chip.active { background: rgba(0,122,255,.14); color: var(--blue); box-shadow: var(--glow-blue); }
.tabbar { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; width: min(calc(100vw - 24px), 406px); display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px; border-radius: 26px; }
.tab { display: grid; gap: 2px; place-items: center; min-height: 54px; border-radius: 18px; background: transparent; color: var(--muted); font-size: 18px; }
.tab span { font-size: 10px; } .tab.active { background: rgba(0,122,255,.12); color: var(--blue); box-shadow: inset 0 0 18px rgba(0,122,255,.10); }
.form-row { display: flex; gap: 8px; flex-wrap: wrap; }
.segment { display: flex; padding: 5px; gap: 5px; border-radius: 18px; background: rgba(255,255,255,.5); border: 1px solid var(--line); }
.segment button { flex: 1; min-height: 40px; border-radius: 14px; background: transparent; color: var(--ink); } .segment button.active { background: #fff; color: var(--blue); box-shadow: var(--shadow); }
.hex-map { height: 380px; position: relative; border-radius: 30px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, var(--water) 0%, var(--water-2) 85%); padding: 10px; }
.hex { position: absolute; width: 64px; height: 74px; clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 900; border: 1px solid rgba(255,255,255,.2); filter: drop-shadow(0 5px 10px rgba(0,0,0,.35)); animation: float 4s ease-in-out infinite; padding: 5px; text-align: center; }
.hex-number { font-size: 13px; color: #050709; background: rgba(255,255,255,.9); padding: 2px 6px; border-radius: 999px; min-width: 24px; line-height: 1; }
.hex-label { font-size: 8px; color: rgba(7,9,18,.85); font-weight: 700; line-height: 1; text-transform: uppercase; }
.hex.robber { box-shadow: inset 0 0 25px rgba(255,255,255,.45); }
.robber-token { font-size: 18px; animation: pulse 1.4s infinite; }
.board-wrap { display: grid; place-items: center; }
#boardSvg { width: 100%; height: 100%; touch-action: manipulation; }
.bd-tap { cursor: pointer; }
.bd-hex-tap { cursor: pointer; }
.bd-hex-tap:active { filter: brightness(1.25); }
.bd-pulse { animation: bdPulse 1.25s ease-in-out infinite; }
@keyframes bdPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; transform-box: fill-box; } }
.discard-row { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.trade-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.trade-chip { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 12px; background: rgba(255,255,255,.6); border: 1px solid var(--line); font-size: 13px; }
.trade-chip.on { background: rgba(75,123,225,.14); border-color: rgba(75,123,225,.45); }
.trade-chip span { min-width: 26px; text-align: center; }
.trade-chip b { margin-left: 3px; }
.trade-chip .mini-btn { padding: 2px 9px; font-size: 15px; line-height: 1; }
.trade-sel { background: rgba(255,255,255,.7); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
.trade-resp { margin-top: 12px; display: grid; gap: 6px; }
.resp-row { justify-content: space-between; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.55); border: 1px solid var(--line); font-size: 13px; }
.mini-btn.lime { background: var(--lime, #3FB373); color: #fff; font-weight: 700; }
.counter-row { display: block; padding: 8px 10px; border-radius: 10px; background: rgba(232,149,75,.10); border: 1px solid rgba(232,149,75,.30); font-size: 13px; }
.roll-card, .score-card { margin: 12px 0; }
.rule-list { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.rule-list li { margin-bottom: 6px; }
.cost-list { display: grid; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--muted); }
@keyframes float { 50% { transform: translateY(-5px) rotateX(8deg); } }
@keyframes tileGlow { 50% { filter: drop-shadow(0 0 18px var(--lime)); } }
.resources { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.resource { padding: 10px 6px; border-radius: 16px; text-align: center; background: rgba(255,255,255,.6); border: 1px solid var(--line); }
.resource.flash { animation: flash .7s ease; } @keyframes flash { 30% { background: rgba(63,179,115,.25); transform: translateY(-4px); } }
.event-feed { max-height: 172px; overflow: hidden; display: grid; gap: 8px; }
.event { padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.55); border: 1px solid var(--line); animation: eventIn .35s ease both; }
@keyframes eventIn { from { opacity: 0; transform: translateX(20px); } }
.dice { display: flex; justify-content: center; gap: 18px; padding: 10px 0; }
.die { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: linear-gradient(145deg, #f9fbff, #8aa7ff); color: #090d18; font-size: 30px; font-weight: 950; box-shadow: 0 18px 38px rgba(49,215,255,.28); }
.rolling .die { animation: roll .62s ease; } @keyframes roll { 50% { transform: rotate(180deg) scale(1.18); } }
.toast { position: fixed; z-index: 99; left: 50%; bottom: 104px; transform: translate(-50%, 22px); width: min(360px, calc(100vw - 32px)); opacity: 0; padding: 13px 15px; border-radius: 18px; background: rgba(26,26,31,.92); color: #fff; border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(18px); transition: .25s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.progress { height: 11px; border-radius: 99px; background: rgba(26,26,31,.08); overflow: hidden; } .progress > i { display: block; height: 100%; width: 68%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--lime)); box-shadow: var(--glow-blue); }
.leader { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.assistant { position: fixed; right: calc(50% - min(50vw, 215px) + 22px); bottom: 112px; width: 58px; height: 58px; border-radius: 22px; background: linear-gradient(135deg, var(--violet), var(--blue)); box-shadow: var(--glow-violet); z-index: 9; animation: pulse 2s infinite; }
input, select { width: 100%; min-height: 48px; border-radius: 16px; background: rgba(255,255,255,.7); color: var(--text); border: 1px solid var(--line); padding: 0 13px; outline: none; }

</style>
</head>
<body>

    <div class="app-shell">
      <div class="noise"></div>
      <header class="topbar glass">
        <div class="tg-user">
          <img id="userAvatar" alt="avatar" />
          <div>
            <span class="eyebrow">Telegram connected</span>
            <strong id="username"></strong>
          </div>
        </div>
        <button class="icon-btn" id="notifyBtn">⚡<span class="badge">3</span></button>
      </header>

      <main id="screen" class="screen"></main>

      <nav class="tabbar glass">
        <button class="tab active" data-route="home">⌂<span>Home</span></button>
        <button class="tab" data-route="play">⬢<span>Table</span></button>
        <button class="tab" data-route="friends">◉<span>Friends</span></button>
        <button class="tab" data-route="rating">★<span>Rating</span></button>
        <button class="tab" data-route="season">✦<span>Season</span></button>
      </nav>
    </div>

    <div id="toast" class="toast"></div>

const SEAT_COLORS = ['#E14B4B', '#4B7BE1', '#3FB373', '#E8954B'];
function seatColor(seat){ return SEAT_COLORS[seat] ?? '#888'; }

// Интерактивная SVG-доска из реального состояния движка.
function boardSvg() {
  const game = gameView();
  if (!game?.hexes?.length || !game.vertices?.length) return hexesFallback();

  const vmap = {};
  game.vertices.forEach(v => { vmap[v.id] = v; });
  const emap = {};
  game.edges.forEach(e => { emap[e.id] = e; });

  // границы
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  game.vertices.forEach(v => {
    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
    minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
  });
  const pad = 26;
  const vbX = minX - pad, vbY = minY - pad;
  const vbW = (maxX - minX) + pad * 2, vbH = (maxY - minY) + pad * 2;

  const isHumanTurn = game.currentSeat === 0;
  const legal = game.legalActions || [];

  // легальные цели по типам (индекс действия в game.legalActions)
  const settle = [], cityUp = [], roadB = [];
  const robberHexes = new Set();
  legal.forEach((a, i) => {
    if (a.type === 'BUILD_SETTLEMENT') settle.push({ i, id: a.vertex });
    else if (a.type === 'BUILD_CITY') cityUp.push({ i, id: a.vertex });
    else if (a.type === 'BUILD_ROAD') roadB.push({ i, id: a.edge });
    else if (a.type === 'MOVE_ROBBER' || a.type === 'PLAY_KNIGHT') robberHexes.add(a.toHex);
  });

  // 0. водный фон + волны (как в макете)
  let svg = `<defs>
    <radialGradient id="bdWater" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#BBDDED"/><stop offset="85%" stop-color="#8FBFDB"/>
    </radialGradient>
    <filter id="bdHexShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A1A1F" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bdGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>`;
  svg += `<rect x="${vbX.toFixed(1)}" y="${vbY.toFixed(1)}" width="${vbW.toFixed(1)}" height="${vbH.toFixed(1)}" fill="url(#bdWater)"/>`;
  // декоративные волны
  for (let i = 0; i < 5; i++) {
    const wy = (vbY + 22 + i * (vbH / 5)).toFixed(1);
    const wx = (vbX + 10 + (i % 2) * 24).toFixed(1);
    svg += `<path d="M ${wx} ${wy} q 14 -7 28 0 t 28 0" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" opacity=".55"/>`;
  }

  // 1. гексы — заливка палитрой + арт-текстура из макета + стеклянный блик
  game.hexes.forEach(hex => {
    const verts = (hex.vertexIds || []).map(id => vmap[id]).filter(Boolean);
    const pts = verts.map(v => `${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' ');
    const robberTap = robberHexes.has(hex.id) && isHumanTurn;
    // радиус (центр→вершина) для масштаба арта
    const R = verts.reduce((m, v) => Math.max(m, Math.hypot(v.x - hex.x, v.y - hex.y)), 0) || 30;
    const s = R / 55.5;
    svg += `<polygon points="${pts}" fill="${terrainColor(hex.terrain)}" filter="url(#bdHexShadow)" />`;
    svg += `<g transform="translate(${hex.x.toFixed(1)} ${hex.y.toFixed(1)}) scale(${s.toFixed(3)}) translate(-50 -57.5)" pointer-events="none">${hexTexture(hex.terrain)}</g>`;
    svg += `<polygon points="${pts}" fill="url(#bdGlass)" stroke="rgba(255,255,255,.6)" stroke-width="1.2" class="bd-hex${robberTap ? ' bd-hex-tap' : ''}"${robberTap ? ` data-robber="${hex.id}"` : ''} />`;
    if (hex.token != null) {
      svg += tokenSvg(hex.token, hex.x, hex.y, R * 0.32);
    }
    if (hex.isRobber) {
      svg += robberSvg(hex.x, hex.y - R * 0.12, R * 0.62);
    }
  });

  // 2. дороги игроков — арт-дороги
  game.players.forEach(p => {
    (p.roads || []).forEach(eid => {
      const e = emap[eid];
      if (!e) return;
      const len = Math.hypot(e.x2 - e.x1, e.y2 - e.y1) * 0.92;
      const ang = Math.atan2(e.y2 - e.y1, e.x2 - e.x1) * 180 / Math.PI;
      svg += roadSvg(e.mx, e.my, len, ang, seatColor(p.seat));
    });
  });

  // 3. поселения (домики) и города (башни)
  game.players.forEach(p => {
    (p.settlements || []).forEach(vid => {
      const v = vmap[vid]; if (!v) return;
      svg += settlementSvg(v.x, v.y, 22, seatColor(p.seat));
    });
    (p.cities || []).forEach(vid => {
      const v = vmap[vid]; if (!v) return;
      svg += citySvg(v.x, v.y, 26, seatColor(p.seat));
    });
  });

  // 4. интерактивные легальные цели (только в ход игрока)
  if (isHumanTurn) {
    roadB.forEach(r => {
      const e = emap[r.id]; if (!e) return;
      svg += `<line x1="${e.x1.toFixed(1)}" y1="${e.y1.toFixed(1)}" x2="${e.x2.toFixed(1)}" y2="${e.y2.toFixed(1)}" stroke="${seatColor(0)}" stroke-width="4" stroke-dasharray="4 4" opacity=".7" />`;
      svg += `<circle cx="${e.mx.toFixed(1)}" cy="${e.my.toFixed(1)}" r="9" fill="rgba(0,0,0,.001)" class="bd-tap bd-road" data-legal="${r.i}" />`;
      svg += `<circle cx="${e.mx.toFixed(1)}" cy="${e.my.toFixed(1)}" r="5" fill="${seatColor(0)}" class="bd-pulse" pointer-events="none" />`;
    });
    settle.forEach(s => {
      const v = vmap[s.id]; if (!v) return;
      svg += `<circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="11" fill="rgba(0,0,0,.001)" class="bd-tap" data-legal="${s.i}" />`;
      svg += `<circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="7" fill="none" stroke="${seatColor(0)}" stroke-width="2.5" class="bd-pulse" pointer-events="none" />`;
    });
    cityUp.forEach(c => {
      const v = vmap[c.id]; if (!v) return;
      svg += `<circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="12" fill="rgba(0,0,0,.001)" class="bd-tap" data-legal="${c.i}" />`;
      svg += `<rect x="${(v.x - 8).toFixed(1)}" y="${(v.y - 8).toFixed(1)}" width="16" height="16" rx="3" fill="none" stroke="var(--amber)" stroke-width="2.5" class="bd-pulse" pointer-events="none" />`;
    });
  }

  return `<svg id="boardSvg" viewBox="${vbX.toFixed(1)} ${vbY.toFixed(1)} ${vbW.toFixed(1)} ${vbH.toFixed(1)}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
}

// Панель сброса карт после 7 (только когда P0 должен сбросить).
function discardPanel() {
  const game = gameView();
  if (!game || game.phase !== 'MAIN_DISCARD' || !(game.mustDiscardHuman > 0)) return '';
  const need = game.mustDiscardHuman;
  const sel = state.discardSel || {};
  const picked = Object.values(sel).reduce((a, b) => a + b, 0);
  const res = game.human?.resources ?? {};
  const rows = Object.keys(res).filter(k => res[k] > 0).map(k => `
    <div class="row discard-row">
      <span>${icon(k)} ${k} · есть ${res[k]}</span>
      <span class="row" style="gap:8px">
        <button class="mini-btn dminus" data-res="${k}">−</button>
        <strong>${sel[k] || 0}</strong>
        <button class="mini-btn dplus" data-res="${k}">+</button>
      </span>
    </div>`).join('');
  return `<div class="card" style="border-color:var(--red)">
    <h3>Выпало 7 — сбрось ${need} карт</h3>
    <p class="muted">Выбрано ${picked} из ${need}</p>
    ${rows}
    <button class="cta" id="discardConfirm" ${picked === need ? '' : 'disabled'} style="margin-top:10px">Сбросить ${picked}/${need}</button>
  </div>`;
}

// Панель торговли: обмен с ботами (give/receive) + банк/порт.
function tradePanel() {
  const game = gameView();
  if (!game) return '';
  const canTrade = !!game.canTrade;
  const hand = game.human?.resources ?? {};
  if (!state.trade) state.trade = { give: {}, receive: {} };
  // если оффер уже исчез (ход закончен / сделка прошла) — убираем устаревшие ответы
  if (state.tradeOfferId && !(game.pendingTrades || []).some(p => p.id === state.tradeOfferId)) {
    state.tradeResponses = [];
    state.tradeOfferId = null;
  }
  const t = state.trade;
  const giveN = resourceTypes.reduce((a, r) => a + (t.give[r] || 0), 0);
  const recvN = resourceTypes.reduce((a, r) => a + (t.receive[r] || 0), 0);

  const stepper = (side) => resourceTypes.map(r => {
    const val = t[side][r] || 0;
    const cap = side === 'give' ? (hand[r] || 0) : 19;
    return `<div class="trade-chip${val ? ' on' : ''}">
      <button class="mini-btn tminus" data-side="${side}" data-res="${r}" ${val <= 0 ? 'disabled' : ''}>−</button>
      <span>${icon(r)}<b>${val}</b></span>
      <button class="mini-btn tplus" data-side="${side}" data-res="${r}" ${side === 'give' && val >= cap ? 'disabled' : ''}>+</button>
    </div>`;
  }).join('');

  const bankGive = state.bankGive || 'wood';
  const bankReceive = state.bankReceive || 'brick';
  const ratio = window.HexlandGame?.bankRatioFor?.(bankGive) ?? 4;
  const bankOk = canTrade && (hand[bankGive] || 0) >= ratio && bankGive !== bankReceive;

  const resp = state.tradeResponses || [];
  const counterText = (c) => {
    const fmt = (bag) => resourceTypes.filter(r => (bag[r] || 0) > 0).map(r => `${bag[r]}${icon(r)}`).join(' ') || '—';
    return `ты даёшь ${fmt(c.give)} → получаешь ${fmt(c.receive)}`;
  };
  const respHtml = resp.length ? `<div class="trade-resp">${resp.map((r, i) => {
    if (r.verdict === 'accept') {
      return `<div class="row resp-row">
        <span><b style="color:${r.color}">P${r.seat}</b> — согласен ✓</span>
        <button class="mini-btn lime confirm-trade" data-seat="${r.seat}" data-offer="${state.tradeOfferId}">Обменять с P${r.seat}</button>
      </div>`;
    }
    if (r.verdict === 'counter' && r.counter) {
      return `<div class="resp-row counter-row">
        <div class="row" style="justify-content:space-between">
          <span><b style="color:${r.color}">P${r.seat}</b> — встречное</span>
          <button class="mini-btn lime accept-counter" data-idx="${i}">Принять контр</button>
        </div>
        <p class="muted" style="margin:4px 0 0">${counterText(r.counter)}</p>
      </div>`;
    }
    return `<div class="row resp-row"><span><b style="color:${r.color}">P${r.seat}</b> — отказался ×</span></div>`;
  }).join('')}</div>` : '';

  return `
    <div class="section-title"><h2>Торговля</h2><span class="muted">${canTrade ? 'твой ход' : 'только в свой ход'}</span></div>
    <div class="card trade-card">
      <h3>Ты отдаёшь</h3>
      <div class="trade-grid">${stepper('give')}</div>
      <h3 style="margin-top:12px">Ты просишь</h3>
      <div class="trade-grid">${stepper('receive')}</div>
      <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="cta" id="offerTradeBtn" ${canTrade && giveN > 0 && recvN > 0 ? '' : 'disabled'}>Предложить ботам</button>
        <button class="chip" id="tradeResetBtn">Сброс</button>
      </div>
      ${respHtml}
    </div>
    <div class="card">
      <h3>Банк и порты</h3>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
        <select id="bankGive" class="trade-sel">${resourceTypes.map(r => `<option value="${r}" ${r === bankGive ? 'selected' : ''}>${icon(r)} ${r}</option>`).join('')}</select>
        <span class="muted">${ratio}:1 →</span>
        <select id="bankReceive" class="trade-sel">${resourceTypes.map(r => `<option value="${r}" ${r === bankReceive ? 'selected' : ''}>${icon(r)} ${r}</option>`).join('')}</select>
        <button class="chip" id="bankTradeBtn" ${bankOk ? '' : 'disabled'}>Обмен</button>
      </div>
      <p class="muted">Курс ${ratio}:1 на ${icon(bankGive)} ${bankGive}. Порт рядом с твоим поселением даёт 3:1 или 2:1.</p>
    </div>`;
}

// Жетон числа (NumberToken): 40×40, центр (20,20), радиус 17.
function tokenSvg(value, cx, cy, r) {
  const k = r / 17;
  const isHot = value === 6 || value === 8;
  const col = isHot ? '#C0392B' : '#1A1A1F';
  const fs = (value >= 10) ? 13 : 15;
  const dots = tokenDots(value);
  let d = '';
  for (let i=0;i<dots;i++) d += `<circle cx="${((i-(dots-1)/2)*2.4).toFixed(2)}" cy="0" r=".9" fill="${col}"/>`;
  return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${k.toFixed(3)}) translate(-20 -20)">
    <circle cx="20" cy="21" r="17" fill="rgba(0,0,0,.18)"/>
    <circle cx="20" cy="20" r="17" fill="#F6EED7" stroke="rgba(0,0,0,.15)" stroke-width=".5"/>
    <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.8)" stroke-width=".7"/>
    <text x="20" y="${value>=10?'24.5':'25'}" text-anchor="middle" font-family="var(--font-rounded)" font-weight="700" font-size="${fs}" fill="${col}">${value}</text>
    <g transform="translate(20 28)">${d}</g></g>`;
}

function bindBoard() {
  const svg = document.querySelector('#boardSvg');
  if (!svg) return;
  svg.addEventListener('click', (e) => {
    const game = gameView();
    if (!game || !window.HexlandGame) return;
    const tap = e.target.closest('[data-legal]');
    if (tap) {
      const action = game.legalActions[Number(tap.dataset.legal)];
      if (action) runEngineAction(window.HexlandGame.applyHuman(action));
      return;
    }
    const rob = e.target.closest('[data-robber]');
    if (rob) {
      const hexId = rob.dataset.robber;
      // среди легальных MOVE_ROBBER/PLAY_KNIGHT для этого гекса берём ту, что крадёт у соперника
      const opts = game.legalActions.filter(a => (a.type === 'MOVE_ROBBER' || a.type === 'PLAY_KNIGHT') && a.toHex === hexId);
      const action = opts.find(a => a.stealFrom != null) || opts[0];
      if (action) runEngineAction(window.HexlandGame.applyHuman(action));
    }
  });
}

function adjustDiscard(res, delta) {
  const game = gameView();
  if (!game) return;
  if (!state.discardSel) state.discardSel = {};
  const have = game.human?.resources?.[res] ?? 0;
  const cur = state.discardSel[res] || 0;
  const picked = Object.values(state.discardSel).reduce((a, b) => a + b, 0);
  let next = cur + delta;
  if (next < 0) next = 0;
  if (next > have) next = have;
  if (delta > 0 && picked >= game.mustDiscardHuman) return; // не больше, чем нужно
  state.discardSel[res] = next;
  render();
}

function confirmDiscard() {
  const game = gameView();
  if (!game || !window.HexlandGame) return;
  const bag = {};
  Object.entries(state.discardSel || {}).forEach(([k, v]) => { if (v > 0) bag[k] = v; });
  const result = window.HexlandGame.applyHuman({ type: 'DISCARD', resources: bag });
  if (result.ok) state.discardSel = {};
  runEngineAction(result);
}

function adjustTrade(side, res, delta) {
  const game = gameView();
  if (!game) return;
  if (!state.trade) state.trade = { give: {}, receive: {} };
  const hand = game.human?.resources ?? {};
  let next = (state.trade[side][res] || 0) + delta;
  if (next < 0) next = 0;
  if (side === 'give' && next > (hand[res] || 0)) next = hand[res] || 0;
  state.trade[side][res] = next;
  render();
}

function resetTrade() {
  state.trade = { give: {}, receive: {} };
  state.tradeResponses = [];
  state.tradeOfferId = null;
  render();
}

function offerTrade() {
  if (!window.HexlandGame) { toast('Движок не готов'); return; }
  const give = {}, receive = {};
  resourceTypes.forEach(r => {
    if (state.trade.give[r] > 0) give[r] = state.trade.give[r];
    if (state.trade.receive[r] > 0) receive[r] = state.trade.receive[r];
  });
  const res = window.HexlandGame.humanOfferTrade(give, receive);
  if (!res.ok) { toast(res.error); return; }
  state.tradeOfferId = res.offerId;
  state.tradeResponses = res.responses;
  const yes = res.responses.filter(r => r.verdict === 'accept').length;
  const counters = res.responses.filter(r => r.verdict === 'counter').length;
  state.events.unshift(`Ты предложил обмен · согласны: ${yes}${counters ? `, контр: ${counters}` : ''}`);
  if (yes) toast(`Согласны: ${yes}. Выбери, с кем обменяться.`);
  else if (counters) toast(`Контр-предложений: ${counters}. Можешь принять.`);
  else toast('Боты отказались от сделки');
  render();
}

function acceptCounter(idx) {
  if (!window.HexlandGame) return;
  const r = (state.tradeResponses || [])[idx];
  if (!r || !r.counter) return;
  const res = window.HexlandGame.acceptCounter(state.tradeOfferId, r.seat, r.counter);
  if (!res.ok) { toast(res.error); state.tradeResponses = []; state.tradeOfferId = null; render(); return; }
  // Контр принят и бот согласен — сразу подтверждаем обмен.
  const conf = window.HexlandGame.humanConfirmTrade(res.offerId, r.seat);
  if (conf.ok) {
    state.trade = { give: {}, receive: {} };
    state.tradeResponses = [];
    state.tradeOfferId = null;
    state.events.unshift(`Контр-обмен с P${r.seat} проведён`);
  }
  runEngineAction(conf);
}

function setBotLevel(level) {
  if (!window.HexlandGame?.setBotLevel) { toast('Движок не готов'); return; }
  window.HexlandGame.setBotLevel(level);
  toast(`Сложность ботов: ${({easy:'лёгкий',medium:'средний',hard:'сложный'})[level]}`);
  render();
}

function confirmTrade(offerId, seat) {
  if (!window.HexlandGame) return;
  const res = window.HexlandGame.humanConfirmTrade(offerId, seat);
  if (res.ok) {
    state.trade = { give: {}, receive: {} };
    state.tradeResponses = [];
    state.tradeOfferId = null;
    state.events.unshift(`Обмен с P${seat} проведён`);
  }
  runEngineAction(res);
}

function bankTradeSelect() {
  if (!window.HexlandGame) { toast('Движок не готов'); return; }
  const give = state.bankGive || 'wood';
  const receive = state.bankReceive || 'brick';
  runEngineAction(window.HexlandGame.humanBankTrade(give, receive));
}

function runEngineAction(result) {
  if (!result) {
    toast('Движок ещё не готов');
    return false;
  }
  if (!result.ok) {
    toast(result.error);
    return false;
  }
  toast(result.label);
  render();
  scheduleBotAutoplay(650, true);
  return true;
}

function stopBotAutoplay(status){
  if (botAutoTimer) clearTimeout(botAutoTimer);
  botAutoTimer = null;
  if (status) state.botAutoStatus = status;
}

function scheduleBotAutoplay(delay = 650, resetRun = false){
  stopBotAutoplay();
  const game = gameView();
  if (resetRun) state.botAutoRunSteps = 0;
  if (!state.botAuto || state.route !== 'play' || !game?.autoBotSeat || !window.HexlandGame) {
    state.botAutoStatus = game?.autoBotSeat ? 'Автоходы на паузе' : game?.humanPrompt || 'Ожидаем ход игрока';
    return;
  }
  if (state.botAutoRunSteps >= state.botAutoMaxSteps) {
    state.botAutoStatus = `Автоходы остановлены: лимит ${state.botAutoMaxSteps} шагов`;
    render();
    return;
  }
  state.botAutoStatus = `Bot P${game.autoBotSeat} думает...`;
  botAutoTimer = setTimeout(() => {
    const snapshot = gameView();
    if (!state.botAuto || state.route !== 'play' || !snapshot?.autoBotSeat) {
      state.botAutoStatus = snapshot?.humanPrompt || 'Ожидаем ход игрока';
      render();
      return;
    }
    if (state.botAutoRunSteps >= state.botAutoMaxSteps) {
      state.botAutoStatus = `Автоходы остановлены: лимит ${state.botAutoMaxSteps} шагов`;
      render();
      return;
    }
    const result = window.HexlandGame.botStep();
    if (!result.ok) {
      state.botAutoStatus = result.error;
      toast(result.error);
      render();
      return;
    }
    state.botAutoRunSteps += 1;
    state.botAutoStatus = result.label;
    toast(result.label);
    render();
    scheduleBotAutoplay();
  }, delay);
}

function rnd(){ return Math.floor(Math.random() * 6) + 1; }
function addBot(){
  const pool = [
    { name: 'Bot Kai', level: 'Trader', mood: 'ports', icon: 'K' },
    { name: 'Bot Lux', level: 'Defensive', mood: 'city build', icon: 'L' },
    { name: 'Bot Vega', level: 'Aggressive', mood: 'robber pressure', icon: 'V' }
  ];
  if (state.bots.length < 2) {
    state.bots.push(pool[state.bots.length % pool.length]);
    return true;
  }
  return false;
}
function handleRoll(sum) {
  state.lastRoll = sum;
  if (sum === 7) {
    handleRobberTrigger();
    return;
  }
  const produced = hexData
    .map((hex, idx) => ({ ...hex, idx }))
    .filter(hex => hex.number === sum && hex.idx !== state.robberIndex && hex.type !== 'desert');
  if (!produced.length) {
    state.events.unshift(`Бросок ${sum}: ресурсы не выданы (разбойник или нет тайлов)`);
    toast(`Бросок ${sum}: пусто`);
    return;
  }
  produced.forEach(tile => { state.resources[tile.type] = (state.resources[tile.type] || 0) + 1; });
  const summary = produced.map(p => `${icon(p.type)} ${p.label}`).join(', ');
  state.events.unshift(`Бросок ${sum}: +${produced.length} ресурсов (${summary})`);
  toast(`Число ${sum}: получены ресурсы`);
}
function handleRobberTrigger(){
  moveRobber();
  state.events.unshift('Выпало 7: разбойник активирован, игроки со >7 карт сбрасывают половину.');
  toast('Выпало 7: разбойник активирован');
}
function moveRobber(targetIndex){
  const candidates = hexData
    .map((hex, idx) => idx)
    .filter(idx => idx !== state.robberIndex && hexData[idx].type !== 'desert');
  const chosen = targetIndex ?? candidates[Math.floor(Math.random() * candidates.length)];
  state.robberIndex = chosen;
  state.events.unshift(`Разбойник перемещён на ${hexData[chosen].label} (${hexData[chosen].type})`);
  toast('Разбойник перемещён');
}
function botTurn(){
  const game = gameView();
  if (game && window.HexlandGame) {
    if (game.currentSeat === 0 && !game.phase.startsWith('SETUP')) {
      toast('Сейчас ход игрока P0');
      return;
    }
    runEngineAction(window.HexlandGame.botStep());
    return;
  }
  if (!state.bots.length) addBot();
  const bot = state.bots[Math.floor(Math.random() * state.bots.length)];
  const sum = rnd() + rnd();
  const actions = sum === 7
    ? [`${bot.name} rolled 7 · robber moved`, `${bot.name} blocks ore tile`]
    : [`${bot.name} rolled ${sum}`, `${bot.name} offers sheep for brick`, `${bot.name} builds road toward harbor`];
  state.events.unshift(actions[Math.floor(Math.random() * actions.length)]);
  toast(`🤖 ${bot.name}: ход выполнен`);
}
function botRound(){
  const game = gameView();
  if (game && window.HexlandGame) {
    if (game.phase.startsWith('SETUP')) {
      state.botAutoRunSteps = 0;
      window.HexlandGame.runSetupWithBots();
      state.botAutoStatus = 'Сетап завершён ботами';
      toast('Сетап завершён ботами');
      render();
      return;
    }
    let steps = 0;
    while (steps < 8) {
      const snapshot = gameView();
      if (!snapshot || snapshot.winnerSeat !== null) break;
      if (snapshot.currentSeat === 0 && !snapshot.phase.startsWith('SETUP')) break;
      const result = window.HexlandGame.botStep();
      if (!result.ok) {
        state.botAutoStatus = result.error;
        toast(result.error);
        break;
      }
      steps++;
    }
    state.botAutoRunSteps += steps;
    state.botAutoStatus = steps ? `Боты сделали ходов: ${steps}` : 'Сейчас очередь P0';
    toast(steps ? `Боты сделали ходов: ${steps}` : 'Сейчас очередь P0');
    render();
    return;
  }
  state.bots.forEach(bot => {
    const sum = rnd() + rnd();
    state.events.unshift(sum === 7 ? `${bot.name} rolled 7 · robber moved` : `${bot.name} rolled ${sum} and collected resources`);
  });
  toast('Раунд ботов симулирован');
}
function bankTrade(){
  if (window.HexlandGame) {
    runEngineAction(window.HexlandGame.applyFirstLegal('BANK_TRADE'));
    return;
  }
  const richest = Object.entries(state.resources).sort((a,b) => b[1] - a[1])[0];
  if (!richest || richest[1] < 4) { toast('Недостаточно ресурсов для обмена 4:1'); return; }
  state.resources[richest[0]] -= 4;
  state.resources.wheat += 1;
  state.events.unshift(`Банк: 4 ${richest[0]} → 1 wheat`);
  toast('Обмен с банком 4:1 выполнен');
}
function canAfford(cost){
  return Object.entries(cost).every(([res,val]) => (state.resources[res] || 0) >= val);
}
function spend(cost){
  Object.entries(cost).forEach(([res,val]) => { state.resources[res] -= val; });
}
function buildStructure(type){
  if (window.HexlandGame) {
    if (type === 'development') {
      runEngineAction(window.HexlandGame.applyFirstLegal('BUY_DEV_CARD'));
      return;
    }
    // дорога/поселение/город ставятся тапом по подсвеченной точке на доске
    const game = gameView();
    const hasSpot = (game?.legalActionTypes || []).includes(actionTypeForBuild(type));
    toast(hasSpot ? 'Тапни по подсвеченной точке на доске' : `Сейчас нельзя построить: ${labelForBuild(type)}`);
    return;
  }
  const cost = state.buildCosts[type];
  if (!cost) return;
  if (!canAfford(cost)) { toast('Не хватает ресурсов'); return; }
  spend(cost);
  switch(type){
    case 'road':
      state.progress.roads += 1;
      if (state.progress.roads >= 5) state.longestRoad = true;
      state.events.unshift('Построена дорога (1 wood + 1 brick)');
      break;
    case 'settlement':
      state.progress.settlements += 1;
      state.events.unshift('Построено поселение (1 ПО)');
      break;
    case 'city':
      if (state.progress.settlements === 0) { toast('Нет поселений для апгрейда'); return; }
      state.progress.settlements -= 1;
      state.progress.cities += 1;
      state.events.unshift('Город построен (2 ПО)');
      break;
    case 'development':
      if (Math.random() > 0.4) {
        state.progress.hiddenVP += 1;
        state.events.unshift('Карта развития: скрытое ПО');
      } else {
        state.progress.knights += 1;
        if (state.progress.knights >= 3) state.largestArmy = true;
        state.events.unshift('Карта развития: рыцарь (можно двигать разбойника)');
      }
      break;
  }
  updateVictory();
  render();
  toast(`${labelForBuild(type)} построен`);
}
function updateVictory(){
  state.victoryPoints = state.progress.settlements * 1 + state.progress.cities * 2 + (state.longestRoad ? 2 : 0) + (state.largestArmy ? 2 : 0) + state.progress.hiddenVP;
}
function rollSummary(){
  const game = gameView();
  if (game) {
    if (!game.lastRoll) {
      return game.phase.startsWith('SETUP')
        ? 'Идёт стартовая расстановка: поселение → дорога для каждого игрока.'
        : 'Броска ещё не было. Движок ждёт легальное действие текущего игрока.';
    }
    if (game.lastRoll === 7) return '7 активирует разбойника: ресурсы не выдаются, игроки со >7 карт сбрасывают половину.';
    const hits = game.hexes.filter(hex => hex.token === game.lastRoll && !hex.isRobber && hex.terrain !== 'desert');
    return hits.length
      ? `Тайл(ы): ${hits.map(hex => `${hex.label} (${icon(hex.terrain)})`).join(', ')}`
      : 'Все тайлы с этим номером заблокированы разбойником или отсутствуют.';
  }
  if (state.lastRoll === 7) return '7 активирует разбойника: ресурсы не выдаются, игроки со >7 карт сбрасывают половину.';
  if (!resourceNumbers.includes(state.lastRoll)) return 'Этого номера нет на базовой карте.';
  const hits = hexData.filter((hex, idx) => hex.number === state.lastRoll && idx !== state.robberIndex);
  return hits.length ? `Тайл(ы): ${hits.map(h => h.label + ' (' + icon(h.type) + ')').join(', ')}` : 'Все тайлы с этим номером заблокированы разбойником.';
}
function phaseLabel(phase){
  return {
    SETUP_R1_SETTLEMENT: 'Сетап: первое поселение',
    SETUP_R1_ROAD: 'Сетап: первая дорога',
    SETUP_R2_SETTLEMENT: 'Сетап: второе поселение',
    SETUP_R2_ROAD: 'Сетап: вторая дорога',
    MAIN_ROLL: 'Бросок',
    MAIN_DISCARD: 'Сброс после 7',
    MAIN_ROBBER: 'Разбойник',
    MAIN_TURN: 'Ход: торговля/стройка',
    GAME_OVER: 'Партия завершена'
  }[phase] || 'Прототип';
}
function actionTypeForBuild(type){
  return {
    road: 'BUILD_ROAD',
    settlement: 'BUILD_SETTLEMENT',
    city: 'BUILD_CITY',
    development: 'BUY_DEV_CARD'
  }[type] || 'END_TURN';
}
function labelForBuild(type){
  return {
    road: 'Дорога',
    settlement: 'Поселение',
    city: 'Город',
    development: 'Карта развития'
  }[type] || type;
}
function startTestGame(){
  if (window.HexlandGame) {
    // Сетап P0 делает сам тапами; ботов прогоняет автоплей, когда дойдёт их очередь.
    window.HexlandGame.reset(4);
  }
  state.discardSel = {};
  state.gameMode = 'test';
  state.botsEnabled = true;
  state.ready = true;
  state.bots = [
    { name: 'Bot Ada', level: 'Balanced', mood: 'trader', icon: 'A' },
    { name: 'Bot Neo', level: 'Aggressive', mood: 'road rush', icon: 'N' },
    { name: 'Bot Kai', level: 'Trader', mood: 'ports', icon: 'K' }
  ];
  state.events = ['Test game started with 3 bots', 'Bot Ada is thinking trade routes', 'Bot Neo rushes longest road', 'Bot Kai watches harbor prices'];
  route('play');
  state.botAutoStatus = 'Тестовая партия готова: ход P0';
  scheduleBotAutoplay(650, true);
  toast('Тестовая игра с ботами запущена');
}
updateVictory();
render();


</script>
