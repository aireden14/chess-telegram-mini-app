name: Keep backend awake

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_HEALTH_URL_VAR: ${{ vars.BACKEND_HEALTH_URL }}
      BACKEND_HEALTH_URL_SECRET: ${{ secrets.BACKEND_HEALTH_URL }}
    steps:
      - name: Ping backend health endpoint
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_HEALTH_URL="${BACKEND_HEALTH_URL_VAR:-${BACKEND_HEALTH_URL_SECRET:-}}"
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "::error::Set BACKEND_HEALTH_URL as a GitHub Actions repository variable or secret."
            exit 1
          fi

          BACKEND_HEALTH_URL="${BACKEND_HEALTH_URL%/}"
          if [[ "$BACKEND_HEALTH_URL" == */api/health ]]; then
            HEALTH_URL="$BACKEND_HEALTH_URL"
          else
            HEALTH_URL="$BACKEND_HEALTH_URL/api/health"
          fi

          curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"
