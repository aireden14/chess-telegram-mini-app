name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — типы и игровая логика
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Катану нужна настоящая база: его партии живут в Postgres, а не в памяти.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chess_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d chess_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/chess_db
      DIRECT_URL: postgresql://user:password@localhost:5432/chess_db

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate

      - name: Типы
        run: npx tsc --noEmit -p tsconfig.json

      - name: Шашки — партии до конца и комнаты
        run: npx tsx scripts/checkers-selfplay.ts 200

      - name: Бункер — партии и состав стола
        run: npx tsx scripts/bunker-selfplay.ts 100

      - name: Катан — партии ботами в чистом движке
        run: npx tsx scripts/catan-selfplay.ts medium 3

      - name: Настолки — комнаты, пароль, смена ведущего
        run: npx tsx scripts/tabletop-selfplay.ts

      - name: Бункер — сквозной тест на живых сокетах
        run: npx tsx scripts/bunker-e2e.ts

      - name: Судоку-дуэль — сквозной тест на живых сокетах
        # Короткое окно ожидания только здесь: иначе проверка ухода соперника
        # длилась бы две минуты, а остальным тестам нужно обычное поведение.
        env:
          ROOM_GRACE_MS: 600
        run: npx tsx scripts/sudoku-duel-e2e.ts

      - name: Катан — сквозной тест с базой
        run: npx tsx scripts/catan-e2e.ts

  frontend:
    name: Фронт — типы и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Типы
        run: npx tsc --noEmit -p tsconfig.json

      - name: Сборка
        run: npm run build

  vendored-copy:
    name: Копия бэкенда в all-in-one не отстала
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # пока предупреждение, а не блокировка

    steps:
      - uses: actions/checkout@v4

      - name: Забрать вендоренную копию
        run: git clone --depth 1 https://github.com/aireden14/gamepass-all-in-one.git /tmp/aio

      - name: Сравнить исходники
        shell: bash
        run: |
          set -uo pipefail
          diff -r -q \
            --exclude node_modules --exclude dist --exclude temp \
            --exclude .env --exclude 'package-lock.json' \
            backend /tmp/aio/services/gamepass > /tmp/diff.txt 2>&1 || true
          if [ -s /tmp/diff.txt ]; then
            echo "::warning::Прод-копия бэкенда отличается от исходника — нужен rsync и деплой"
            cat /tmp/diff.txt
          else
            echo "Копия совпадает с исходником."
          fi
